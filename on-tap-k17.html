<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập K17 — Kang</title>
<style>
:root{
  --paper:#F7F6F2;
  --ink:#12211E;
  --ink-soft:#5A6B66;
  --line:#DCDAD1;
  --teal:#0B5C4B;
  --teal-soft:#E4EFEA;
  --amber:#9A5B00;
  --amber-soft:#FBEEDC;
  --red:#96271F;
  --red-soft:#F8E6E3;
  --card:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55;
}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 96px}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- header ---------- */
header.top{
  border-bottom:1px solid var(--line);background:var(--card);
  position:sticky;top:0;z-index:20;
}
.top .wrap{padding-top:14px;padding-bottom:14px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
.brand span{color:var(--teal)}
.top-meta{font-size:13.5px;color:var(--ink-soft);margin-left:auto}
.linkbtn{background:none;border:none;color:var(--teal);padding:0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- home ---------- */
.hero{padding:44px 0 8px}
.hero h1{font-size:clamp(28px,5vw,40px);line-height:1.12;letter-spacing:-.02em;margin:0 0 12px;max-width:16ch}
.hero p{margin:0;max-width:56ch;color:var(--ink-soft)}
.counts{display:flex;gap:28px;margin:26px 0 34px;flex-wrap:wrap}
.count b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.count span{font-size:13.5px;color:var(--ink-soft)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel + .panel{margin-top:16px}
.panel h2{font-size:15px;margin:0 0 4px;font-weight:700}
.panel .hint{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:7px 13px;font-size:14px;
}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip small{opacity:.7;margin-left:5px}

.rowfields{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.field label{display:block;font-size:13.5px;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select{
  font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);
}
.field input[type=number]{width:96px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}

.start{
  margin-top:22px;width:100%;background:var(--teal);color:#fff;border:none;
  border-radius:9px;padding:15px;font-size:17px;font-weight:600;
}
.start:hover{background:#0d6d59}
.start:disabled{background:#9DAFAA;cursor:not-allowed}

.resume{border-left:3px solid var(--amber);background:var(--amber-soft);border-color:#EBD9BE}

/* ---------- quiz ---------- */
.roundbar{
  position:sticky;top:53px;z-index:15;background:var(--paper);
  border-bottom:1px solid var(--line);padding:12px 0 10px;margin-bottom:8px;
}
.roundbar .inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.roundtag{font-weight:700;font-size:15px}
.roundsub{font-size:13.5px;color:var(--ink-soft)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}

.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
.q.correct{border-color:#A9CFC1;background:#FBFEFC}
.q.wrong{border-color:#E0B4AE}
.qhead{display:flex;gap:12px;font-size:13px;color:var(--ink-soft);margin-bottom:9px;align-items:baseline}
.qnum{font-weight:700;color:var(--ink);font-size:15px}
.qsubj{margin-left:auto;text-align:right}
.qtext{margin:0 0 14px;font-size:16.5px;font-weight:600;line-height:1.45}
.multi{font-size:13px;color:var(--amber);font-weight:600;margin:-8px 0 12px}

.opt{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:#B9C6C1}
.opt input{margin:4px 0 0;accent-color:var(--teal);flex:0 0 auto}
.opt .k{font-weight:700;flex:0 0 auto}
.opt.pick{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok{border-color:var(--teal);background:var(--teal-soft)}
.opt.no{border-color:#DBA9A2;background:var(--red-soft)}
.opt.locked{cursor:default}
.mark{margin-left:auto;font-weight:700;flex:0 0 auto}
.mark.ok{color:var(--teal)}.mark.no{color:var(--red)}

.expl{margin-top:12px;padding:12px 14px;background:var(--paper);border-radius:8px;font-size:14.5px;color:var(--ink-soft);white-space:pre-wrap}
.expl b{color:var(--ink)}

.actions{position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 70%,rgba(247,246,242,0));padding:18px 0 22px;display:flex;gap:12px;flex-wrap:wrap}
.btn{border-radius:9px;padding:13px 22px;font-size:16px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#0d6d59}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- result ---------- */
.result{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px;margin:20px 0}
.result h2{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
.result p{margin:0 0 4px;color:var(--ink-soft)}
.score{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:16px 0 6px}
.done{border-top:4px solid var(--teal)}
.tally{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.tally div b{display:block;font-size:22px}
.tally div span{font-size:13px;color:var(--ink-soft)}

.empty{color:var(--ink-soft);padding:30px 0}
.hidden{display:none}
@media (max-width:560px){
  .wrap{padding:0 14px 90px}
  .q{padding:15px 14px}
  .roundbar{top:49px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="brand">Ôn tập <span>K17</span></p>
    <span class="top-meta" id="topMeta"></span>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
const DATA = {"subjects":[{"id":"ld-ben-trong","name":"Lãnh đạo từ bên trong & Trí tuệ cảm xúc","group":"ngoai"},{"id":"agile","name":"Agile & Tư duy linh hoạt","group":"ngoai"},{"id":"7-thoi-quen","name":"7 Thói quen hiệu quả (FranklinCovey)","group":"ngoai"},{"id":"quan-tri-thay-doi","name":"Quản trị sự thay đổi","group":"ngoai"},{"id":"nang-luc-lanh-dao","name":"Nâng cao năng lực lãnh đạo & Quản lý đội nhóm","group":"ngoai"},{"id":"giao-tiep-doi-ngoai","name":"Giao tiếp đối ngoại trên bàn tiệc","group":"ngoai"},{"id":"kinh-te-vi-mo","name":"Kinh tế vĩ mô & Chiến lược BIDV 2030","group":"noi"},{"id":"quan-ly-dieu-hanh-cn","name":"Quản lý điều hành hoạt động tại chi nhánh","group":"noi"},{"id":"ban-le","name":"Chiến lược & Phát triển ngân hàng bán lẻ","group":"noi"},{"id":"ke-hoach","name":"Công tác lập & triển khai kế hoạch kinh doanh","group":"noi"},{"id":"alco","name":"ALCO – Quản trị nguồn vốn & Rủi ro thanh khoản","group":"noi"},{"id":"kho-quy","name":"Kho quỹ & An toàn kho quỹ","group":"noi"},{"id":"tttm","name":"Tài trợ thương mại & Thanh toán quốc tế","group":"noi"},{"id":"chuyen-doi-so","name":"Chuyển đổi số & Chiến lược công nghệ","group":"noi"},{"id":"ttdvkh","name":"Trung tâm Dịch vụ khách hàng","group":"noi"},{"id":"tham-dinh-phe-duyet","name":"Thẩm định & Phê duyệt tín dụng","group":"noi"},{"id":"tai-tro-du-an","name":"Tài trợ dự án","group":"noi"},{"id":"dau-thau","name":"Đấu thầu & Mua sắm tập trung","group":"noi"},{"id":"pcrt","name":"Phòng chống rửa tiền & Tuân thủ cấm vận","group":"noi"},{"id":"truyen-thong","name":"Truyền thông, Thương hiệu & Văn hóa doanh nghiệp","group":"noi"},{"id":"kiem-tra-giam-sat","name":"Kiểm tra & Giám sát tuân thủ","group":"noi"},{"id":"phap-che","name":"Pháp chế & Quản trị ngân hàng","group":"noi"},{"id":"xu-ly-no","name":"Xử lý nợ & Thu hồi nợ","group":"noi"},{"id":"qlrr","name":"Quản lý rủi ro thị trường & rủi ro hoạt động","group":"noi"},{"id":"cong-tac-dang","name":"Công tác Đảng trong doanh nghiệp","group":"noi"},{"id":"kinh-nghiem-dieu-hanh","name":"Chia sẻ kinh nghiệm điều hành chi nhánh","group":"noi"}],"questions":[{"i":0,"s":"ld-ben-trong","q":"Phần não nào sau đây liên quan đến trạng thái Fight or Flight\" Chiến đấu/Bỏ chạy","o":[["A","Võ não trước trán (Prefrontal Cortex)"],["B","Hạch hạnh nhân (Amygdala)"],["C","Thùy đỉnh (Parietal Lobe)"],["D","Thể chai (Corpus Callosum)"]],"a":["B"],"e":""},{"i":1,"s":"ld-ben-trong","q":"Khi bị kích động về cảm xúc ta nên","o":[["A","Đè nén cảm xúc"],["B","Buông thả cảm xúc"],["C","Dừng lại. Hít thở. Nhận biết, suy xét và phản hồi"],["D","Né tránh vấn đề"]],"a":["C"],"e":""},{"i":2,"s":"ld-ben-trong","q":"Khi bị kích động về cảm xúc ta nên","o":[["A","Phản ứng ngay lập tức để giải tỏa cảm xúc"],["B","Tạm dừng, hít thở sâu và nhận diện cảm xúc trước khi phản ứng"],["C","Tránh tiếp xúc với mọi người xung quanh"],["D","Giữ mọi việc trong lòng và không suy nghĩ"]],"a":["B"],"e":""},{"i":3,"s":"ld-ben-trong","q":"Chúng ta có thể thực hành Mindfulness bằng cách","o":[["A","Ngồi thiền khoảng 5 phút mỗi buổi sáng và tối"],["B","Thiền 1-2 phút trước khi bắt đầu một công việc nào đó"],["C","Chú tâm vào hoạt động mà ta đang thực hiện"],["D","Cả 3 câu trên đều đúng"]],"a":["D"],"e":""},{"i":4,"s":"ld-ben-trong","q":"Đâu là những thứ bất biến trong cuộc sống","o":[["A","Sự thay đổi"],["B","Sự lựa chọn"],["C","Những nguyên lý"],["D","Cả 3 câu trên đều đúng"]],"a":["D"],"e":""},{"i":5,"s":"ld-ben-trong","q":"Khi người khác bị kích động về cảm xúc, việc đầu tiên ta nên làm là…","o":[["A","Thể hiện sự đồng cảm"],["B","Nói họ bình tĩnh lại"],["C","Cho họ lời khuyên"],["D","Buông lời phán xét"]],"a":["A"],"e":""},{"i":6,"s":"ld-ben-trong","q":"Mindfulness là khả năng đưa tâm trí trở về với … và ý thức về những gì đang diễn ra với sự cởi mở, không phán xét và lòng nhân ái, để nhìn rõ sự vật/sự việc đúng như bản chất của nó. Từ còn thiếu trong “…” là gì?","o":[["A","Quá khứ"],["B","Tương lai"],["C","Hiện tại"],["D","Cả 3 câu trên đều sai"]],"a":["C"],"e":""},{"i":7,"s":"ld-ben-trong","q":"Để nâng cao khả năng tự nhận thức (self-awareness), ta cần thường xuyên:","o":[["A","Phản tỉnh bản thân (self-reflection)"],["B","Xin phản hồi từ người khác (feedback)"],["C","Cả 2 câu trên đều đúng"],["D","Cả 2 câu trên đều sai"]],"a":["C"],"e":""},{"i":8,"s":"ld-ben-trong","q":"Khi con người chúng ta trải qua những cảm xúc khó khăn như sợ hãi hay tức giận, phần nào trong não chúng ta đang bị kích hoạt mạnh mẽ?","o":[["A","Vỏ não trước trán (Prefrontal Cortex)"],["B","Hạch hạnh nhân (Amygdala)"],["C","Hồi hải mã (Hippocampus)"],["D","Cả 3 câu trên đều sai"]],"a":["B"],"e":""},{"i":9,"s":"ld-ben-trong","q":"Thứ tự nào sau đây là đúng nhất về 5 cấp độ của lắng nghe (từ thấp đến cao);","o":[["A","Pretend Listening (Giả vờ nghe), Phớt lờ (Ignore), Selective Listening (Nghe chọn lọc), Attentive (Nghe chú tâm), Empathic Listening (Nghe đồng cảm)"],["B","Phớt lờ (Ignore), Pretend Listening (Giả vờ nghe), Attentive (Nghe chú tâm), Selective Listening (Nghe chọn lọc), Empathic Listening (Nghe đồng cảm)"],["C","Phớt lờ (Ignore), Pretend Listening (Giả vờ nghe), Selective Listening (Nghe chọn lọc), Empathic Listening (Nghe đồng cảm), Attentive (Nghe chú tâm),"],["D","Phớt lờ (Ignore), Pretend Listening (Giả vờ nghe), Selective Listening (Nghe chọn lọc), Attentive (Nghe chú tâm), Empathic Listening (Nghe đồng cảm)"]],"a":["D"],"e":""},{"i":10,"s":"ld-ben-trong","q":"Thiền sư Thích Nhất Hạnh từng nói: “Chất lượng của quyền lực có thể được đo bằng cách nhìn sâu vào tận gốc rễ của sự lãnh đạo, xem có … ở đó hay không”. Từ còn thiếu trong “…” là gì?","o":[["A","Sự thông cảm (Sympathy)"],["B","Sự đồng cảm (Empathy)"],["C","Lòng trắc ẩn (Compassion)"],["D","Cả 3 câu trên đều sai"]],"a":["C"],"e":""},{"i":11,"s":"ld-ben-trong","q":"Lãnh đạo với lòng trắc ẩn là: (có thể chọn nhiều đáp án)","o":[["A","Nhất thiết đồng ý với người kia"],["B","Trở nên “mềm yếu” hay “ngây thơ”"],["C","Kết hợp lòng trắc ẩn và trí tuệ"],["D","Làm những việc khó một cách nhân văn"]],"a":["C","D"],"e":""},{"i":12,"s":"ld-ben-trong","q":"Những cách để rèn luyện EQ là: (có thể chọn nhiều đáp án)","o":[["A","Thực hành thiền"],["B","Học những môn khoa học xã hội như văn, sử, triết"],["C","Học những môn khoa học tự nhiên như toán, lý, hóa"],["D","Trải nghiệm những khó khăn, thất bại trong đời"],["E","Quan sát những hành vi đúng/sai từ người khác"]],"a":["A","B","D","E"],"e":""},{"i":13,"s":"ld-ben-trong","q":"… là khả năng nhận ra và kết nối với cảm xúc của người khác. Từ còn thiếu trong “…” là gì?","o":[["A","Thông cảm (Sympathy)"],["B","Đồng cảm (Empathy)"],["C","Trắc ẩn (Compassion)"],["D","Cả 3 câu trên đều sai"]],"a":["B"],"e":""},{"i":14,"s":"ld-ben-trong","q":"Daniel Goleman nói rằng: “… là không chỉ cảm nhận được nỗi đau của người, mà còn thấy động tâm muốn giúp làm cho nó giảm đi”. Từ còn thiếu trong “…” là gì?","o":[["A","Sự thông cảm (Sympathy)"],["B","Sự đồng cảm (Empathy)"],["C","Lòng trắc ẩn (Compassion)"],["D","Cả 3 câu trên đều sai"]],"a":["C"],"e":""},{"i":15,"s":"ld-ben-trong","q":"Những lợi ích của việc viết ra suy nghĩ, cảm xúc là: (có thể chọn nhiều đáp án)","o":[["A","Nhận diện rõ ràng cảm xúc"],["B","Giảm căng thẳng và lo âu"],["C","Giúp sắp xếp suy nghĩ và ra quyết định tốt hơn"],["D","Thay đổi cảm xúc của người khác"],["E","Đáp án A,B và C"]],"a":["A"],"e":""},{"i":16,"s":"ld-ben-trong","q":"Phần não nào sau đây liên quan đến trạng thái 'Reflect & Regulate / Nhìn nhận lại vấn đề & Điều tiết cảm xúc'?","o":[["A","Hạch hạnh nhân (Amygdala)"],["B","Vỏ não trước trán (Prefrontal Cortex)"],["C","Thùy thái dương (Temporal Lobe)"],["D","Tiểu não (Cerebellum)"]],"a":["B"],"e":""},{"i":17,"s":"ld-ben-trong","q":"Theo nghiên cứu tại Đại học Harvard vào năm 2010, bao nhiêu % thời gian trung bình tâm trí con người suy nghĩ lan man mỗi ngày?","o":[["A","0.25"],["B","0.47"],["C","0.6"],["D","0.75"]],"a":["B"],"e":""},{"i":18,"s":"agile","q":"Phát biểu nào sau đây không thể hiện tư duy Agile","o":[["A","Hoạt động lấy khách hàng ệ khách hàng. Phiên bản của chuyên đề Lập kế hoạch K16 có phương án D là \"Cả 3 đáp án đều đúng\" (bao gồm cả phân tích đối thủ cạnh tranh). Khi làm bài phải đọc kỹ nội dung phương án D."},{"i":85,"s":"quan-tri-thay-doi","q":"Trong việc lập kế hoạch kinh doanh, việc phân tích thực trạng bao gồm phân tích các yếu tố nào sau đây","o":[["A","Phân tích kết quả kinh doanh trong quá khứ"],["B","Phân tích cơ sở dữ liệu, hệ khách hàng"],["C","Phân tích đối thủ cạnh tranh"],["D","Cả 3 đáp án đều đúng"]],"a":["D"],"e":"LƯU Ý: đề có hai phiên bản. Phiên bản này (chuyên đề Lập kế hoạch K16 và bảng tổng hợp K16) tính đủ cả 3 yếu tố, gồm cả phân tích đối thủ cạnh tranh. Phiên bản K15 có phương án D là \"Cả đáp án a và b đều đúng\". Khi làm bài phải đọc kỹ nội dung phương án D."},{"i":86,"s":"quan-tri-thay-doi","q":"Kế hoạch luôn được phát triển từ Bản đồ chiến lược. Anh/Chị cho biết yếu tố nào KHÔNG nằm trong vấn đề cần quan tâm của Bản đồ chiến lược?","o":[["A","Vị trí địa lý"],["B","Tài chính"],["C","Khách hàng"],["D","Quy trình nội bộ"]],"a":["A"],"e":""},{"i":87,"s":"quan-tri-thay-doi","q":"Một bản kế hoạch tốt cần được giám sát như thế nào?","o":[["A","Báo cáo định kỳ từ các nhóm và thành viên"],["B","Báo cáo trực tiếp, toàn hệ thống"],["C","Báo cáo trực tiếp, toàn hệ thống"],["D","Cả đáp án a và b đều đúng"]],"a":["D"],"e":""},{"i":88,"s":"quan-tri-thay-doi","q":"Xác định lập và triển khai kế hoạch kinh doanh của ngân hàng thường được triển khai qua các bước nào?","o":[["A","Phân tích cơ cấu lợi nhuận – Phân tích tiềm năng thị trường – Xác định vị thế - Xác định mục tiêu bán hàng"],["B","Phân tích sản phẩm – Phân tích tiềm năng thị trường – Xác định vị thế - Xác định mục tiêu bán hàng"],["C","Phân tích sản phẩm – Phân tích tiềm năng thị trường – Xác định khách hàng - Xác định mục tiêu bán hàng"],["D","Phân tích sản phẩm – Phân tích đội ngũ nhân sự – Xác định khách hàng - Xác định mục tiêu bán hàng"]],"a":["A"],"e":""},{"i":89,"s":"quan-tri-thay-doi","q":"Triết lý cốt lõi của việc lập kế hoạch kinh doanh theo chia sẻ của diễn giả trong tài liệu là gì?","o":[["A","Thực hiện nghiêm ngặt theo một kịch bản số liệu đã được phân rã trên Excel."],["B","Bản kế hoạch là vô ích, không cần thiết phải lập kế hoạch vì thực tế luôn biến động."],["C","Chuẩn bị các kịch bản dự phòng khác nhau để chủ động ứng phó trước mọi biến động và hành động của đối thủ."],["D","Đạt được mục tiêu doanh thu bằng mọi giá, bất chấp sự phản đối của nhân viên."]],"a":["C"],"e":"Lập kế hoạch không phải để chạy theo kịch bản cố định mà để chuẩn bị các phương án dự phòng cho thực tế, giúp tổ chức chủ động đối phó với biến động (Napoleon/Eisenhower)."},{"i":90,"s":"quan-tri-thay-doi","q":"Đâu là 4 vai trò cốt lõi của người quản lý cấp trung trong quá trình quản trị sự thay đổi của tổ chức?","o":[["A","Planner, Supervisor, Auditor, Executor."],["B","Translator, Bridge, Coach, Role Model."],["C","Decision Maker, Delegator, Coordinator, Evaluator."],["D","Communicator, Controller, Trainer, Reporter."]],"a":["B"],"e":"4 vai trò quan trọng của quản lý cấp trung là Translator (Phiên dịch chiến lược thành hành động), Bridge (Cầu nối giữa sếp và nhân viên), Coach (Huấn luyện kỹ năng), Role Model (Làm gương làm mẫu)."},{"i":91,"s":"quan-tri-thay-doi","q":"Câu hỏi cốt tử mà một nhà quản lý cần đặt ra ngay khi nhận chỉ tiêu tăng trưởng đầy thách thức (ví dụ tăng 30%) từ cấp trên là gì?","o":[["A","Làm thế nào để trình xin sếp giảm bớt chỉ tiêu này xuống?"],["B","Tiền đến từ đâu và từ những nguồn nào?"],["C","Ai sẽ là người chịu trách nhiệm chính nếu chi nhánh thất bại?"],["D","Cơ chế xử phạt tài chính cho nhân viên không đạt số là bao nhiêu?"]],"a":["B"],"e":"Nhận kế hoạch không thể trả lại, mà việc đầu tiên là phải ngồi phân tích cơ cấu nguồn thu (cho vay, huy động, dịch vụ), xác định các động lực và hỏi: 'Tiền đến từ đâu?'"},{"i":92,"s":"quan-tri-thay-doi","q":"Theo nguyên tắc 'Gold Number' của Shopee được thảo luận, mốc mua sắm bao nhiêu đơn hàng/tháng được coi là điểm người tiêu dùng đã 'bị phụ thuộc' và sẽ tự động mua sắm không cần khuyến mãi?","o":[["A","1 đơn hàng/tháng."],["B","2 đơn hàng/tháng."],["C","4 đơn hàng/tháng."],["D","10 đơn hàng/tháng."]],"a":["C"],"e":"Shopee phát hiện ra con số vàng (Gold Number) là 4 đơn hàng thành công/tháng. Sau mốc này họ cắt ưu đãi để dồn tiền lôi kéo những khách mới hoặc khách còn lưỡng lự chưa mua."},{"i":93,"s":"quan-tri-thay-doi","q":"Trong case study của Bamboo Airways, chiến thuật nào đã được sử dụng đột phá để giành tệp khách hàng VIP của đối thủ cạnh tranh (Vietnam Airlines)?","o":[["A","Giảm giá vé siêu rẻ trên tất cả các đường bay nội địa."],["B","Áp dụng chính sách 'Phiên ngang thẻ' (Status Match) tương đương và cộng thêm 1 hạng dịch vụ."],["C","Tặng quà lưu niệm có giá trị lớn tại phòng chờ VIP sân bay."],["D","Tăng tần suất bay lên gấp 3 lần so với đối thủ."]],"a":["B"],"e":"Chiến sách phiên ngang thẻ (status match) và tặng thêm một hạng dịch vụ giúp Bamboo Airways bứng ngay tệp khách VIP của đối thủ sang trải nghiệm đặc quyền cao hơn lập tức."},{"i":94,"s":"quan-tri-thay-doi","q":"Nguyên tắc 'Thẩm định theo đuôi' (Piggyback Underwriting) khi phát hành thẻ tín dụng hạn mức lớn cho khách hàng VIP dựa trên cơ sở khoa học nào?","o":[["A","Thẩm định lại từ đầu toàn bộ hồ sơ chứng minh tài sản và thu nhập theo quy trình nội bộ nghiêm ngặt."],["B","Tin tưởng hoàn toàn vào uy tín cá nhân và cam kết miệng của khách hàng."],["C","Thừa hưởng kết quả thẩm định kỹ lưỡng của các ngân hàng lớn đi trước (đã cấp hạn mức lớn cho khách hàng dựa trên CIC)."],["D","Chỉ cấp hạn mức tối thiểu 30 triệu đồng để phòng ngừa rủi ro nợ xấu tuyệt đối."]],"a":["C"],"e":"Các ngân hàng lớn đi trước đã thẩm định rủi ro kỹ lưỡng, ngân hàng đi sau chỉ cần 'thẩm định theo đuôi' để cấp hạn mức tổng tương đương nhằm thu hút khách nhanh chóng mà vẫn an toàn."},{"i":95,"s":"quan-tri-thay-doi","q":"Để một kế hoạch hay chỉ tiêu có tính khả thi (Achievable) trong mô hình SMARTER, người lãnh đạo cần thiết kế điều gì cho nhân viên?","o":[["A","Yêu cầu tuyệt đối hoàn hảo 100%, không cho phép bất kỳ sai sót kỹ thuật nào xảy ra."],["B","Thiết lập hạn mức sai sót cho phép (dư địa sai số) và thưởng cực lớn nếu làm tốt hơn hạn mức đó."],["C","Áp dụng các mức phạt tài chính nặng nề ngay từ lần vi phạm quy trình đầu tiên."],["D","Giao chỉ tiêu vượt xa năng lực thực tế để nhân viên tự bứt phá giới hạn."]],"a":["B"],"e":"KPI hoàn hảo 100% không thực tế và triệt tiêu động lực hành động (bài học gạch rơi tại Tasco). Phải có dư địa sai số được chấp nhận (như tỉ lệ nợ xấu cho phép 1%) và thưởng lớn nếu tối ưu hơn."},{"i":96,"s":"quan-tri-thay-doi","q":"Khái niệm 'Nhiều hơn có nghĩa là ít hơn' khi bàn về việc thiết lập chỉ số KPI mang ý nghĩa gì?","o":[["A","Giao càng nhiều chỉ tiêu thì nhân viên càng làm việc chăm chỉ và bao quát hơn."],["B","Báo cáo quá nhiều chỉ tiêu (ví dụ bẫy 88 chỉ tiêu thực chất là PI) sẽ làm phân tán nguồn lực và giảm hiệu quả tập trung vào chiến lược cốt lõi."],["C","Việc có nhiều chỉ tiêu sẽ giúp ngân hàng dễ dàng quản lý rủi ro hoạt động."],["D","Cần nhiều nhân sự hơn để vận hành hệ thống báo cáo KPI đồ sộ."]],"a":["B"],"e":"Nhiều chỉ tiêu rườm rà (thực chất chỉ là PI - Performance Indicator) sẽ làm loãng sự tập trung. Chỉ nên giao ít KPI thực sự quan trọng (Key) gắn chặt với mục tiêu chiến lược."},{"i":97,"s":"quan-tri-thay-doi","q":"Lực lượng bán hàng trực tiếp DSF (Direct Sales Force) hoạt động theo nguyên tắc tổ chức nào?","o":[["A","Nhân viên giao dịch tại quầy kiêm nhiệm thêm việc đi tiếp thị ngoài thực địa khi rảnh."],["B","Lực lượng chuyên trách chỉ đi bán hàng, được giải phóng hoàn toàn khỏi các thủ tục hành chính và giải ngân."],["C","Bán hàng hoàn toàn qua điện thoại (telesales) tại văn phòng chi nhánh."],["D","Ủy quyền quy trình bán hàng cho các đại lý tài chính bên thứ ba."]],"a":["B"],"e":"Đội DSF được thành lập để chuyên trách 100% đi bán hàng thực địa, không bận tâm đến việc xử lý hồ sơ, giải ngân, từ đó đo lường chính xác năng lực kinh doanh thực tế."},{"i":98,"s":"quan-tri-thay-doi","q":"Trong kỷ luật vận hành DSF, cuộc họp giao ban sáng 15 phút hàng ngày (lúc 7:00 sáng) có yêu cầu bắt buộc nào?","o":[["A","Quản lý phòng đọc báo cáo tổng hợp tuần và giao chỉ tiêu mới."],["B","Từng nhân viên lên bảng tự viết số liệu thực tế ngày hôm trước, mồm nói, tay viết, tự đề xuất giải pháp và không chấp nhận lý do bao biện."],["C","Nhân viên nộp báo cáo bằng văn bản giấy và kết thúc buổi họp bằng các khẩu hiệu hô hào."],["D","Thảo luận tự do về xu hướng chung của thị trường mà không cần con số cụ thể."]],"a":["B"],"e":"Họp sáng 15 phút yêu cầu kỷ luật nghiêm ngặt: từng người lên bảng mồm nói tay viết số liệu cá nhân của ngày hôm qua. Phạt chống đẩy tập thể nếu đội không đạt chỉ tiêu để nâng cao ý thức trách nhiệm."},{"i":99,"s":"quan-tri-thay-doi","q":"Chiến thuật bán hàng thực địa 'Đèn đỏ rẽ phải' được thiết lập nhằm mục đích gì?","o":[["A","Phát tờ rơi tiếp cận khách hàng đang dừng chờ đèn đỏ tại các ngã tư lớn."],["B","Chia nhân viên thành các đội 3 người đi dọc tuyến phố, gõ cửa tất cả các nhà mở cửa, gặp ngã tư bắt buộc rẽ phải để bao phủ 100% địa bàn tránh bỏ sót."],["C","Tối ưu hóa thời gian di chuyển bằng cách tránh các tuyến đường có nhiều đèn tín hiệu."],["D","Chỉ tiếp cận các khách hàng doanh nghiệp nằm ở phía bên phải của tuyến phố."]],"a":["B"],"e":"Đèn đỏ rẽ phải là kỷ luật bán hàng thực địa: đi dọc phố gõ cửa từng nhà, đến ngã tư rẽ phải để quét sạch địa bàn, quản lý dùng bản đồ vẽ lại hành trình để kiểm soát 100% hoạt động."},{"i":100,"s":"quan-tri-thay-doi","q":"Trong ma trận đánh giá tư duy quản lý dựa trên trục 'Kiến thức' và 'Sự cởi mở', đối tượng nào là lý tưởng nhất để dẫn dắt sự thay đổi?","o":[["A","Thiếu kiến thức & Bảo thủ."],["B","Có kiến thức nhưng Bảo thủ."],["C","Thiếu kiến thức nhưng Quá cởi mở."],["D","Có kiến thức & Cởi mở."]],"a":["D"],"e":"Người quản lý lý tưởng nhất là người có cả kiến thức chuyên môn sâu rộng và tư duy cởi mở, sẵn sàng tiếp thu cái mới, đây là lực lượng tiên phong thúc đẩy tổ chức đổi mới."},{"i":101,"s":"quan-tri-thay-doi","q":"Khi thuyết phục cấp trên thuộc nhóm 'Có kiến thức nhưng Bảo thủ' ủng hộ sáng kiến mới, phương pháp nào hiệu quả nhất?","o":[["A","Thuyết phục bằng các lý thuyết quản trị hiện đại học được từ sách vở."],["B","Tạo ra các 'Thắng lợi ngắn hạn' (Quick Wins) liên tục được minh chứng bằng dữ liệu số liệu cụ thể."],["C","Sử dụng áp lực hành chính hoặc mệnh lệnh từ lãnh đạo cấp cao hơn ép xuống."],["D","Tự ý triển khai quy mô lớn rồi báo cáo kết quả sau khi đã hoàn thành."]],"a":["B"],"e":"Với cấp trên bảo thủ, mọi lập luận lý thuyết đều vô ích. Phải dùng thực tế để chứng minh thông qua những thắng lợi nhỏ, ngắn hạn nhưng thuyết phục (như thí điểm cải tiến quầy giao dịch)."},{"i":102,"s":"quan-tri-thay-doi","q":"Dưới góc độ phân loại nhân sự theo 4 nhóm (Năng lực & Gắn bó), nhóm số 3 (Không có năng lực nhưng cực kỳ gắn bó lâu năm) thường ngốn bao nhiêu nguồn lực và đóng góp bao nhiêu phần trăm kết quả cho tổ chức?","o":[["A","Ngốn 10% nguồn lực, đóng góp 50% kết quả."],["B","Ngốn 60% nguồn lực, đóng góp 20% kết quả."],["C","Ngốn 20% nguồn lực, đóng góp 65% kết quả."],["D","Ngốn 50% nguồn lực, đóng góp 10% kết quả."]],"a":["B"],"e":"Nhóm 3 không có năng lực cao nhưng gắn bó lâu năm, thường ngốn 60% nguồn lực vận hành (bàn ghế, quỹ lương cơ bản, trang thiết bị, phúc lợi) nhưng đóng góp chỉ 20% kết quả thực tế."},{"i":103,"s":"quan-tri-thay-doi","q":"Mô hình 'Tháp đào tạo' song song học - dạy được thiết lập nhằm mục đích cốt lõi nào trong quản trị nhân sự?","o":[["A","Cắt giảm tối đa ngân sách và chi phí đào tạo nội bộ hàng năm."],["B","Đảm bảo tri thức được kế thừa liên tục, chống hẫng hụt nguồn lực chốt ('Đại ca chết thì Nhị ca lên thay') và làm căn cứ bổ nhiệm cán bộ minh bạch."],["C","Tăng số lượng bằng cấp và chứng chỉ học thuật cho toàn chi nhánh."],["D","Ép buộc nhân viên phải học ngoài giờ làm việc không được trả lương."]],"a":["B"],"e":"Tháp đào tạo yêu cầu 'Học đi đôi với Dạy' (ai học môn gì phải dạy lại môn đó cho người khác). Giúp chuyển giao tri thức liên tục, chống hẫng hụt nhân sự cốt cán và tạo tiêu chuẩn thăng tiến rõ ràng."},{"i":104,"s":"quan-tri-thay-doi","q":"Để triển khai thành công một cuộc chuyển đổi (Transform), doanh nghiệp cần phải thay đổi đồng bộ 5 yếu tố nào dưới đây?","o":[["A","Doanh thu, Chi phí, Lợi nhuận, Headcount, Thương hiệu."],["B","Con người (People), Quy trình (Process), Công nghệ (Technology), Cơ cấu quyền hạn (Structure), Văn hóa thói quen (Culture)."],["C","Sản phẩm, Giá cả, Kênh phân phối, Quảng bá, Khách hàng."],["D","Tầm nhìn, Sứ mệnh, Sổ tay văn hóa, Hệ thống báo cáo, Sơ đồ tổ chức."]],"a":["B"],"e":"Đổi mới sẽ thất bại nếu dùng công nghệ mới để giải quyết một quy trình cũ, với tư duy cũ và cơ cấu cũ. Phải thay đổi đồng bộ cả 5 yếu tố: Con người, Quy trình, Công nghệ, Cơ cấu và Văn hóa."},{"i":105,"s":"quan-tri-thay-doi","q":"Hiện tượng 'Bất đối xứng thông tin' (Information Asymmetry) trong ra quyết định của nhà quản trị được định nghĩa như thế nào?","o":[["A","Hệ thống thông tin nội bộ hoạt động không đồng bộ giữa các chi nhánh."],["B","Người ra quyết định thì không có đủ thông tin thực tế, còn người có thông tin thực tế (cấp dưới) thì lại không chia sẻ hết vì e ngại hoặc lợi ích cá nhân."],["C","Thông tin truyền đạt từ trên xuống bị thất lạc do lỗi hệ thống email."],["D","Khách hàng cố tình cung cấp sai lệch thông tin hồ sơ vay vốn."]],"a":["B"],"e":"Bất đối xứng thông tin khiến lãnh đạo dễ bị thao túng bởi cấp dưới (qua nghệ thuật thậm xưng, chỉ báo cáo điều sếp thích nghe), dẫn đến các quyết định vận hành sai lầm."},{"i":106,"s":"quan-tri-thay-doi","q":"Phương pháp 'Technical stop' (Điểm dừng kỹ thuật) được khuyến nghị sử dụng trong quản lý nhằm mục đích gì?","o":[["A","Dừng tạm thời các hoạt động giao dịch tại quầy để bảo trì hệ thống IT."],["B","Dừng lại để xác minh đa chiều khi nhận được phản ánh mang tính 'thậm xưng' từ nhân viên (ví dụ 'tất cả mọi người đều phản đối'), tránh bị thao túng quyết định."],["C","Tạm dừng hoạt động kinh doanh cuối ngày để đối chiếu quỹ ngân quỹ."],["D","Đình chỉ công việc của nhân viên vi phạm kỷ luật lao động."]],"a":["B"],"e":"Technical Stop là điểm dừng kỹ thuật giúp nhà quản lý tỉnh táo, không vội vã đưa ra quyết định dựa trên thông tin phóng đại một chiều của đám đông hoặc nhân viên dưới quyền."},{"i":107,"s":"quan-tri-thay-doi","q":"Trong chuỗi chuyển hóa dữ liệu DIKW để phục vụ ra quyết định đúng đắn, các bước được sắp xếp theo thứ tự tăng dần về giá trị như thế nào?","o":[["A","Data (Dữ liệu thô) -> Information (Thông tin có cấu trúc) -> Knowledge (Kiến thức đúc rút) -> Wisdom (Trí tuệ ứng dụng)."],["B","Data -> Idea -> Key metrics -> Work."],["C","Document -> Information -> Key performance -> Wisdom."],["D","Definition -> Information -> KPI -> Wisdom."]],"a":["A"],"e":"Đưa ra quyết định đúng đắn phải dựa trên chuỗi DIKW: đi từ dữ liệu thô (Data) -> thông tin sắp xếp theo mục đích (Information) -> kiến thức đúc kết (Knowledge) -> trí tuệ ứng dụng thực tiễn (Wisdom)."},{"i":108,"s":"quan-tri-thay-doi","q":"Theo nghiên cứu được thảo luận, nhân viên thường kháng cự sự thay đổi chủ yếu là do nguyên nhân nào dưới đây?","o":[["A","Do sự chống đối mang tính bản năng hoặc không thích người dẫn dắt thay đổi."],["B","Do 5 nỗi sợ nội tâm: sợ mất quyền lợi quen thuộc, sợ không làm được việc mới, sợ kết quả không tốt hơn, sợ sự bất định, sợ sự hiện diện của mình vô nghĩa."],["C","Do họ không có đủ thời gian học tập và làm việc ngoài giờ."],["D","Do chính sách tiền lương và khen thưởng của ngân hàng không rõ ràng."]],"a":["B"],"e":"Đa số sự chống đối đến từ nỗi sợ tâm lý của con người trước sự thay đổi. Hiểu rõ 5 nỗi sợ này giúp quản lý thiết kế lộ trình truyền thông và giải tỏa lực cản hiệu quả."},{"i":109,"s":"quan-tri-thay-doi","q":"Quản trị sự thay đổi được định nghĩa là gì?","o":[["A","Quy trình kiểm soát rủi ro trong thay đổi"],["B","Cách tiếp cận có cấu trúc để đảm bảo thay đổi diễn ra trơn tru và bền vững"],["C","Một phương pháp để tăng năng suất nhân viên"],["D","Một hệ thống báo cáo tiến độ"]],"a":["B"],"e":""},{"i":110,"s":"quan-tri-thay-doi","q":"Theo John F. Kennedy, điều gì khiến con người bỏ lỡ cơ hội?","o":[["A","Chỉ nhìn vào tương lai quá xa"],["B","Chỉ nhìn vào quá khứ hoặc hiện tại"],["C","Phân tích quá nhiều"],["D","Quá tự tin vào bản thân"]],"a":["B"],"e":""},{"i":111,"s":"quan-tri-thay-doi","q":"Vì sao tổ chức phải thay đổi?","o":[["A","Vì nhân viên mong muốn"],["B","Để duy trì sự kiểm soát nội bộ"],["C","Vì môi trường, công nghệ, khách hàng, cạnh tranh đều thay đổi"],["D","Để giảm chi phí"]],"a":["C"],"e":""},{"i":112,"s":"quan-tri-thay-doi","q":"Nguồn gốc KHÔNG thuộc nhóm phản kháng cá nhân đối với thay đổi là:","o":[["A","Sợ điều chưa biết"],["B","Mất quyền lợi"],["C","Sợ mất quyền lực bộ phận"],["D","Cảm nhận thiếu kỹ năng mới"]],"a":["C"],"e":""},{"i":113,"s":"quan-tri-thay-doi","q":"Công thức D × V × F > R biểu thị điều gì?","o":[["A","Điều kiện để tổ chức duy trì cấu trúc"],["B","Điều kiện để thay đổi diễn ra"],["C","Điều kiện để duy trì nguồn lực"],["D","Công thức đo động lực nhân viên"]],"a":["B"],"e":""},{"i":114,"s":"quan-tri-thay-doi","q":"Trong 8 bước của Kotter, bước “Tạo thắng lợi ban đầu” nhằm:","o":[["A","Khắc phục sự phản đối"],["B","Tạo động lực và niềm tin cho nhân viên"],["C","Giảm thiểu rủi ro"],["D","Xác lập vai trò lãnh đạo"]],"a":["B"],"e":""},{"i":115,"s":"quan-tri-thay-doi","q":"Phát biểu “Bạn không thể quản lý những gì bạn không thể đo lường được” là của ai?","o":[["A","Brian Tracy"],["B","Peter Drucker"],["C","Robert Kaplan & David Norton"],["D","Dwight Eisenhower"]],"a":["C"],"e":""},{"i":116,"s":"quan-tri-thay-doi","q":"Một bản kế hoạch theo định nghĩa của Collins phải bao gồm nội dung nào?","o":[["A","Mô tả nhân sự, quy trình, KPI"],["B","Các mục tiêu, chiến lược và chiến thuật để đạt mục tiêu"],["C","Danh sách khách hàng và doanh thu kỳ vọng"],["D","Dự báo rủi ro và kế hoạch tài chính"]],"a":["B"],"e":""},{"i":117,"s":"quan-tri-thay-doi","q":"Bảng phân tích STARS trong kế hoạch hành động đề cập đến điều gì?","o":[["A","Chiến lược tuyển dụng nhân sự cấp cao"],["B","Kiểm soát tiến độ của các nhóm dự án"],["C","Phân loại và ưu tiên các sáng kiến theo tác động và khả năng thực thi"],["D","Công cụ phân tích tài chính ngân hàng"]],"a":["C"],"e":""},{"i":118,"s":"quan-tri-thay-doi","q":"Trong nguyên tắc SMART-ER, chữ “R” cuối cùng (Rewarding) nghĩa là gì?","o":[["A","Mục tiêu có thể đo lường lại"],["B","Mục tiêu mang lại phần thưởng/dộng lực"],["C","Mục tiêu có tính thực tế"],["D","Mục tiêu có người chịu trách nhiệm"]],"a":["B"],"e":""},{"i":119,"s":"quan-tri-thay-doi","q":"Một kế hoạch hành động hiệu quả nên bao gồm yếu tố nào sau đây?","o":[["A","Phân bổ chỉ tiêu, khen thưởng và kế hoạch dự phòng"],["B","Thống kê dữ liệu ngân hàng"],["C","Tổng kết các năm tài chính"],["D","Danh sách nhân sự và mô tả công việc"]],"a":["A"],"e":""},{"i":120,"s":"quan-tri-thay-doi","q":"Theo tài liệu, điều gì KHÔNG được chấp nhận trong báo cáo tiến độ?","o":[["A","Báo cáo hằng ngày theo khung giờ cố định"],["B","Mỗi người tự cung cấp và giải trình số liệu"],["C","Báo cáo hộ, báo cáo dồn, báo cáo sai"],["D","Họp nhóm nhỏ với tần suất cao"]],"a":["C"],"e":""},{"i":121,"s":"quan-tri-thay-doi","q":"Lý do khiến kế hoạch thất bại thường là do:","o":[["A","Thiếu tài chính đầu tư"],["B","Không có giám sát từ cấp trên"],["C","Không có cam kết và sự tham gia"],["D","Đối thủ cạnh tranh quá mạnh"]],"a":["C"],"e":""},{"i":122,"s":"quan-tri-thay-doi","q":"Phân tích SWOT/TOWS giúp người quản lý:","o":[["A","Biết cách chốt sale hiệu quả hơn"],["B","Tăng trưởng doanh thu ngắn hạn"],["C","Hợp lý hóa cơ cấu nhân sự"],["D","Xác định rõ thực trạng và đưa ra định hướng phù hợp"]],"a":["D"],"e":""},{"i":123,"s":"quan-tri-thay-doi","q":"Một mục tiêu tốt nên có gì?","o":[["A","Mang tính cảm hứng và mơ hồ"],["B","Tập trung vào hành vi cá nhân"],["C","Được lượng hóa bằng chỉ tiêu đo lường"],["D","Được viết dài để chi tiết hóa"]],"a":["C"],"e":""},{"i":124,"s":"quan-tri-thay-doi","q":"Nguyên tắc “gắn kết 2 chiều” trong lập kế hoạch nhấn mạnh điều gì?","o":[["A","Kế hoạch phải phù hợp văn hóa đơn vị"],["B","Kế hoạch phải gắn chặt với tầm nhìn – chiến lược toàn hàng và vai trò của từng bộ phận"],["C","Kế hoạch phải có sự tham gia của khách hàng"],["D","Kế hoạch phải được phê duyệt bởi nhiều cấp"]],"a":["B"],"e":""},{"i":125,"s":"giao-tiep-doi-ngoai","q":"Bạn sẽ xử lý như thế nào nếu lỡ làm rơi dao nĩa trên bàn tiệc?","o":[["A","Cúi xuống nhặt ngay lập tức"],["B","Báo nhân viên phục vụ để xử lý"],["C","Nhặt lên và tiếp tục sử dụng"],["D","Để nguyên và không làm gì cả"]],"a":["B"],"e":""},{"i":126,"s":"giao-tiep-doi-ngoai","q":"Những lỗi nào nên tránh khi giao tiếp trên bàn tiệc?","o":[["A","Nói quá nhiều và to tiếng"],["B","Dùng điện thoại trên bàn tiệc"],["C","Không giao tiếp, chỉ tập trung ăn"],["D","Tất cả các đáp án trên đều đúng"]],"a":["D"],"e":""},{"i":127,"s":"giao-tiep-doi-ngoai","q":"Nguyên tắc cơ bản khi sử dụng dao, nĩa và các dụng cụ trên bàn tiệc là gì?","o":[["A","Sử dụng từ ngoài vào trong theo thứ tự món ăn"],["B","Dùng bất kỳ dụng cụ nào tiện tay"],["C","Chỉ sử dụng khi được yêu cầu"],["D","Dùng dụng cụ của người khác nếu cần"]],"a":["A"],"e":""},{"i":128,"s":"giao-tiep-doi-ngoai","q":"Khi giới thiệu nhiều người với khách, thứ tự giới thiệu đúng là gì?","o":[["A","Người trẻ trước người lớn tuổi, nam trước nữ, chức thấp trước chức cao"],["B","Giới thiệu theo ngẫu nhiên, không cần tuân theo thứ tự"],["C","Người có chức vụ cao trước người có chức vụ thấp, nữ trước nam, người lớn tuổi trước người trẻ tuổi"],["D","Nam trước nữ, người trẻ tuổi trước người lớn tuổi, chức cao sau chức thấp"]],"a":["C"],"e":""},{"i":129,"s":"giao-tiep-doi-ngoai","q":"Điều nào sau đây là hành vi không phù hợp khi chào hỏi khách trong bữa tiệc?","o":[["A","Bắt tay và giao tiếp bằng mắt với khách"],["B","Ngậm thuốc lá và đút tay vào túi khi chào"],["C","Cúi đầu nhẹ và mỉm cười khi gặp khách"],["D","Chào khách trước khi bắt đầu dùng bữa"]],"a":["B"],"e":""},{"i":130,"s":"kho-quy","q":"Tại Chi nhánh B thường xuyên nhận được báo Nợ của NHNN về việc thiếu tờ tiền trong bó tiền niêm phong (số tiền thiếu <01 triệu đồng/lần), chi nhánh phải xử lý như thế nào?","o":[["A","Yêu cầu người có tên trên niêm phong của bó tiền thiếu giải trình nguyên nhân đồng thời bồi hoàn 100% số tiền thiếu cho NHNN;."],["B","Lập Hội đồng xử lý tiền thiếu (nếu cần thiết); xem xét biện pháp khắc phục (điều chuyển công việc khác đối với cán bộ có tên trên niêm phong thường xuyên thiếu tiền)"],["C","Yêu cầu người có tên trên niêm phong của bó tiền thiếu bồi hoàn 100% số tiền thiếu cho NHNN"],["D","Phương án A, B đúng"]],"a":["D"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":131,"s":"kho-quy","q":"Khách hàng X của Chi nhánh M thường xuyên có nhu cầu giao dịch bằng chứng từ nộp, rút tiền mặt với số lượng lớn (trong đó, tổng số tiền mặt trên các chứng từ nộp tiền bằng tổng số tiền mặt trên các chứng từ rút tiền). Chi nhánh xử lý giao dịch cho Khách hàng X như thế nào để đảm bảo quy định của BIDV và hiệu quả hoạt động ?","o":[["A","Tư vấn cho khách hàng sử dụng phương thức thanh toán khác hoặc đăng ký giao dịch trước với chi nhánh, để chi nhánh chuẩn bị đầy đủ tiền chi cho khách hàng theo quy định. Sau đó thu tiền mặt theo đúng giấy nộp tiền của khách hàng"],["B","Thực hiện giao dịch ghi nợ, ghi có tài khoản của khách hàng qua tài khoản trung gian GL, không thực hiện giao dịch thu, chi tiền mặt"],["C","Thực hiện giao dịch thu của khách hàng trước, giao dịch chi cho khách sau, không thực hiện thu, chi tiền mặt thực tế"],["D","Thường xuyên duy trì hạn mức tồn quỹ lớn để thực hiện được giao dịch rút tiền của Khách hàng"]],"a":["A"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":132,"s":"kho-quy","q":"Cán bộ A (là GDV của PGD Y) được giao nhiệm áp tải tiền tiếp quỹ đầu ngày cho PGD Y. Sau khi tiếp quỹ GDV A ở lại PGD Y để làm việc, xe chuyên dùng phải quay về chi nhánh để đi thu tiền lưu động. Cán bộ A giao chìa khóa thùng chở tiền trên xe chuyên dùng về cho Thủ kho tiền như thế nào để đảm bảo an toàn, bảo mật chìa khóa?","o":[["A","Cán bộ A đưa chìa khóa vào bì niêm phong lại, đưa cho Lái xe mang về chi nhánh giao cho Thủ kho tiền (Cán bộ A ký sổ giao nhận chìa khóa với Thủ kho tiền)"],["B","Cán bộ A đưa chìa khóa vào bì niêm phong lại, đưa cho Lái xe mang về chi nhánh giao cho Thủ kho tiền (Lái xe ký sổ giao nhận chìa khóa với Thủ kho tiền)"],["C","Cán bộ A đưa chìa khóa vào bì niêm phong lại, đưa cho Lái xe mang về chi nhánh giao cho Thủ kho tiền (Cán bộ A ký sổ giao nhận chìa khóa với Thủ kho tiền vào ngày hôm sau)"],["D","Do Giám đôc Chi nhánh quyết định"]],"a":["B"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":133,"s":"kho-quy","q":"Theo quy định, lãnh đạo Phòng QLNB/KHTC được giao nhiệm vụ cầm chìa khóa số 2 cửa kho tiền để quản lý kho tiền tại Chi nhánh. Tuy nhiên, tại Chi nhánh chưa có đủ cán bộ lãnh đạo phòng (Chỉ có Trưởng phòng, chưa có Phó Phòng, KSV), trường hợp Trưởng phòng nghỉ phép thì Giám đốc có thể giao nhiệm vụ cho ai?","o":[["A","Giao nhiệm vụ cho cán bộ Phòng QLNB/KHTC giữ chìa khóa số 2"],["B","Giao nhiệm vụ cho Lãnh đạo phòng GDKH/QLDVKQ giữ chìa khóa số 2"],["C","Giao nhiệm vụ cho cán bộ P.QLRR"],["D","Giao nhiệm vụ cho lãnh đạo/KSV phòng khác (Không phải Lãnh đạo/KSV phòng GDKH/QLDVKQ)"]],"a":["D"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":134,"s":"kho-quy","q":"Khách hàng M thường xuyên đến chi nhánh X đổi tiền không đủ tiêu chuẩn lưu thông (KĐTCLT) số lượng lớn, trong đó chủ yếu là loại tiền có mệnh giá lớn (200.000đ, 500.000đ). Cán bộ thu đổi tiền thực hiện như thế nào để vừa đảm bảo chấp hành quy định, vừa phòng chống được rủi ro có thể xảy ra?","o":[["A","Thu đổi cho khách hàng, không hạn chế số lượng, không yêu cầu thủ tục giấy tờ"],["B","- Đối chiếu tiêu chuẩn tiền KĐTCLT NHNN quy định - Xác định nguyên nhân tiền KĐTCLT - Thu đổi cho khách hàng, không hạn chế số lượng, không yêu cầu thủ tục giấy tờ"],["C","- Đối chiếu tiêu chuẩn tiền KĐTCLT NHNN ,I2 Xác định nguyên nhân tiền KĐTCLT. - Phân loại tiền KĐTCLT, báo cáo lãnh đạo chi nhánh nếu có nghi ngờ, thu đổi tiền cho khách hàng theo chỉ đạo của lãnh đạo và quy định của NHNN. Ghi chép đầy đủ thông tin khách hàng thu đổi"],["D","- Đối chiếu tiêu chuẩn tiền KĐTCLT NHNN quy định - Thu đổi cho khách hàng, không hạn chế số lượng, không yêu cầu thủ tục giấy tờ"]],"a":["C"],"e":"Thông tư 25/2013/TT/NHNN ngày 02/12/2013 quy định về thu đổi tiền không đủ TCLT"},{"i":135,"s":"kho-quy","q":"Theo quy định của BIDV, thời gian Giám đốc Chi nhánh có thể ủy quyền áp tải hàng đặc biệt thường xuyên cho 01 cán bộ tối đa là bao lâu?","o":[["A","01 tháng"],["B","03 tháng"],["C","06 tháng"],["D","01 năm"]],"a":["C"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":136,"s":"kho-quy","q":"Theo quy định của BIDV, Chi nhánh A khi phát hiện thiếu tiền mặt khi nhận tiền từ Chi nhánh B thì chi nhánh A phải xử lý như thế nào?","o":[["A","Thông báo cho Chi nhánh B để chuyển tiền bổ sung và gửi biên bản kèm niêm phong các bó/túi tiền có thiếu tiền, dữ liệu camera theo dõi quá trình kiểm đếm tiền."],["B","Báo nợ cho Chi nhánh B và gửi biên bản kèm niêm phong các bó/túi tiền có thiếu tiền, dữ liệu camera theo dõi quá trình kiểm đếm tiền."],["C","Thông báo cho Chi nhánh B để chuyển tiền bổ sung và gửi biên bản kèm niêm phong các bó/túi tiền có thiếu tiền."],["D","Báo nợ cho Chi nhánh B và gửi biên bản kèm niêm phong các bó/túi tiền có thiếu tiền."]],"a":["A"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":137,"s":"kho-quy","q":"Khi có sự thay đổi thành viên quản lý kho tiền, trường hợp nào được phép bàn giao sơ bộ một số nội dung có liên quan đến kho tiền mà không bắt buộc phải bàn giao toàn bộ tiền và tài sản trong kho tiền?","o":[["A","Thay đổi thành viên quản lý chìa khóa số 1 cửa kho tiền theo định kỳ"],["B","Thay đổi thành viên quản lý chìa khóa số 1 cửa kho tiền đột xuất"],["C","Thay đổi thành viên quản lý chìa khóa số 2 cửa kho tiền theo định kỳ"],["D","Thay đổi thủ kho tiền"]],"a":["B"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":138,"s":"kho-quy","q":"Khi khóa kho tiền Chi nhánh, Ban quản lý kho phải đóng các ổ khóa kho tiền theo thứ tự nào để đảm bảo đúng quy định?","o":[["A","Giám đốc Chi nhánh, Trưởng phòng QLNB/KHTC, thủ kho tiền."],["B","Thủ kho tiền, Trưởng phòng QLNB/KHTC, Giám đốc Chi nhánh."],["C","Thủ kho tiền khóa cửa đầu tiên, Trưởng phòng QLNB/KHTC và Giám đốc Chi nhánh không phân biệt thứ tự khóa kho."],["D","Ban quản lý kho tiền có mặt tại gian đệm và khóa kho đầy đủ, không quy định thứ tự khóa."]],"a":["B"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":139,"s":"kho-quy","q":"Theo quy định của BIDV, kiểm tra toàn diện công tác đảm bảo an toàn kho quỹ thực hiện theo tần suất như thế nào?","o":[["A","Thực hiện kiểm tra Tối thiểu 1 lần/năm"],["B","Thực hiện kiểm tra Tối thiểu 2 lần/năm"],["C","Thực hiện kiểm tra Tối thiểu 3 lần/năm"],["D","Thực hiện kiểm tra Tối thiểu 4 lần/năm"]],"a":["B"],"e":"QĐ 6868/QyĐ - BIDV ngày 30/12/2019 về giao nhận, bảo quản vận chuyển tiền mặt, tài sản quý, GTCG."},{"i":140,"s":"kho-quy","q":"Tại Chi nhánh B thường xuyên nhận được báo nợ của NHNN về việc thiếu tờ tiền trong bó tiền niêm phong (số tiền thiếu nhỏ hơn 1 triệu đồng/ lần). Trường hợp này, Chi nhánh phải xử lý như thế nào?","o":[["A","Yêu cầu người có tên trên niêm phong của bó tiền thiếu giải trình nguyên nhân đồng thời bồi hoàn 100% số tiền thiếu cho NHNN"],["B","Lập hội đồng xử lý tiền thiếu (nếu cần thiết), xem xét biện pháp khắc phục (điều chuyển công việc khác đối với cán bộ có tên trên niêm phong thường xuyên thiếu tiền)"],["C","Yêu cầu người có tên trên niêm phong của bó tiền thiếu bồi hoàn 100% số tiền cho NHNN"],["D","A, B đúng"]],"a":["D"],"e":""},{"i":141,"s":"kho-quy","q":"Giai đoạn 1 (2024 - Q1/2026) của Đề án Kho quỹ tập trung đã giúp BIDV tiết kiệm được bao nhiêu chi phí trong riêng năm 2025?","o":[["A","22 tỷ đồng"],["B","56 tỷ đồng"],["C","122 tỷ đồng"],["D","223 tỷ đồng"]],"a":["C"],"e":"Theo mục 'Số liệu minh họa nổi bật' của Đề án Kho quỹ tập trung (Chủ đề 1), hệ thống đã tiết kiệm được 122 tỷ đồng trong riêng năm 2025."},{"i":142,"s":"kho-quy","q":"Thu nhập ròng của khối Kho quỹ trong năm 2025 đã cải thiện lịch sử như thế nào so với trước khi triển khai Đề án?","o":[["A","Từ -235 tỷ đồng lên -3,5 tỷ đồng"],["B","Từ -122 tỷ đồng lên -22 tỷ đồng"],["C","Từ -284 tỷ đồng lên -11 tỷ đồng"],["D","Từ -314,8 tỷ đồng lên 0 tỷ đồng"]],"a":["A"],"e":"Thu nhập ròng chuyển biến lịch sử: Từ -235 tỷ đồng (trước đề án) lên -3,5 tỷ đồng (2025), giúp thu hẹp đáng kể lỗ vận hành kho quỹ hệ thống."},{"i":143,"s":"kho-quy","q":"Ứng dụng công nghệ phần mềm B.Cash đã đem lại hiệu quả tiết kiệm chi phí khoảng bao nhiêu mỗi năm cho hệ thống?","o":[["A","~11 tỷ đồng/năm"],["B","~22 tỷ đồng/năm"],["C","~28 tỷ đồng/năm"],["D","~35 tỷ đồng/năm"]],"a":["B"],"e":"Theo Chủ đề 1, việc ứng dụng phần mềm quản lý kho quỹ B.Cash giúp hệ thống tiết kiệm chi phí khoảng ~22 tỷ đồng/năm."},{"i":144,"s":"kho-quy","q":"Việc tinh giảm bao nhiêu cán bộ kho quỹ chuyên trách nhờ đề án tập trung hóa đã giúp hệ thống tiết kiệm được 28 tỷ đồng/năm?","o":[["A","35 cán bộ"],["B","40 cán bộ"],["C","52 cán bộ"],["D","56 cán bộ"]],"a":["D"],"e":"Đề án Kho quỹ tập trung đã giảm được 56 cán bộ kho quỹ chuyên trách so với trước triển khai, tương ứng tiết kiệm 28 tỷ đồng/năm chi phí nhân sự."},{"i":145,"s":"kho-quy","q":"Năng suất lao động tại Trung tâm Quản lý và Dịch vụ Kho quỹ (TTQL&DVKQ) tăng bao nhiêu % nhờ chuyển sang mô hình làm việc 1 ca?","o":[["A","15%"],["B","30%"],["C","40%"],["D","53%"]],"a":["C"],"e":"Nhờ tối ưu quy trình và chuyển sang mô hình làm việc 1 ca, năng suất lao động tại TTQL&DVKQ đã tăng 40%."},{"i":146,"s":"kho-quy","q":"Hệ số quay vòng tiền mặt kỷ lục đạt được tại địa bàn Hà Nội và TP.HCM sau khi tập trung hóa lần lượt là bao nhiêu?","o":[["A","4,49 lần và 4,06 lần"],["B","4,06 lần và 4,49 lần"],["C","5,02 lần và 4,11 lần"],["D","4,50 lần và 4,00 lần"]],"a":["A"],"e":"Chỉ số hiệu quả luân chuyển tiền mặt (vòng quay tiền mặt) đạt kỷ lục: 4,49 lần tại Hà Nội và 4,06 lần tại địa bàn TP.HCM."},{"i":147,"s":"kho-quy","q":"Ứng dụng B.Cash đã cắt giảm bao nhiêu % quy trình nghiệp vụ kho quỹ truyền thống?","o":[["A","Cắt giảm 40% quy trình, từ 15 bước xuống 9 bước"],["B","Cắt giảm 53% quy trình, từ 19 bước xuống 10 bước"],["C","Cắt giảm 60% quy trình, từ 20 bước xuống 8 bước"],["D","Cắt giảm 30% quy trình, từ 10 bước xuống 7 bước"]],"a":["B"],"e":"Ứng dụng B.Cash đã giúp cắt giảm 53% quy trình nghiệp vụ, cụ thể là tinh gọn từ 19 bước tác nghiệp xuống còn 10 bước."},{"i":148,"s":"kho-quy","q":"Tỷ lệ chứng từ giấy được loại bỏ trong tác nghiệp kho quỹ nhờ số hóa quy trình là bao nhiêu?","o":[["A","50%"],["B","75%"],["C","90%"],["D","100%"]],"a":["C"],"e":"Số hóa quy trình thông qua B.Cash giúp loại bỏ hoàn toàn 90% chứng từ giấy trong các tác nghiệp kho quỹ truyền thống."},{"i":149,"s":"kho-quy","q":"Mục tiêu Giai đoạn 2 (2026 - 2028) hướng tới tỷ lệ điểm giao dịch được tiếp quỹ tập trung đạt bao nhiêu % trên toàn hệ thống và hiệu quả mang lại là bao nhiêu?","o":[["A","Đạt ~35%, hiệu quả ~122 tỷ đồng/năm"],["B","Đạt ~52%, hiệu quả ~223 tỷ đồng/năm"],["C","Đạt ~60%, hiệu quả ~314,8 tỷ đồng/năm"],["D","Đạt ~70%, hiệu quả ~300 tỷ đồng/năm"]],"a":["B"],"e":"Mục tiêu giai đoạn 2 (2026-2028) là đạt tỷ lệ tiếp quỹ tập trung ~52% toàn hệ thống, mang lại hiệu quả tài chính ~223 tỷ đồng/năm."},{"i":150,"s":"kho-quy","q":"Trong năm 2024, doanh thu thu chi hộ toàn hệ thống đạt 16,7 tỷ đồng từ ~90.000 lượt giao dịch, nhưng có bao nhiêu doanh thu bị hạch toán sai mã phí (bị map sang sản phẩm Quản lý dòng tiền)?","o":[["A","3,5 tỷ đồng"],["B","8,3 tỷ đồng"],["C","8,4 tỷ đồng"],["D","11 tỷ đồng"]],"a":["C"],"e":"Bất cập hạch toán: Có 8,4 tỷ đồng bị hạch toán sai mã phí (map sang sản phẩm Quản lý dòng tiền), khiến DVNQ chỉ ghi nhận đúng 8,3 tỷ đồng."},{"i":151,"s":"kho-quy","q":"Tổng chi phí kho quỹ toàn hệ thống đã tăng biến động như thế nào trong giai đoạn 2023 - 2025?","o":[["A","258,6 tỷ (2023) -> 284 tỷ (2024) -> 314,8 tỷ (2025)"],["B","284 tỷ (2023) -> 258,6 tỷ (2024) -> 314,8 tỷ đồng (2025)"],["C","200 tỷ (2023) -> 250 tỷ (2024) -> 300 tỷ (2025)"],["D","314,8 tỷ (2023) -> 258,6 tỷ (2024) -> 284 tỷ (2025)"]],"a":["B"],"e":"Số liệu chi tiết về biến động chi phí: 284 tỷ đồng (2023) -> giảm xuống 258,6 tỷ đồng (2024) -> tăng lên 314,8 tỷ đồng (2025)."},{"i":152,"s":"kho-quy","q":"Tỷ lệ chi phí kho quỹ được phân bổ thực tế về cho các chi nhánh sử dụng dịch vụ tiếp quỹ tập trung thay đổi như thế nào trong giai đoạn 2023 - 2025?","o":[["A","Giảm dần: 13% (2023) -> 15% (2024) -> 11% (2025)"],["B","Tăng dần: 11% (2023) -> 13% (2024) -> 15% (2025)"],["C","Giữ nguyên ở mức 15% qua các năm"],["D","Giảm mạnh từ 50% xuống còn 10%"]],"a":["A"],"e":"Tỷ lệ phân bổ thực tế về chi nhánh khá thấp và giảm dần: 13% (2023) -> 15% (2024) -> 11% (~35 tỷ đồng) năm 2025. Trụ sở chính gánh 89% còn lại."},{"i":153,"s":"kho-quy","q":"Chế tài nộp tiền muộn (sau 15h30) quy định chi nhánh sẽ bị áp thêm phí lãi FTP trên tổng tồn quỹ vượt hạn mức/ngày với mức lãi suất phạt là bao nhiêu?","o":[["A","7,76%/năm với VND và 3,36%/năm với USD"],["B","6,50%/năm với VND và 2,50%/năm với USD"],["C","8,00%/năm với VND và 4,00%/năm với USD"],["D","7,00%/năm với VND và 3,00%/năm với USD"]],"a":["A"],"e":"Chế tài áp thêm phí lãi FTP phạt tồn quỹ qua đêm do nộp muộn sau 15h30 là 7,76%/năm đối với tiền VND và 3,36%/năm đối với ngoại tệ USD."},{"i":154,"s":"kho-quy","q":"Doanh thu cung cấp ngoại tệ mặt và dịch vụ ngân quỹ cho các Tổ chức tín
