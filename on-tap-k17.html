định hình 3 trụ cột chiến lược: 1. Kinh doanh vốn (nguồn vốn lớn, giá rẻ); 2. Trở thành trung tâm thu xếp, thẩm định, tài trợ vốn cho DN/TCT lớn, dự án trọng điểm; 3. FDI và hoạt động số."},{"i":810,"s":"kinh-nghiem-dieu-hanh","q":"Tính đến ngày 30/06/2026, quy mô huy động vốn của BIDV Sở Giao dịch 1 đạt mức nào và xếp thứ mấy toàn hệ thống?","o":[["A","Đạt 69.510 tỷ đồng - số 2 hệ thống"],["B","Đạt 91.323 tỷ đồng - số 1 hệ thống"],["C","Đạt 101.960 tỷ đồng - số 1 hệ thống"],["D","Đạt 170.000 tỷ đồng - số 1 hệ thống"]],"a":["C"],"e":"Huy động vốn cuối kỳ của SGD 1 đến 30/6/2026 đạt 101.960 tỷ đồng (101.957 tỷ đồng), tiếp tục duy trì vị thế đứng số 1 toàn hệ thống."},{"i":811,"s":"kinh-nghiem-dieu-hanh","q":"Nguồn huy động vốn ngoại tệ và không kỳ hạn (CASA) có tính chất giá rẻ tại BIDV Sở Giao dịch 1 đạt mức nào tính đến 30/06/2026?","o":[["A","Đạt 15.000 tỷ đồng"],["B","Đạt 23.000 tỷ đồng"],["C","Đạt 37.402 tỷ đồng (chiếm 36.68% tổng huy động)"],["D","Đạt 50.000 tỷ đồng"]],"a":["C"],"e":"Nguồn vốn giá rẻ bao gồm ngoại tệ và không kỳ hạn của SGD 1 đạt 37.402 tỷ đồng, chiếm tỷ trọng 36.68% tổng quy mô huy động vốn của chi nhánh."},{"i":812,"s":"kinh-nghiem-dieu-hanh","q":"Trong vòng 20 tháng dưới sự điều hành của ông Vũ Hoàng Dương, dư nợ trung dài hạn của BIDV Sở Giao dịch 1 tăng thêm bao nhiêu?","o":[["A","Tăng thêm 5.000 tỷ đồng"],["B","Tăng thêm 10.000 tỷ đồng"],["C","Tăng thêm 17.000 tỷ đồng"],["D","Tăng thêm 23.000 tỷ đồng"]],"a":["D"],"e":"Dư nợ trung dài hạn tăng mạnh từ 17.013 tỷ đồng (2024) lên 40.662 tỷ đồng (30/06/2026), tức tăng thêm hơn 23.000 tỷ đồng chỉ trong 20 tháng."},{"i":813,"s":"kinh-nghiem-dieu-hanh","q":"Hoạt động bán lẻ vốn không phải thế mạnh truyền thống của Sở Giao dịch 1 đã bứt phá tăng bao nhiêu bậc về thu nhập ròng trong 19 tháng?","o":[["A","Tăng 5 bậc"],["B","Tăng 10 bậc"],["C","Tăng 15 bậc"],["D","Tăng 19 bậc (từ thứ 24 lên thứ 5 hệ thống)"]],"a":["D"],"e":"SGD 1 bứt phá ngoạn mục tăng 19 bậc trong 19 tháng, đưa vị trí thu nhập bán lẻ từ thứ 24 lên thứ 5 toàn hệ thống nhờ chuyển hướng sang phân khúc khách hàng giàu có và VIP."},{"i":814,"s":"kinh-nghiem-dieu-hanh","q":"Dự án đột phá nào được Sở Giao dịch 1 triển khai tại khu vực Tây Hồ Tây nhằm thu hút và phục vụ khách hàng siêu giàu (VVIP)?","o":[["A","Mở rộng PGD Hoàn Kiếm"],["B","Thành lập Gold Club tại Starlake với dịch vụ hầm kho két cao cấp"],["C","Xây dựng Trung tâm Hội thảo Quốc tế Mỹ Đình"],["D","Liên kết với các sân golf lớn tại Sóc Sơn"]],"a":["B"],"e":"SGD 1 triển khai dự án Gold Club rộng 1500m2 tại Starlake Tây Hồ Tây, cung cấp dịch vụ hầm kho két bảo mật cực cao để kéo giới siêu giàu đến giao dịch."},{"i":815,"s":"kinh-nghiem-dieu-hanh","q":"Triết lý chăm sóc khách hàng cốt lõi tạo nên sự khác biệt và thành công của ông Vũ Hoàng Dương là gì?","o":[["A","Luôn cạnh tranh bằng cách phá giá lãi suất và phí dịch vụ"],["B","Triết lý kinh doanh 'Chạm đến trái tim' - thấu hiểu, tinh tế, cá nhân hóa và đồng hành cả khi khó khăn"],["C","Tập trung chào bán hàng loạt sản phẩm đại trà sẵn có"],["D","Chỉ ưu tiên phục vụ khách hàng khi họ mang lại lợi nhuận tức thì"]],"a":["B"],"e":"Triết lý kinh doanh cốt lõi của ông Dương là 'Chạm đến trái tim', tiếp cận khách hàng bài bản, tinh tế, riêng biệt, may đo giải pháp và đồng hành thực chất."},{"i":816,"s":"kinh-nghiem-dieu-hanh","q":"Trong tình huống xử lý nợ khó khăn của Đạm Ninh Bình, quyết định dũng cảm và bản lĩnh nào của ông Vũ Hoàng Dương đã giúp dự án phục hồi?","o":[["A","Dừng cho vay ngay lập tức để chuyển nợ nhóm 5 và xiết nợ tài sản"],["B","Tiếp tục cấp hạn mức vốn lưu động trên nguyên tắc giá bán cao hơn biến phí và hoãn xếp nợ xấu do dự án chưa quyết toán"],["C","Yêu cầu chủ đầu tư bán rẻ nhà máy cho nhà đầu tư nước ngoài"],["D","Thực hiện xóa toàn bộ gốc và lãi cho doanh nghiệp"]],"a":["B"],"e":"Ông Dương đã kiên định duy trì hạn mức vốn lưu động 800 tỷ đồng, áp dụng nguyên lý giá bán cao hơn biến phí để duy trì sản xuất, đồng thời hoãn xếp nhóm nợ xấu với lý do dự án chưa quyết toán. </script>
<script>
/* ============ state ============ */
const SUBJ = {}; DATA.subjects.forEach(s=>SUBJ[s.id]=s.name);
const QMAP = {}; DATA.questions.forEach(q=>QMAP[q.i]=q);
const KEY='k17-ontap-v1';
let store = load();
let sess = null;   // phiên đang làm
let cfg = {subjects:[], size:20, shuffle:true};

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {stats:{}, sess:null}; }
  catch(e){ return {stats:{}, sess:null}; }
}
function save(){
  try{ store.sess = sess; localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
}
function stat(i){ return store.stats[i] || (store.stats[i]={right:0,wrong:0}); }

const esc = t => String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shuffle(a){ for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]];} return a; }

/* ============ home ============ */
function renderHome(){
  const total = DATA.questions.length;
  const seen = Object.keys(store.stats).length;
  const weak = Object.entries(store.stats).filter(([i,s])=>s.wrong>0).length;
  document.getElementById('topMeta').textContent = seen ? `Đã làm ${seen}/${total} câu` : '';

  const subjChips = DATA.subjects.map(s=>{
    const n = DATA.questions.filter(q=>q.s===s.id).length;
    if(!n) return '';
    const on = cfg.subjects.includes(s.id);
    return `<button class="chip" aria-pressed="${on}" data-subj="${s.id}">${esc(s.name)}<small>${n}</small></button>`;
  }).join('');

  const resume = store.sess ? `
    <div class="panel resume">
      <h2>Bài ôn đang dở</h2>
      <p class="hint">Vòng ${store.sess.round} · còn ${store.sess.queue.length + store.sess.current.length} câu chưa trả lời đúng.</p>
      <div class="rowfields">
        <button class="btn primary" id="resumeBtn">Học tiếp</button>
        <button class="btn" id="dropBtn">Bỏ bài này</button>
      </div>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <section class="hero">
      <h1>Trả lời đến khi đúng hết thì thôi.</h1>
      <p>Mỗi bài ôn lấy 20 câu. Câu nào đúng thì loại luôn, câu nào sai quay lại ở vòng sau — hết hàng đợi là xong bài.</p>
      <div class="counts">
        <div class="count"><b>${total}</b><span>câu trong ngân hàng</span></div>
        <div class="count"><b>${DATA.subjects.length}</b><span>chuyên đề</span></div>
        <div class="count"><b>${weak}</b><span>câu từng trả lời sai</span></div>
      </div>
    </section>
    ${resume}
    <div class="panel">
      <h2>Chọn chuyên đề</h2>
      <p class="hint">Không chọn gì là lấy ngẫu nhiên từ toàn bộ ngân hàng.</p>
      <div class="chips">
        <button class="chip" aria-pressed="${cfg.subjects.length===0}" data-subj="__all">Tất cả</button>
        ${subjChips}
      </div>
    </div>
    <div class="panel">
      <h2>Thiết lập bài ôn</h2>
      <p class="hint">Số câu mỗi bài, và ưu tiên bốc lại những câu bạn hay sai.</p>
      <div class="rowfields">
        <div class="field"><label for="size">Số câu</label><input type="number" id="size" min="5" max="100" value="${cfg.size}"></div>
        <div class="field"><label for="mode">Cách bốc câu</label>
          <select id="mode">
            <option value="random">Ngẫu nhiên</option>
            <option value="weak">Ưu tiên câu từng sai</option>
            <option value="new">Ưu tiên câu chưa làm</option>
          </select></div>
        <label class="switch"><input type="checkbox" id="shf" ${cfg.shuffle?'checked':''}> Xáo trộn đáp án</label>
      </div>
      <button class="start" id="startBtn">Bắt đầu bài ôn</button>
    </div>
    <div class="panel">
      <h2>Tiến độ</h2>
      <p class="hint">Lưu ngay trên máy bạn. Xoá nếu muốn học lại từ đầu.</p>
      <button class="linkbtn" id="resetBtn">Xoá toàn bộ tiến độ</button>
    </div>`;

  document.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.subj;
    if(id==='__all') cfg.subjects=[];
    else{
      const k=cfg.subjects.indexOf(id);
      k<0 ? cfg.subjects.push(id) : cfg.subjects.splice(k,1);
    }
    renderHome();
  });
  document.getElementById('startBtn').onclick=()=>{
    cfg.size = Math.max(1, Math.min(200, +document.getElementById('size').value||20));
    cfg.shuffle = document.getElementById('shf').checked;
    startSession(document.getElementById('mode').value);
  };
  document.getElementById('resetBtn').onclick=()=>{
    if(confirm('Xoá toàn bộ tiến độ và bài đang dở?')){ store={stats:{},sess:null}; sess=null; save(); renderHome(); }
  };
  if(store.sess){
    document.getElementById('resumeBtn').onclick=()=>{ sess=store.sess; renderRound(); };
    document.getElementById('dropBtn').onclick=()=>{ sess=null; save(); renderHome(); };
  }
}

/* ============ session ============ */
function startSession(mode){
  let pool = DATA.questions.filter(q=>!cfg.subjects.length || cfg.subjects.includes(q.s));
  if(mode==='weak'){
    const w = pool.filter(q=>(store.stats[q.i]||{}).wrong);
    pool = shuffle(w).concat(shuffle(pool.filter(q=>!(store.stats[q.i]||{}).wrong)));
  }else if(mode==='new'){
    const n = pool.filter(q=>!store.stats[q.i]);
    pool = shuffle(n).concat(shuffle(pool.filter(q=>store.stats[q.i])));
  }else pool = shuffle(pool.slice());

  const picked = pool.slice(0, cfg.size).map(q=>q.i);
  if(!picked.length){ alert('Không có câu nào khớp lựa chọn.'); return; }
  sess = {
    total: picked.length, round:1, current: shuffle(picked), queue: [],
    answers:{}, graded:false, firstTryRight:0, order:{}
  };
  sess.current.forEach(i=>sess.order[i]=optOrder(i));
  save(); renderRound();
}
function optOrder(i){
  const ks = QMAP[i].o.map((_,k)=>k);
  return cfg.shuffle ? shuffle(ks) : ks;
}

function renderRound(){
  const s=sess;
  document.getElementById('topMeta').innerHTML = `<button class="linkbtn" id="homeBtn">Lưu & về trang chủ</button>`;
  const list = s.current.map((qi,n)=>qCard(QMAP[qi], n+1)).join('');
  document.getElementById('app').innerHTML = `
    <div class="roundbar">
      <div class="inner">
        <span class="roundtag">Vòng ${s.round}</span>
        <span class="roundsub">${s.current.length} câu · đã xong ${s.total - s.current.length - s.queue.length}/${s.total}</span>
      </div>
      <div class="bar"><i id="pbar"></i></div>
    </div>
    ${list}
    <div class="actions">
      <button class="btn primary" id="grade">Chấm điểm</button>
      <button class="btn" id="quit">Tạm dừng</button>
    </div>`;
  bindOpts();
  updateBar();
  document.getElementById('grade').onclick=grade;
  document.getElementById('quit').onclick=()=>{ save(); sess=sess; renderHome(); };
  document.getElementById('homeBtn').onclick=()=>{ save(); renderHome(); };
  window.scrollTo(0,0);
}

function qCard(q, n){
  const multi = q.a.length>1;
  const picked = sess.answers[q.i] || [];
  const opts = sess.order[q.i].map(k=>{
    const [key,txt]=q.o[k];
    const on = picked.includes(key);
    return `<label class="opt ${on?'pick':''}" data-q="${q.i}" data-k="${key}">
      <input type="${multi?'checkbox':'radio'}" name="q${q.i}" ${on?'checked':''}>
      <span class="k">${esc(key)}.</span><span>${esc(txt)}</span></label>`;
  }).join('');
  return `<article class="q" id="q${q.i}">
    <div class="qhead"><span class="qnum">Câu ${n}</span>
      <span class="qsubj">${esc(SUBJ[q.s]||'')}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    ${multi?`<p class="multi">Chọn ${q.a.length} đáp án</p>`:''}
    ${opts}
  </article>`;
}

function bindOpts(){
  document.querySelectorAll('.opt').forEach(el=>{
    el.onclick=e=>{
      if(sess.graded) { e.preventDefault(); return; }
      const qi=+el.dataset.q, key=el.dataset.k, q=QMAP[qi];
      let cur = sess.answers[qi]||[];
      if(q.a.length>1){
        cur = cur.includes(key) ? cur.filter(x=>x!==key) : cur.concat(key);
      }else cur=[key];
      sess.answers[qi]=cur;
      document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(o=>{
        const on=cur.includes(o.dataset.k);
        o.classList.toggle('pick',on);
        o.querySelector('input').checked=on;
      });
      updateBar(); save();
    };
  });
}
function updateBar(){
  const answered = sess.current.filter(i=>(sess.answers[i]||[]).length).length;
  const bar=document.getElementById('pbar');
  if(bar) bar.style.width = (answered/sess.current.length*100)+'%';
}

/* ============ grading ============ */
function isRight(q, picked){
  const a=[...q.a].sort().join(), p=[...(picked||[])].sort().join();
  return a===p && p!=='';
}
function grade(){
  const s=sess;
  const blank = s.current.filter(i=>!(s.answers[i]||[]).length);
  if(blank.length && !confirm(`Còn ${blank.length} câu chưa chọn đáp án. Chấm luôn? (các câu bỏ trống tính là sai)`)) return;

  s.graded=true;
  const wrong=[];
  s.current.forEach(qi=>{
    const q=QMAP[qi], ok=isRight(q, s.answers[qi]);
    const st=stat(qi);
    ok ? st.right++ : st.wrong++;
    if(s.round===1 && ok) s.firstTryRight++;
    if(!ok) wrong.push(qi);
    paint(q, ok);
  });
  s.pendingWrong = wrong;
  save();

  const right = s.current.length - wrong.length;
  const act=document.querySelector('.actions');
  act.innerHTML = `<button class="btn primary" id="next">${wrong.length? `Ôn lại ${wrong.length} câu sai` : 'Xem kết quả'}</button>
                   <button class="btn" id="quit2">Tạm dừng</button>`;
  document.querySelector('.roundbar .roundsub').textContent = `Đúng ${right}/${s.current.length} câu ở vòng này`;
  document.getElementById('next').onclick=nextRound;
  document.getElementById('quit2').onclick=()=>{ save(); renderHome(); };
  const firstWrong = wrong[0];
  if(firstWrong!=null) document.getElementById('q'+firstWrong).scrollIntoView({behavior:'smooth',block:'start'});
}

function paint(q, ok){
  const card=document.getElementById('q'+q.i);
  card.classList.add(ok?'correct':'wrong');
  const picked=sess.answers[q.i]||[];
  card.querySelectorAll('.opt').forEach(o=>{
    const k=o.dataset.k;
    o.classList.add('locked'); o.classList.remove('pick');
    o.querySelector('input').disabled=true;
    if(q.a.includes(k)){ o.classList.add('ok'); o.insertAdjacentHTML('beforeend','<span class="mark ok">đáp án đúng</span>'); }
    else if(picked.includes(k)){ o.classList.add('no'); o.insertAdjacentHTML('beforeend','<span class="mark no">bạn chọn</span>'); }
  });
  if(q.e && q.e.trim()){
    card.insertAdjacentHTML('beforeend', `<div class="expl"><b>Giải thích. </b>${esc(q.e.trim())}</div>`);
  }else if(!ok){
    card.insertAdjacentHTML('beforeend', `<div class="expl">Đáp án đúng: <b>${q.a.join(', ')}</b></div>`);
  }
}

function nextRound(){
  const s=sess;
  s.queue = s.queue.concat(s.pendingWrong||[]);
  s.pendingWrong=[];
  if(!s.queue.length){ finish(); return; }
  s.round++;
  s.current = shuffle(s.queue); s.queue=[];
  s.current.forEach(i=>{ s.answers[i]=[]; s.order[i]=optOrder(i); });
  s.graded=false;
  save(); renderRound();
}

function finish(){
  const s=sess, pct=Math.round(s.firstTryRight/s.total*100);
  sess=null; save();
  document.getElementById('topMeta').textContent='';
  document.getElementById('app').innerHTML=`
    <div class="result done">
      <h2>Xong bài ôn</h2>
      <p>Bạn đã trả lời đúng toàn bộ ${s.total} câu.</p>
      <div class="score">${pct}%</div>
      <p>đúng ngay từ lần đầu</p>
      <div class="tally">
        <div><b>${s.total}</b><span>câu trong bài</span></div>
        <div><b>${s.firstTryRight}</b><span>đúng vòng 1</span></div>
        <div><b>${s.round}</b><span>vòng đã làm</span></div>
      </div>
      <div class="actions"><button class="btn primary" id="again">Làm bài ôn mới</button>
        <button class="btn" id="home2">Về trang chủ</button></div>
    </div>`;
  document.getElementById('again').onclick=()=>startSession('random');
  document.getElementById('home2').onclick=renderHome;
  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
</html>
