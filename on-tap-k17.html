D","Cả 2 phương án B và C"]],"a":["A"],"e":""},{"i":182,"s":"truyen-thong","q":"Việc khoanh vùng và giải quyết tình huống tiềm ẩn/gây khủng hoảng truyền thông gồm các hoạt động nào?","o":[["A","- Nhanh chóng khoanh vùng, cô lập tình huống phát sinh khủng hoảng truyền thông, hạn chế những người không liên quan tiếp cận tình huống; - Sử dụng những biện pháp phù hợp với quy định của pháp luật nhằm hạn chế những người không liên quan lưu trữ, phát tán thông tin (như quay phim, chụp ảnh, ghi âm bằng phương tiện cá nhân...);"],["B","- Tìm hiểu, xác định nguyên nhân và giải quyết dứt điểm tình huống ngay tại chỗ theo các quy định của pháp luật và của BIDV; - Trong trường hợp tình huống không hoặc chưa được giải quyết ngay, cần trao đổi, thỏa thuận... với cá nhân/tập thể liên quan để giải quyết trong thời gian sớm nhất theo quy định của pháp luật và của BIDV."],["C","- Nhanh chóng khoanh vùng, cô lập tình huống phát sinh khủng hoảng truyền thông, hạn chế những người không liên quan tiếp cận tình huống; - Sử dụng những biện pháp phù hợp với quy định của pháp luật nhằm hạn chế những người không liên quan lưu trữ, phát tán thông tin (như quay phim, chụp ảnh, ghi âm bằng phương tiện cá nhân...); - Tìm hiểu, xác định nguyên nhân và giải quyết dứt điểm tình huống ngay tại chỗ theo các quy định của pháp luật và của BIDV; - Trong trường hợp tình huống không hoặc chưa được giải quyết ngay, cần trao đổi, thỏa thuận... với cá nhân/tập thể liên quan để giải quyết trong thời gian sớm nhất theo quy định của pháp luật và của BIDV."],["D","Không có hoạt động nào phù hợp"]],"a":["C"],"e":""},{"i":183,"s":"truyen-thong","q":"BIDV phát ngôn, cung cấp thông tin đột xuất cho báo chí trong các trường hợp nào?","o":[["A","- Khi có yêu cầu của các cơ quan có thẩm quyền của Nhà nước. - Khi cần thiết phải thông tin trên báo chí nhằm kịp thời thông báo, giải thích, làm rõ về một vấn đề nào đó liên quan đến hoạt động của BIDV. - Khi cần thiết phải thông tin, đề nghị cơ quan báo chí đăng tải, phát phản hồi, cải chính, xin lỗi nội dung thông tin trên báo chí. - Khi nhận được đề nghị cung cấp thông tin, trả lời phỏng vấn của báo chí trong quá trình hoạt động hoặc tại các sự kiện có sự tham dự của BIDV (các hội nghị, hội thảo, diễn đàn,...) phù hợp với quy định của Luật báo chí và chức năng nhiệm vụ của BIDV."],["B","- Khi có yêu cầu của các cơ quan có thẩm quyền của Nhà nước. - Khi cần thiết phải thông tin trên báo chí nhằm kịp thời thông báo, giải thích, làm rõ về một vấn đề nào đó liên quan đến hoạt động của BIDV. - Khi cần thiết phải thông tin, đề nghị cơ quan báo chí đăng tải, phát phản hồi, cải chính, xin lỗi nội dung thông tin trên báo chí."],["C","- Khi nhận được đề nghị cung cấp thông tin, trả lời phỏng vấn của báo chí trong quá trình hoạt động hoặc tại các sự kiện có sự tham dự của BIDV (các hội nghị, hội thảo, diễn đàn,...) phù hợp với quy định của Luật báo chí và chức năng nhiệm vụ của BIDV.D9"],["D","BIDV không có các phát ngôn đột xuất"]],"a":["A"],"e":""},{"i":184,"s":"truyen-thong","q":"Người phát ngôn BIDV có quyền từ chối phát ngôn và cung cấp thông tin cho báo chí trong các trường hợp nào?","o":[["A","- Thông tin thuộc danh mục bí mật nhà nước, bí mật thuộc nguyên tắc và quy định của Đảng, bí mật đời tư của cá nhân và bí mật khác theo quy định của pháp luật; - Thông tin về vụ án đang được điều tra hoặc chưa xét xử, trừ trường hợp cơ quan nhà nước, cơ quan điều tra cần thông tin trên báo chí những vấn đề có lợi cho hoạt động điều tra và công tác đấu tranh phòng, chống tội phạm;"],["B","- Thông tin về vụ việc đang trong quá trình thanh tra mà chưa có kết luận thanh tra; vụ việc đang trong quá trình giải quyết khiếu nại, tố cáo; những vấn đề tranh chấp, mâu thuẫn giữa các cơ quan nhà nước đang trong quá trình giải quyết, chưa có kết luận chính thức của người có thẩm quyền mà theo quy định của pháp luật chưa được phép công bố;"],["C","- Những văn bản chính sách, đề án đang trong quá trình soạn thảo mà theo quy định của pháp luật chưa được phép công bố hoặc chưa được cấp có thẩm quyền cho phép công bố. - Thông tin thuộc bí mật kinh doanh của BIDV. - Thông tin liên quan đến tài khoản, tiền gửi, tài sản gửi và các giao dịch của khách hàng tại BIDV. - Những trường hợp khác theo quy định của pháp luật."],["D","Phương án A và B"],["E","Phương án A, B và C"],["F","Không được từ chối phát ngôn và cung cấp thông tin trong mọi trường hợp"]],"a":["E"],"e":""},{"i":185,"s":"truyen-thong","q":"Ngày thành lập Ngân hàng Kiến thiết Việt Nam (tiền thân của BIDV) là ngày nào?","o":[["A","26/04/1957"],["B","27/05/1957"],["C","15/11/1976"],["D","01/01/1995"]],"a":["A"],"e":"Theo Lịch sử phát triển, BIDV thành lập ngày 26/04/1957 với tên gọi Ngân hàng Kiến thiết Việt Nam. Ngày 27/05/1957 thành lập 11 chi nhánh đầu tiên."},{"i":186,"s":"truyen-thong","q":"Sứ mệnh của BIDV theo Nghị quyết 345/NQ-BIDV phê duyệt Chiến lược phát triển đến năm 2030, tầm nhìn 2045 là gì?","o":[["A","Tiên phong kiến tạo giá trị vững bền cho nền tài chính quốc gia"],["B","Đem lại lợi ích, tiện ích tốt nhất cho khách hàng, cổ đông, người lao động, cộng đồng xã hội và phụng sự Tổ quốc"],["C","Trở thành tập đoàn tài chính xanh và mạnh nhất Đông Nam Á"],["D","Đồng hành phát triển cùng mọi doanh nghiệp Việt Nam vươn tầm quốc tế"]],"a":["B"],"e":"Nghị quyết 345/NQ-BIDV xác định rõ sứ mệnh: 'Đem lại lợi ích, tiện ích tốt nhất cho khách hàng, cổ đông, người lao động, cộng đồng xã hội và phụng sự Tổ quốc'."},{"i":187,"s":"truyen-thong","q":"Định vị thương hiệu của BIDV đến năm 2045 được xác định là gì?","o":[["A","Ngân hàng hàng đầu về dịch vụ bán lẻ và công nghệ số tại Việt Nam"],["B","Ngân hàng của mọi nhà, nghĩa tình và phát triển bền vững"],["C","Đạt quy mô tổng tài sản lớn nhất khu vực Đông Nam Á"],["D","Ngân hàng Thông minh – Hạnh phúc – Nghĩa tình"]],"a":["D"],"e":"Theo định hướng Chiến lược phát triển BIDV tầm nhìn 2045, định vị của BIDV là 'Ngân hàng Thông minh - Hạnh phúc - Nghĩa tình'."},{"i":188,"s":"truyen-thong","q":"Giá trị cốt lõi nào dưới đây thuộc Hệ năm giá trị cốt lõi (iBIDV) của Sổ tay Văn hóa BIDV sửa đổi, bổ sung năm 2026?","o":[["A","Chuyên nghiệp (Professionalism)"],["B","Nghĩa tình (Devotion)"],["C","Đổi mới (Innovation)"],["D","Tận tụy (Dedication)"]],"a":["B"],"e":"Hệ năm giá trị iBIDV sửa đổi bổ sung năm 2026 gồm: Trí tuệ (i - intelligence), Niềm tin (B - Belief), Liêm chính (I - Integrity), Nghĩa tình (D - Devotion), Khát vọng (V - Vitality). Giá trị 'Nghĩa tình' thay thế cho 'Chuyên nghiệp'."},{"i":189,"s":"truyen-thong","q":"Từ viết tắt 'iBIDV' trong Sổ tay Văn hóa thể hiện những giá trị cốt lõi nào theo tiếng Anh?","o":[["A","Innovation - Brand - Integrity - Discipline - Value"],["B","Intelligence - Belief - Integrity - Devotion - Vitality"],["C","Insight - Benevolence - Industry - Diligence - Victory"],["D","Initiative - Bravery - Impartiality - Duty - Versatility"]],"a":["B"],"e":"Viết tắt tiếng Anh tương ứng của iBIDV là: intelligence (Trí tuệ) - Belief (Niềm tin) - Integrity (Liêm chính) - Devotion (Nghĩa tình) - Vitality (Khát vọng)."},{"i":190,"s":"truyen-thong","q":"Hình mẫu và tính cách thương hiệu chủ đạo của BIDV là gì?","o":[["A","Người tiên phong kiến tạo"],["B","Người bảo vệ tin cậy"],["C","Người đồng hành thông tuệ"],["D","Chuyên gia tài chính năng động"]],"a":["C"],"e":"Tài liệu K17 xác định rõ thuộc tính hình mẫu, tính cách thương hiệu của BIDV là 'Người đồng hành thông tuệ'."},{"i":191,"s":"truyen-thong","q":"Định vị thương hiệu hiện tại của BIDV là gì?","o":[["A","Vững bước tiên phong, đồng hành phát triển"],["B","Tiên phong kiến tạo giá trị vững bền"],["C","Chia sẻ cơ hội, hợp tác thành công"],["D","Kết nối giá trị, phát triển bền vững"]],"a":["B"],"e":"Định vị thương hiệu của BIDV được tuyên bố cụ thể: 'Tiên phong kiến tạo giá trị vững bền'."},{"i":192,"s":"truyen-thong","q":"Chỉ số Brand Beat Score (BBS) dùng để đo lường sức khỏe thương hiệu của MiBrand tổng hợp ba biểu hiện tài sản thương hiệu nào?","o":[["A","Nhận biết, Cân nhắc, Đang sử dụng"],["B","Thống trị tâm trí, Tin cậy, Hài lòng"],["C","Yêu thích, Sẵn sàng giới thiệu, Sẵn sàng trả giá cao"],["D","Mức độ trung thành, Quen thuộc, Chất lượng cảm nhận"]],"a":["C"],"e":"Theo MiBrand (2026), chỉ số Brand Beat Score (BBS) tổng hợp từ ba biểu hiện tài sản thương hiệu: yêu thích, sẵn sàng giới thiệu và sẵn sàng trả giá cao."},{"i":193,"s":"truyen-thong","q":"Theo kết quả xếp hạng Sức khỏe thương hiệu (BBS Score) năm 2025 của MiBrand, thương hiệu BIDV đứng ở vị trí thứ mấy?","o":[["A","Thứ 1"],["B","Thứ 2"],["C","Thứ 3"],["D","Thứ 4"]],"a":["C"],"e":"Trong bảng xếp hạng Top 10 Ngân hàng có sức khỏe thương hiệu mạnh nhất 2025 của MiBrand, BIDV đạt 32,5 điểm, xếp thứ 3 toàn hệ thống (giữ nguyên hạng so với năm 2024)."},{"i":194,"s":"truyen-thong","q":"Theo báo cáo của MiBrand năm 2025, chỉ số thương hiệu nào của BIDV có thứ hạng cao nhất (đứng thứ 2 toàn ngành)?","o":[["A","Quen thuộc thương hiệu"],["B","Đáng đồng tiền"],["C","Sẵn sàng giới thiệu"],["D","Sẵn sàng trả giá cao"]],"a":["A"],"e":"Chỉ số Quen thuộc (Familiarity) của BIDV năm 2025 đạt 74,0 điểm, đứng ở vị trí thứ 2 toàn ngành."},{"i":195,"s":"truyen-thong","q":"Ngân hàng nào đã có sự bứt phá mạnh mẽ tăng 2 bậc trong bảng xếp hạng Sức khỏe thương hiệu (BBS) của MiBrand năm 2025?","o":[["A","Vietcombank"],["B","MB"],["C","Techcombank"],["D","VPBank"]],"a":["B"],"e":"Theo biểu đồ xếp hạng BBS 2025, MB đã tăng 2 bậc (lên vị trí thứ 2, đạt 34,2 điểm), trong khi Techcombank bị lùi 2 bậc xuống vị trí thứ 4."},{"i":196,"s":"truyen-thong","q":"Theo khảo sát hành trình trải nghiệm của MiBrand năm 2025, tỷ lệ chuyển đổi khách hàng từ 'Nhận biết' sang 'Yêu thích' đối với BIDV đạt bao nhiêu %?","o":[["A","76.0%"],["B","19.4%"],["C","17.0%"],["D","9.0%"]],"a":["D"],"e":"Hành trình trải nghiệm khách hàng năm 2025 của BIDV ghi nhận: Nhận biết đạt 76%, Cân nhắc đạt 19.4%, Đang sử dụng đạt 17%, Sử dụng chính đạt 13.3%, và Yêu thích đạt 9.0% (tăng từ 6.1% năm 2024)."},{"i":197,"s":"truyen-thong","q":"Báo cáo Digital 2026: Vietnam công bố số liệu nào về số lượng kết nối di động tại Việt Nam tính đến cuối năm 2025?","o":[["A","85,6 triệu"],["B","137 triệu"],["C","79,0 triệu"],["D","92,3 triệu"]],"a":["B"],"e":"Hệ sinh thái truyền thông số Việt Nam ghi nhận 137 triệu kết nối di động (chiếm 134% dân số)."},{"i":198,"s":"truyen-thong","q":"Luật Báo chí số 126/2025/QH15 chính thức có hiệu lực từ thời điểm nào?","o":[["A","23/09/2025"],["B","01/01/2026"],["C","26/04/2026"],["D","01/07/2026"]],"a":["D"],"e":"Theo bài giảng phần 3, Luật Báo chí số 126/2025/QH15 chính thức có hiệu lực thi hành từ ngày 01/07/2026."},{"i":199,"s":"truyen-thong","q":"Ba trụ cột phát triển của chiến lược BIDV đến 2030, tầm nhìn 2045 là gì?","o":[["A","Khách hàng; Nguồn nhân lực & Văn hóa doanh nghiệp; Đổi mới sáng tạo, Công nghệ & Chuyển đổi số"],["B","An toàn; Hiệu quả; Tăng trưởng bền vững"],["C","Đầu tư mạo hiểm; Tài chính xanh; Ngân hàng số bán lẻ"],["D","Chất lượng dịch vụ; Quản trị rủi ro; Mở rộng mạng lưới FDI"]],"a":["A"],"e":"Ba trụ cột phát triển cốt lõi của BIDV là: (1) Khách hàng, (2) Nguồn nhân lực và VHDN, (3) Đổi mới sáng tạo, công nghệ và chuyển đổi số."},{"i":200,"s":"truyen-thong","q":"Quản trị truyền thông và rủi ro theo nguyên tắc 'Social-first' yêu cầu điều gì?","o":[["A","Chỉ tập trung truyền tải thông tin trên mạng xã hội Facebook và TikTok"],["B","Ưu tiên phát hiện, đánh giá và phản ứng ban đầu theo tốc độ và logic lan truyền của mạng xã hội, đồng thời xử lý tận gốc nguyên nhân trong thực tế"],["C","Nghiêm cấm cán bộ nhân viên sử dụng mạng xã hội để bảo mật thông tin nội bộ tuyệt đối"],["D","Luôn luôn yêu cầu khách hàng hoặc chủ tài khoản xóa ngay lập tức các bài đăng bất lợi"]],"a":["B"],"e":"Nguyên tắc 'Social-first' có nghĩa là ưu tiên phát hiện, đánh giá và phản ứng ban đầu theo tốc độ, logic lan truyền của mạng xã hội; đồng thời xử lý tận gốc nguyên nhân trong hoạt động thực tế."},{"i":201,"s":"truyen-thong","q":"Quy trình xử lý khủng hoảng truyền thông chuẩn tại BIDV gồm mấy bước?","o":[["A","5 bước"],["B","6 bước"],["C","8 bước"],["D","10 bước"]],"a":["C"],"e":"Tài liệu K17 và Sổ tay quy định rõ 'Quy trình tám bước xử lý khủng hoảng truyền thông', đi từ Phát hiện sớm đến Phục hồi và rút kinh nghiệm."},{"i":202,"s":"truyen-thong","q":"Nội dung nào sau đây thuộc nhóm 5 điều TUYỆT ĐỐI TRÁNH khi xử lý khủng hoảng truyền thông tại đơn vị?","o":[["A","Lắng nghe sớm"],["B","Tranh luận, đối đầu với khách hàng trên mạng xã hội"],["C","Báo cáo đúng đầu mối"],["D","Truyền thông nhất quán"]],"a":["B"],"e":"Năm điều tuyệt đối tránh gồm: (1) Che giấu/báo cáo chậm, (2) Tự phát ngôn khi chưa phân công, (3) Tranh luận, đối đầu với khách hàng trên MXH, (4) Đổ lỗi, gây sức ép hoặc chỉ yêu cầu xóa bài, (5) Cung cấp thông tin chưa kiểm chứng."},{"i":203,"s":"truyen-thong","q":"Khi có phóng viên báo chí đến làm việc tự phát tại chi nhánh, việc lãnh đạo quản lý nên làm ngay là gì?","o":[["A","Trả lời ngay mọi câu hỏi của phóng viên để thể hiện sự hợp tác nhanh chóng"],["B","Từ chối thẳng thừng và yêu cầu bảo vệ mời phóng viên ra ngoài lập tức"],["C","Giới thiệu và kiểm tra thông tin nhà báo (thẻ nhà báo), xác định kế hoạch, phạm vi trao đổi, liên hệ ngay Ban Truyền thông & Thương hiệu hội sở chính"],["D","Cung cấp hồ sơ và tài liệu mật của khách hàng để chứng minh chi nhánh đúng"]],"a":["C"],"e":"Kinh nghiệm tiếp xúc báo chí: Nên kiểm tra thông tin thẻ nhà báo, thống nhất phạm vi, thời gian, chuẩn bị thông tin, nói trong phạm vi ủy quyền và phối hợp Ban TT&TH Hội sở chính."},{"i":204,"s":"truyen-thong","q":"5 từ khóa vàng thể hiện nguyên tắc xuyên suốt của người quản lý khi xử lý khủng hoảng truyền thông là gì?","o":[["A","SỚM – NHANH – ĐÚNG – THỰC – NHẤT"],["B","CHỦ ĐỘNG – KÍN ĐÁO – ĐỒNG BỘ – ĐƠN PHƯƠNG – LẬP TỨC"],["C","LẮNG NGHE – ĐÀO TẠO – PHỐI HỢP – ĐO LƯỜNG – LIÊN KẾT"],["D","TUÂN THỦ – KIÊN QUYẾT – XÓA BÀI – KHÔNG BÌNH LUẬN – KHẮC PHỤC"]],"a":["A"],"e":"Năm từ khóa cốt lõi cho mọi hành động ứng phó tại đơn vị là SỚM - NHANH - ĐÚNG - THỰC - NHẤT (Lắng nghe sớm, Xác minh nhanh, Báo cáo đúng, Xử lý thực, Truyền thông nhất quán)."},{"i":205,"s":"truyen-thong","q":"Theo Brand Finance, năm 2024, chỉ số nhận biết thương hiệu của BIDV đứng thứ mấy trên thị trường ngân hàng?","o":[["A","Thứ 1"],["B","Thứ 2"],["C","Thứ 3"],["D","Thứ 4"]],"a":["C"],"e":""},{"i":206,"s":"truyen-thong","q":"Đâu là kênh truyền thông nội bộ hiện hành của BIDV?","o":[["A","BIDV RealFM 19MHz"],["B","Facebook Fanpage"],["C","Gapowork"],["D","Workplace"]],"a":["C"],"e":""},{"i":207,"s":"truyen-thong","q":"Khi xử lý khủng hoảng truyền thông (KHTT), các đơn vị cần phải tuần tự thực hiện những việc gì?","o":[["A","1. Liên hệ với Ban truyền thông và thương hiệu 2. Nhận diện đúng sự việc và xác định rõ nguyên nhân có thể xảy ra KHTT 3. Định hướng thốn tin 4. Xây dựng kịch bản phòng ngừa KHTT"],["B","1.Nhận diện đúng sự việc và xác định rõ nguyên nhân có thể xảy ra KHTT 2.Liên hệ với Ban truyền thông và thương hiệu 3. Định hướng thông tin 4. Xây dựng kịch bản phòng ngừa KHTT"],["C","1. Xây dựng kịch bản phòng ngừa KHTT 2. Nhận diện đúng sự việc và xác định rõ nguyên nhân có thể xảy ra KHTT 3.Liên hệ với Ban truyền thông và thương hiệu 4.Định hướng thông tin"],["D","1. Liên hệ với Ban truyền thông và thương hiệu 2.Xây dựng kịch bản phòng ngừa KHTT 3.Nhận diện đúng sự việc và xác định rõ nguyên nhân có thể xảy ra KHTT 4.Định hướng thông tin"]],"a":["B"],"e":""},{"i":208,"s":"7-thoi-quen","q":"Đâu là định nghĩa của 'Hiệu quả' theo Thầy Tuấn và tài liệu?","o":[["A","Đạt kết quả tối đa bằng nguồn lực tối thiểu trong ngắn hạn."],["B","Liên tục đạt kết quả tốt bằng hoặc tốt hơn một cách bền vững với cùng một cách làm."],["C","Giải quyết triệt để mọi vấn đề phát sinh trong thời gian ngắn nhất."],["D","Đạt KPI do cấp trên giao phó bằng bất cứ giá trị nào."]],"a":["B"],"e":"Định nghĩa cốt lõi của hiệu quả là liên tục đạt được kết quả tốt bằng hoặc tốt hơn một cách bền vững với cùng một cách làm."},{"i":209,"s":"7-thoi-quen","q":"Bốn tiêu chí quyết định sự 'Thành công' toàn diện của cá nhân và tổ chức là gì?","o":[["A","Kết quả, Hiệu quả, Bình yên, và Mối quan hệ."],["B","Doanh thu, Chi phí, Hiệu suất, và Kỳ vọng."],["C","Năng lực chuyên môn, Năng lực chính trị, Nhân cách, và Lương bổng."],["D","Sự giàu có, Địa vị xã hội, Uy tín, và Sức khỏe thể chất."]],"a":["A"],"e":"Diễn giả nhấn mạnh thành công phải đạt được bốn yếu tố: kết quả, hiệu quả, sự bình yên và duy trì mối quan hệ tốt đẹp."},{"i":210,"s":"7-thoi-quen","q":"Theo 'Mô thức Làm việc Đội ngũ' (Hợp tác cùng nhau), kết quả nhận được (GET) là gì?","o":[["A","Thường xuyên tan làm muộn và gặp khó khăn trong việc phân nhiệm."],["B","Kết quả tốt hơn, hợp tác chặt chẽ hơn, tinh thần trách nhiệm chung, và cuộc sống cân bằng."],["C","Tự làm mọi việc và hoàn thành công việc theo cách riêng của mình."],["D","Mọi người biết mình hoàn thành việc gì và tin tưởng tuyệt đối."]],"a":["B"],"e":"Bảng so sánh mô thức chỉ rõ mô thức hợp tác đội ngũ mang lại kết quả tốt hơn, hợp tác chặt chẽ, trách nhiệm chung và cuộc sống cân bằng."},{"i":211,"s":"7-thoi-quen","q":"Đâu là 4 năng lực thiên phú trời cho giúp con người 'tạm ngưng' trước khi phản ứng?","o":[["A","Thể chất, Trí tuệ, Tình cảm, Lương tâm."],["B","Nhận thức bản thân, Lương tâm mách bảo, Hình dung kết quả, Ý chí hành động."],["C","Can đảm bày tỏ, Quan tâm lắng nghe, Thấu hiểu, Hợp lực."],["D","Tự chủ, Hoạch định, Thực thi, Tái tạo."]],"a":["B"],"e":"Bốn năng lực thiên phú bẩm sinh giúp con người làm chủ hành vi bao gồm nhận thức bản thân, lương tâm mách bảo, hình dung kết quả và ý chí độc lập."},{"i":212,"s":"7-thoi-quen","q":"Ngôn ngữ 'Can-Do' thuộc Đạo đức nhân cách hay tính cách và thể hiện thái độ gì?","o":[["A","Đạo đức nhân cách, thể hiện sự khiêm nhường."],["B","Đạo đức tính cách, thể hiện sự tích cực, chủ động, kiến tạo."],["C","Năng lực chính trị, thể hiện sự cam chịu."],["D","Đạo đức nhân cách, thể hiện sự độc đoán."]],"a":["B"],"e":"Ngôn ngữ Can-Do thuộc đạo đức tính cách biểu hiện sự tích cực, chủ động, luôn tìm kiếm giải pháp và khả năng kiến tạo."},{"i":213,"s":"7-thoi-quen","q":"Khoản đầu tư nào sau đây được coi là một 'khoản gửi' (+) vào Tài khoản Tình cảm?","o":[["A","Cho rằng mình đã hiểu để làm việc nhanh hơn."],["B","Đưa ra những kỳ vọng không rõ ràng để thử thách nhân viên."],["C","Trung tín với người vắng mặt (không nói xấu sau lưng)."],["D","Giải thích và bào chữa khi có sai sót xảy ra."]],"a":["C"],"e":"Tài khoản tình cảm liệt kê việc trung tín với người vắng mặt (không nói xấu sau lưng) là một khoản gửi quan trọng tích lũy niềm tin."},{"i":214,"s":"7-thoi-quen","q":"Kỹ thuật 'Hình dung ngược' (Reverse Visualization) được giải thích thế nào trong tài liệu?","o":[["A","Xem lại kết quả trong quá khứ để rút kinh nghiệm cho tương lai."],["B","Tưởng tượng mình đã đạt được kết quả mong muốn, rồi suy ngược lại những việc cần làm để đạt được kết quả đó."],["C","Đóng vai sếp và lính đảo ngược nhau để thấu hiểu nỗi khổ của nhau."],["D","Bắt đầu hành động trước rồi mới điều chỉnh mục tiêu sau."]],"a":["B"],"e":"Hình dung ngược nghĩa là tưởng tượng mình đã đạt được kết quả mong muốn rồi suy ngược lại các bước hành động cần thiết."},{"i":215,"s":"7-thoi-quen","q":"Nhóm công việc nào nằm trong Ô Q2 (Ô Hiệu quả) của Ma trận Quản lý Thời gian?","o":[["A","Khủng hoảng, vấn đề cấp bách, thời hạn gấp rút."],["B","Việc gián đoạn vô ích, báo cáo không cần thiết, cuộc họp không liên quan."],["C","Công việc chủ động, mục tiêu quan trọng, tư duy sáng tạo, hoạch định và phòng ngừa, xây dựng quan hệ."],["D","Việc lãng phí thời gian, buôn chuyện, xem TV, lướt internet quá mức."]],"a":["C"],"e":"Ô Q2 (Quan trọng nhưng không cấp bách) là ô hiệu quả, tập trung vào xây dựng quan hệ, tư duy sáng tạo, hoạch định và phòng ngừa."},{"i":216,"s":"7-thoi-quen","q":"Phẩm chất 'Chính trực, trung thành, can đảm, công bằng' thuộc về nhóm đạo đức nào?","o":[["A","Đạo đức tính cách."],["B","Đạo đức nhân cách."],["C","Năng lực chính trị."],["D","Năng lực chuyên môn."]],"a":["B"],"e":"Chính trực, trung thành, can đảm, công bằng là đạo đức nhân cách (bản tính bên trong), được ví như bộ rễ bám sâu dưới mặt đất."},{"i":217,"s":"7-thoi-quen","q":"Ma trận giao tiếp/ứng xử (Habit 4) phân loại các xu hướng giao tiếp dựa trên hai trục nào?","o":[["A","Sự kiêu hãnh và Sự định kiến."],["B","Mức độ Lắng nghe và Mức độ Bày tỏ."],["C","Đạo đức Nhân cách và Đạo đức Tính cách."],["D","Sự can đảm bày tỏ và Sự nhượng bộ."]],"a":["B"],"e":"Trục tung biểu thị mức độ Bày tỏ (từ ít đến nhiều) và trục hoành biểu thị mức độ Lắng nghe (từ ít đến nhiều)."},{"i":218,"s":"7-thoi-quen","q":"Trạng thái giao tiếp 'Thua - Thắng' (Yếu thế) có đặc điểm gì?","o":[["A","Bày tỏ nhiều nhưng Lắng nghe ít."],["B","Bày tỏ ít nhưng Lắng nghe nhiều (có xu hướng nhượng bộ, cam chịu và không dám bảo vệ chính kiến)."],["C","Bày tỏ ít và Lắng nghe ít."],["D","Bày tỏ nhiều và Lắng nghe nhiều."]],"a":["B"],"e":"Thua - Thắng (Yếu thế) là trạng thái người giao tiếp bày tỏ ý kiến ít nhưng lắng nghe đối phương nhiều, dẫn đến sự nhượng bộ bế tắc."},{"i":219,"s":"7-thoi-quen","q":"Thế nào là 'Lắng nghe chủ quan' (Subjective Listening)?","o":[["A","Quan tâm lắng nghe, tạo cơ hội cho người khác chia sẻ quan điểm và cảm xúc."],["B","Biến câu chuyện của người khác thành của mình bằng cách đánh giá, áp đặt, suy diễn, khuyên bảo."],["C","Lắng nghe bằng cả tai, mắt và tim để thấu hiểu sâu sắc."],["D","Dành phần lớn thời gian để đặt câu hỏi mở 5W1H."]],"a":["B"],"e":"Lắng nghe chủ quan biến câu chuyện người khác thành của mình bằng việc đánh giá, áp đặt lăng kính, suy diễn hoặc khuyên bảo vội vã."},{"i":220,"s":"7-thoi-quen","q":"Bốn phản hồi mang tính chủ quan (autobiographical responses) mà người nghe hay phạm phải là gì?","o":[["A","Tôn trọng, kiểm tra, phân tích, tìm hiểu."],["B","Đánh giá, áp đặt, suy diễn, khuyên bảo."],["C","Nhận thức bản thân, lương tâm bách bảo, hình dung kết quả, ý chí độc lập."],["D","Khai vấn, định hướng, huấn luyện, hỗ trợ."]],"a":["B"],"e":"Lắng nghe chủ quan bao gồm bốn hành vi điển hình là đánh giá, áp đặt góc nhìn cá nhân, suy diễn động cơ và khuyên bảo chủ quan."},{"i":221,"s":"7-thoi-quen","q":"Đâu là 4 bước để 'Cùng tạo cách mới' (Synergize - Habit 6)?","o":[["A","Sáng tạo lần 1, Sáng tạo lần 2, Thực thi, Tái tạo."],["B","Xác định tâm thế, Định nghĩa thành công, Sáng tạo giải pháp, Đạt được cách mới."],["C","Tự chủ, Hoạch định, Thực thi, Kiểm tra."],["D","Thấu hiểu, Đồng thuận, Thỏa hiệp, Hợp tác."]],"a":["B"],"e":"Hành trình cùng tạo cách mới đi qua 4 bước: xác định tâm thế, định nghĩa thành công, sáng tạo giải pháp và đạt được cách mới vượt trội."},{"i":222,"s":"7-thoi-quen","q":"Bản chất của 'Hợp lực' (Synergy) khác với 'Thỏa hiệp' (Compromise) như thế nào?","o":[["A","Hợp lực là 1+1=2, Thỏa hiệp là 1+1=3."],["B","Hợp lực tạo ra giải pháp mới vượt trội (1+1=3 hoặc nhiều hơn); Thỏa hiệp là mỗi người nhường một chút (1+1=1 hoặc ít hơn)."],["C","Hợp lực là bắt buộc làm theo ý sếp; Thỏa hiệp là làm theo ý đa số."],["D","Hợp lực là lấn át đối phương; Thỏa hiệp là yếu thế nhượng bộ."]],"a":["B"],"e":"Hợp lực là sự hợp tác sáng tạo tạo ra giá trị lớn hơn tổng các phần (1+1=3 hoặc nhiều hơn), còn thỏa hiệp chỉ là mỗi bên chịu thiệt đi một ít."},{"i":223,"s":"7-thoi-quen","q":"Các phương diện 'Thân - Tâm - Thần - Trí' trong Habit 7 tương ứng với bốn khía cạnh nào?","o":[["A","Thể chất, Xã hội/Cảm xúc, Tâm linh/Tinh thần, Trí tuệ."],["B","Sức khỏe, Tiền bạc, Sự nghiệp, Mối quan hệ."],["C","Năng lực chuyên môn, Năng lực chính trị, Đạo đức nhân cách, Đạo đức tính cách."],["D","Cơ thể, Bộ não, Trái tim, Linh hồn."]],"a":["A"],"e":"Làm mới bản thân (Habit 7) dựa trên việc phát triển đồng đều cả 4 khía cạnh: Thể chất (Thân), Xã hội/Tình cảm (Tâm), Tâm linh (Thần), Trí tuệ (Trí)."},{"i":224,"s":"7-thoi-quen","q":"Khi cho nhân viên nghỉ phép dài ngày để du lịch, học tập, tái tạo năng lượng, sếp đang đầu tư vào khía cạnh nào trong Habit 7?","o":[["A","Thân (Thể chất)."],["B","Tâm & Trí (Tinh thần & Trí tuệ)."],["C","Thần (Tâm linh)."],["D","Cả Thân, Tâm, Thần và Trí (con người tổng thể)."]],"a":["D"],"e":"Thầy Tuấn phân tích việc du lịch dài ngày để tìm kiếm văn minh giúp cân bằng và tái sinh năng lực cho cả Thân, Tâm, Thần và Trí của nhân viên."},{"i":225,"s":"7-thoi-quen","q":"Khi người quản lý được điều chuyển sang bộ phận mới, nguyên tắc ứng xử với bảng đánh giá nhân sự của mình là gì?","o":[["A","Để lại bảng đánh giá cho người quản lý kế nhiệm tham khảo."],["B","Công khai bảng đánh giá cho toàn bộ nhân viên cũ biết."],["C","Mang bảng đó đi hoặc tiêu hủy nó, không để lại cho người mới để tránh 'gieo' định kiến và kiêu hãnh."],["D","Nộp bảng đó cho phòng Nhân sự hoặc Sếp cấp trên làm tài liệu lưu trữ."]],"a":["C"],"e":"Người quản lý tuyệt đối không để lại bảng đánh giá cho người mới vì mỗi người một góc nhìn, để lại sẽ gieo định kiến và kiêu hãnh lên người kế nhiệm."},{"i":226,"s":"7-thoi-quen","q":"Câu nói 'Làm sếp ăn lương để hỏi' của Thầy Tuấn hàm ý điều gì trong quản trị?","o":[["A","Sếp không cần biết làm gì, chỉ cần đi hỏi nhân viên."],["B","Sếp đặt câu hỏi (khai vấn/coaching) để giúp nhân viên tự ngộ, tự tìm giải pháp và phát triển tư duy thay vì áp đặt câu trả lời."],["C","Sếp hỏi để kiểm tra xem ai lười biếng để phạt nặng."],["D","Sếp hỏi để lấy thông tin báo cáo cho cấp trên."]],"a":["B"],"e":"Sếp ăn lương để hỏi giúp chuyển đổi mô thức nhân viên, kích thích sự tự ngộ thông qua việc khai vấn, giúp nhân viên phát huy vai trò chủ động."},{"i":227,"s":"7-thoi-quen","q":"Trước khi đưa ra quyết định sa thải/cho thôi việc một nhân sự rất giỏi, sếp cần trả lời 4 câu hỏi gì để bảo đảm quyết định sáng suốt?","o":[["A","Việc sa thải này có tốt cho Công ty không? Có tốt cho Bộ phận không? Có tốt cho bản thân Người đó không? Và có tốt cho chính tôi (Sếp) không?"],["B","Công ty có tuyển được người thay thế ngay không? Chi phí đền bù hợp đồng là bao nhiêu? Có bị nhân viên kiện không? Cấp trên có đồng ý không?"],["C","Nhân viên đó có lỗi gì nặng không? Có ai làm chứng không? Có biên bản kỷ luật không? Có đúng quy trình không?"],["D","Kết quả kinh doanh tháng này thế nào? KPI có bị ảnh hưởng không? Khách hàng có phản ứng không? Đồng nghiệp có đồng thuận không?"]],"a":["A"],"e":"Bốn câu hỏi tự vấn trước khi sa thải nhân sự bao gồm: Tốt cho công ty không? Tốt cho bộ phận không? Tốt cho bản thân người đó không? Tốt cho mình (Sếp) không?"},{"i":228,"s":"7-thoi-quen","q":"Theo bạn, để đạt được hiệu quả thực sự và bền vững trong công việc cũng như cuộc sống, điều gì là quan trọng nhất?","o":[["A","Tập trung vào việc hoàn thành thật nhanh và nhiều công việc"],["B","Luôn tìm kiếm những bí quyết hay mẹo để thành công nhanh chóng"],["C","Hiểu rõ bản thân từ bên trong, những giá trị cốt lõi và mục đích sống của mình"],["D","Chú trọng vào việc tạo ra thật nhiều thành quả và kết quả"]],"a":["C"],"e":"Nền tảng: nhận thức"},{"i":229,"s":"7-thoi-quen","q":"Một người được coi là làm việc \"có hiệu quả\" khi họ","o":[["A","Xử lý công việc trong thời gian ngắn nhất có thể"],["B","Đạt được kết quả mình mong muốn một cách lâu dài và bền vững"],["C","Luôn cố gắng giành được thành công bằng mọi giá"],["D","Có những cách làm độc đáo, đi tắt đón đầu để đạt mục tiêu"]],"a":["B"],"e":"Nền tảng: nhận thức"},{"i":230,"s":"7-thoi-quen","q":"Cách chúng ta nhìn nhận, đánh giá một sự việc, một tình huống, hay một vấn đề thường bắt nguồn từ đâu?","o":[["A","Từ những việc cụ thể mà chúng ta đã làm"],["B","Từ những kết quả mà chúng ta đã đạt được"],["C","Từ chính cách suy nghĩ và góc nhìn của chúng ta về sự việc đó"],["D","Từ tất cả những điều trên"]],"a":["C"],"e":"Nền tảng: nhận thức"},{"i":231,"s":"7-thoi-quen","q":"Khi gặp phải một tình huống khó khăn hoặc không như ý, bạn thường có suy nghĩ và hành động nào đầu tiên?","o":[["A","Chịu trách nhiệm với cuộc sống của mình, thường chủ động tìm cách để thay đổi tình hình hoặc tác động đến nó"],["B","Tôi thường phụ thuộc và tuân theo hoàn cảnh"],["C","Tôi thường nghĩ do hoàn cảnh hoặc người khác gây ra"],["D","Tôi thường phản ứng theo cảm xúc tức thời của mình và chờ xem có ai có thể giúp mình hay không"]],"a":["A"],"e":"Tự chủ và kiến tạo (Thói quen 1)"},{"i":232,"s":"7-thoi-quen","q":"Điều gì thể hiện rõ nhất một người có khả năng tự chủ và tạo ra thay đổi tích cực trong cuộc sống của mình?","o":[["A","Họ thường chờ đợi mọi chuyện tự diễn ra và phản ứng theo những gì đã xảy ra"],["B","Họ nhận trách nhiệm về cuộc đời mình và tích cực hành động để đạt được điều mình muốn"],["C","Họ luôn cố gắng vượt qua hoàn cảnh và chứng tỏ bản thân tốt hơn người khác"],["D","Họ thường tìm lý do từ bên ngoài hoặc từ người khác khi mọi việc không như ý"]],"a":["B"],"e":"Tự chủ và kiến tạo (Thói quen 1)"},{"i":233,"s":"7-thoi-quen","q":"Làm sao để chúng ta chủ động kiểm soát cuộc sống của mình?","o":[["A","Bằng cách cố gắng kiểm soát mọi yếu tố bên ngoài"],["B","Bằng cách tập trung vào những việc chúng ta có thể ảnh hưởng và thay đổi, dùng ngôn ngữ tích cực, chủ động"],["C","Bằng cách phản ứng thật nhanh chóng với mọi sự kiện"],["D","Hướng đến đạt được mục tiêu bằng mọi cách"]],"a":["B"],"e":"Tự chủ và kiến tạo (Thói quen 1)"},{"i":234,"s":"7-thoi-quen","q":"Trước khi bắt đầu một công việc hay dự án quan trọng, bạn thường làm gì?","o":[["A","Bắt tay vào làm ngay thay vì tốn thời gian suy nghĩ"],["B","Xác định rõ mục tiêu trước khi bắt đầu"],["C","Vừa làm vừa tính toán, đến đâu hay đến đó"],["D","Chỉ tập trung vào quá trình, không quan tâm đến kết quả"]],"a":["B"],"e":"Mục tiêu và Ưu tiên (Thói quen 2)"},{"i":235,"s":"7-thoi-quen","q":"Việc xác định rõ kết quả mong muốn trước khi bắt đầu có ý nghĩa gì đối với bạn?","o":[["A","Giúp tôi dự đoán được những rủi ro hoặc hậu quả có thể xảy ra"],["B","Giúp tôi có một \"bản thiết kế\" hay định hướng rõ ràng cho quá trình thực hiện"],["C","Giúp tôi dễ dàng dừng lại nếu thấy công việc quá khó khăn"],["D","Giúp tôi đưa ra các quyết định nhanh hơn"]],"a":["B"],"e":"Mục tiêu và Ưu tiên (Thói quen 2)"},{"i":236,"s":"7-thoi-quen","q":"Để xây dựng một định hướng rõ ràng và ý nghĩa cho cuộc đời mình, theo bạn, những yếu tố nào là nền tảng nhất?","o":[["A","Những hình mẫu và tâm gương thành công từ những người mà tôi kính trọng và ngưỡng mộ"],["B","Sự đúc kết từ những bài học quá khứ cùng với những khát vọng và tầm nhìn của tôi về tương lai"],["C","Các trách nhiệm và vị trí cụ thể mà tôi đang gánh vác trong cuộc sống (vd: vài trò trong gia đình, công viêc, cộng đồng)"],["D","Tổng hợp tất cả các yếu tố từ kinh nghiệm đã qua, những hình dung về tương lai, và những vai trò hiện tại của bản thân"]],"a":["D"],"e":"Mục tiêu và Ưu tiên (Thói quen 2)"},{"i":237,"s":"7-thoi-quen","q":"Khi có quá nhiều việc cần làm và thời gian có hạn, theo bạn, người quản lý nên xử lý như thế nào?","o":[["A","Làm theo thứ tự công việc cấp bách và đến hạn"],["B","Tập trung ưu tiên những việc thực sự quan trọng nhất, và tìm cách xử lý hoặc giao bớt phần còn lại"],["C","Cố gắng làm thêm giờ để hoàn thành tất cả mọi thứ"],["D","Làm những việc mà bản thân cảm thấy thú vị hoặc dễ dàng xử lý nhất trước"]],"a":["B"],"e":"Quản lý Thời gian và Ưu tiên Quan trọng (Thói quen 3)"},{"i":238,"s":"7-thoi-quen","q":"Để lập kế hoạch hiệu quả cho tuần làm việc của mình, bạn thường tập trung vào điều gì?","o":[["A","Liệt kê tất cả các việc cần làm và xếp lịch cho từng việc"],["B","Xác định những mục tiêu lớn, quan trọng nhất của tuần (những \"viên đá lớn\") và xếp lịch ưu tiên cho chúng trước, sau đó mới sắp xếp các việc khác xung quanh"],["C","Thống nhất công việc với cấp trên và xác định vai trò của bản thân trước khi lên kế hoạch"],["D","Sẵn sàng cho những công việc đột xuất/phát sinh có thể xảy ra bất cứ lúc nào"]],"a":["B"],"e":"Quản lý Thời gian và Ưu tiên Quan trọng (Thói quen 3)"},{"i":239,"s":"7-thoi-quen","q":"Một người được coi là \"thành công cá nhân\" khi họ đạt được điều gì?","o":[["A","Khi họ trở nên độc lập và tự chủ trong mọi việc"],["B","Khi họ có thể phụ thuộc vào người khác để cùng hoàn thành mục tiêu"],["C","Khi họ đã thành thục cách làm việc nhóm và giao tiếp tốt"],["D","Khi họ có nhiều kỹ năng mềm"]],"a":["A"],"e":"Quản lý Thời gian và Ưu tiên Quan trọng (Thói quen 3)"},{"i":240,"s":"7-thoi-quen","q":"Khi giải quyết một bất đồng hoặc mâu thuẫn với đồng nghiệp, cách tiếp cận nào là tốt nhất với bạn?","o":[["A","Chỉ tập trung vào việc bảo vệ lợi ích và nhu cầu của riêng mình"],["B","Né tránh tranh cãi, để mọi chuyện tự lắng xuống"],["C","Tìm kiếm một giải pháp mà cả hai bên đều cảm thấy có lợi và hài lòng"],["D","Yêu cầu bên kia phải tự tìm cách giải quyết vấn đề của họ"]],"a":["C"],"e":"Quan hệ và Hợp tác (Thói quen 4)"},{"i":241,"s":"7-thoi-quen","q":"Kiểu suy nghĩ nào dưới đây thường dẫn đến sự cạnh tranh gay gắt và ganh đua giữa mọi người","o":[["A","Tư duy cho rằng mọi thứ đều có hạn, nếu người khác có thì mình sẽ mất phần"],["B","Tư duy cho rằng có đủ cơ hội và tài nguyên cho tất cả mọi người"],["C","Tư duy luôn sẵn sàng hành động và thử thách bản thân"],["D","Tư duy chủ động và tích cực"]],"a":["A"],"e":"Quan hệ và Hợp tác (Thói quen 4)"},{"i":242,"s":"7-thoi-quen","q":"Để có thể đạt được một giải pháp mà cả hai bên cùng có lợi (cùng thắng), bạn nên làm gì?","o":[["A","Chỉ nên mạnh dạn trình bày ý kiến và mong muốn của mình"],["B","Chỉ nên tập trung lắng nghe để hiểu nhu cầu của người khác."],["C","Cần phải vừa mạnh dạn bày tỏ quan điểm của mình, vừa chân thành lắng nghe nhu cầu của người khác"],["D","Không cần làm gì cả, cứ để mọi việc tự nhiên"]],"a":["C"],"e":"Quan hệ và Hợp tác (Thói quen 4)"},{"i":243,"s":"7-thoi-quen","q":"Khi người khác đang chia sẻ điều gì đó quan trọng, theo bạn phản ứng nào dưới đây thể hiện thói quen “lắng nghe chủ quan”?","o":[["A","Lắng nghe để thực sự hiểu sâu sắc cảm xúc, quan điểm và điều họ muốn nói"],["B","Vừa nghe vừa đưa ra đánh giá, phán xét, suy diễn, sau đó ngắt lời để đưa lời khuyên hoặc áp đặt quan điểm của mình về vấn đề được chia sẻ"],["C","Tôi vừa nghe vừa tìm kiếm những điểm yếu trong lập luận của họ để phản bác"],["D","Tôi chỉ nghe những gì liên quan đến bản thân mình"]],"a":["B"],"e":"Lắng nghe và Thấu hiểu (Thói quen 5)"},{"i":244,"s":"7-thoi-quen","q":"Để một cuộc hội thoại hiệu quả, theo bạn, thời điểm nào là thích hợp để bạn bắt đầu trình bày ý kiến và quan điểm của mình","o":[["A","Sau khi bạn đã kiên nhẫn lắng nghe đối phương và cho phép họ bày tỏ hết những gì họ muốn nói"],["B","Ngay khi cuộc trò chuyện bắt đầu, để đảm bảo quan điểm của bạn được trình bày rõ ràng"],["C","Khi bạn có nhiều cảm xúc và muốn bày tỏ suy nghĩ của mình ngay lập tức"],["D","Khi bạn đã hiểu rõ người khác và tìm được một cách thức, thời điểm phù hợp để thể hiện qua điểm của mình một cách rõ ràng và thuyết phục"]],"a":["D"],"e":"Lắng nghe và Thấu hiểu (Thói quen 5)"},{"i":245,"s":"7-thoi-quen","q":"Bạn thường làm gì để ý kiến của mình được người khác lắng nghe và chấp nhận một cách hiệu quả?","o":[["A","Tập trung vào việc trình bày những lý lẽ logic của mình"],["B","Tìm thời điểm thích hợp và kết hợp cả lý lẽ, uy tín (sự tin cậy) và cảm xúc của mình"],["C","Kể thật nhiều về những kinh nghiệm cá nhân của bạn"],["D","Chỉ dựa vào trí thông minh của bạn"]],"a":["B"],"e":"Lắng nghe và Thấu hiểu (Thói quen 5)"},{"i":246,"s":"7-thoi-quen","q":"Để mọi thành viên trong một dự án nhóm cảm thấy có giá trị và muốn đóng góp, bạn sẽ làm gì?","o":[["A","Tập trung lấy ý kiến đóng góp từ những thành viên nổi bật nhất"],["B","Do là người có uy tín trong nhóm nên tôi tự đưa ra mọi quyết định để tiết kiệm thời gian"],["C","Khuyến khích tất cả mọi người tham gia tích cực và tôn trọng những góc nhìn, ý kiến khác nhau"],["D","Lắng nghe ý kiến của tất cả mọi người nhưng không nhất thiết phải sử dụng"]],"a":["C"],"e":"Sức mạnh của sự hợp tác (Thói quen 6)"},{"i":247,"s":"7-thoi-quen","q":"Khi làm việc nhóm, điều gì giúp tạo ra kết quả tốt hơn so với làm việc một mình?","o":[["A","Mọi người tuân theo ý kiến của người giỏi nhất/có ảnh hưởng nhất"],["B","Nhóm chia việc để ai cũng làm phần mình nhanh chóng"],["C","Nhóm làm việc nhanh hơn vì ai cũng nghĩ giống nhau."],["D","Có thể tạo ra giải pháp tốt hơn nhờ kết hợp ý tưởng đa dạng"]],"a":["D"],"e":"Sức mạnh của sự hợp tác (Thói quen 6)"},{"i":248,"s":"7-thoi-quen","q":"Khi làm viêc nhóm và gặp ý kiến trái ngược, cách xử lý nào sau đây giúp nhóm đạt hiệu quả tốt nhất?","o":[["A","Phớt lờ ý kiến khác biệt để tránh mất thời gian tranh luận"],["B","Chọn ý kiến của người giữ chức vụ cao và có kinh nghiệm hoặc có sức ảnh hưởng nhất để dễ thống nhất"],["C","Khuyến khích mọi người trao đổi cởi mở, tôn trọng nhau và xem xét các quan điểm khác nhau để cùng nhau tìm giải pháp tốt nhất"],["D","Giữ vững quan điểm cá nhân và thuyết phục mọi người theo mình"]],"a":["C"],"e":"Sức mạnh của sự hợp tác (Thói quen 6)"},{"i":249,"s":"7-thoi-quen","q":"Thông điệp chính của việc \"làm mới bản thân\" (tự chăm sóc và phát triển) theo bạn là gì?","o":[["A","Thay đổi diện mạo của bản thân thường xuyên"],["B","Thường xuyên duy trì sự cân bằng và tự làm mới mình ở bốn khía cạnh quan trọng của con người (thể chất, tinh thần, trí tuệ, và các mối quan hệ)."],["C","Chỉ cần luôn nuôi dưỡng tinh thần lạc quan và suy nghĩ tích cực"],["D","Tập trung vào việc phát triển bản thân thông qua các mối quan hệ"]],"a":["B"],"e":"Làm mới và Phát triển bản thân (Thói quen 7)"},{"i":250,"s":"7-thoi-quen","q":"Để tự làm mới và phát triển mỗi ngày, một người cần chú ý đến những khía cạnh nào sau đây?","o":[["A","Sức khỏe thể chất, trí tuệ, tinh thần, và các mối quan hệ (tình cảm/xã hội)."],["B","Thực hành, cảm xúc, thành công, và trí tuệ"],["C","Tài chính, cảm xúc, tinh thần, và thể chất"],["D","Cách tư duy, cảm xúc, trí tuệ, và tinh thần"]],"a":["A"],"e":"Làm mới và Phát triển bản thân (Thói quen 7)"},{"i":251,"s":"7-thoi-quen","q":"Theo bạn, tại sao việc liên tục phát triển và làm mới bản thân mỗi ngày lại rất quan trọng?","o":[["A","Giúp chúng ta duy trì năng lượng, sức khỏe và khả năng để làm việc hiệu quả lâu dài"],["B","Giúp chúng ta đạt được thành công nhanh chóng mà không bị đuối sức"],["C","Để được nhiều người yêu mến và ngưỡng mộ."],["D","Để bạn có cơ hội được thăng tiến trong công việc"]],"a":["A"],"e":"Làm mới và Phát triển bản thân (Thói quen 7)"},{"i":252,"s":"7-thoi-quen","q":"Chương trình đào tạo \"7 Thói quen hiệu quả®\" có mục đích gì?","o":[["A","Cung cấp hướng dẫn toàn diện để phát triển bản thân, giúp các cá nhân trở nên hiệu quả hơn"],["B","Đưa ra mô hình quản lý thời gian hiệu quả"],["C","Thúc đẩy việc luôn sử dụng những lời khẳng định tích cực"],["D","Chia sẻ những kiến thức về lãnh đạo và câu chuyện thành công"]],"a":["A"],"e":""},{"i":253,"s":"7-thoi-quen","q":"Đạo đức bản tính trong \"7 Thói quen hiệu quả®\" của Stephen R. Covey đề cập tới việc:","o":[["A","Tập trung vào các yếu tố bên ngoài"],["B","Tập trung vào con người bên trong"],["C","Tập trung vào thành công và kết quả"],["D","Tập trung vào những biện pháp hiệu suất cao"]],"a":["B"],"e":""},{"i":254,"s":"7-thoi-quen","q":"Thế nào là hiệu quả?","o":[["A","Thực hiện công việc nhanh nhất với thời gian ngắn nhất"],["B","Đạt được thành công bằng mọi giá"],["C","Đạt được kết quả mong muốn một cách lâu dài"],["D","Đi tắt đón đầu là chìa khóa của thành công"]],"a":["C"],"e":""},{"i":255,"s":"7-thoi-quen","q":"Mức độ trưởng thành cao nhất trong \"Hệ điều hành hiệu quả\" là gì?","o":[["A","Độc lập"],["B","Tương thuộc"],["C","Thành công"],["D","Phụ thuộc"]],"a":["B"],"e":""},{"i":256,"s":"7-thoi-quen","q":"Mô thức bắt nguồn từ","o":[["A","Những việc chúng ta làm"],["B","Những kết quả chúng ta đạt được"],["C","Cách chúng ta nhìn nhận vấn đề"],["D","Cả ba điều trên"]],"a":["C"],"e":""},{"i":257,"s":"7-thoi-quen","q":"Thói quen đầu tiên \"Tự chủ & kiến tạo®\" nghĩa là gì?","o":[["A","Luôn phản ứng với các tình huống và sự kiện diễn ra xung quanh chúng ta"],["B","Chủ động và chịu trách nhiệm với cuộc sống của riêng mình"],["C","Bị động, để hoàn cảnh chi phối"],["D","Đổ lỗi cho người khác về hoàn cảnh của bản thân"]],"a":["B"],"e":""},{"i":258,"s":"7-thoi-quen","q":"Như nào là một “Người kiến tạo”?","o":[["A","Người thay đổi từ ngôn ngữ bị động sang ngôn ngữ chủ động"],["B","Người thay đổi từ tư duy hạn hẹp sang tư duy “đủ đầy”"],["C","Người phá bỏ những hành vi cũ không lành mạnh, có hại, lạm dụng hoặc không hiệu quả và thay thế bằng những hành vi chủ động, có ích và có hiệu quả"],["D","Người luôn có tư duy cùng thắng"]],"a":["C"],"e":""},{"i":259,"s":"7-thoi-quen","q":"“Vòng tròn quan tâm” khác với “Vòng tròn ảnh hưởng” như thế nào?","o":[["A","Vòng tròn quan tâm bao gồm mọi thứ trong tầm kiểm soát của một người, còn Vòng tròn ảnh hưởng bao gồm những thứ ngoài tầm kiểm soát"],["B","Vòng tròn ảnh hưởng bao gồm những thứ chúng ta quan tâm và lo nghĩ đến, còn Vòng tròn quan tâm bao gồm những thứ chúng ta có thể tác động"],["C","Vòng tròn quan tâm bao gồm những thứ chúng ta quan tâm nhưng không thể kiểm soát được, trong khi Vòng tròn ảnh hưởng bao gồm những thứ chúng ta có thể tác động trực tiếp hoặc thay đổi"],["D","Vòng tròn quan tâm và Vòng tròn ảnh hưởng là như nhau"]],"a":["C"],"e":""},{"i":260,"s":"7-thoi-quen","q":"Tập trung vào Vòng tròn ảnh hưởng của bản thân, thay vì Vòng tròn quan tâm có nghĩa là gì?","o":[["A","Tập trung vào những thứ không thể thay đổi vì đó là điều làm ta lo lắng"],["B","Tập trung vào những thứ có thể tác động hoặc thay đổi, thể hiện tinh thần tự chủ, kiến tạo"],["C","Tập trung vào những thứ ngoài tầm kiểm soát vì ta không thể làm gì và cảm thấy bất lực"],["D","Nên tập trung vào Vòng tròn ảnh hưởng và Vòng tròn quan tâm như nhau"]],"a":["B"],"e":""},{"i":261,"s":"7-thoi-quen","q":"Chúng ta có thể chủ động kiểm soát cuộc sống và hoàn cảnh của mình bằng cách nào?","o":[["A","Tạm ngừng để lựa chọn những phản ứng sáng suốt"],["B","Sử dụng ngôn ngữ chủ động"],["C","Tập trung vào Vòng tròn ảnh hưởng"],["D","Tất cả những điều trên"]],"a":["D"],"e":""},{"i":262,"s":"7-thoi-quen","q":"4 Khả năng riêng có của con người là gì?","o":[["A","Thể chất khỏe mạnh, trí tuệ tinh thông, tình cảm dồi dào, tinh thần mạnh mẽ"],["B","Nhận thức bản thân, hình dung kết quả, lương tâm mách bảo, ý chí hành động"],["C","Yêu quý gia đình, hợp tác sáng tạo, nhận thức bản thân, tinh ch","q":"Trong các nguyên tắc vàng lập kế hoạch tại chi nhánh (theo Tài liệu PDF), nguyên tắc nào nhấn mạnh \"20% công việc quan trọng nhất mang lại 80% hiệu quả\"?","o":[["A","Nguyên tắc gắn kết 2 chiều (phối hợp dọc - ngang)"],["B","Nguyên tắc mục tiêu SMART-ER (cụ thể, đo lường được)"],["C","Nguyên tắc Ưu tiên (tập trung 80/20 vào khách hàng và công việc cốt lõi)"],["D","Nguyên tắc Cam kết và tham gia (tránh việc chỉ là mơ ước)"]],"a":["C"],"e":"Tài liệu slide 12 chỉ rõ Nguyên tắc \"ƯU TIÊN\": 20% công việc quan trọng mang lại 80% hiệu quả, 20% khách hàng mang lại 80% lợi nhuận, 20% khách hàng lớn tiềm ẩn 80% rủi ro."},{"i":320,"s":"ke-hoach","q":"Theo chia sẻ trong file ghi âm, chi nhánh Phủ Diễn đã đạt tăng trưởng huy động vốn bán lẻ rất tốt nhờ giải pháp thực tế nào?","o":[["A","Tăng lãi suất huy động thỏa thuận vượt mức 9% để cạnh tranh"],["B","Quan hệ chặt chẽ với địa phương, lấy danh sách đền bù giải tỏa và chủ động mở sổ tiết kiệm trao tận tay tại nhà cho người dân"],["C","Chỉ tập trung huy động tiền gửi từ các định chế tài chính lớn"],["D","Ép buộc toàn bộ cán bộ chi nhánh tự bỏ tiền cá nhân để gửi tiết kiệm"]],"a":["B"],"e":"Chi nhánh Phủ Diễn liên kết với trung tâm quỹ đất và chính quyền địa phương, nắm số tiền đền bù của người dân, phát hành sổ và mang đến nhà trước khi các bank cổ phần đến cạnh tranh lãi suất."},{"i":321,"s":"ke-hoach","q":"Nguyên tắc xử lý nhanh đề xuất tăng giới hạn tín dụng thuộc luồng ưu tiên (xử lý trong 1 ngày) yêu cầu tỷ lệ nợ xấu ở mức nào?","o":[["A","Nợ xấu dưới 1,5% trong 2 năm gần nhất và của tháng gần nhất"],["B","Nợ xấu phải bằng 0% tại thời điểm đề xuất"],["C","Nợ xấu dưới 3,0% và có tài sản bảo đảm là bất động sản đạt 100%"],["D","Nợ xấu dưới 5,0% và có cam kết thu hồi nợ của Giám đốc chi nhánh"]],"a":["A"],"e":"Phân loại luồng ưu tiên (xử lý trong 1 ngày làm việc) áp dụng cho chi nhánh có chất lượng tín dụng tốt trong 2 năm gần nhất và tháng gần nhất có nợ xấu < 1,5%."},{"i":322,"s":"ke-hoach","q":"Theo phân tích dữ liệu của anh Bình, địa bàn TP. Hồ Chí Minh (38 chi nhánh) gặp điểm nghẽn nghiêm trọng nào về chất lượng tín dụng?","o":[["A","Tỷ lệ nợ xấu bình quân gấp 3 lần trung bình hệ thống, đạt 4,57% với nợ xấu tuyệt đối hơn 23.000 tỷ đồng"],["B","Thiếu hụt nghiêm trọng khách hàng gửi tiền CASA dẫn đến mất thanh khoản"],["C","Tỷ lệ nợ xấu luôn thấp hơn trung bình toàn hàng nhưng dư nợ tăng quá chậm"],["D","Hầu hết các chi nhánh không có dư nợ xử lý rủi ro ngoại bảng"]],"a":["A"],"e":"Tỷ lệ nợ xấu trung bình hệ thống khoảng 1,5% - 1,7% nhưng địa bàn TP.HCM lên tới 4,57%, nợ xấu tuyệt đối là 23.000 tỷ đồng, chiếm 37% nợ ngoại bảng hệ thống."},{"i":323,"s":"ke-hoach","q":"Chi nhánh nào tại địa bàn TP. Hồ Chí Minh đang có mức nợ quỹ tích lũy lớn nhất hệ thống với số tiền gần 11.000 tỷ đồng?","o":[["A","Chi nhánh Chợ Lớn"],["B","Chi nhánh Sở giao dịch 2"],["C","Chi nhánh Bến Thành"],["D","Chi nhánh Nam Sài Gòn"]],"a":["B"],"e":"Anh Bình nêu rõ Chi nhánh Sở giao dịch 2 nợ quỹ gần 11.000 tỷ đồng, Chợ Lớn nợ quỹ gần 5.000 tỷ đồng."},{"i":324,"s":"ke-hoach","q":"Bài học xương máu từ việc xử lý rủi ro 3.000 tỷ đồng đối với 2 khách hàng lớn tại Chi nhánh Chợ Lớn là gì?","o":[["A","Tài sản bảo đảm bị cháy nổ không được bảo hiểm đền bù"],["B","Buông lỏng quản lý dòng tiền, kho hàng, bỏ qua các điều kiện mở LC của Trụ sở chính đối với khách hàng ngành thép và xăng dầu"],["C","Khách hàng bị phá sản do biến động tỷ giá ngoại tệ toàn cầu"],["D","Sự cạnh tranh gay gắt của các ngân hàng thương mại cổ phần trên địa bàn"]],"a":["B"],"e":"Khoản vay thương mại thép, xăng dầu nhưng chi nhánh lơ là quản lý dòng tiền, kho hàng, không thực hiện đúng ủy quyền mở LC (ký quỹ, bổ sung tài sản đảm bảo) dẫn đến việc khách hàng trục lợi."},{"i":325,"s":"ke-hoach","q":"Lộ trình chính thức áp dụng kết quả xếp hạng các phòng kinh doanh (bán lẻ, doanh nghiệp) tại chi nhánh được thực hiện như thế nào?","o":[["A","Năm 2026 áp dụng trực tiếp để điều chỉnh quỹ lương của phòng kinh doanh"],["B","Năm 2026 dùng để ranking đối chiếu năng lực, năm 2027 chính thức làm cơ sở tính tiền lương và cơ chế khuyến khích"],["C","Chỉ áp dụng thử nghiệm nội bộ, không bao giờ dùng để tính lương"],["D","Bắt đầu tính lương ngay từ quý I năm 2026"]],"a":["B"],"e":"Năm 2026 xếp hạng để ranking các phòng với nhau xem hiệu quả thực tế, bắt đầu từ năm có bộ số liệu 2027 sẽ là cơ sở tính lương và khuyến khích."},{"i":326,"s":"ke-hoach","q":"Theo quy chế mạng lưới phòng giao dịch (PGD) của BIDV, PGD sẽ bị Trụ sở chính đóng cửa hoặc chuyển giao cho chi nhánh khác quản lý trong trường hợp nào?","o":[["A","Có kết quả kinh doanh thua lỗ trong 1 quý duy nhất"],["B","Trong 3 năm xếp hạng 3 hoặc hạng 4 liên tiếp, hoặc 2 năm xếp hạng 4 liên tiếp"],["C","Không huy động được dòng tiền gửi của các tổng công ty nhà nước"],["D","Giám đốc PGD không hoàn thành chỉ tiêu chạy marathon hàng năm"]],"a":["B"],"e":"Anh Bình chia sẻ chế tài hiện tại của PGD là nếu trong 3 năm xếp hạng 3, hạng 4 liên tiếp hoặc 2 năm xếp hạng 4 liên tiếp sẽ bị đóng cửa hoặc chuyển cho chi nhánh khác."},{"i":327,"s":"ke-hoach","q":"Theo chỉ đạo của Chủ tịch HĐQT, mục tiêu tăng trưởng hàng năm được quy định trong kế hoạch 5 năm (2026-2030) của các chi nhánh là bao nhiêu?","o":[["A","Tăng trưởng từ 5% - 10% tùy thuộc vào quy mô từng địa bàn"],["B","Tăng trưởng áp lực ở mức 15% - 16% hàng năm ở tất cả các mục tiêu, năm trước làm thiếu thì năm sau cộng dồn vào"],["C","Duy trì mức tăng trưởng bằng bình quân chung của 3 năm trước đó"],["D","Tăng trưởng không quá 10% để bảo đảm an toàn kiểm soát rủi ro"]],"a":["B"],"e":"Kế hoạch 5 năm giai đoạn 2026-2030 áp lực lớn vì mục tiêu tăng trưởng toàn 15-16% ở tất cả các mục tiêu, năm trước làm chưa đủ thì năm sau cộng vào."},{"i":328,"s":"ke-hoach","q":"Ba nội dung đổi mới trọng tâm được Khối tài chính triển khai quyết liệt trong năm nay để áp dụng cho năm sau là gì?","o":[["A","Đổi mới Core Banking, phát hành thẻ tín dụng mới, giảm lãi suất cho vay"],["B","Xây dựng Dashboard quản trị toàn hàng, ứng dụng Monitoring vào điều hành, và triển khai phần mềm B-Plan chấm điểm thi đua chi nhánh"],["C","Thoái vốn Map Life, cơ cấu lại nợ xấu TP.HCM, thành lập ban rủi ro mới"],["D","Cắt giảm thủ tục mở tài khoản, áp dụng chatbot AI hỗ trợ khách hàng"]],"a":["B"],"e":"Anh Bình nêu 3 nội dung đổi mới của Ban kế hoạch: 1. Đổi mới hệ thống Dashboard quản trị toàn hàng; 2. Ứng dụng Monitoring vào quản trị điều hành; 3. Triển khai B-Plan hỗ trợ quản trị chi nhánh."},{"i":329,"s":"ke-hoach","q":"Theo câu chuyện rèn luyện marathon và leo núi của anh Bình, phương pháp tập luyện cơ chân hàng ngày tại tòa nhà văn phòng là gì?","o":[["A","Chạy xuống cầu thang bộ 32 tầng liên tục để rèn sức chịu đựng"],["B","Leo cầu thang bộ đi lên (ví dụ 4 lần lên tòa nhà 32 tầng) và đi xuống bằng thang máy để bảo vệ khớp gối"],["C","Đi bộ nhanh quanh sảnh tòa nhà và thực hiện các động tác căng cơ"],["D","Đăng ký tập luyện cường độ cao tại các phòng gym chuyên biệt"]],"a":["B"],"e":"Kinh nghiệm rèn luyện cơ chân của anh Bình: Leo cầu thang bộ đi lên (4 lần tòa nhà 32 tầng), còn đi xuống thì đi thang máy để tránh chấn thương khớp gối."},{"i":330,"s":"ke-hoach","q":"Đối với các chi nhánh có tỷ lệ CASA rất tốt (đạt mức 40-45% như Đắk Nông), Trụ sở chính áp dụng cơ chế đánh giá như thế nào?","o":[["A","Tiếp tục bắt buộc tăng trưởng thêm tối thiểu 30% quy mô hàng năm"],["B","Giao chỉ tiêu và chấm điểm ở mức tối đa vì CASA đã chạm ngưỡng bão hòa và việc duy trì CASA quá cao cũng tiềm ẩn rủi ro thanh khoản lớn"],["C","Yêu cầu chi nhánh giảm tỷ lệ CASA xuống dưới 20% để bảo đảm an toàn"],["D","Phạt trừ điểm thi đua vì không đóng góp vào tốc độ tăng trưởng chung"]],"a":["B"],"e":"Anh Bình giải thích đối với chi nhánh đạt CASA 35-40% trở lên thì đánh giá sẽ giao tối đa/điểm tối đa, vì CASA đạt trần bão hòa và việc duy trì quá cao cũng tiềm ẩn rủi ro thanh khoản khi thị trường biến động (như MBBank gặp phải)."},{"i":331,"s":"ke-hoach","q":"Quan điểm của anh Bình và Ban lãnh đạo BAV về việc các khối chuyên môn (bán buôn, bán lẻ) tự xếp hạng và giao kế hoạch cho chi nhánh là gì?","o":[["A","Cho phép tự thực hiện để tăng tính chủ động của các khối chuyên môn"],["B","Khẳng định nguyên tắc \"BAV One\" (BIDV One) - Ban kế hoạch là đầu mối giao chỉ tiêu đồng nhất để tránh hiện tượng \"rắn hai đầu\" gây mâu thuẫn về xếp hạng và tính lương của chi nhánh"],["C","Sẽ áp dụng thí điểm cho khối bán lẻ trước, khối bán buôn sau"],["D","Giao toàn quyền cho các khối tự quyết định chỉ tiêu mà không cần Ban kế hoạch"]],"a":["B"],"e":"Anh Bình nêu quan điểm \"BAV One\", không thể giao theo ngành dọc riêng lẻ dẫn đến tình trạng chi nhánh xếp hạng khối này đặc biệt khối kia hạng 4, gây vênh nhau và bối rối khi tính lương."},{"i":332,"s":"ke-hoach","q":"Tỷ lệ chi nhánh xếp loại Hoàn thành xuất sắc nhiệm vụ theo quy định tối đa của BIDV và thực tế khống chế tại hệ thống là bao nhiêu?","o":[["A","Quy định tối đa 40%, thực tế chụp ảnh đúng số liệu thực tế đạt khoảng 18% xuất sắc"],["B","Quy định tối đa 20%, thực tế khống chế nghiêm ngặt ở mức 10%"],["C","Quy định tối đa 50%, thực tế đánh giá đạt 40%"],["D","Quy định tối đa 10%, thực tế đạt 10%"]],"a":["A"],"e":"Quy định xếp loại xuất sắc tối đa theo quý của BIDV là 40%, tuy nhiên do kết quả hệ thống chưa đạt kỳ vọng nên Ban lãnh đạo yêu cầu chụp ảnh đúng số liệu thực tế, chỉ khoảng 18% chi nhánh đạt xuất sắc."},{"i":333,"s":"ke-hoach","q":"Theo Công văn 3113/BIDV-KH v/v hướng dẫn chỉ tiêu, tiêu chí, tiêu chuẩn xếp loại HTNV KHKD đối với các đơn vị năm 2025, những chi nhánh nào được áp dụng cách thức chấm điểm chi nhánh có đóng góp lớn trong hệ thống về Lợi nhuận trước thuế","o":[["A","Là chi nhánh xếp hạng Đặc biệt năm 2024"],["B","Có LNTT tại kỳ đánh giá xét HTNV từ 1.000 tỷ trờ lên"],["C","Là chi nhánh xếp hạng Đặc biệt năm 2024 hoặc có LNTT tại kỳ đánh giá xét HTNV từ 1.000 tỷ trờ lên"],["D","Là chi nhánh xếp hạng Đặc biệt năm 2024 hoặc có LNTT tại kỳ đánh giá xét HTNV từ 1.000 tỷ trờ lên, đồng thời đáp ứng các điều kiện: (i) Tổng quy mô (HĐV CK+DNTD CK) tăng trưởng so với năm 2024; (ii) Tỷ lệ nợ xấu gộp kiểm soát ở mức thấp hơn mức thực hiện của hệ thống; (iii) Không có sai phạm, vi phạm bị cơ quan chức năng xử phạt hành chính trở lên hoặc cán bộ chi nhánh bị xử lý hình sự."]],"a":["D"],"e":"Khoản 1.c, Mục IV, Công văn 3113/BIDV-KH ngày 07/05/2025"},{"i":334,"s":"ke-hoach","q":"Theo Công văn 3113/BIDV-KH ngày 07/05/2025 v/v hướng dẫn chỉ tiêu, tiêu chí, tiêu chuẩn xếp loại HTNV KHKD đối với các đơn vị năm 2025, điều kiện về mức hoàn thành thu bảo hiểm Metlife được áp dụng đối với kỳ đánh giá nào?","o":[["A","Hàng Quý và cả năm"],["B","Quý II và cả năm"],["C","Chỉ áp dụng với kỳ đánh giá cả năm"],["D","Quý I và Quý III"]],"a":["B"],"e":"Khoản 1.a, 1.b Mục IV, Công văn 3113/BIDV-KH ngày 07/05/2025"},{"i":335,"s":"ke-hoach","q":"Theo Công văn 5836/BIDV-KH ngày 29/07/2025 v/v điều chỉnh tiêu chuẩn xếp loại hoàn thành nhiệm vụ KHKD các đơn vị năm 2025, điều kiện về mức hoàn thành thu nợ HTNB đối với mức xếp loại Hoàn thành xuất sắc là?","o":[["A","Hoàn thành ≥ 70% kế hoạch thu nợ HTNB"],["B","Hoàn thành ≥ 80% kế hoạch thu nợ HTNB"],["C","Hoàn thành ≥ 90% kế hoạch thu nợ HTNB"],["D","Hoàn thành ≥ 100% kế hoạch thu nợ HTNB"]],"a":["D"],"e":"Công văn 5836/BIDV-KH ngày 29/07/2025"},{"i":336,"s":"ke-hoach","q":"Theo Nghị quyết 242/NQ-BIDV v/v phê duyệt hệ thống chỉ tiêu xếp hạng Chi nhánh, điều kiện \"Không có nợ nghĩa vụ tài chính đối với Trụ sở chính\" được áp dụng đối với mức xếp hạng nào?","o":[["A","Hạng Đặc biệt"],["B","Hặng đặc biệt và Hạng 1"],["C","Hạng đặc biệt, Hạng 1 và Hạng 2"],["D","Hạng Đặc biệt, 1,2,3"]],"a":["A"],"e":"Khoản 3.3, Điều 1, Nghị quyết 242/NQ-BIDV"},{"i":337,"s":"ke-hoach","q":"Theo quy định 4268/QĐ-BIDV ngày 16/6/2025 về việc phân cấp, uỷ quyền trong công tác điều hành KHKD và quản lý mạng lưới, phân cấp thẩm quyền ký báo cáo NHNN chi nhánh Khu vực về việc thay đổi người đứng đầu phòng giao dịch đến cấp nào?","o":[["A","Phó Trưởng Khối Tài chính Kế toán"],["B","Giám đốc Ban Kế hoạch"],["C","Giám o","q":"Trong cuộc họp, đệm thanh khoản của BIDV vào thời điểm khủng hoảng thanh khoản quý 4 năm ngoái từng giảm xuống còn bao nhiêu?","o":[["A","50.000 tỷ VND"],["B","30.000 tỷ VND"],["C","10.000 tỷ VND"],["D","5.000 tỷ VND"]],"a":["C"],"e":"Vào quý 4 năm ngoái, đệm thanh khoản của BIDV đã chạm mức cực kỳ căng thẳng, chỉ còn khoảng 10.000 tỷ VND (tương đương nhu cầu rút tiền trong 1 ngày)."},{"i":386,"s":"alco","q":"Theo Thông tư 22/2019/TT-NHNN, tỷ lệ tối đa của nguồn vốn ngắn hạn được dùng để cho vay trung dài hạn hiện hành được nới lỏng lên mức bao nhiêu?","o":[["A","30%"],["B","35%"],["C","40%"],["D","45%"]],"a":["C"],"e":"Tỷ lệ nguồn vốn ngắn hạn cho vay trung dài hạn ban đầu quy định là 30%, nhưng sau khi các ngân hàng kiến nghị đã được nâng lên mức 40%."},{"i":387,"s":"alco","q":"Theo quy định hiện hành, tỷ lệ dư nợ cho vay trên tổng tiền gửi (LDR) tối đa được quy định là bao nhiêu và thực tế tính đủ của BIDV tại thời điểm họp là bao nhiêu?","o":[["A","Quy định 80%, thực tế BIDV là 90%"],["B","Quy định 85%, thực tế BIDV là 95%"],["C","Quy định 85%, thực tế BIDV là 112%"],["D","Quy định 90%, thực tế BIDV là 95%"]],"a":["B"],"e":"Quy định LDR tối đa là 85% theo Thông tư 22. Tuy nhiên, tính đủ thực tế tại BIDV là 95% (và toàn thị trường trung bình lên tới 112%)."},{"i":388,"s":"alco","q":"Trong dự thảo sửa đổi Thông tư 22 dự kiến ban hành năm 2026 và có hiệu lực từ 2028, tỷ lệ LDR sẽ được chuyển đổi sang chỉ số nào?","o":[["A","LCR"],["B","NSFR"],["C","CDR (Credit-to-Deposit Ratio)"],["D","CAR"]],"a":["C"],"e":"Tỷ lệ LDR (Loan-to-Deposit Ratio) sẽ được đổi sang CDR (Credit-to-Deposit Ratio) theo định hướng sửa đổi Thông tư 22 để quản lý chặt chẽ hơn."},{"i":389,"s":"alco","q":"Điểm khác biệt lớn nhất giữa chỉ số CDR dự kiến so với chỉ số LDR hiện hành là gì?","o":[["A","Chỉ tính nguồn vốn huy động từ thị trường 2"],["B","Mở rộng phạm vi tín dụng (thêm trái phiếu DN) và loại trừ nguồn huy động TCTD & Kho bạc (thị trường 2) khỏi tử/mẫu số"],["C","Loại trừ hoàn toàn tiền gửi của dân cư khỏi mẫu số"],["D","Tăng giới hạn an toàn lên 100%"]],"a":["B"],"e":"CDR mở rộng phạm vi tín dụng bằng cách thêm trái phiếu doanh nghiệp, đồng thời chỉ tính nguồn huy động ổn định từ thị trường 1, loại trừ thị trường 2."},{"i":390,"s":"alco","q":"Tính đến ngày 30/06/2026, tỷ lệ LCR VND thực tế của BIDV đạt bao nhiêu phần trăm so với mục tiêu tối thiểu 70% theo định hướng mới?","o":[["A","52,2%"],["B","65,5%"],["C","70,0%"],["D","97,6%"]],"a":["A"],"e":"Tỷ lệ LCR VND của BIDV hiện đạt 52,2%, thiếu hụt khoảng 105.000 tỷ VND tài sản thanh khoản cao (HQLA) so với mốc mục tiêu 70%."},{"i":391,"s":"alco","q":"Nghị quyết của Hội đồng quản trị BIDV yêu cầu tốc độ tăng trưởng huy động vốn phải cao hơn tăng trưởng tín dụng bao nhiêu phần trăm mỗi năm?","o":[["A","Cao hơn 1%"],["B","Cao hơn 2%"],["C","Cao hơn 3%"],["D","Cao hơn 5%"]],"a":["B"],"e":"HĐQT ban hành nghị quyết tăng trưởng huy động vốn thị trường 1 phải cao hơn tăng trưởng tín dụng ít nhất 2% mỗi năm để bù đắp sự thiếu hụt khi siết chặt nguồn thị trường 2."},{"i":392,"s":"alco","q":"Chỉ số NIM của BIDV được ghi nhận đạt bao nhiêu phần trăm tính đến ngày 30/06/2026 so với các ngân hàng thương mại nhà nước và cổ phần khác?","o":[["A","2,05% (thấp hơn CTG 2,56%, Vietcombank 2,62%, Techcombank 3,63%, MB 3,37%)"],["B","2,56% (bằng VietinBank)"],["C","2,62% (bằng Vietcombank)"],["D","3,37% (bằng MB)"]],"a":["A"],"e":"NIM của BIDV rất thấp, chỉ đạt 2,05% do chi phí vốn cao (CASA thấp), nợ xấu cao dẫn tới thoái lãi dự thu nhiều, và vốn chủ sở hữu mỏng."},{"i":393,"s":"alco","q":"Ngân hàng nào là ngân hàng đầu tiên tại Việt Nam triển khai cơ chế điều hành vốn tập trung (FTP) vào năm 2007?","o":[["A","Vietcombank"],["B","BIDV"],["C","VietinBank"],["D","Agribank"]],"a":["B"],"e":"BIDV là ngân hàng tiên phong tại Việt Nam áp dụng cơ chế điều chuyển vốn nội bộ tập trung (FTP) từ năm 2007, thay thế cơ chế phân tán cũ."},{"i":394,"s":"alco","q":"Đâu KHÔNG phải là một trong năm nguyên tắc cốt lõi của điều hành FTP được đề cập tại BIDV?","o":[["A","Tính áp dụng thống nhất"],["B","Tính đầy đủ chi phí"],["C","Phân bổ thu nhập gắn trực tiếp với hiệu quả thực tế của ngân hàng"],["D","Điều hành FTP cơ sở linh hoạt theo từng vùng miền địa lý"]],"a":["D"],"e":"FTP cơ sở áp dụng thống nhất trên toàn hệ thống để đảm bảo tính khách quan và là thước đo chuẩn. Các yếu tố đặc thù vùng miền chỉ hỗ trợ qua FTP bổ sung."},{"i":395,"s":"alco","q":"Vào năm 2025, việc BIDV học tập kinh nghiệm từ Hanabank đã mang lại thay đổi trọng yếu nào trong cơ chế FTP?","o":[["A","Chuyển giao toàn bộ rủi ro thanh khoản về chi nhánh"],["B","Chuyển giao và tập trung toàn bộ rủi ro lãi suất về hội sở chính"],["C","Áp dụng cơ chế phạt tự động đối với nợ xấu tại chi nhánh"],["D","Cho phép các chi nhánh tự quyết định lãi suất cơ sở"]],"a":["B"],"e":"Từ năm 2025, theo kinh nghiệm Hanabank, BIDV chuyển toàn bộ rủi ro lãi suất về Hội sở chính thông qua cơ chế khớp giá giao dịch, giúp chi nhánh cố định NIM từ lúc đàm phán."},{"i":396,"s":"alco","q":"Cơ cấu FTP cơ sở mua vốn (FTPmvcs) từ năm 2026 đã được tinh gọn từ 5 cấu phần xuống còn bao nhiêu cấu phần?","o":[["A","1 cấu phần"],["B","2 cấu phần"],["C","3 cấu phần"],["D","4 cấu phần"]],"a":["B"],"e":"FTPmvcs 2026 tinh giản còn 2 cấu phần: Lãi suất tham chiếu + (Tỷ lệ phân bổ thu nhập HĐV x Chênh lệch lãi suất bình quân) giúp đơn giản, minh bạch hơn."},{"i":397,"s":"alco","q":"Trong năm 2026, dự kiến khoản lỗ (âm) của trung tâm vốn BIDV do cơ chế FTP bổ sung là khoảng bao nhiêu và phần lớn do cấu phần nào chi phối?","o":[["A","11.700 tỷ VND, chủ yếu do FTP bổ sung (add-on) cho các chương trình cạnh tranh và chính sách"],["B","1.000 tỷ VND, chủ yếu do FTP cơ sở"],["C","5.400 tỷ VND, chủ yếu do chi phí dự phòng rủi ro nợ xấu"],["D","30.000 tỷ VND, chủ yếu do hỗ trợ khu vực Tây Nguyên"]],"a":["A"],"e":"Lỗ trung tâm vốn dự kiến khoảng 11.700 tỷ VND, trong đó FTP cơ sở chỉ chiếm dưới 1.000 tỷ, phần lớn còn lại là do chi phí FTP bổ sung quá lớn tại Việt Nam."},{"i":398,"s":"alco","q":"Loại sản phẩm nào dưới đây được áp dụng cơ chế \"FTP cơ sở đặc biệt\" tại BIDV?","o":[["A","Khoản vay mua nhà thương mại cao cấp"],["B","Tiền gửi không kỳ hạn (CASA) của doanh nghiệp lớn"],["C","Khoản vay nhà ở xã hội năm 2013 lãi suất 4.6% được NHNN tái cấp vốn"],["D","Trái phiếu dài hạn do BIDV phát hành"]],"a":["C"],"e":"FTP cơ sở đặc biệt chỉ áp dụng cho sản phẩm đặc thù về nguồn và mục tiêu như gói cho vay nhà ở xã hội 2013 (lãi suất 4,6%), được tái cấp vốn từ NHNN."},{"i":399,"s":"alco","q":"Khi áp dụng cơ chế sàn lãi suất cho vay theo nhóm ngành nghề từ năm 2026, nhóm ngành nào bị áp cộng thêm biên độ cao nhất (+1,8%)?","o":[["A","Nhóm ngành Mở rộng"],["B","Nhóm ngành Duy trì"],["C","Nhóm ngành Hạn chế"],["D","Nhóm ngành Bất động sản"]],"a":["D"],"e":"Sàn LSCV phân loại theo ngành: Mở rộng (-0.3%), Duy trì (0), Hạn chế (+0.2%) và Bất động sản cộng thêm biên độ cao nhất (+1,8%) để hạn chế rủi ro tập trung."},{"i":400,"s":"alco","q":"Theo cơ chế kiểm soát tăng trưởng tín dụng gắn với huy động vốn tại chi nhánh, mức tăng ròng dư nợ cho vay VND tối đa của chi nhánh được kiểm soát theo công thức nào?","o":[["A","Không vượt quá 85% tổng tiền gửi tính LDR của chi nhánh đó"],["B","Không vượt quá Hệ số kiểm soát (0,4 - 0,85) nhân với mức tăng ròng huy động vốn VND"],["C","Phải giảm ròng tương ứng 100% nếu huy động vốn của chi nhánh tăng chậm hơn 2%"],["D","Bằng mức tăng trưởng tín dụng bình quân của toàn hệ thống"]],"a":["B"],"e":"Chi nhánh tăng ròng dư nợ cho vay VND tối đa không vượt quá Hệ số kiểm soát (0.4 - 0.85, tùy địa bàn và GAP HĐV-CV) nhân với mức tăng ròng HĐV VND của chính chi nhánh đó."},{"i":401,"s":"alco","q":"Để đảm bảo nguồn vốn trung dài hạn ổn định, chi nhánh được khuyến khích tập trung huy động vốn ở kỳ hạn nào thay vì kỳ hạn 12 tháng thông thường?","o":[["A","Kỳ hạn ngắn dưới 6 tháng để giảm chi phí vốn"],["B","Kỳ hạn từ 13 tháng trở lên"],["C","Kỳ hạn 3 tháng thả nổi"],["D","Kỳ hạn 9 tháng cố định"]],"a":["B"],"e":"Kỳ hạn từ 13 tháng trở lên mới có ý nghĩa được tính trọn vẹn vào nguồn vốn trung dài hạn ổn định phục vụ các tỷ lệ an toàn thanh khoản dài hạn của hệ thống."},{"i":402,"s":"alco","q":"Kênh thông tin chính thức của Ban ALCO dùng để cập nhật nhanh chóng các thông tin điều hành cân đối vốn, lãi suất và FTP cho các chi nhánh là gì?","o":[["A","Trang thông tin nội bộ BIDV portal"],["B","Nhóm Zalo \"Thông tin điều hành ALCO\""],["C","Bản tin ALCO gửi qua email hàng ngày"],["D","Diễn đàn thảo luận kinh doanh của BIDV"]],"a":["B"],"e":"Trang Zalo 'Thông tin điều hành ALCO' là kênh truyền thông chính thức, thường trực, truyền tải tức thì các định hướng lãi suất, FTP và chính sách ALCO tới các chi nhánh."},{"i":403,"s":"xu-ly-no","q":"Cấp có thẩm quyền quyết định trong trường hợp áp dụng đồng thời nhiều biên pháp xử lý nợ ( Mua bán nợ, khởi kiện,...)","o":[["A","Cấp có thẩm quyền đối với từng biện pháp xử lý nợ"],["B","Hội đồng quản trị"],["C","Tổng giám đốc"],["D","Phó tổng giám đốc phụ trách xử lý nợ"],["E","Không có phương án nào đúng"]],"a":["A"],"e":"Điểm b, Khoản 1 Điều 8 Quy chế xử lý nợ ban hành kèm theo QĐ 811/QĐ-BIDV ngày 19/9/2022 của Hội đồng quản trị BIDV"},{"i":404,"s":"xu-ly-no","q":"Cấp có thẩm quyền quyết định áp dụng các biện pháp bảo đảm xử xý nợ (đặt cọc mua bán nợ, đặt cọc trong xử lý mua bán nợ…)","o":[["A","Hội đồng quản trị"],["B","Tổng Giam đốc"],["C","Phó TGĐ phụ trách xử lý nợ"],["D","Cấp có thẩm quyền phê duyệt biện pháp xử lý nợ đó"]],"a":["D"],"e":"Khoản 3 Điều 8 Quy chế xử lý nợ ban hành kèm theo QĐ 811/QĐ-BIDV ngày 19/9/2022 của HĐQT BIDV"},{"i":405,"s":"xu-ly-no","q":"Khoản nợ được BIDV bán phải đáp ứng các điều kiện","o":[["A","Hồ sơ, chứng từ và các tài liệu có kiên quan của khoản nợ, Hợp đồng bảo đảm (nếu có) phản ánh đầy đủchính xác thực trạng khoản nợ theo đúng quy định pháp luật"],["B","Không có thỏa thuận bằng văn bản về việc không được mua bán khoản nợ"],["C","Khoản nợ không được sử dụng để bảo đảm thực hiện nghĩa vụ dân sự tại thời điểm bán nợ, trừ trường hợp bên nhận bảo đảm đồng ý bằng văn bản về việc bán nợ"],["D","Đáp ứng yêu cầu kinh doanh của BIDV trong tửng thời kỳ"],["E","Tất cả các điều kiện trên"]],"a":["E"],"e":"Khoản 2 Điều 3 Quy chế mua bán nợ ban hành kèm theo QĐ 1383/QĐ-BIDV ngày 16/12/2024 của HĐQT BIDV"},{"i":406,"s":"xu-ly-no","q":"BIDV thực hiện việc mua bán nợ theo phương thức nào sau đây","o":[["A","Phương thức thỏa thuận"],["B","Phương thức đấu giá"],["C","Phương thức đối chiếu công nợ"],["D","A, B đều đúng"],["E","A, B, C đều đúng"]],"a":["D"],"e":"Điều 5 Quy chế mua bán nợ ban hành kèm theo QĐ 1383/QĐ-BIDV ngày 16/12/2024 của HĐQT BIDV"},{"i":407,"s":"xu-ly-no","q":"Nhận định nào sau đây không đúng (chọn nhiều đáp án)","o":[["A","BIDV không mua bán nợ thứ cấp trên thị trường"],["B","BIDV không bán khoản nợ đang được tái cơ cấu nợ"],["C","BIDV không bán khoản nợ có tài sản bảo đảm là tài sản của bên thứ ba nếu chưa có ý kiến của bên bảo đảm"],["D","BIDV chỉ bán khoản nợ khi khách hàng đã phá sản"],["E","-"]],"a":["A","C"],"e":"Điều 13 Quy chế mua bán nợ ban hành kèm theo QĐ 1383/QĐ-BIDV ngày 16/12/2024 của HĐQT BIDV"},{"i":408,"s":"xu-ly-no","q":"\"Tài sản đảm bảo khó xử lý\" theo Quy chế miến giảm lãi và phí đối với khách hàng là","o":[["A","Tài sản đảm bảo có tranh chấp về quyền sở hữu, quyền sử dụng và hoặc tại thời điểm xử lý có phát sinh vướng mắc liên quan đến yếu tố pháp lý ảnh hưởng đến khả năng xử lý"],["B","Đã tiến hành chào bán công khai/đấu giá ít nhất 3 lần dưới giá trị nợ gốc nhưng không có người mua"],["C","Dự kiến chi phí xử lý tài sản bảo đảm lớn hơn giá trị thu hồi"],["D","Tài sản bảo đảm đã suy giảm giá trị, có tính thanh khoản thấp"],["E","A, B, C đều đúng"],["F","A,B,C,Đ đều đúng"]],"a":["E"],"e":"Điểm c, Khoản 1, Điều 2 Quy chế miễn giảm lãi và phí đối với khách hàng ban hành theo QĐ 1096/QĐ-HĐQT ngày 07/10/2024"},{"i":409,"s":"xu-ly-no","q":"Số tiền tối thiểu bên thứ ba / bên bảo đảm phải nộp để nhận lại TSBD là tài sản của bên thứ ba ( không phải khách hàng )", 18,"s":"xu-ly-no","q":"Trong quy trình xử lý nợ 5 bước, công việc 'Xác minh thực trạng khách hàng, bên bảo đảm và tài sản bảo đảm' thuộc bước thứ mấy?","o":[["A","Bước 1."],["B","Bước 2."],["C","Bước 3."],["D","Bước 4."]],"a":["B"],"e":"Xác minh thực trạng khách hàng và tài sản bảo đảm nằm ở Bước 2 của quy trình, nhằm đánh giá khả năng thực tế của khách hàng trước khi xây dựng phương án xử lý."},{"i":419,"s":"xu-ly-no","q":"Quyết định số 1175/QĐ-BIDV ngày 24/10/2024 ban hành văn bản quy chế nội bộ nào?","o":[["A","Quy chế mua bán nợ."],["B","Quy chế giảm miễn lãi và phí đối với khách hàng."],["C","Quy chế sử dụng dự phòng rủi ro."],["D","Quy chế xử lý tranh chấp."]],"a":["C"],"e":"Quyết định số 1175/QĐ-BIDV ban hành Quy chế sử dụng dự phòng rủi ro ngày 24/10/2024."},{"i":420,"s":"xu-ly-no","q":"Nguyên tắc ứng xử cốt lõi nào của ngân hàng đối với khách hàng khi thực hiện xử lý rủi ro (XLRR) bằng nguồn dự phòng rủi ro?","o":[["A","Công khai việc hạch toán ngoại bảng cho khách hàng biết để cùng hợp tác."],["B","Yêu cầu khách hàng ký biên bản đồng thuận xóa nợ nội bảng trước khi hạch toán."],["C","Việc sử dụng DPRR chỉ là thay đổi hạch toán nội bộ, tuyệt đối không thông báo cho khách hàng biết."],["D","Báo cáo cho chính quyền địa phương để niêm yết công khai tại UBND phường/xã."]],"a":["C"],"e":"Theo Quy chế 1175, việc sử dụng DPRR để xử lý rủi ro là biện pháp hạch toán kỹ thuật nội bộ của ngân hàng, không làm thay đổi nghĩa vụ trả nợ của khách hàng, do đó tuyệt đối bảo mật thông tin này đối với khách hàng."},{"i":421,"s":"xu-ly-no","q":"Sau khi sử dụng DPRR để chuyển hạch toán ngoại bảng, khoản nợ phải được theo dõi, thực hiện tất cả các biện pháp thu hồi nợ trong thời gian tối thiểu bao lâu trước khi xem xét xuất toán?","o":[["A","Tối thiểu 1 năm."],["B","Tối thiểu 3 năm."],["C","Tối thiểu 5 năm."],["D","Tối thiểu 10 năm."]],"a":["C"],"e":"Căn cứ nội dung Quy chế sử dụng DPRR 1175, khoản nợ được xử lý rủi ro phải được theo dõi ngoại bảng và áp dụng mọi biện pháp thu hồi nợ tối thiểu là 5 năm trước khi xem xét xuất toán."},{"i":422,"s":"xu-ly-no","q":"Các khoản nợ sau khi được xuất toán ra khỏi ngoại bảng (được phê duyệt xuất toán) phải tiếp tục theo dõi trong hệ thống của BIDV tối thiểu bao nhiêu năm?","o":[["A","5 năm."],["B","10 năm."],["C","15 năm."],["D","20 năm."]],"a":["B"],"e":"Căn cứ Quy chế sử dụng DPRR 1175, các khoản nợ đã được xuất toán ra khỏi ngoại bảng vẫn phải tiếp tục được theo dõi trong hệ thống tối thiểu 10 năm."},{"i":423,"s":"xu-ly-no","q":"Quy chế Giảm, miễn lãi và phí đối với khách hàng tại BIDV được ban hành kèm theo quyết định nào?","o":[["A","Quyết định số 868/QĐ-BIDV ngày 13/8/2025."],["B","Quyết định số 1175/QĐ-BIDV ngày 24/10/2024."],["C","Quyết định số 1130/QĐ-BIDV ngày 15/10/2025."],["D","Quyết định số 1129/QĐ-BIDV ngày 15/10/2025."]],"a":["C"],"e":"Căn cứ Slide đào tạo và câu luận, Quy chế Giảm, miễn lãi và phí đối với khách hàng được ban hành theo Quyết định số 1130/QĐ-BIDV ngày 15/10/2025."},{"i":424,"s":"xu-ly-no","q":"Theo Quy chế giảm miễn lãi và phí 1130, BIDV chỉ xem xét giảm, miễn phí bảo lãnh chưa thu được cho khách hàng khi nào?","o":[["A","Khi khoản bảo lãnh bị quá hạn trên 180 ngày."],["B","Khi nghĩa vụ bảo lãnh của BIDV đối với bên nhận bảo lãnh đã chấm dứt hoàn toàn."],["C","Khi khách hàng có tài sản bảo đảm bổ sung tương đương giá trị phí bảo lãnh."],["D","Khi khách hàng bổ sung phương án kinh doanh khả thi được chi nhánh phê duyệt."]],"a":["B"],"e":"Theo quy định cụ thể của Quy chế 1130, BIDV chỉ xem xét giảm, miễn phí bảo lãnh chưa thu được cho khách hàng khi nghĩa vụ bảo lãnh của BIDV đã chấm dứt."},{"i":425,"s":"xu-ly-no","q":"Quyết định số 1129/QĐ-BIDV ngày 15/10/2025 ban hành văn bản quy định về nội dung gì?","o":[["A","Quy chế xử lý tranh chấp tại BIDV."],["B","Quy chế mua bán nợ tại BIDV."],["C","Quy chế miễn giảm lãi suất cho vay ngoại bảng."],["D","Quy trình giao giữ tài sản thế chấp."]],"a":["B"],"e":"Quyết định số 1129/QĐ-BIDV ngày 15/10/2025 chính thức ban hành Quy chế Mua bán nợ của BIDV."},{"i":426,"s":"xu-ly-no","q":"Theo Quy chế Mua bán nợ 1129, trường hợp đấu giá lại khoản nợ, giá khởi điểm của lần đấu giá lại tiếp theo giảm tối đa bao nhiêu phần trăm so với giá khởi điểm của lần đấu giá ngay trước đó?","o":[["A","Giảm tối đa 5%."],["B","Giảm tối đa 10%."],["C","Giảm tối đa 15%."],["D","Giảm tối đa 20%."]],"a":["B"],"e":"Theo nguyên tắc định giá và đấu giá tại Quy chế 1129, mỗi lần đấu giá lại khoản nợ được phép giảm giá khởi điểm tối đa không quá 10% so với giá khởi điểm của lần đấu giá ngay trước đó."},{"i":427,"s":"xu-ly-no","q":"Cẩm nang Xử lý tranh chấp của BIDV được ban hành kèm theo văn bản hướng dẫn nào?","o":[["A","Văn bản số 35434/BIDV-PC ngày 19/11/2025."],["B","Quyết định số 210/QyĐ-BIDV ngày 11/3/2025."],["C","Quyết định số 9455/QyĐ-BIDV ngày 26/12/2024."],["D","Văn bản số 3810/BIDV-TTXLN ngày 25/5/2026."]],"a":["A"],"e":"Căn cứ hệ thống văn bản pháp lý về xử lý nợ: Cẩm nang Xử lý tranh chấp được ban hành kèm theo văn bản số 35434/BIDV-PC ngày 19/11/2025."},{"i":428,"s":"xu-ly-no","q":"Đề án CHOM (biệt phái cán bộ xử lý nợ từ chi nhánh về trực thuộc Trung tâm Xử lý nợ) được triển khai thí điểm tại bao nhiêu chi nhánh trong giai đoạn 1?","o":[["A","5 chi nhánh."],["B","10 chi nhánh."],["C","12 chi nhánh."],["D","20 chi nhánh."]],"a":["C"],"e":"Theo transcript ghi âm, Đề án CHOM được triển khai giai đoạn 1 tại 12 chi nhánh (như Long Biên, Hà Nội, Thành Đô, Đống Đa, Bắc Hưng Yên, Quảng Bình, Nam Sài Gòn, Sài Gòn, Hồng Giang, Cà Mau...)."},{"i":429,"s":"xu-ly-no","q":"Cơ chế chi trả lương và thưởng đối với các cán bộ thuộc Đề án biệt phái CHOM được phân định như thế nào?","o":[["A","Chi nhánh chi trả toàn bộ lương thưởng."],["B","Trung tâm Xử lý nợ chi trả toàn bộ lương thưởng."],["C","Lương do chi nhánh chi trả, thưởng do Trung tâm Xử lý nợ quyết định và chi trả."],["D","Trung tâm Xử lý nợ chịu trách nhiệm chi trả 100% lương, chi nhánh chi trả thưởng quý/năm."]],"a":["A"],"e":"Theo chia sẻ trong transcript cuộc họp: Cán bộ biệt phái làm việc theo chỉ đạo của Trung tâm XLN, tuy nhiên cơ chế lương thưởng vẫn do Chi nhánh gốc chi trả."},{"i":430,"s":"xu-ly-no","q":"Vụ việc thất thoát nợ xấu nghiêm trọng tại Chi nhánh Tây Sài Gòn phát hiện năm 2010 xuất phát từ nguyên nhân định giá sai loại tài sản bảo đảm nào?","o":[["A","Thế chấp đất nông nghiệp trồng cây hàng năm bị ngập lụt."],["B","Thế chấp đất rừng phòng hộ tại Ninh Thuận, An Giang... được định giá nâng khống."],["C","Thế chấp máy móc thiết bị nhập khẩu cũ đã hết niên hạn sử dụng."],["D","Thế chấp quyền tài sản phát sinh từ hợp đồng mua bán nhà đất ma."]],"a":["B"],"e":"Theo bài học thực tế từ chi nhánh Tây Sài Gòn (phát hiện tháng 3/2010), ngân hàng giải ngân cho 57 khách hàng vay mua vàng thế chấp bằng đất trồng rừng phòng hộ tại Ninh Thuận, An Giang được định giá khống, dẫn tới dư nợ quá hạn không thể thu hồi lên tới 1.770 tỷ đồng."},{"i":431,"s":"xu-ly-no","q":"Tại Chi nhánh Bến Thành, lỗ hổng trong kiểm tra giám sát sau cho vay đối với một khách hàng cá nhân VIP có dư nợ 400 tỷ đồng là gì?","o":[["A","Cán bộ không phát hiện khách hàng đã xuất cảnh định cư ở nước ngoài."],["B","Cán bộ chấp nhận nguồn trả nợ từ cho thuê bất động sản nhưng thực tế khách hàng không khai thuế, không có chứng từ nộp thuế hợp pháp."],["C","Khách hàng dùng tài sản của bên thứ ba không có hợp đồng ủy quyền hợp pháp."],["D","Tài sản bảo đảm là đất dự án chưa được cơ quan nhà nước cấp sổ đỏ."]],"a":["B"],"e":"Theo transcript, khách hàng VIP vay 400 tỷ đồng trả nợ rất đều mười mấy năm, nguồn trả nợ từ thuê bất động sản nhưng khi thanh tra vào kiểm tra yêu cầu chứng minh bằng hồ sơ khai và nộp thuế thì không cung cấp được."},{"i":432,"s":"xu-ly-no","q":"Rủi ro lớn nhất được rút ra từ vụ việc Công ty Phụng Hoàng tại Sở giao dịch 2 khi nhận thế chấp tài sản bảo đảm là máy móc thiết bị là gì?","o":[["A","Tài sản bị hư hỏng, không vận hành được khi ngân hàng thu giữ."],["B","Điều khoản 'Bảo lưu quyền sở hữu' của nhà cung cấp nước ngoài khi bên mua (khách hàng) chưa thanh toán đủ tiền."],["C","Khách hàng đã bán thiết bị cho bên thứ ba trước khi thế chấp cho ngân hàng."],["D","Hợp đồng mua bán thiết bị bị vô hiệu do thiếu chữ ký của người đại diện pháp luật."]],"a":["B"],"e":"Vụ việc Phụng Hoàng cảnh báo bài học: Nếu cán bộ không rà soát kỹ hợp đồng thương mại, bỏ sót điều khoản nhà cung cấp giữ quyền sở hữu máy móc thiết bị cho đến khi thanh toán đủ 100% tiền, ngân hàng sẽ mất quyền xử lý TSBĐ khi xảy ra tranh chấp do chưa hoàn thành nghĩa vụ thanh toán với nhà cung cấp ngoại."},{"i":433,"s":"xu-ly-no","q":"Thói quen nào của cán bộ quản lý khách hàng đối với mảng bán lẻ có thể khiến hồ sơ khởi kiện bị Tòa án trả lại hoặc từ chối thụ lý?","o":[["A","Gửi thông báo nhắc nợ bằng thư thường."],["B","Chỉ lưu trữ hồ sơ pháp lý (CCCD/giấy tờ hộ tịch) của khách hàng bằng bản photocopy không có công chứng/chứng thực hoặc thiếu bản gốc đối chiếu."],["C","Không ký biên bản làm việc trực tiếp tại nhà khách hàng định kỳ hàng tháng."],["D","Chấp nhận tài sản thế chấp nằm ngoài địa bàn hoạt động của chi nhánh."]],"a":["B"],"e":"Theo transcript cuộc họp, hồ sơ khởi kiện bắt buộc phải có bản sao công chứng/chứng thực các giấy tờ pháp lý. Cán bộ bán lẻ có thói quen chỉ lưu bản photocopy không chứng thực, khi có tranh chấp đưa ra tòa bị tòa từ chối thụ lý hồ sơ, làm kéo dài thời gian xử lý và tăng chi phí pháp lý."},{"i":434,"s":"xu-ly-no","q":"Tổng số tiền thu nợ thực tế lũy kế trong giai đoạn 5 năm (2021 - 2025) của toàn hệ thống BIDV đạt được là bao nhiêu?","o":[["A","14.367 tỷ đồng."],["B","41.099 tỷ đồng."],["C","143.024 tỷ đồng."],["D","8.038 tỷ đồng."]],"a":["B"],"e":"Căn cứ bảng thống kê số liệu thu nợ qua các năm trong slide đào tạo (trang 2/Slide kết quả): Tổng số tiền thu nợ giai đoạn 2021-2025 đạt lũy kế 41.099 tỷ đồng."},{"i":435,"s":"dau-thau","q":"Một trong các căn cứ lập Kế hoạch lựa chọn nhà thầu đối với việc mua sắm hàng năm các thiết bị văn phòng, văn phòng phẩm dùng nguồn vốn chi thường xuyên là gi?","o":[["A","Quyết định phê duyệt dự án"],["B","Nguồn vốn được duyệt"],["C","Quyết định mua sắm được phê duyệt"],["D","Cả 3 đáp án trên đều đúng"]],"a":["C"],"e":"Khoản 1 và 5 Điều 37 Luật Đấu thầu số 22/2023/QH15"},{"i":436,"s":"dau-thau","q":"Kế hoạch lựa chọn nhà thầu gồm bao nhiêu nội dung chính","o":[["A","6"],["B","7"],["C","8"],["D","9"],["E","10"]],"a":["C"],"e":""},{"i":437,"s":"dau-thau","q":"Đấu thầu là gì","o":[["A","Là quá trình lựa chọn nhà thầu để ký kết, thực hiện hợp đồng cung cấp dịch vụ tư vấn, phi tư vấn, mua sắm hàng hóa, lựa chọn nhà đầu tư để ký kết, thực hiện hợp đồng dự án đầu tư kinh doanh trên cơ sở đảm bảo cạnh tranh, công bằng, minh bạch"],["B","Là quá trình lựa chọn nhà thầu để ký kết, thực hiện hợp đồng cung cấp dịch vụ tư vấn, phi tư vấn, mua sắm hàng hóa, xây lắp, lựa chọn nhà đầu tư để ký kết, thực hiện hợp đồng dự án đầu tư kinh doanh trên cơ sở đảm bảo cạnh tranh, công bằng và trách nhiệm giải trình"],["C","Là quá trình lựa chọn nhà thầu để ký kết, thực hiện hợp đồng cung cấp dịch vụ tư vấn, phi tư vấn, mua sắm hàng hóa, xây lắp, lựa chọn nhà đầu tư để ký kết, thực hiện hợp đồng dự án đầu tư kinh doanh trên cơ sở đảm bảo cạnh tranh, công bằng, minh bạch, hiệu quả kinh tế và trách nhiệm giải trình"]],"a":["C"],"e":""},{"i":438,"s":"dau-thau","q":"Đối với nhà thầu là tổ chức, nội dung nào sau đây không phải là tiêu chí đánh giá về tư cách hợp lệ của nhà thầu?","o":[["A","Có tên trong danh sách mua hồ sơ mời thầu"],["B","Đã đăng ký trên hệ thống mạng đấu thầu quốc gia"],["C","Hạch toán tài chính độc lập"],["D","Không đang trong thời gian bị cấm tham dự thầu"]],"a":["A"],"e":"Khoản 1 Điều 5 Luật Đấu thầu số 22/2023/QH15"},{"i":439,"s":"dau-thau","q":"Đối với gói thầu áp dụng quy trình chỉ định thầu thông thường thì phần phương thức lựa chọn nhà thầu trong Kế hoạch lựa chọn nhà thầu được ghi như thế nào?","o":[["A","Bỏ trống"],["B","Một giai đoạn một túi hồ sơ"],["C","Một giai đoạn hai túi hồ sơ"],["D","Đáp án khác"]],"a":["B"],"e":"Khoản 1 Điều 30 Lu
