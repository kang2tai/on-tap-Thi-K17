i":661,"s":"kinh-te-vi-mo","q":"Chỉ tiêu nào được BIDV và các chuyên gia thống nhất áp dụng làm thước đo cốt lõi để đo lường năng suất lao động thay thế cho dư nợ và huy động bình quân trước đây?","o":[["A","Số lượng tài khoản mở mới"],["B","Lợi nhuận trước thuế bình quân đầu người"],["C","Doanh thu phí dịch vụ bình quân"],["D","Tổng tài sản bình quân"]],"a":["B"],"e":"[B] - Hội thảo thống nhất chuyển đổi sang sử dụng chỉ tiêu Lợi nhuận trước thuế bình quân đầu người để đánh giá chính xác năng suất lao động."},{"i":662,"s":"kinh-te-vi-mo","q":"Trong đề án thành lập Sàn giao dịch tài sản mã hóa (Nghị quyết 05/2025/NQ-CP), mức vốn điều lệ quy định tối thiểu là bao nhiêu?","o":[["A","2.000 tỷ đồng"],["B","5.000 tỷ đồng"],["C","10.000 tỷ đồng"],["D","15.000 tỷ đồng"]],"a":["C"],"e":"[C] - Vốn điều lệ tối thiểu 10.000 tỷ đồng, yêu cầu tối đa 5 cổ đông sáng lập bao gồm ngân hàng, công ty công nghệ và chứng khoán."},{"i":663,"s":"kinh-te-vi-mo","q":"Theo mục tiêu chiến lược phát triển BIDV riêng lẻ đến năm 2030, tốc độ tăng trưởng tổng tài sản tối thiểu hàng năm (CAGR) là bao nhiêu?","o":[["A",">= 8%/năm"],["B",">= 10%/năm"],["C",">= 13%/năm"],["D",">= 15%/năm"]],"a":["C"],"e":"[C] - Chiến lược đặt mục tiêu Tăng trưởng tổng tài sản riêng lẻ tối thiểu >= 13%/năm giai đoạn 2026-2030."},{"i":664,"s":"kinh-te-vi-mo","q":"Chỉ tiêu dư nợ tín dụng hợp nhất của BIDV dự kiến đạt mốc nào vào năm 2030?","o":[["A","~ 3.5 triệu tỷ đồng"],["B","~ 4.0 triệu tỷ đồng"],["C","~ 4.7 triệu tỷ đồng"],["D","~ 5.5 triệu tỷ đồng"]],"a":["C"],"e":"[C] - Dư nợ tín dụng hợp nhất dự kiến đạt ~ 4,7 triệu tỷ đồng vào năm 2030 (trong đó riêng lẻ dự kiến đạt ~ 4,6 triệu tỷ đồng)."},{"i":665,"s":"kinh-te-vi-mo","q":"Chỉ tiêu Lợi nhuận trước thuế hợp nhất của BIDV đến năm 2030 đặt mục tiêu đạt bao nhiêu?","o":[["A","70.000 tỷ đồng"],["B","80.000 tỷ đồng"],["C","86.000 tỷ đồng"],["D","90.000 tỷ đồng"]],"a":["C"],"e":"[D] - Mục tiêu LNTT hợp nhất đến năm 2030 là 90.000 tỷ đồng (riêng lẻ đặt mục tiêu đạt 86.000 tỷ đồng)."},{"i":666,"s":"kinh-te-vi-mo","q":"Mục tiêu kiểm soát tỷ lệ nợ xấu của BIDV (cả riêng lẻ và hợp nhất) đến năm 2030 là bao nhiêu?","o":[["A","< 1.0%"],["B","< 1.5%"],["C","< 2.0%"],["D","< 3.0%"]],"a":["A"],"e":"[A] - BIDV cam kết kiểm soát tỷ lệ nợ xấu cực kỳ nghiêm ngặt dưới mức 1,0% cho cả riêng lẻ và hợp nhất."},{"i":667,"s":"kinh-te-vi-mo","q":"Mục tiêu tăng trưởng dư nợ tín dụng xanh/bền vững của BIDV đến năm 2030 được yêu cầu như thế nào?","o":[["A","Bằng tốc độ chung"],["B","Gấp 1.3 đến 1.5 lần tốc độ tín dụng chung"],["C","Gấp 2.0 lần tốc độ tín dụng chung"],["D","Chiếm 50% tổng dư nợ"]],"a":["B"],"e":"[B] - Tăng trưởng tín dụng xanh của BIDV phải đạt gấp 1,3 đến 1,5 lần tốc độ tăng trưởng tín dụng chung để phát triển bền vững."},{"i":668,"s":"kinh-te-vi-mo","q":"Mục tiêu giảm mức phát thải ròng trong hoạt động vận hành nội bộ của BIDV đến năm 2030 là bao nhiêu?","o":[["A","Giảm tối thiểu 10%"],["B","Giảm tối thiểu 20%"],["C","Giảm tối thiểu 30%"],["D","Đạt mức Net Zero 100%"]],"a":["B"],"e":"[B] - Chỉ tiêu xanh hóa vận hành nội bộ của BIDV đặt ra yêu cầu giảm tối thiểu 20% lượng phát thải khí nhà kính."},{"i":669,"s":"kinh-te-vi-mo","q":"Tỷ lệ an toàn vốn (CAR) mục tiêu của BIDV riêng lẻ và hợp nhất đến năm 2030 lần lượt là bao nhiêu?","o":[["A","9.5% và 10.0%"],["B","10.7% và 11.0%"],["C","11.5% và 12.0%"],["D","12.0% và 13.5%"]],"a":["B"],"e":"[B] - Hệ số CAR mục tiêu đến năm 2030 là 10,7% đối với riêng lẻ và 11,0% đối với hợp nhất theo chuẩn Basel III."},{"i":670,"s":"kinh-te-vi-mo","q":"Mục tiêu tỷ lệ chi phí trên thu nhập (CIR) của BIDV đến năm 2030 là bao nhiêu?","o":[["A","< 25%"],["B","< 30%"],["C","< 35%"],["D","< 40%"]],"a":["B"],"e":"[B] - Kiểm soát hiệu quả chi phí hoạt động CIR dưới 30% thông qua các chương trình số hóa và tự động hóa quy trình nghiệp vụ."},{"i":671,"s":"kinh-te-vi-mo","q":"Tỷ lệ đóng góp của vốn đầu tư toàn xã hội vào tăng trưởng kinh tế Việt Nam (giai đoạn 2026-2030f) theo tính toán của Viện NCKT BIDV là bao nhiêu % GDP?","o":[["A","32% - 35% GDP"],["B","35% - 37% GDP"],["C","38% - 39% GDP"],["D","40% - 42% GDP"]],"a":["C"],"e":"[C] - Nghiên cứu của Viện NCKT BIDV chỉ ra vốn đầu tư toàn xã hội cần đạt mức đóng góp 38% - 39% GDP trong giai đoạn tới."},{"i":672,"s":"kinh-te-vi-mo","q":"Để đạt mức thu nhập cao vào năm 2045 (23.000 USD bình quân đầu người), tăng trưởng GDP bình quân hàng năm giai đoạn 2026-2030 cần đạt mức tối thiểu nào?","o":[["A","7.0% - 8.0%/năm"],["B","8.0% - 9.0%/năm"],["C","9.0% - 10.0%/năm"],["D","11.0% - 12.0%/năm"]],"a":["C"],"e":"[C] - Để vượt qua bẫy thu nhập trung bình, tốc độ tăng trưởng GDP bình quân hàng năm giai đoạn 2026-2030 phải đạt 9,0% - 10,0%/năm."},{"i":673,"s":"kinh-te-vi-mo","q":"Ngân hàng nào tại Việt Nam là định chế duy nhất được Ủy ban Chứng khoán Nhà nước chấp thuận làm ngân hàng thanh toán cho thị trường giao dịch hạn ngạch phát thải và tín chỉ carbon thí điểm?","o":[["A","Vietcombank"],["B","VietinBank"],["C","BIDV"],["D","Agribank"]],"a":["C"],"e":"[C] - BIDV là ngân hàng duy nhất được cấp phép cung cấp dịch vụ thanh toán bù trừ giao dịch tín chỉ carbon và hạn ngạch phát thải khí nhà kính."},{"i":674,"s":"kinh-te-vi-mo","q":"Đâu không phải là một trong các rủi ro, thách thức chính với kinh tế thế giới 2025-2026","o":[["A","Xung đột địa chính trị phức tạp, chính tranh thương mại – công nghệ"],["B","Các NHTW tại Mỹ, châu Âu bàn thảo nghiên cứu tiền kỹ thuật số"],["C","Rủi ro suy giảm, tăng trưởng thấp ở 1 số nước (Mỹ, Trung Quốc, EU…);"],["D","Rủi ro an ninh năng lượng, an ninh lương thực, an ninh chuỗi cung ứng và an ninh mạng luôn hiện hữu; biến đổi khí hậu bất thường"]],"a":["B"],"e":"slide 22 KTVM"},{"i":675,"s":"kinh-te-vi-mo","q":"Việt Nam đang có động thái nào với tiền kỹ thuật số do NHTW phát hành (CBDC)?","o":[["A","Đã phát hành"],["B","Đang thử nghiệm"],["C","Đang nghiên cứu"],["D","Chưa có động thái gì"]],"a":["C"],"e":"slide 38 ngành ngân hàng"},{"i":676,"s":"kinh-te-vi-mo","q":"Các xu hướng tài chính – tiền tệ chính toàn cầu hiện nay là (có thể chọn nhiều hơn 1 lựa chọn)","o":[["A","Thay đổi chính sách tài khóa, tiền tệ, khung pháp lý"],["B","Thúc đẩy chuyển đổi số, thanh toán không dùng tiền mặt"],["C","Khách hàng thay đổi hành vi đầu tư, tiêu dùng…"],["D","Mở rộng mạng lưới chi nhánh, phòng giao dịch"],["E","Tài chính xanh"],["F","Tăng cường nhanh hiện diện quốc tế"]],"a":["A","B","C","E"],"e":"slide 24 ngành ngân hàng"},{"i":677,"s":"kinh-te-vi-mo","q":"Cơ chế điều hành tỷ giá tại Việt Nam là","o":[["A","Neo cứng (hard peg)"],["B","Neo mềm (soft peg)"],["C","Thả nổi (Float)"],["D","Khác"]],"a":["B"],"e":"slide 6 KTVM"},{"i":678,"s":"kinh-te-vi-mo","q":"Một số nước đang phát triển như Việt Nam sử dụng công cụ chính sách tiền tệ khác với các nước phát triển?","o":[["A","Dự trữ bắt buộc"],["B","Chính sách (tái) chiết khấu"],["C","Kiểm soát cung tiền (tín dụng)"],["D","Nghiệp vụ thị trường mở"],["E","Công cụ lãi suất"]],"a":["C"],"e":"Slide 5 KTVM"},{"i":679,"s":"cong-tac-dang","q":"Theo Chuyên đề Công tác Đảng của Lớp K17, tỷ lệ phân bổ nội dung giữa Lý thuyết và Thực hành trong cấu trúc bài giảng và ôn thi được quy định là bao nhiêu?","o":[["A","50% Lý thuyết, 50% Thực hành"],["B","40% Lý thuyết, 60% Thực hành"],["C","30% Lý thuyết, 70% Thực hành"],["D","20% Lý thuyết, 80% Thực hành"]],"a":["C"],"e":"Quy định của ban tổ chức lớp học: lý thuyết chiếm 30%, phần thực hành (giải quyết câu hỏi thảo luận, bài tập thực tế) chiếm 70% tổng số điểm bài thi."},{"i":680,"s":"cong-tac-dang","q":"Văn bản nào sau đây quy định đầy đủ về chức năng, nhiệm vụ của đảng bộ, chi bộ cơ sở trong doanh nghiệp nhà nước?","o":[["A","Quy định số 48-QĐ/TW ngày 20/12/2021"],["B","Quy định số 20-QĐ/TW ngày 08/04/2026"],["C","Chỉ thị số 50-CT/TW ngày 23/7/2025"],["D","Quy định số 19-QĐ/TW về chính trị tư tưởng"]],"a":["A"],"e":"Quy định số 48-QĐ/TW ngày 20/12/2021 của Ban Chấp hành Trung ương quy định rõ chức năng, nhiệm vụ của đảng bộ, chi bộ cơ sở trong doanh nghiệp nhà nước."},{"i":681,"s":"cong-tac-dang","q":"Theo Quy định số 48-QĐ/TW, có bao nhiêu nhóm nhiệm vụ chính của đảng bộ, chi bộ cơ sở trong doanh nghiệp nhà nước?","o":[["A","4 nhiệm vụ"],["B","5 nhiệm vụ"],["C","6 nhiệm vụ"],["D","7 nhiệm vụ"]],"a":["C"],"e":"Quy định 48 quy định 6 nhóm nhiệm vụ: 1. Lãnh đạo SXKD; 2. Công tác chính trị tư tưởng; 3. Tổ chức, cán bộ; 4. Xây dựng tổ chức đảng; 5. Kiểm tra giám sát; 6. Lãnh đạo đoàn thể CT-XH."},{"i":682,"s":"cong-tac-dang","q":"Theo tài liệu chuyên đề, cơ cấu nội dung trọng tâm bài thi gồm mấy phần chính?","o":[["A","2 phần chính"],["B","3 phần chính"],["C","4 phần chính"],["D","5 phần chính"]],"a":["A"],"e":"Gồm 2 phần: Phần 1: Vai trò, trách nhiệm của Ban Giám đốc đối với công tác Đảng, Đoàn thể. Phần 2: Nhiệm vụ chủ yếu của cấp uỷ, Phó Bí thư cấp uỷ cơ sở và các đoàn thể."},{"i":683,"s":"cong-tac-dang","q":"Theo Chỉ thị số 50-CT/TW và hướng dẫn, ngày thống nhất tổ chức sinh hoạt chi bộ toàn Đảng hàng tháng là ngày nào?","o":[["A","Ngày 01 hằng tháng"],["B","Ngày mùng 3 hằng tháng"],["C","Ngày 15 hằng tháng"],["D","Ngày 30 hằng tháng"]],"a":["B"],"e":"Thống nhất thực hiện sinh hoạt chi bộ toàn Đảng vào ngày mùng 3 hằng tháng (trường hợp đặc biệt sinh hoạt trong tuần đầu tiên của tháng)."},{"i":684,"s":"cong-tac-dang","q":"Thời lượng sinh hoạt chi bộ định kỳ tối thiểu theo hướng dẫn quy định là bao nhiêu phút?","o":[["A","Tối thiểu 60 phút"],["B","Tối thiểu 90 phút"],["C","Tối thiểu 120 phút"],["D","Tối thiểu 150 phút"]],"a":["B"],"e":"Thời lượng sinh hoạt chi bộ định kỳ thường kỳ được yêu cầu tối thiểu là 90 phút."},{"i":685,"s":"cong-tac-dang","q":"Thời lượng sinh hoạt chi bộ tối thiểu khi có kết hợp nội dung sinh hoạt chuyên đề là bao nhiêu phút?","o":[["A","Tối thiểu 90 phút"],["B","Tối thiểu 120 phút"],["C","Tối thiểu 150 phút"],["D","Tối thiểu 180 phút"]],"a":["B"],"e":"Thời lượng tối thiểu yêu cầu là 120 phút nếu kết hợp sinh hoạt thường kỳ với sinh hoạt chuyên đề."},{"i":686,"s":"cong-tac-dang","q":"Theo quy định hiện hành, việc đăng tải kết luận/nghị quyết cuộc họp chi bộ lên ứng dụng Sổ tay đảng viên điện tử phải hoàn thành trong thời gian nào?","o":[["A","Trong ngày diễn ra cuộc họp"],["B","Trong vòng 02 ngày làm việc sau cuộc họp"],["C","Trong vòng 05 ngày làm việc sau cuộc họp"],["D","Trong vòng 07 ngày làm việc sau cuộc họp"]],"a":["B"],"e":"Theo quy định, sau hội nghị trong vòng 02 ngày làm việc phải hoàn thiện báo cáo và đăng tải kết quả kết luận lên ứng dụng Sổ tay đảng viên điện tử."},{"i":687,"s":"cong-tac-dang","q":"Theo Chuyên đề, có bao nhiêu nhóm giải pháp trọng tâm được đưa ra để nâng cao chất lượng sinh hoạt Đảng?","o":[["A","4 nhóm giải pháp"],["B","5 nhóm giải pháp"],["C","6 nhóm giải pháp"],["D","7 nhóm giải pháp"]],"a":["B"],"e":"Có 5 nhóm giải pháp trọng tâm: 1. Nâng cao nhận thức; 2. Đổi mới nội dung hình thức; 3. Chuẩn bị kỹ lưỡng trước họp; 4. Thực hiện nghiêm nguyên tắc tổ chức; 5. Tăng cường KTGS & đánh giá."},{"i":688,"s":"cong-tac-dang","q":"Khi Bí thư cấp ủy đi vắng, quy trình Phó Bí thư được phân công chủ trì hội nghị cấp ủy thực hiện theo mấy bước?","o":[["A","3 bước"],["B","4 bước"],["C","5 bước"],["D","6 bước"]],"a":["C"],"e":"Quy trình 5 bước: 1. Chuẩn bị nội dung; 2. Khai mạc; 3. Điều hành thảo luận; 4. Kết luận, biểu quyết; 5. Ban hành kết luận và theo dõi thực hiện."},{"i":689,"s":"cong-tac-dang","q":"Đâu là nguyên tắc tổ chức và hoạt động quan trọng nhất, đóng vai trò là 'bộ khung pháp lý' của Đảng Cộng sản Việt Nam?","o":[["A","Nguyên tắc tập trung dân chủ"],["B","Nguyên tắc tự phê bình và phê bình"],["C","Nguyên tắc đoàn kết thống nhất"],["D","Nguyên tắc hoạt động trong khuôn khổ hiến pháp và pháp luật"]],"a":["A"],"e":"Nguyên tắc tập trung dân chủ là nguyên tắc tổ chức cơ bản nhất của Đảng, điều hành mọi hoạt động quyết định tập thể."},{"i":690,"s":"cong-tac-dang","q":"Có bao nhiêu nguyên tắc tổ chức và hoạt động của Đảng được xác định trong Điều lệ Đảng?","o":[["A","3 nguyên tắc"],["B","4 nguyên tắc"],["C","5 nguyên tắc"],["D","6 nguyên tắc"]],"a":["C"],"e":"Có 5 nguyên tắc tổ chức hoạt động của Đảng: Tập trung dân chủ; Tự phê bình và phê bình; Đoàn kết thống nhất; Liên hệ mật thiết với nhân dân; Hoạt động trong khuôn khổ Hiến pháp và Pháp luật."},{"i":691,"s":"cong-tac-dang","q":"Đối với Phó Bí thư cấp ủy cơ sở, vai trò chủ yếu trong công tác cấp ủy là gì?","o":[["A","Quyết định toàn bộ mọi việc của đơn vị"],["B","Giúp việc cho Bí thư, thay mặt Bí thư chủ trì xử lý công việc khi được phân công hoặc ủy quyền"],["C","Chỉ đạo chuyên môn mà không cần báo cáo Đảng ủy"],["D","Thay mặt Ban Giám đốc ký kết các hợp đồng kinh tế"]],"a":["B"],"e":"Phó Bí thư là người giúp việc cho Bí thư, thay mặt Bí thư khi đi vắng và chịu trách nhiệm trực tiếp về mảng công tác được phân công."},{"i":692,"s":"cong-tac-dang","q":"Đảng bộ, chi bộ cơ sở trong doanh nghiệp nhà nước giữ vai trò gì đối với mọi hoạt động của doanh nghiệp?","o":[["A","Là hạt nhân chính trị, lãnh đạo thực hiện đường lối chính sách và nhiệm vụ chính trị sản xuất kinh doanh"],["B","Là cơ quan quản lý hành chính trực tiếp điều hành kinh doanh"],["C","Là ban cố vấn độc lập của Hội đồng quản trị"],["D","Là đại diện của cổ đông nhà nước tại doanh nghiệp"]],"a":["A"],"e":"Theo Quy định 48-QĐ/TW, Đảng bộ/chi bộ cơ sở là hạt nhân chính trị, lãnh đạo thực hiện đường lối chính sách và nhiệm vụ SXKD."},{"i":693,"s":"cong-tac-dang","q":"Chi bộ trực thuộc đảng bộ cơ sở có tần suất sinh hoạt định kỳ tối thiểu là bao nhiêu?","o":[["A","Ít nhất 01 lần / tháng"],["B","Ít nhất 01 lần / quý"],["C","Ít nhất 02 lần / tháng"],["D","Ít nhất 01 lần / năm"]],"a":["A"],"e":"Theo quy định Điều lệ Đảng và hướng dẫn hiện hành, chi bộ sinh hoạt định kỳ ít nhất 1 lần/tháng."},{"i":694,"s":"cong-tac-dang","q":"Chi bộ trực thuộc đảng bộ cơ sở có tần suất sinh hoạt chuyên đề tối thiểu là bao nhiêu?","o":[["A","Ít nhất 01 lần / tháng"],["B","Ít nhất 01 lần / quý (ít nhất 4 lần / năm)"],["C","Ít nhất 02 lần / năm"],["D","Ít nhất 01 lần / năm"]],"a":["B"],"e":"Quy định sinh hoạt chuyên đề ít nhất mỗi quý 1 lần (4 lần/năm) để làm sâu sắc các nội dung chính trị, tư tưởng hoặc nghiệp vụ."},{"i":695,"s":"cong-tac-dang","q":"Việc lồng ghép sinh hoạt chi bộ với cuộc họp giao ban chuyên môn được quy định thế nào?","o":[["A","Được lồng ghép thoải mái để tiết kiệm thời gian"],["B","Được lồng ghép nếu Ban Giám đốc đồng ý"],["C","Tuyệt đối không được họp chi bộ lồng ghép với các cuộc họp chuyên môn"],["D","Được lồng ghép nếu cuộc họp diễn ra ngoài giờ hành chính"]],"a":["C"],"e":"Chỉ thị số 50-CT/TW và hướng dẫn yêu cầu tuyệt đối không được lồng ghép họp chi bộ với các cuộc họp chuyên môn để đảm bảo tính nghiêm túc."},{"i":696,"s":"cong-tac-dang","q":"Cụm từ viết tắt 'Sáu đỏ' (hoặc bốn đỏ nâng cấp) trong công tác quản lý đảng viên nhằm mục đích 'Rõ người - Rõ việc' gồm những nội dung nào?","o":[["A","Rõ người, rõ việc, rõ thời gian, rõ kết quả, rõ trách nhiệm, rõ thẩm quyền"],["B","Rõ lương, rõ thưởng, rõ chức vụ, rõ quan hệ, rõ thâm niên, rõ bằng cấp"],["C","Rõ kế hoạch, rõ thực hiện, rõ kiểm tra, rõ báo cáo, rõ phê duyệt, rõ lưu trữ"],["D","Rõ nguồn gốc, rõ trình độ, rõ gia thế, rõ lý lịch, rõ tư tưởng, rõ hành vi"]],"a":["A"],"e":"Bí thư nhấn mạnh việc quản lý đảng viên theo nguyên tắc 'Sáu đỏ': Rõ người, rõ việc, rõ thời gian, rõ kết quả, rõ trách nhiệm, rõ thẩm quyền để tránh hô hào suông."},{"i":697,"s":"cong-tac-dang","q":"Quy định mới nhất của Ban Chấp hành Trung ương về thi hành Điều lệ Đảng ban hành ngày 08/04/2026 là quy định nào?","o":[["A","Quy định số 20-QĐ/TW"],["B","Quy định số 48-QĐ/TW"],["C","Quy định số 208-QĐ/TW"],["D","Quy định số 207-QĐ/TW"]],"a":["A"],"e":"Quy định số 20-QĐ/TW ngày 08/04/2026 của Ban Chấp hành Trung ương về việc thi hành Điều lệ Đảng."},{"i":698,"s":"cong-tac-dang","q":"Ứng dụng công nghệ nào hiện đang được nhấn mạnh để chuyển đổi số và nâng cao tính minh bạch, nề nếp trong hoạt động Đảng cơ sở tại BIDV?","o":[["A","Phần mềm Zoom trực tuyến"],["B","Sổ tay đảng viên điện tử"],["C","Hệ thống quản trị Office 365"],["D","Phần mềm KPI điện tử"]],"a":["B"],"e":"Sổ tay đảng viên điện tử là công cụ chuyển đổi số cốt lõi giúp số hóa toàn bộ quá trình sinh hoạt, điểm danh, nghị quyết của chi bộ tại BIDV."},{"i":699,"s":"chuyen-doi-so","q":"Theo PTGD Phan Thanh Hải, công thức bản chất của Chuyển đổi số là gì?","o":[["A","Chuyển đổi số = Công nghệ + Quy trình cũ"],["B","Chuyển đổi số = Số hóa + Quy trình truyền thống"],["C","Chuyển đổi số = Chuyển đổi + Số (Tái thiết kế quy trình trước khi số hóa)"],["D","Chuyển đổi số = Công nghệ lõi + Hệ sinh thái Agile"]],"a":["C"],"e":"Chuyển đổi số thực chất gồm hai phần: 'Chuyển đổi' (tái thiết kế, cải tiến quy trình vận hành) trước, rồi mới thực hiện 'Số hóa'. Nếu bê nguyên quy trình cũ bị lỗi/thủ công lên công nghệ thì chỉ tạo ra 'quy trình cũ đắt đỏ'."},{"i":700,"s":"chuyen-doi-so","q":"Trong chương trình tiếp quỹ thông minh (BCE), quy trình phê duyệt giao dịch tiếp quỹ đã giảm số lượng nhân sự tham gia như thế nào?","o":[["A","Từ 4 người xuống còn 3 người"],["B","Từ 4 người xuống còn 2 người (giảm 50% nhân sự phê duyệt)"],["C","Từ 3 người xuống còn 1 người"],["D","Giữ nguyên nhưng số hóa toàn bộ hồ sơ giấy"]],"a":["B"],"e":"Trước đây quy trình giấy yêu cầu qua 4 tay (1 maker + 1 checker bên giao tiền, và 1 maker + 1 checker bên nhận tiền). Khi số hóa qua app BCE xác nhận real-time giữa hai bên, hệ thống tự động kiểm soát rủi ro, giảm từ 4 xuống còn 2 người phê duyệt."},{"i":701,"s":"chuyen-doi-so","q":"Chương trình tiếp quỹ thông minh (BCE) đã biến chiếc xe tiếp quỹ từ một 'ốc đảo' đơn tuyến thành mô hình hoạt động gì?","o":[["A","Xe tiếp quỹ tự động không người lái"],["B","Giao dịch viên quỹ phụ di động (cập nhật real-time)"],["C","Trung tâm tiền mặt chi nhánh di động"],["D","Trạm trung chuyển tiền mặt tạm thời"]],"a":["B"],"e":"BCE biến xe tiếp quỹ thành một 'giao dịch viên quỹ phụ' tự chủ ngân quỹ, cập nhật dòng tiền real-time. Hệ thống điều phối xe linh hoạt như mô hình Uber/Grab thay vì chỉ đi một chiều cố định như trước."},{"i":702,"s":"chuyen-doi-so","q":"Khung chiến lược chuyển đổi số của hãng tư vấn BCG gồm mấy lớp nền tảng chính?","o":[["A","2 lớp"],["B","3 lớp"],["C","4 lớp"],["D","5 lớp"]],"a":["B"],"e":"Khung BCG gồm 3 lớp: Lớp 1 (Business strategy driven by digital - Chiến lược dẫn dắt bởi Số hóa), Lớp 2 (Số hóa Lõi - Thâm canh sản phẩm cũ & Tăng trưởng Số mới - Quảng canh mô hình mới), Lớp 3 (Lớp thực thi: Con người & tổ chức, Dữ liệu, Công nghệ, Hệ sinh thái)."},{"i":703,"s":"chuyen-doi-so","q":"Trong lớp thứ hai của khung BCG, sự khác biệt giữa 'Số hóa lõi' (Digital core) và 'Tăng trưởng số mới' (New digital growth) được ví như hoạt động nào?","o":[["A","Thâm canh (tối ưu hóa sản phẩm hiện hữu) và Quảng canh (khai phá mô hình kinh doanh mới)"],["B","Bán lẻ (khách hàng cá nhân) và Bán buôn (khách hàng doanh nghiệp)"],["C","Khai thác dữ liệu (Data mining) và Bảo mật hệ sinh thái (Security)"],["D","Phát triển ứng dụng nội bộ và Mua giải pháp phần mềm đóng gói từ bên ngoài"]],"a":["A"],"e":"Thâm canh (Farmer) tập trung tối ưu hóa, số hóa trên nền tảng sản phẩm hiện hữu để gia tăng hiệu quả thu nhập. Quảng canh (Hunter) là đi tìm kiếm, khai phá mô hình mới, tạo ra dòng doanh thu phi truyền thống mới."},{"i":704,"s":"chuyen-doi-so","q":"Phương pháp lập chiến lược 'Thích nghi' (Adaptive) của BCG phù hợp nhất trong bối cảnh nào?","o":[["A","Môi trường kinh doanh ổn định, dễ đoán định dài hạn"],["B","Môi trường VUCA (bất định, biến đổi nhanh), chấp nhận thử và sai liên tục"],["C","Khi ngân hàng tập trung cắt giảm tối đa chi phí vận hành"],["D","Khi sáp nhập hoàn toàn các đơn vị thành viên"]],"a":["B"],"e":"Trong bối cảnh VUCA biến động không thể đoán định (như sự bùng nổ của AI), cách làm chiến lược cổ điển (phân tích tĩnh, kế hoạch dài hạn) sẽ lỗi thời rất nhanh. Do đó, phương pháp thích nghi chấp nhận thử nghiệm, sai lầm và rút ngắn chu kỳ đánh giá liên tục."},{"i":705,"s":"chuyen-doi-so","q":"Quy tắc '2 danh sách' (To-do list) của Warren Buffet được PTGD Phan Thanh Hải chia sẻ nhằm nhấn mạnh điều gì?","o":[["A","Phải ghi lại mọi công việc cần làm hàng ngày để tránh quên"],["B","Tập trung 100% nguồn lực vào 5 mục tiêu quan trọng nhất, coi 25 mục tiêu còn lại là danh sách 'tránh làm bằng mọi giá'"],["C","Mỗi cán bộ phải tự lập kế hoạch tài chính cá nhân trước khi thực hiện dự án"],["D","Phân bổ đều tài nguyên cho tất cả các sáng kiến chuyển đổi số"]],"a":["B"],"e":"Quy tắc yêu cầu chọn ra 5 mục tiêu cốt lõi nhất. 25 việc còn lại là danh sách cực kỳ cám dỗ cần phải tránh thực hiện, vì nếu cố làm thêm sẽ gây phân tán nguồn lực, dẫn đến mất tập trung chiến lược."},{"i":706,"s":"chuyen-doi-so","q":"Theo McKinsey, mô hình tổ chức chuyển đổi số 'Tập trung' (Centralized) được thể hiện rõ nhất qua hành động nào?","o":[["A","Đưa nhân sự IT về phân tán tại tất cả các chi nhánh"],["B","Thành lập một đơn vị kỹ thuật số riêng biệt phối hợp với các khối kinh doanh (như Trung tâm kinh doanh số)"],["C","Thuê ngoài (outsourcing) toàn bộ việc vận hành hệ thống thông tin"],["D","Tái cấu trúc giảm bớt các phòng ban kiểm tra giám sát nội bộ"]],"a":["B"],"e":"Mô hình tập trung thành lập một trung tâm kỹ thuật số riêng biệt (Digital Business Center / Trung tâm kinh doanh số) để làm đầu mối dẫn dắt, phối hợp thực thi các sáng kiến số thay vì phân tán hoặc ươm tạo biệt lập."},{"i":707,"s":"chuyen-doi-so","q":"Ngân hàng nào tại Việt Nam hiện đang duy trì mô hình Trung tâm kinh doanh số tích hợp cả mảng bán buôn và bán lẻ?","o":[["A","Vietcombank"],["B","VietinBank"],["C","MB (Military Bank)"],["D","Agribank"]],"a":["C"],"e":"Hiện nay duy nhất có MB là còn duy trì Trung tâm kinh doanh số hoạt động cho cả mảng bán buôn và bán lẻ (tuy nhiên mô hình này chủ yếu gom cán bộ kinh doanh chứ chưa tích hợp triệt để cán bộ kỹ thuật)."},{"i":708,"s":"chuyen-doi-so","q":"Theo McKinsey, tốc độ thay đổi công nghệ được ví với cấu trúc cây. Lớp 'lá' đại diện cho thành phần nào?","o":[["A","Hệ thống Core Banking"],["B","Giao diện và dịch vụ số thay đổi nhanh (Smart Banking, BIDV Direct)"],["C","Hạ tầng máy chủ và mạng lưu trữ vật lý"],["D","Văn hóa tổ chức và quy chế quản trị nội bộ"]],"a":["B"],"e":"Lớp lá (Commerce & Fashion) thay đổi rất nhanh theo mùa/mốt, tương đương với các kênh số tiếp xúc khách hàng như Smart Banking, BIDV Direct cần cập nhật liên tục để thích ứng thị trường. Core Banking hay hạ tầng là phần thân/rễ thay đổi chậm và trầm tích hơn."},{"i":709,"s":"chuyen-doi-so","q":"Mô hình 'Agile Squad' (Nhóm tự chủ đa chức năng) theo nguyên lý McKinsey được thiết lập để giải quyết triệt để vấn đề gì?","o":[["A","Tình trạng hoạt động biệt lập theo silo (Siloed) giữa các phòng ban chuyên môn truyền thống"],["B","Sự thiếu hụt nhân sự công nghệ thông tin tại các chi nhánh vùng sâu vùng xa"],["C","Rủi ro thất thoát dữ liệu khách hàng khi chia sẻ ra bên ngoài"],["D","Vấn đề quản lý ngân sách đầu tư công nghệ thông tin hàng năm"]],"a":["A"],"e":"Mô hình Agile Squad gom nhân sự từ các phòng ban khác nhau (Nghiệp vụ, IT, Rủi ro, Pháp chế, Bảo mật) vào một nhóm tự chủ để phối hợp trực tiếp, ra quyết định tức thì, phá bỏ rào cản 'silo' cát cứ thông tin."},{"i":710,"s":"chuyen-doi-so","q":"Dòng rượu nào được PTGD Phan Thanh Hải ví von là đại diện cho tinh thần chuyển đổi số đa chức năng, phối hợp nhịp nhàng?","o":[["A","Single Malt Whisky (Độc bản từ một nhà máy, một dòng chảy)"],["B","Blended Whisky (Hòa trộn tinh hoa từ nhiều nhà máy và thùng sồi khác nhau - ví dụ Hibiki)"],["C","Rượu Champagne Pháp chính hiệu"],["D","Rượu vang đỏ lâu năm"]],"a":["B"],"e":"Single Malt giống như hoạt động silo đơn lẻ. Rượu Blended Whisky (như Hibiki) là đại diện cho chuyển đổi số Agile - hòa trộn nhuần nhuyễn những nét đặc sắc nhất của các phòng ban khác nhau để tạo ra sản phẩm xuất sắc nhất."},{"i":711,"s":"chuyen-doi-so","q":"Kiến trúc lắp ghép (Composable Architecture) của Gartner được mô tả tương tự với hình ảnh thực tế nào?","o":[["A","Khối bê tông đúc sẵn không thể chỉnh sửa"],["B","Mô hình gạch lắp ráp Lego (các vi dịch vụ - microservices dùng chung dễ dàng tháo lắp)"],["C","Bản vẽ thiết kế kỹ thuật xây dựng truyền thống"],["D","Hệ thống mạng lưới giao thông khép kín"]],"a":["B"],"e":"Kiến trúc lắp ghép tháo rời hệ thống 'bê tông' nguyên khối (monolithic) thành các mô-đun vi dịch vụ (microservices) dùng chung như Payment Hub, định danh (OneAccess), giúp dễ dàng lắp ghép, tái sử dụng để tạo sản phẩm mới cực nhanh."},{"i":712,"s":"chuyen-doi-so","q":"Sự chuyển dịch tư duy từ 'Dự án' (Project) sang 'Sản phẩm' (Product) đòi hỏi điều gì?","o":[["A","Làm xong dự án bàn giao là kết thúc trách nhiệm của đội IT"],["B","Chăm sóc, đồng hành và làm mới liên tục trong suốt vòng đời (Life cycle) sản phẩm giữa IT và Nghiệp vụ"],["C","Cắt giảm ngân sách đầu tư ban đầu để thuê ngoài hoàn toàn"],["D","Tập trung tối đa vào việc mua các giải pháp đóng gói sẵn"]],"a":["B"],"e":"Sản phẩm số như một 'đứa trẻ' sinh ra, lớn lên, làm mới liên tục (Listen, Update, Build, Operate) và kết thúc vòng đời. Nó đòi hỏi sự đồng hành liên tục, trọn đời giữa IT và Nghiệp vụ, không có chuyện làm xong là 'phủi tay'."},{"i":713,"s":"chuyen-doi-so","q":"Tham vọng định vị thương hiệu của ngân hàng DBS (Singapore) thông qua chữ viết tắt 'GANDALF' là gì?","o":[["A","Trở thành một ngân hàng chuyên biệt về tài trợ vốn dự án công nghệ"],["B","Định vị mình là một công ty công nghệ lớn ngang tầm Google, Amazon, Netflix, Apple, LinkedIn, Facebook"],["C","Thành lập chuỗi chi nhánh bán lẻ tự động hoàn toàn tại châu Á"],["D","Phát triển một hệ thống bảo mật blockchain độc quyền"]],"a":["B"],"e":"GANDALF là từ ghép viết tắt của Google, Amazon, Netflix, DBS (D), Apple, LinkedIn, Facebook. DBS đặt tham vọng lớn không cạnh tranh đơn thuần với ngân hàng khác mà trở thành một Big Tech thực thụ."},{"i":714,"s":"chuyen-doi-so","q":"Ba trọng tâm chiến lược chuyển đổi số cốt lõi của ngân hàng DBS là gì?","o":[["A","Số hóa lõi (Become digital to the core), Nhúng vào hành trình khách hàng (Make DBS invisible), Tạo văn hóa 22.000 startup"],["B","Đóng cửa chi nhánh vật lý, Giảm lãi suất cho vay, Sử dụng tiền kỹ thuật số"],["C","Tập trung tín dụng doanh nghiệp, Số hóa quy trình thủ công tại quầy, Mở rộng chi nhánh ngoại quốc"],["D","Thuê ngoài toàn bộ phòng IT, Phát triển app độc lập, Nâng cao phí dịch vụ"]],"a":["A"],"e":"Ba trọng tâm của DBS gồm: 1) Become digital to the core (Số hóa từ lõi), 2) Embed yourself in the customer journey (Nhúng tài chính vào hành trình khách hàng để ngân hàng trở nên vô hình), 3) Tạo văn hóa 22.000 startup trong lòng nhân viên."},{"i":715,"s":"chuyen-doi-so","q":"Triết lý 'Nguyên lý Ferrari' được đúc kết từ các sự cố sập hệ thống liên tục của DBS nhấn mạnh điều gì?","o":[["A","Phải trang bị máy chủ có tốc độ xử lý nhanh nhất thế giới"],["B","Muốn bứt tốc chạy nhanh và đổi mới sáng tạo tự tin, hệ thống IT phải có 'phanh tốt' (Năng lực phục hồi - Resilience và kiến trúc IT vững chắc)"],["C","Nên sử dụng toàn bộ phần mềm mã nguồn mở để tối ưu hóa chi phí vận hành"],["D","Cần cắt giảm đội ngũ kiểm soát rủi ro để tăng tốc độ ra mắt sản phẩm"]],"a":["B"],"e":"Siêu xe Ferrari dám chạy tốc độ cao nhờ có hệ thống phanh an toàn bậc nhất. Trong ngân hàng, 'chiếc phanh' chính là Năng lực phục hồi (Resilience) và Quản trị rủi ro kiến trúc IT cực tốt. Chạy nhanh mà phanh hỏng (như sự cố sập hệ thống DBS do lỗi kiến trúc) sẽ dẫn đến đổ vỡ nghiêm trọng."},{"i":716,"s":"chuyen-doi-so","q":"Tại BIDV, các hệ thống thực tế nào hiện nay đang chứng minh việc hiện thực hóa lý thuyết của BCG & Gartner?","o":[["A","Ứng dụng Smart Banking dành cho khách hàng cá nhân đơn lẻ"],["B","Hệ thống Core Banking cũ của những năm 2000"],["C","Hệ thống Smart Counter Hub (SCH), B1, BIDV Direct, CRM Platform và Core mới 2023"],["D","Hệ thống quản lý tài liệu giấy tập trung tại chi nhánh"]],"a":["C"],"e":"BIDV đã go-live thành công Core mới 2023 và hàng loạt nền tảng số hóa toàn diện như SCH (quầy), B1 (nội bộ), BIDV Direct (doanh nghiệp), CRM Platform (360 độ khách hàng) tạo thành một hệ sinh thái đồng bộ từ lõi đến kênh phân phối."},{"i":717,"s":"chuyen-doi-so","q":"Theo slide 'Tầm nhìn Tháng 6/2025: Lộ trình Ngân hàng không giấy tờ', mục tiêu hoàn thành lộ trình này của BIDV là khi nào?","o":[["A","Tháng 12 năm 2024"],["B","Tháng 6 năm 2025"],["C","Tháng 12 năm 2026"],["D","Tháng 12 năm 2030"]],"a":["B"],"e":"Theo tài liệu chia sẻ, BIDV đặt mốc thời gian mục tiêu cụ thể là Tháng 6/2025 để hoàn thành lộ trình 'Ngân hàng không giấy tờ', hoạt động không còn giấy tờ bản chất."},{"i":718,"s":"chuyen-doi-so","q":"Khi BIDV đạt trạng thái 'Ngân hàng không giấy tờ' trong tương lai, mô hình hoạt động của bộ phận nào sẽ thay đổi căn bản nhất?","o":[["A","Mô hình bán hàng của Khối bán lẻ"],["B","Mô hình hoạt động của Khối Kiểm tra và Giám sát (chuyển sang giám sát từ xa trên dữ liệu hệ thống tại Hội sở)"],["C","Mô hình quản lý cơ sở hạ tầng tòa nhà của Ban quản lý"],["D","Quy trình truyền thông thương hiệu của Ban thương hiệu và PR"]],"a":["B"],"e":"Khi 100% hồ sơ được đưa lên môi trường số (B1, SCH, Landing Hub), đoàn kiểm tra giám sát sẽ không cần di chuyển xuống chi nhánh lục chứng từ giấy nữa. Họ có thể ngồi tại Hội sở truy cập trực tiếp dữ liệu hệ thống, thay đổi hoàn toàn cách thức kiểm tra truyền thống."},{"i":719,"s":"quan-ly-dieu-hanh-cn","q":"Theo tài liệu '2. TOM TAT A KIM HOA.docx', người đứng đầu nhấn mạnh tầm quan trọng của việc quản trị nào nhiều hơn?","o":[["A","Quản trị định lượng (số liệu doanh số cụ thể)"],["B","Quản trị định tính (xu hướng xã hội, cán bộ, giải quyết trước khi xảy ra)"],["C","Quản trị theo cơ chế thị trường tự do"],["D","Quản trị dựa trên kiểm tra hành chính gắt gao"]],"a":["B"],"e":"Căn cứ đoạn 1 trong Tóm tắt A Kim Hòa: người đứng đầu chú trọng vào quản trị định tính nhiều hơn định lượng."},{"i":720,"s":"quan-ly-dieu-hanh-cn","q":"Sự khác biệt cốt lõi giữa 'Quyền năng' và 'Quyền lực' được định nghĩa như thế nào?","o":[["A","Quyền lực có được do năng lực thực tế; Quyền năng do cấp trên ban phát."],["B","Quyền lực là vĩnh viễn; Quyền năng chỉ mang tính tạm thời."],["C","Quyền lực hình thành ngay lập tức và có thể bị tước đi; Quyền năng là vĩnh viễn, được nuôi dưỡng từ uy tín và thực lực."],["D","Hai khái niệm hoàn toàn tương đồng trong hoạt động điều hành ngân hàng."]],"a":["C"],"e":"Căn cứ đoạn 1 (Tóm tắt A Kim Hòa) và bài giảng: Quyền lực có thể bị tước đi bằng một quyết định hành chính, còn quyền năng là vĩnh viễn, dựa trên nội lực."},{"i":721,"s":"quan-ly-dieu-hanh-cn","q":"Mối quan hệ giữa 'Hình thức' và 'Nội dung' trong xây dựng thương hiệu được khẳng định như thế nào?","o":[["A","Nội dung quyết định hình thức, nhưng sự thay đổi của hình thức tác động sâu sắc đến nội dung."],["B","Hình thức quyết định hoàn toàn nội dung và kết quả kinh doanh."],["C","Hình thức và nội dung không có bất kỳ mối liên hệ biện chứng nào."],["D","Thương hiệu chỉ cần nội dung tốt, hình thức bên ngoài không quan trọng."]],"a":["A"],"e":"Căn cứ đoạn 2 (Tóm tắt A Kim Hòa) và bài giảng: 'hình thức chính là thương hiệu'. Sự thay đổi hình thức tác động và thúc đẩy nội dung."},{"i":722,"s":"quan-ly-dieu-hanh-cn","q":"Trong Bản mô tả công việc của Giám đốc Chi nhánh, nhóm công việc nào sau đây được liệt kê?","o":[["A","Chỉ bao gồm quản lý kế hoạch và quản lý khách hàng."],["B","Gồm 6 nhóm công việc cụ thể: Kế hoạch, Khách hàng, Nhân sự & Đảng đoàn thể, Rủi ro, Học hỏi sáng tạo, Xu hướng lớn."],["C","Tập trung duy nhất vào công tác phê duyệt tín dụng dự án lớn."],["D","Chỉ thực hiện quản trị nhân sự và đối nội đối ngoại tại địa bàn."]],"a":["B"],"e":"Căn cứ Bản MTCV Giám đốc Chi nhánh (Passage 3-4): gồm đầy đủ 6 nhóm công việc quản lý điều hành toàn diện."},{"i":723,"s":"quan-ly-dieu-hanh-cn","q":"Có bao nhiêu nguyên tắc chủ đạo trong công tác Quản lý kế hoạch của Giám đốc Chi nhánh?","o":[["A","3 nguyên tắc"],["B","4 nguyên tắc"],["C","5 nguyên tắc"],["D","6 nguyên tắc"]],"a":["B"],"e":"Căn cứ Passage 4 (Slide 2. QUẢN LÝ KẾ HOẠCH): Có 4 nguyên tắc chủ đạo (Phù hợp kế hoạch, SMART, Rõ người rõ việc rõ tiến độ, Quản lý theo mục tiêu)."},{"i":724,"s":"quan-ly-dieu-hanh-cn","q":"Đâu KHÔNG phải là một trong bốn nguyên tắc chủ đạo của Quản lý kế hoạch tại Chi nhánh?","o":[["A","Phù hợp với kế hoạch chung của toàn hệ thống BIDV"],["B","Áp dụng tiêu chuẩn SMART trong giao chỉ tiêu"],["C","Tối đa hóa doanh số cho vay bằng mọi giá, bỏ qua rủi ro tiềm ẩn"],["D","Rõ người, rõ việc, rõ tiến độ thực hiện"]],"a":["C"],"e":"Căn cứ Slide nguyên tắc Quản lý kế hoạch (Passage 4): Tối đa hóa doanh số bằng mọi giá không nằm trong 4 nguyên tắc, trái với tinh thần kiểm soát rủi ro."},{"i":725,"s":"quan-ly-dieu-hanh-cn","q":"Quy trình lập và triển khai kế hoạch tại chi nhánh theo Cẩm nang quản trị gồm mấy bước chính?","o":[["A","2 bước: Lập kế hoạch và Triển khai thực hiện"],["B","3 bước: Phân tích môi trường -> Lập kế hoạch -> Triển khai"],["C","4 bước: Phân tích -> Lập kế hoạch -> Triển khai -> Giám sát, đánh giá"],["D","5 bước: Khảo sát -> Lập kế hoạch -> Giao chỉ tiêu -> Thực hiện -> Báo cáo"]],"a":["C"],"e":"Căn cứ Cẩm nang quản trị (Passage 4-5): Quy trình 4 bước chuẩn hóa gồm Phân tích, Lập kế hoạch, Triển khai, Giám sát & Đánh giá."},{"i":726,"s":"quan-ly-dieu-hanh-cn","q":"Nguyên tắc nào sau đây được nhấn mạnh để thu hút và giữ chân khách hàng hiệu quả?","o":[["A","Cạnh tranh khốc liệt bằng cách hạ giá sâu để lôi kéo khách hàng"],["B","Không lệ thuộc vào giá, bán hàng chủ động và thường xuyên liên hệ với khách hàng"],["C","Chỉ phục vụ nhóm khách hàng trung thành, hạn chế tìm kiếm khách hàng mới"],["D","Áp dụng chính sách phí dịch vụ cao nhất để sàng lọc khách hàng chất lượng"]],"a":["B"],"e":"Căn cứ Slide Quản lý khách hàng (Passage 5): 'Không lệ thuộc vào giá - Bán hàng chủ động - Thường xuyên liên hệ với KH'."},{"i":727,"s":"quan-ly-dieu-hanh-cn","q":"Trong công tác đào tạo cán bộ, chi nhánh được khuyên nên tập trung trọng tâm vào nhóm đối tượng nào?","o":[["A","Nhóm nhân viên có hiệu suất xuất sắc nhất để bồi dưỡng làm hạt nhân"],["B","Nhóm nhân viên trung bình (để nâng mặt bằng hiệu suất chung lên)"],["C","Nhóm nhân viên yếu kém nhất để đào tạo lại từ đầu"],["D","Chỉ đào tạo cho cán bộ quản lý cấp trung (Trưởng, Phó phòng)"]],"a":["B"],"e":"Căn cứ Slide Quản lý nhân sự 4.1 (Passage 6): 'Tập trung vào nhóm nhân viên trung bình'."},{"i":728,"s":"quan-ly-dieu-hanh-cn","q":"Hai phương pháp quản lý sự thay đổi được cẩm nang phân tích là gì?","o":[["A","Phương pháp trực tiếp và phương pháp gián tiếp"],["B","Phương pháp cưỡng ép hành chính và phương pháp tự nguyện"],["C","Phương pháp Economic (hà khắc) và phương pháp Organization (mềm dẻo)"],["D","Phương pháp số hóa toàn diện và phương pháp thủ công truyền thống"]],"a":["C"],"e":"Căn cứ Slide Quản lý sự thay đổi 4.3 (Passage 8): Đưa ra hai phương pháp chính là Economic (hà khắc) và Organization (mềm dẻo)."},{"i":729,"s":"quan-ly-dieu-hanh-cn","q":"Biện pháp kiểm soát rủi ro và kiểm soát nội bộ nào sau đây là BẮT BUỘC hàng năm đối với một số vị trí?","o":[["A","Khen thưởng bằng tiền mặt hàng tháng"],["B","Luân chuyển cán bộ định kỳ và thực hiện nghiêm túc việc nghỉ bắt buộc hàng năm"],["C","Yêu cầu cán bộ viết cam kết không vi phạm quy trình"],["D","Kiểm tra toàn bộ 100% giao dịch phát sinh hàng ngày của chi nhánh"]],"a":["B"],"e":"Căn cứ Slide Quản lý rủi ro 5 (Passage 8): 'Luân chuyển cán bộ định kỳ, thực hiện nghiêm túc việc nghỉ bắt buộc hàng năm đối với một số vị trí'."},{"i":730,"s":"quan-ly-dieu-hanh-cn","q":"Giá trị văn hóa 'Nghĩa tình' của BIDV được cụ thể hóa bằng hành động thực tế nào trong chính sách lương?","o":[["A","Tăng lương đồng loạt 50% cho tất cả cán bộ trong hệ thống"],["B","Áp dụng cơ chế điều phối lương nội bộ, chia sẻ thu nhập từ chi nhánh thuận lợi cho chi nhánh khó khăn"],["C","Giữ nguyên mức lương cố định không thay đổi qua các năm"],["D","Cắt giảm lương của cán bộ có kết quả kinh doanh kém để nộp quỹ phúc lợi"]],"a":["B"],"e":"Căn cứ bài giảng đối thoại (Passage 41): Lấy lương của chi nhánh thuận lợi (như Sở Giao dịch 1) để điều phối, chia sẻ cho các chi nhánh miền núi, khó khăn."},{"i":731,"s":"quan-ly-dieu-hanh-cn","q":"Kết quả hoạt động của lực lượng công nghệ thông tin BIDV trong 6 tháng đầu năm 2026 là gì?","o":[["A","Tăng quy mô lên gần 600 người và tiết kiệm cho hệ thống 1,200 tỷ VND nhờ tự làm thay vì thuê ngoài"],["B","Tăng quy mô lên 800 người và giảm chi phí vận hành 20%"],["C","Thu hẹp nhân sự còn 200 người để tinh gọn bộ máy công nghệ"],["D","Tự xây dựng thành công 100% phần mềm lõi trong vòng 3 tháng"]],"a":["A"],"e":"Căn cứ bài giảng đối thoại (Passage 121): Quy mô CNTT tăng gần 600 người, tự chủ làm được nhiều dự án giúp tiết kiệm 1,200 tỷ VND thuê ngoài trong 6 tháng."},{"i":732,"s":"quan-ly-dieu-hanh-cn","q":"Lương bình quân của cán bộ nhân viên tại chi nhánh Đắk Nông (địa bàn Tây Nguyên khó khăn) được tiết lộ đạt mức nào?","o":[["A","Khoảng 45 triệu VND/tháng"],["B","Khoảng 65 triệu VND/tháng"],["C","Khoảng 85 triệu VND/tháng"],["D","Khoảng 105 triệu VND/tháng"]],"a":["C"],"e":"Căn cứ bài giảng đối thoại (Passage 96): Giám đốc Lê Kim Hòa tiết lộ lương bình quân anh em tại Đắk Nông đạt 85 triệu VND/tháng, rất cao so với mặt bằng."},{"i":733,"s":"quan-ly-dieu-hanh-cn","q":"Biện pháp cứng rắn nhất để xử lý chuyên viên giỏi cố tình từ chối ký duyệt hồ sơ khó vì sợ trách nhiệm pháp lý?","o":[["A","Chấp nhận yêu cầu và không giao hồ sơ khó cho họ nữa"],["B","Nâng lương thưởng đặc biệt để thuyết phục họ ký"],["C","Áp dụng biện pháp tổ chức cán bộ cứng rắn (thuyên chuyển công tác khỏi bộ phận rủi ro/phê duyệt hoặc không bổ nhiệm)"],["D","Tự trưởng nhóm ký duyệt thay toàn bộ hồ sơ"]],"a":["C"],"e":"Căn cứ bài giảng đối thoại (Passage 119): Người đứng đầu khuyên dùng biện pháp tổ chức cán bộ cứng rắn: 'Nếu em không làm được, không ký cái này thì đề nghị em đừng làm bộ phận này nữa'."},{"i":734,"s":"quan-ly-dieu-hanh-cn","q":"Triết lý động viên nhân sự 'Đồng tiền đi trước là đồng tiền khôn' được đề xuất áp dụng như thế nào tại PGD yếu kém?","o":[["A","Cắt giảm thu nhập để làm đòn bẩy buộc nhân viên phải tự nỗ lực"],["B","Hỗ trợ, động viên lương thưởng ở mức tốt trước, tạo động lực tâm lý để họ tăng tốc bứt phá sau"],["C","Chỉ chi lương thưởng khi phòng giao dịch đã hoàn thành xuất sắc 100% kế hoạch năm"],["D","Tách riêng phòng giao dịch yếu kém ra khỏi cơ chế tính lương của chi nhánh"]],"a":["B"],"e":"Căn cứ bài giảng đối thoại (Passage 66): Gợi ý đối với phòng giao dịch sáp nhập yếu kém (Dĩ An nhập vào Nam Bình Dương) là cho cơ chế lương động viên đi trước để tạo động lực bứt phá."},{"i":735,"s":"quan-ly-dieu-hanh-cn","q":"Đâu là ba cột trụ cốt lõi trong mục tiêu chiến lược phát triển đến năm 2030 của BIDV?","o":[["A","Nhanh - Nhạy - Nhẹ"],["B","Lớn - Mạnh - Xanh"],["C","Rộng - Sâu - Bền"],["D","Đổi mới - Sáng tạo - Số hóa"]],"a":["B"],"e":"Căn cứ bài giảng đối thoại (Passage 74): Mục tiêu chiến lược phát triển đến năm 2030 của BIDV gồm ba chữ cột trụ: Lớn, Mạnh, Xanh."},{"i":736,"s":"quan-ly-dieu-hanh-cn","q":"Nghệ thuật ứng xử với nhân sự có tư duy hay 'bàn lùi' được khuyên áp dụng tại chi nhánh là gì?","o":[["A","Lắng nghe, tôn trọng và cho họ thử thực hiện theo ý họ để họ tự va vấp và tự thức tỉnh cái sai"],["B","Ngăn chặn mọi ý kiến trái chiều để đảm bảo kỷ luật tập thể tối đa"],["C","Yêu cầu viết giải trình chi tiết bằng văn bản về lý do bàn lùi"],["D","Luân chuyển ngay sang bộ phận không tham gia lập kế hoạch"]],"a":["A"],"e":"Căn cứ bài giảng đối thoại (Passage 101-102): Phương pháp ứng xử là lắng nghe, cho làm thử để họ tự vấp ngã và nhận diện đúng sai của ý kiến bàn lùi."},{"i":737,"s":"quan-ly-dieu-hanh-cn","q":"Vì sao người đứng đầu khuyên không nên xử lý thô bạo hay cắt giảm quyền lợi đối với nhóm nhân sự cựu trào lớn tuổi đã hết động lực?","o":[["A","Vì họ đóng đóng vai trò kiểm soát rủi ro pháp lý cao nhất"],["B","Vì xử lý thô bạo một người lớn tuổi sẽ làm mất đi lòng tin cống hiến của hàng trăm nhân sự trẻ đang nhìn vào"],["C","Vì họ có năng suất lao động cao nhất chi nhánh"],["D","Vì chi nhánh cần duy trì nguyên vẹn cơ cấu nhân sự cũ"]],"a":["B"],"e":"Căn cứ bài giảng đối thoại (Passage 109): Người đứng đầu khuyên bảo vệ, tôn trọng người lớn tuổi vì: 'Hy sinh một người nhưng mất đi trăm người... người trẻ nhìn vào họ nghĩ già rồi mình cũng thế thôi'."},{"i":738,"s":"quan-ly-dieu-hanh-cn","q":"Cam kết của hệ thống giúp giải tỏa áp lực tâm lý e ngại trách nhiệm pháp lý cho cán bộ tín dụng xử lý nợ xấu?","o":[["A","Toàn bộ hệ thống cam kết bảo vệ cán bộ nếu sai sót xảy ra vô tình, khách quan, vì lợi ích chung và không tư lợi"],["B","Đảm bảo cán bộ tín dụng không bao giờ phải chịu trách nhiệm trước pháp luật"],["C","Áp dụng quy trình cho vay không cần thẩm định tài sản bảo đảm"],["D","Miễn hoàn toàn trách nhiệm đối với các khoản nợ xấu phát sinh mới"]],"a":["A"],"e":"Căn cứ bài giảng đối thoại (Passage 28): Người đứng đầu cam kết: 'Nếu các em vô tình các em làm sai, không tư lợi làm cho tập thể thì không ai đứng ra xử cả... cả hệ thống bảo vệ'."},{"i":739,"s":"pcrt","q":"Theo Thông tư 27/2025, chức danh lãnh đạo cấp cao nhất chịu trách nhiệm về công tác phòng, chống rửa tiền tại BIDV là:","o":[["A","Tổng Giám đốc"],["B","Phó Tổng Giám đốc phụ trách khối Quản lý rủi ro"],["C","Giám đốc Ban Quản lý rủi ro hoạt động và thị trường"],["D","Trưởng Ban Kiểm toán nội bộ"]],"a":["B"],"e":"Theo quy định hướng dẫn thực thi Luật PCRT và Thông tư 27/2025 tại BIDV, Phó Tổng Giám đốc phụ trách khối Quản lý rủi ro là người chịu trách nhiệm cao nhất trước pháp luật và Hội đồng quản trị về công tác phòng chống rửa tiền, cấm vận và chống gian lận."},{"i":740,"s":"pcrt","q":"Theo quy định pháp luật Việt Nam hiện hành, giao dịch tiền mặt của một khách hàng có tổng trị giá từ bao nhiêu tiền trở lên trong một ngày phải thực hiện báo cáo giao dịch giá trị lớn (CTR)?","o":[["A","Từ 200 triệu đồng trở lên"],["B","Từ 300 triệu đồng trở lên"],["C","Từ 400 triệu đồng trở lên"],["D","Từ 500 triệu đồng trở lên"]],"a":["C"],"e":"Theo quy định của Luật PCRT và các văn bản hướng dẫn hiện hành (Quyết định 11/2023/QĐ-TTg), ngưỡng giá trị giao dịch bằng tiền mặt phải báo cáo là từ 400 triệu đồng trở lên trong một ngày đối với một khách hàng."},{"i":741,"s":"pcrt","q":"Theo quy định, giao dịch chuyển tiền điện tử trong nước có trị giá từ bao nhiêu tiền trở lên phải thực hiện báo cáo Ngân hàng Nhà nước?","o":[["A","Từ 300 triệu đồng trở lên"],["B","Từ 400 triệu đồng trở lên"],["C","Từ 500 triệu đồng trở lên"],["D","Từ 1 tỷ đồng trở lên"]],"a":["C"],"e":"Đối với giao dịch chuyển tiền điện tử trong nước, ngưỡng giá trị giao dịch phải thực hiện báo cáo Ngân hàng Nhà nước là từ 500 triệu đồng trở lên (hoặc tương đương bằng ngoại tệ) trong một ngày đối với một khách hàng."},{"i":742,"s":"pcrt","q":"Đối với giao dịch chuyển tiền quốc tế (đi hoặc đến), hạn mức giá trị giao dịch tối thiểu phải thực hiện báo cáo Ngân hàng Nhà nước hàng ngày là:","o":[["A","Từ 500 USD trở lên (hoặc tương đương)"],["B","Từ 1.000 USD trở lên (hoặc tương đương)"],["C","Từ 5.000 USD trở lên (hoặc tương đương)"],["D","Từ 10.000 USD trở lên (hoặc tương đương)"]],"a":["B"],"e":"Theo quy định về báo cáo chuyển tiền điện tử quốc tế tại BIDV và pháp luật hiện hành, các giao dịch chuyển tiền quốc tế từ 1.000 USD trở lên (hoặc tương đương) phải được báo cáo tự động hàng ngày."},{"i":743,"s":"pcrt","q":"Theo quy định của BIDV, tần suất cập nhật thông tin nhận biết khách hàng định kỳ đối với khách hàng được phân loại rủi ro CAO về rửa tiền là:","o":[["A","6 tháng một lần"],["B","1 năm một lần"],["C","2 năm một lần"],["D","3 năm một lần"]],"a":["B"],"e":"Tần suất cập nhật hồ sơ nhận biết khách hàng định kỳ được phân loại theo mức độ rủi ro: Khách hàng rủi ro cao: 1 năm/lần; khách hàng rủi ro trung bình: 3 năm/lần (hoặc 2 năm/lần theo slide cũ nhưng 3 năm/lần là cập nhật mới theo quy chế); khách hàng rủi ro thấp: 5 năm/lần."},{"i":744,"s":"pcrt","q":"Thời điểm rà soát, cập nhật hồ sơ nhận biết khách hàng định kỳ hàng năm tại các chi nhánh BIDV được thực hiện tập trung vào thời gian nào?","o":[["A","Tháng 12 hàng năm"],["B","Quý 1 hàng năm"],["C","Quý 4 hàng năm"],["D","Tháng 6 hàng năm"]],"a":["B"],"e":"Theo Quy chế của BIDV, thời điểm rà soát và cập nhật hồ sơ nhận biết khách hàng (KYC/CDD) định kỳ toàn hệ thống được quy định tập trung thực hiện vào Quý 1 hàng năm."},{"i":745,"s":"pcrt","q":"Theo quy tắc 50% trong tuân thủ cấm vận của các cơ quan quản lý nước ngoài (như OFAC), thực thể nào sau đây sẽ bị coi là đối tượng bị cấm vận?","o":[["A","Tổ chức được sở hữu từ 25% trở lên bởi cá nhân/tổ chức nằm trong danh sách cấm vận"],["B","Tổ chức được sở hữu từ 50% trở lên bởi cá nhân/tổ chức nằm trong danh sách cấm vận"],["C","Tổ chức được sở hữu trên 50% bởi cá nhân/tổ chức nằm trong danh sách cấm vận"],["D","Tổ chức có đối tác kinh doanh nằm trong danh sách cấm vận"]],"a":["B"],"e":"Quy tắc 50% của OFAC quy định: một tổ chức/thực thể pháp lý sẽ tự động bị cấm vận nếu bị sở hữu trực tiếp hoặc gián tiếp, riêng lẻ hoặc gộp nhóm, từ 50% vốn/cổ phần trở lên bởi một hoặc nhiều cá nhân/tổ chức thuộc danh sách đen."},{"i":746,"s":"pcrt","q":"Chương trình công nghệ thông tin nào tại BIDV hỗ trợ lọc tự động theo thời gian thực (real-time) các điện SWIFT đi và đến để quét với danh sách cấm vận?","o":[["A","Hệ thống SironKYC"],["B","Chương trình M3 (Chương trình lọc điện SWIFT trên AML-SWIFT-HUB)"],["C","Hệ thống Case Management"],["D","Hệ thống Core Banking Profile"]],"a":["B"],"e":"Chương trình M3 (hay Cẩm nang lọc điện Swift trên Chương trình AML-SWIFT-HUB) là giải pháp tự động, xử lý real-time để kiểm soát, ngăn chặn các điện SWIFT vi phạm chính sách cấm vận, cấm vận ngành trước khi điện được gửi đi hoặc xử lý đến."},{"i":747,"s":"pcrt","q":"Trong mảng công tác phòng chống gian lận, BIDV tự hào là ngân hàng đầu tiên được Ngân hàng Nhà nước lựa chọn thí điểm giải pháp nào?","o":[["A","Sử dụng camera AI nhận diện khuôn mặt tại quầy giao dịch"],["B","Sàng lọc tài khoản hưởng trong giao dịch chuyển tiền trong nước trên kênh IBFT với danh sách tài khoản nghi ngờ gian lận"],["C","Mở tài khoản thanh toán bằng định danh điện tử eKYC tích hợp chip CCCD"],["D","Tự động khóa thẻ ATM khi có dấu hiệu giao dịch bất thường ở nước ngoài"]],"a":["B"],"e":"BIDV là ngân hàng thương mại đầu tiên được Ngân hàng Nhà nước Việt Nam tin tưởng lựa chọn thí điểm giải pháp sàng lọc tài khoản thụ hưởng trong các giao dịch chuyển tiền nhanh trong nước (IBFT) thông qua danh sách đen các tài khoản nghi ngờ lừa đảo, gian lận."},{"i":748,"s":"pcrt","q":"Theo số liệu được báo cáo trong buổi chia sẻ, tổng giá trị tổn thất do lừa đảo, gian lận mà khách hàng khiếu nại tại BIDV lũy kế từ năm 2024 đến nay là khoảng bao nhiêu?","o":[["A","500 tỷ đồng"],["B","788 tỷ đồng"],["C","1.110 tỷ đồng"],["D","1.500 tỷ đồng"]],"a":["C"],"e":"Tổng tổn thất do gian lận lừa đảo từ phía khách hàng khiếu nại tại BIDV lũy kế từ năm 2024 đến nay là 1.110 tỷ đồng. Đây là con số rất lớn, cho thấy mức độ nghiêm trọng của tội phạm công nghệ cao."},{"i":749,"s":"pcrt","q":"Trong các hình thức lừa đảo gây tổn thất cho khách hàng BIDV, hình thức nào chiếm tỷ trọng lớn nhất với con số tổn thất lên tới 788 tỷ đồng?","o":[["A","Chiếm đoạt quyền kiểm soát tài khoản (ATO)"],["B","Lừa đảo giả mạo và thao túng tâm lý khách hàng"],["C","Làm giả hồ sơ, giấy tờ để vay vốn"],["D","Gian lận thẻ tín dụng quốc tế"]],"a":["B"],"e":"Hình thức lừa đảo giả mạo và thao túng tâm lý (Deepfake, giả danh cơ quan công an, viện kiểm sát, thông báo trúng thưởng...) gây tổn thất nặng nề nhất cho khách hàng tại BIDV với giá trị 788 tỷ đồng trong tổng số 1.110 tỷ đồng."},{"i":750,"s":"pcrt","q":"Theo quy định pháp luật Việt Nam hiện hành về PCRT, khi áp dụng biện pháp tạm thời 'trì hoãn giao dịch', thời hạn áp dụng tối đa là bao nhiêu ngày?","o":[["A","1 ngày làm việc"],["B","2 ngày làm việc"],["C","3 ngày làm việc"],["D","5 ngày làm việc"]],"a":["C"],"e":"Biện pháp trì hoãn giao dịch theo quy định của Luật PCRT chỉ được áp dụng tối đa trong vòng 3 ngày làm việc kể từ ngày thực hiện trì hoãn."},{"i":751,"s":"pcrt","q":"Khi thực hiện trì hoãn giao dịch, ngân hàng có trách nhiệm gửi báo cáo cho cơ quan nhà nước có thẩm quyền và Hội sở chính trong thời hạn tối đa bao nhiêu giờ?","o":[["A","12 giờ"],["B","24 giờ"],["C","48 giờ"],["D","72 giờ"]],"a":["B"],"e":"Ngay sau khi áp dụng biện pháp trì hoãn giao dịch, ngân hàng phải gửi báo cáo bằng văn bản hoặc điện tử cho cơ quan nhà nước có thẩm quyền và Hội sở chính trong vòng 24 giờ kể từ thời điểm áp dụng."},{"i":752,"s":"pcrt","q":"Quy trình cập nhật thông tin nhận biết khách hàng định kỳ tại các đơn vị BIDV gồm bao nhiêu bước?","o":[["A","4 bước"],["B","5 bước"],["C","6 bước"],["D","7 bước"]],"a":["C"],"e":"Quy trình cập nhật thông tin định kỳ gồm 6 bước chuẩn hóa: Bước 1: Xác định khách hàng cần cập nhật; Bước 2: Liên hệ thu thập thông tin; Bước 3: Xác minh thông tin; Bước 4: Tra cứu, quét lọc thông tin; Bước 5: Phê duyệt duy trì quan hệ; Bước 6: Lưu trữ thông tin trên hệ thống."},{"i":753,"s":"pcrt","q":"Theo Nghị quyết 66.23/2026/NQ-CP và Luật PCRT, 'Chủ sở hữu hưởng lợi' (CSHHL) đối với khách hàng tổ chức được xác định dựa trên tỷ lệ sở hữu vốn điều lệ hoặc cổ phần biểu quyết trực tiếp/gián tiếp tối thiểu là:","o":[["A","Từ 10% trở lên"],["B","Từ 20% trở lên"],["C","Từ 25% trở lên"],["D","Từ 50% trở lên"]],"a":["C"],"e":"Theo Nghị quyết 66.23/2026/NQ-CP hướng dẫn chi tiết thực hiện Luật PCRT, ngưỡng xác định Chủ sở hữu hưởng lợi của khách hàng tổ chức là cá nhân sở hữu từ 25% vốn điều lệ hoặc cổ phần biểu quyết trở lên."},{"i":754,"s":"pcrt","q":"Theo quy chế của BIDV, ngân hàng sẽ áp dụng biện pháp xử lý nghiêm khắc là từ chối thực hiện giao dịch tiếp theo nếu khách hàng có hành vi nào sau đây?","o":[["A","Có 1 giao dịch bị nghi ngờ gian lận"],["B","Có từ 5 giao dịch quá hạn bổ sung chứng từ cam kết"],["C","Không cập nhật email cá nhân sau khi thay đổi"],["D","Thực hiện rút tiền mặt tại phòng giao dịch khác tỉnh"]],"a":["B"],"e":"Nhằm thắt chặt quản lý rủi ro thanh toán quốc tế và tuân thủ cấm vận, BIDV quy định sẽ từ chối thực hiện giao dịch mới đối với các khách hàng có từ 5 giao dịch trở lên quá hạn bổ sung chứng từ gốc theo cam kết."},{"i":755,"s":"pcrt","q":"Trong mô hình 3 tuyến bảo vệ về PCRT tại BIDV, các chi nhánh, phòng giao dịch trực tiếp thiết lập quan hệ và xử lý giao dịch với khách hàng thuộc tuyến bảo vệ nào?","o":[["A","Tuyến bảo vệ thứ nhất (Tuyến 1)"],["B","Tuyến bảo vệ thứ hai (Tuyến 2)"],["C","Tuyến bảo vệ thứ ba (Tuyến 3)"],["D","Tuyến quản lý độc lập của Ngân hàng Nhà nước"]],"a":["A"],"e":"Tuyến 1 bao gồm các đơn vị kinh doanh, quản lý khách hàng, giao dịch, vận hành tại chi nhánh và TSC. Đây là tuyến quan trọng nhất, trực tiếp thực hiện hầu hết các khâu nhận biết, cập nhật, giám sát giao dịch và báo cáo đáng ngờ ban đầu."},{"i":756,"s":"pcrt","q":"Thời hạn lưu trữ tối thiểu đối với hồ sơ nhận biết khách hàng, chứng từ kế toán giao dịch liên quan đến công tác PCRT được quy định là bao nhiêu năm?","o":[["A","3 năm kể từ ngày phát sinh giao dịch"],["B","5 năm kể từ ngày kết thúc quan hệ khách hàng hoặc phát sinh giao dịch cuối cùng"],["C","10 năm kể từ ngày mở tài khoản"],["D","Lưu trữ vĩnh viễn"]],"a":["B"],"e":"Luật PCRT và quy chế nội bộ BIDV quy định hồ sơ nhận biết khách hàng, thông tin định danh và chứng từ giao dịch phải được lưu trữ tối thiểu 5 năm kể từ ngày khách hàng chấm dứt quan hệ kinh doanh hoặc kể từ ngày phát sinh giao dịch cuối cùng."},{"i":757,"s":"pcrt","q":"Trong bài tập tình huống thực tế về vụ án tham ô xảy ra tại chi nhánh Quảng Ninh, hành vi sai phạm nghiêm trọng nào của cán bộ BIDV đã dẫn đến hậu quả bị truy tố hình sự liên đới?","o":[["A","Cung cấp thông tin khách hàng cho bên thứ ba trái phép"],["B","Thực hiện bút toán khống rút/nộp tiền mặt mười mấy tỷ đồng và không thực hiện giám sát đặc biệt giao dịch lớn bất thường của kế toán trưởng"],["C","Mở tài khoản thanh toán cho đối tượng nằm trong danh sách đen cấm vận của Mỹ"],["D","Trì hoãn giao dịch chuyển tiền quá 3 ngày làm việc"]],"a":["B"],"e":"Trong vụ án tại Quảng Ninh, cán bộ BIDV đã vi phạm nghiêm trọng quy trình thu chi tiền mặt khi làm bút toán khống rút tiền mặt mười mươi tỷ và nộp lại tài khoản cá nhân của kế toán trưởng mà không có tiền mặt thực tế, đồng thời không áp dụng biện pháp giám sát đặc biệt khi phát hiện giao dịch lớn bất thường."},{"i":758,"s":"pcrt","q":"Tại sao trong tình huống thực tế giao dịch nhập khẩu đường trị giá 182.000 USD từ Campuchia, ngân hàng đại lý của Mỹ (Chase) lại phong tỏa giao dịch dù công ty thụ hưởng B không nằm trực tiếp trong danh sách đen?","o":[["A","Vì Campuchia là quốc gia bị Mỹ cấm vận toàn diện và triệt để về thương mại"],["B","Vì Chủ tịch và Tổng giám đốc của công ty B là vợ và con rể của Ly Yong Phat - cá nhân nằm trong danh sách cấm vận của OFAC"],["C","Vì BIDV Quảng Ninh chưa đăng ký mã số thuế quốc tế cho công ty nhập khẩu Việt Nam"],["D","Vì mặt hàng đường kính nguyện thuộc danh mục vũ khí hủy diệt hàng loạt"]],"a":["B"],"e":"Ngân hàng đại lý Chase áp dụng nguyên tắc thận trọng tối đa của Mỹ ('giết nhầm còn hơn bỏ sót'). Dù công ty B không nằm trực tiếp trong danh sách đen và tỷ lệ sở hữu của cá nhân bị cấm vận (Ly Yong Phat) là 0%, nhưng việc Chủ tịch (vợ) và Tổng giám đốc (con rể) nắm giữ 100% cổ phần thể hiện mối liên hệ gia đình và lợi ích trực tiếp liên đới với cá nhân bị cấm vận."},{"i":759,"s":"kiem-tra-giam-sat","q":"Theo Nghị quyết 534/NQ-HĐQT, bản chất của Văn hóa kiểm soát rủi ro (VHKSRR) tại BIDV được định nghĩa là gì?","o":[["A","Sự tuân thủ tuyệt đối các quy trình nghiệp vụ và quy định nội bộ."],["B","Sự đúng đắn trong Nhận thức - Thái độ - Hành vi đối với rủi ro."],["C","Việc triệt tiêu hoàn toàn mọi rủi ro có thể phát sinh trong hoạt động."],["D","Việc phân giao toàn bộ trách nhiệm kiểm soát rủi ro cho tuyến phòng thủ thứ ba."]],"a":["B"],"e":"Được quy định rõ tại Slide VHKSRR (Phần III) và bài giảng của ông Ngô Văn Dũng: VHKSRR là sự đúng đắn trong Nhận thức - Thái độ - Hành vi đối với rủi ro."},{"i":760,"s":"kiem-tra-giam-sat","q":"Theo thông lệ quốc tế (Nguyên tắc 3 Basel D328) và Luật các TCTD, ngân hàng thương mại quy mô lớn bắt buộc phải thành lập tối thiểu các ủy ban trực thuộc HĐQT nào?","o":[["A","Ủy ban Quản lý rủi ro và Ủy ban Công nghệ thông tin."],["B","Ủy ban Nhân sự và Ủy ban Chiến lược & Tổ chức."],["C","Ủy ban Nhân sự và Ủy ban Quản lý rủi ro."],["D","Ủy ban Quản lý rủi ro và Ủy ban Hợp tác chiến lược."]],"a":["C"],"e":"Theo Nguyên tắc 3 Basel và Thông tư 13/83, ngân hàng bắt buộc phải thành lập tối thiểu hai Ủy ban trực thuộc HĐQT là Ủy ban Nhân sự và Ủy ban Quản lý rủi ro."},{"i":761,"s":"kiem-tra-giam-sat","q":"Ủy ban Quản lý rủi ro tại BIDV được thành lập lần đầu tiên vào thời gian nào?","o":[["A","Tháng 05/2012, theo Thông tư 40/TT-NHNN."],["B","Tháng 12/2018, theo Thông tư 13/2018/TT-NHNN."],["C","Tháng 07/2020, theo Nghị quyết 534/NQ-HĐQT."],["D","Tháng 04/2026, theo Nghị quyết 345/NQ-BIDV."]],"a":["A"],"e":"Theo Slide VHKSRR (Phần II - 2.2), Ủy ban QLRR tại BIDV được thành lập khá sớm từ tháng 05/2012 theo quy định của Thông tư 40."},{"i":762,"s":"kiem-tra-giam-sat","q":"Cơ cấu tổ chức hiện tại của Ủy ban Quản lý rủi ro tại BIDV gồm bao nhiêu thành viên?","o":[["A","11 thành viên, bao gồm 1 thành viên độc lập."],["B","13 thành viên, bao gồm Chủ tịch Ủy ban, 1 Phó Chủ tịch từ cổ đông chiến lược Hana Bank và các thành viên khác."],["C","15 thành viên, bao gồm đầy đủ Ban điều hành và HĐQT."],["D","9 thành viên, bao gồm các Giám đốc Ban quản lý rủi ro."]],"a":["B"],"e":"Theo Slide VHKSRR (Phần II - 2.2), Ủy ban QLRR BIDV hiện có 13 thành viên, ông Ngô Văn Dũng làm Chủ tịch Ủy ban và một Phó Chủ tịch đến từ Hana Bank."},{"i":763,"s":"kiem-tra-giam-sat","q":"Quan điểm định hướng nào sau đây KHÔNG thuộc quan điểm chỉ đạo của HĐQT BIDV về đảm bảo an toàn hệ thống?","o":[["A","Kinh doanh an toàn để phát triển bền vững và trường tồn."],["B","Không vì áp lực kinh doanh mà đánh đổi phiêu lưu mạo hiểm."],["C","Chỉ làm những gì pháp luật cho phép."],["D","Triệt tiêu hoàn toàn mọi rủi ro bằng cách ngừng cung cấp các sản phẩm có tính biến động cao."]],"a":["D"],"e":"HĐQT BIDV thừa nhận kinh doanh ngân hàng là kinh doanh rủi ro, không thể triệt tiêu hoàn toàn mà mục tiêu là chủ động kiểm soát trong mức khẩu vị cho phép (Slide VHKSRR 1.4)."},{"i":764,"s":"kiem-tra-giam-sat","q":"Trong 8 giá trị cốt lõi của VHKSRR theo Nghị quyết 534, giá trị cốt lõi số 1 đặt nền móng cho mọi hành vi tuân thủ là gì?","o":[["A","Chủ động nhận diện – Làm chủ rủi ro."],["B","Thượng tôn pháp luật – Tuân thủ quy định."],["C","Suy nghĩ tích cực – Hành động trách nhiệm."],["D","Minh bạch hoạt động – Giải trình trung thực."]],"a":["B"],"e":"Giá trị cốt lõi số 1 của VHKSRR theo Nghị quyết 534 là 'Thượng tôn pháp luật – Tuân thủ quy định' (Slide VHKSRR 3.4)."},{"i":765,"s":"kiem-tra-giam-sat","q":"Trong 5 nguyên tắc thực hành VHKSRR theo Nghị quyết 534, nguyên tắc nào được xác định là quyết định thành bại của chương trình?","o":[["A","Lan tỏa thẩm thấu."],["B","Toàn diện đa chiều."],["C","Lãnh đạo nêu gương."],["D","Ghi nhận, tôn vinh."]],"a":["C"],"e":"Nguyên tắc thực hành số 1 và là nguyên tắc quyết định thành bại của VHKSRR là 'Lãnh đạo nêu gương'. Bài viết của học viên Nguyễn Hiếu Trường Giang và slide bài giảng đều khẳng định điều này."},{"i":766,"s":"kiem-tra-giam-sat","q":"Chỉ số lợi nhuận hợp nhất của BIDV đã đạt mức tăng trưởng ấn tượng như thế nào từ khi triển khai Nghị quyết 534 (năm 2020) đến năm 2024?","o":[["A","Tăng từ 9.017 tỷ đồng năm 2020 lên 31.000 tỷ đồng năm 2024."],["B","Tăng từ 12.500 tỷ đồng năm 2020 lên 25.000 tỷ đồng năm 2024."],["C","Tăng từ 5.000 tỷ đồng năm 2020 lên 18.000 tỷ đồng năm 2024."],["D","Tăng từ 9.017 tỷ đồng năm 2020 lên 50.000 tỷ đồng năm 2024."]],"a":["A"],"e":"Theo Slide VHKSRR (Kết quả triển khai 2020-2025), lợi nhuận hợp nhất BIDV tăng trưởng vượt bậc từ 9.017 tỷ đồng (2020) lên 31.000 tỷ đồng (2024)."},{"i":767,"s":"kiem-tra-giam-sat","q":"Ông Ngô Văn Dũng đã chia sẻ con số thực tế về nợ ngoại bảng và lãi treo của BIDV (phản ánh gánh nặng lịch sử cần giải quyết) là bao nhiêu?","o":[["A","Nợ ngoại bảng khoảng 14.600 tỷ đồng và lãi treo khoảng 14.600 tỷ đồng."],["B","Nợ ngoại bảng khoảng 146.000 tỷ đồng và lãi treo khoảng 146.000 tỷ đồng."],["C","Nợ ngoại bảng khoảng 70.000 tỷ đồng và lãi treo khoảng 12.000 tỷ đồng."],["D","Nợ ngoại bảng khoảng 300.000 tỷ đồng và lãi treo khoảng 100.000 tỷ đồng."]],"a":["B"],"e":"Trong file ghi âm thảo luận VHKSRR, ông Ngô Văn Dũng thẳng thắn chỉ ra con số nợ ngoại bảng của BIDV là 146.000 tỷ đồng và lãi treo tương ứng cũng là 146.000 tỷ đồng."},{"i":768,"s":"kiem-tra-giam-sat","q":"Theo Chiến lược phát triển đến năm 2030 (Nghị quyết 345/NQ-BIDV), mục tiêu kiểm soát tỷ lệ nợ xấu toàn hàng là bao nhiêu?","o":[["A","Dưới 1.6% cho tất cả các năm."],["B","Dưới 1.4% vào năm 2028 và dưới 1.2% vào năm 2029."],["C","Giảm dần qua các năm và đạt mức dưới 1.0% vào năm 2030."],["D","Duy trì ổn định ở mức dưới 1.5% đến năm 2030."]],"a":["C"],"e":"Chiến lược phát triển 2026-2030 (Nghị quyết 345) đặt mục tiêu kiểm soát nợ xấu toàn hàng giảm dần: năm 2026-2027 <1.6%, năm 2028 <1.4%, năm 2029 <1.2% và đến năm 2030 đạt dưới 1%."},{"i":769,"s":"kiem-tra-giam-sat","q":"Mục tiêu chất lượng tín dụng đối với Khối Bán buôn theo Chiến lược Khối KHDN đến năm 2030 đặt ra các chỉ số cụ thể nào?","o":[["A","Tỷ lệ nợ xấu bán buôn <= 1.2% và Tỷ lệ nợ nhóm 2 <= 1.5%."],["B","Tỷ lệ nợ xấu bán buôn <= 1.5% và Tỷ lệ nợ nhóm 2 <= 1.8%."],["C","Tỷ lệ nợ xấu bán buôn <= 1.0% và Tỷ lệ nợ nhóm 2 <= 1.2%."],["D","Tỷ lệ nợ xấu bán buôn <= 1.6% và Tỷ lệ nợ nhóm 2 <= 1.5%."]],"a":["A"],"e":"Chi tiết tại Slide VHKSRR (mục 2.3 Khối Bán buôn), chỉ tiêu năm 2030 yêu cầu tỷ lệ nợ xấu BB <= 1.2%, nợ nhóm 2 <= 1.5%, chi phí dự phòng rủi ro là 26.300 tỷ đồng."},{"i":770,"s":"kiem-tra-giam-sat","q":"Trong hệ thống kiểm soát nội bộ của ngân hàng thương mại, bộ phận tuân thủ và bộ phận quản lý rủi ro thuộc tuyến bảo vệ thứ mấy?","o":[["A","Tuyến thứ nhất (Front Office)."],["B","Tuyến thứ hai (Second Line)."],["C","Tuyến thứ ba (Third Line - Kiểm toán nội bộ)."],["D","Tuyến giám sát độc lập của Ban kiểm soát."]],"a":["B"],"e":"Tuyến thứ hai gồm bộ phận tuân thủ và bộ phận quản lý rủi ro, chịu trách nhiệm xây dựng chính sách, đo lường và theo dõi rủi ro toàn ngân hàng."},{"i":771,"s":"kiem-tra-giam-sat","q":"Bài học pháp lý đắt giá nhất đối với BIDV từ vụ án cháy nhà máy sắn của chi nhánh Lam Sada (thua sơ thẩm bồi thường 120 tỷ) là gì?","o":[["A","Ngân hàng không được giữ chìa khóa kho của khách hàng trong mọi trường hợp."],["B","Hợp đồng mẫu do ngân hàng soạn thảo, nếu có điều khoản không rõ ràng hoặc gây tranh cãi, thẩm phán sẽ giải thích theo hướng bất lợi cho ngân hàng (bên ra mẫu)."],["C","Bắt buộc phải thuê đơn vị bảo vệ chuyên nghiệp để trông coi tài sản cầm cố."],["D","Hợp đồng thế chấp hàng hóa luân chuyển bắt buộc phải được công chứng, chứng thực."]],"a":["B"],"e":"Bộ luật Dân sự quy định nguyên tắc giải thích hợp đồng mẫu: điều khoản không rõ ràng sẽ được giải thích theo hướng có lợi cho bên chấp nhận mẫu (khách hàng), bất lợi cho bên đưa ra mẫu (ngân hàng). Đây là bài học xương máu được chị Ngô Phương nhấn mạnh."},{"i":772,"s":"kiem-tra-giam-sat","q":"Tranh cãi kéo dài 9 năm (và 5.5 năm tạm giam cán bộ) trong vụ án Giám đốc Hùng (Tây Sài Gòn) xoay quanh điểm nghẽn pháp lý cốt lõi nào?","o":[["A","Do chưa xác định được thiệt hại tài chính thực tế của ngân hàng."],["B","Do không thể kết tội vi phạm quy định cho vay (vì hành vi xảy ra ở khâu xử lý tài sản bảo đảm sau cho vay) và không thể kết tội gây thất thoát lãng phí tài sản nhà nước (vì tài sản bảo đảm vẫn thuộc quyền sở hữu của người vay)."],["C","Do cán bộ ngân hàng chứng minh được mình hoàn toàn không có lỗi vô ý."],["D","Do khách hàng vay vốn đã hoàn thành nghĩa vụ trả nợ thay thế."]],"a":["B"],"e":"Điểm nghẽn pháp lý lớn nhất là việc định danh tội danh: hành vi bán tài sản bảo đảm dưới giá thị trường không qua hội đồng của hai cán bộ này không thuộc hoạt động cho vay, và tài sản bảo đảm cũng không phải tài sản nhà nước, gây tranh cãi lớn giữa Viện kiểm sát, Tòa án và Cơ quan điều tra."},{"i":773,"s":"kiem-tra-giam-sat","q":"Theo khảo sát cán bộ nhân viên năm 2023, khó khăn lớn nhất ảnh hưởng trực tiếp đến việc thực hành và vận dụng VHKSRR tại cơ sở là gì?","o":[["A","Áp lực từ các chỉ tiêu kinh doanh và kế hoạch tăng trưởng ngắn hạn (chiếm 27% phản hồi)."],["B","Sự thiếu hụt cẩm nang hướng dẫn và công cụ tra cứu quy định."],["C","Trình độ công nghệ thông tin và AI của ngân hàng chưa đáp ứng yêu cầu."],["D","Sự lỏng lẻo trong quy trình luân chuyển cán bộ làm công tác tín dụng."]],"a":["A"],"e":"Theo tài liệu Slide VHKSRR (Phần 3 - Tồn tại hạn chế), 27% CBNV khảo sát cho biết áp lực kinh doanh ngắn hạn khiến họ phải thỏa hiệp hoặc gặp khó khăn khi thực hành nguyên tắc VHKSRR."},{"i":774,"s":"kiem-tra-giam-sat","q":"Nghị quyết số 66/NQ-CP về đổi mới xây dựng và thi hành pháp luật đặt ra mục tiêu đưa hệ thống pháp luật Việt Nam lọt vào nhóm dẫn đầu ASEAN vào mốc thời gian nào?","o":[["A","Năm 2026."],["B","Năm 2028 (nằm trong top 3 quốc gia có hệ thống pháp luật tiên tiến nhất ASEAN)."],["C","Năm 2030."],["D","Năm 2045."]],"a":["B"],"e":"Mục tiêu của Nghị quyết 66 là đưa hệ thống pháp luật Việt Nam lọt vào nhóm 3 quốc gia dẫn đầu ASEAN về tính tiên tiến, hiện đại vào năm 2028 (Slide Pháp luật vĩ mô)."},{"i":775,"s":"kiem-tra-giam-sat","q":"Hệ thống pháp luật Việt Nam hiện tại thừa nhận những nguồn bổ trợ không thành văn nào khi các văn bản quy phạm pháp luật chưa có quy định điều chỉnh?","o":[["A","Hiến pháp, Nghị quyết của Đảng và Thỏa ước lao động."],["B","Án lệ, Tập quán pháp và Lẽ công bằng."],["C","Tập quán địa phương, Quyết định hành chính và Luật tục."],["D","Hương ước, Lệ làng và Điều lệ doanh nghiệp."]],"a":["B"],"e":"Bên cạnh luật thành văn, Bộ luật Dân sự thừa nhận 3 nguồn bổ trợ chính thức là Án lệ, Tập quán (quốc tế và địa phương) và Lẽ công bằng."},{"i":776,"s":"kiem-tra-giam-sat","q":"Năm bộ luật nền tảng tạo nên cấu trúc hệ thống pháp luật Việt Nam (theo Đề án hoàn thiện cấu trúc pháp luật) bao gồm?","o":[["A","Bộ luật Dân sự, Hình sự, Tố tụng Dân sự, Tố tụng Hình sự và Luật Hành chính."],["B","Luật Doanh nghiệp, Luật Đầu tư, Luật Chứng khoán, Luật TCTD và Luật Đất đai."],["C","Bộ luật Lao động, Luật Thương mại, Luật Thuế, Luật Ngân hàng và Luật Hải quan."],["D","Bộ luật Dân sự, Bộ luật Hình sự, Luật Đất đai, Luật Nhà ở và Luật Doanh nghiệp."]],"a":["A"],"e":"Năm bộ luật cốt lõi tạo nền tảng cấu trúc pháp luật bao gồm: BL Dân sự, BL Hình sự, BL Tố tụng Dân sự, BL Tố tụng Hình sự và Luật Hành chính (Slide Pháp luật vĩ mô - phần Chị Ngô Phương)."},{"i":777,"s":"kiem-tra-giam-sat","q":"Đặc điểm bất cập nghiêm trọng nhất trong môi trường VHKSRR tại các chi nhánh có tỷ lệ nợ xấu cao theo khảo sát năm 2024 là gì?","o":[["A","Cán bộ không được đào tạo về quy trình cấp tín dụng."],["B","Gần 1/3 số cán bộ tham gia khảo sát chưa sẵn sàng chia sẻ thông tin hoặc thảo luận khi phát hiện dấu hiệu rủi ro tại đơn vị."],["C","100% hồ sơ tín dụng tại các đơn vị này đều có sai phạm cố ý."],["D","Các chi nhánh này hoàn toàn không triển khai bất kỳ hoạt động truyền thông nào."]],"a":["B"],"e":"Slide VHKSRR chỉ ra rằng tại các chi nhánh có nợ xấu cao, môi trường phản ánh rủi ro bị nghẽn: Gần 1/3 số cán bộ không sẵn sàng lên tiếng hoặc chia sẻ khi phát hiện rủi ro do e ngại hoặc thiếu cơ chế bảo vệ."},{"i":778,"s":"kiem-tra-giam-sat","q":"Chuyển dịch cốt lõi trong định hướng triển khai VHKSRR giai đoạn 2026 - 2030 của HĐQT BIDV (theo Nghị quyết 846/NQ-HĐQT) là gì?","o":[["A","Từ tiếp cận 'tuân thủ hình thức' sang 'quản trị hành vi rủi ro'."],["B","Từ quản trị định tính sang quản trị hoàn toàn bằng công cụ AI."],["C","Từ xử lý trách nhiệm cá nhân sang nâng cao quỹ lương để bù đắp rủi ro."],["D","Tập trung tối đa vào việc cắt giảm mạng lưới chi nhánh vật lý."]],"a":["A"],"e":"Nghị quyết 846 định hướng giai đoạn 2026-2030 là chuyển dịch từ tiếp cận 'tuân thủ hình thức' (chỉ hoàn thiện hồ sơ đối phó) sang 'quản trị hành vi rủi ro' thực chất (Slide VHKSRR 22)."},{"i":779,"s":"kinh-nghiem-dieu-hanh","q":"Theo bà Trần Anh Thư, kẻ thù lớn nhất của sự phát triển đối với người lãnh đạo là gì?","o":[["A","Biến động địa chính trị bên ngoài"],["B","Sự bùng nổ của trí tuệ nhân tạo (AI)"],["C","Tư duy cứng nhắc và không chịu thay đổi"],["D","Quy trình nghiệp vụ rườm rà"]],"a":["C"],"e":"Tài liệu khẳng định kẻ thù lớn nhất của sự phát triển là tư duy cứng nhắc của người lãnh đạo, điều nguy hiểm nhất là môi trường đã biến đổi sâu sắc nhưng người đứng đầu vẫn không thay đổi."},{"i":780,"s":"kinh-nghiem-dieu-hanh","q":"Bộ năng lực thực thi (Mã Gen Lãnh đạo mới) được giới thiệu gồm bao nhiêu tố chất cốt lõi?","o":[["A","4 tố chất"],["B","5 tố chất"],["C","6 tố chất"],["D","7 tố chất"]],"a":["C"],"e":"Bộ năng lực thực thi của chân dung lãnh đạo mới gồm 6 tố chất: 1. Bản lĩnh, 2. Trí tuệ học hỏi, 3. Quyết đoán, 4. Dẫn dắt thay đổi, 5. Phát triển con người, 6. Kiến tạo giá trị."},{"i":781,"s":"kinh-nghiem-dieu-hanh","q":"Theo 'quy tắc lãi kép năng lực 1% mỗi ngày' được đề cập trong tài liệu, sau 1 năm năng lực sẽ giỏi hơn bao nhiêu lần?","o":[["A","Giỏi hơn 3 lần"],["B","Giỏi hơn 5 lần"],["C","Giỏi hơn 7 lần"],["D","Giỏi hơn 10 lần"]],"a":["C"],"e":"Tố chất thứ 2 'Trí tuệ học hỏi' chỉ rõ áp dụng quy tắc lãi kép năng lực 1% mỗi ngày thì sau 1 năm, người học sẽ giỏi hơn gấp 7 lần."},{"i":782,"s":"kinh-nghiem-dieu-hanh","q":"Theo tài liệu, giá trị của một người lãnh đạo trong kỷ nguyên mới được đo bằng thước đo nào?","o":[["A","Tổng số năm kinh nghiệm tích lũy tại ngân hàng"],["B","Số lượng dự án công nghệ đã triển khai thành công"],["C","Sự thành công của những người (đội ngũ kế cận) mà họ tạo ra"],["D","Quy mô tổng tài sản và dư nợ của chi nhánh đang quản lý"]],"a":["C"],"e":"Ở tố chất thứ 5 'Phát triển con người', tài liệu khẳng định giá trị lãnh đạo được đo bằng sự thành công của những người họ tạo ra."},{"i":783,"s":"kinh-nghiem-dieu-hanh","q":"Điểm khác biệt cốt lõi trong tư duy mới về nhân sự so với tư duy cũ là gì?","o":[["A","Sử dụng các cơ chế cơ học để giữ chân nhân sự bằng mọi giá"],["B","Khởi tạo môi trường phát triển để nhân tài khao khát được ở lại và cống hiến"],["C","Tăng lương và thăng chức định kỳ để cạnh tranh với thị trường"],["D","Siết chặt kỷ luật lao động và quy trình chấm công hàng ngày"]],"a":["B"],"e":"Tư duy cũ là tìm mọi cách và cơ chế cơ học để giữ người. Tư duy mới là khởi tạo môi trường phát triển để nhân tài tự nguyện và khao khát ở lại cống hiến."},{"i":784,"s":"kinh-nghiem-dieu-hanh","q":"Trong mô phỏng tương lai về Ngân hàng Bán lẻ 2036, tỷ lệ thời gian cán bộ tín dụng dành cho việc xây dựng quan hệ và chiến lược tài chính là bao nhiêu?","o":[["A","30% thời gian"],["B","50% thời gian"],["C","70% thời gian"],["D","90% thời gian"]],"a":["C"],"e":"Năm 2036, cán bộ bán lẻ sẽ dành 70% thời gian xây dựng quan hệ và chiến lược tài chính, đóng vai trò là 'Cố vấn tài chính trọn đời'."},{"i":785,"s":"kinh-nghiem-dieu-hanh","q":"Trong bối cảnh hiện tại năm 2026, cán bộ tín dụng bán lẻ đang dành bao nhiêu phần trăm thời gian cho thủ tục hành chính và xử lý hồ sơ giấy tờ?","o":[["A","30% thời gian"],["B","50% thời gian"],["C","70% thời gian"],["D","90% thời gian"]],"a":["C"],"e":"Năm 2026, thực trạng của cán bộ bán lẻ là dành tới 70% thời gian cho thủ tục hành chính và xử lý hồ sơ giấy tờ, chỉ dành 30% tư vấn thực tế."},{"i":786,"s":"kinh-nghiem-dieu-hanh","q":"Quyền năng của Trí tuệ Nhân tạo vào năm 2036 giúp hoàn thành việc lập hồ sơ tín dụng bán lẻ trong thời gian bao lâu?","o":[["A","Chỉ trong 30 giây"],["B","Chỉ trong 5 phút"],["C","Chỉ trong 15 phút"],["D","Chỉ trong 30 phút"]],"a":["A"],"e":"Tài liệu dự báo năm 2036 việc lập hồ sơ chỉ mất 30 giây nhờ AI tự động đồng bộ hóa thông tin từ dữ liệu quốc gia (VNeID, Thuế, bảo hiểm, Open Finance)."},{"i":787,"s":"kinh-nghiem-dieu-hanh","q":"Năm 2036, AI dự kiến sẽ xử lý tự động bao nhiêu phần trăm hồ sơ tín dụng bán lẻ đã được chuẩn hóa nếu nằm trong khẩu vị rủi ro?","o":[["A","Từ 50% đến 60%"],["B","Từ 70% đến 80%"],["C","Từ 80% đến 90%"],["D","Từ 95% đến 100%"]],"a":["C"],"e":"Năm 2036, 80-90% hồ sơ chuẩn hóa (thẻ, thấu chi, mua xe/nhà) được AI xử lý tự động hoàn toàn nếu nằm trong khẩu vị rủi ro xác định."},{"i":788,"s":"kinh-nghiem-dieu-hanh","q":"Trong bối cảnh công nghệ năm 2036, vai trò của người lãnh đạo ngân hàng được tái định nghĩa là quản lý tổ hợp hệ sinh thái nào?","o":[["A","Máy chủ, mạng nội bộ và các cơ sở dữ liệu số hóa"],["B","Con người + AI + Thuật toán + Đạo đức dữ liệu"],["C","Các đối tác liên kết bán chéo và cộng tác viên bên ngoài"],["D","Cán bộ tín dụng bán lẻ và đội ngũ hỗ trợ tác nghiệp"]],"a":["B"],"e":"Tài liệu chỉ rõ vai trò lãnh đạo năm 2036 sẽ chuyển dịch sang quản lý một tổ hợp hệ sinh thái phức tạp gồm: Con người + AI + Thuật toán + Đạo đức dữ liệu."},{"i":789,"s":"kinh-nghiem-dieu-hanh","q":"Đâu là một trong 3 'điểm vàng cơ hội' giúp BIDV bứt phá trong phát triển Ngân hàng Xanh?","o":[["A","Được Quỹ Khí hậu Xanh (GCF) công nhận đầu tiên tại Việt Nam"],["B","Được ưu tiên phát hành trái phiếu xanh miễn thuế quốc tế"],["C","Được bao tiêu 100% sản lượng tín chỉ carbon tại miền Bắc Việt Nam"],["D","Được chính phủ cấp vốn mồi không hoàn lại trị giá 1 tỷ USD"]],"a":["A"],"e":"Cơ hội vàng thứ nhất của BIDV là được GCF công nhận đầu tiên, giúp mở ra khả năng tiếp cận và giải ngân các nguồn vốn khí hậu quốc tế giá rẻ."},{"i":790,"s":"kinh-nghiem-dieu-hanh","q":"BIDV được chỉ định là ngân hàng thanh toán duy nhất cho Sàn giao dịch carbon của Việt Nam trong thời gian bao lâu?","o":[["A","Trong 1 năm đầu"],["B","Trong 3 năm đầu"],["C","Trong 5 năm đầu"],["D","Trong suốt toàn bộ thời gian vận hành sàn"]],"a":["B"],"e":"Tài liệu ghi nhận BIDV có lợi thế là ngân hàng thanh toán duy nhất của Sàn giao dịch carbon Việt Nam trong vòng 3 năm đầu tiên."},{"i":791,"s":"kinh-nghiem-dieu-hanh","q":"Khái niệm 'MAV' (hay MRV) trong phát triển Ngân hàng Xanh viết tắt của những từ tiếng Anh nào?","o":[["A","Management, Reporting, Valuation"],["B","Measurement, Reporting, Verification"],["C","Market, Regulation, Validation"],["D","Mitigation, Recovery, Verification"]],"a":["B"],"e":"MAV (hoặc MRV) viết tắt của Measurement (Đo lường), Reporting (Báo cáo) và Verification (Xác thực/Cấp chứng chỉ xanh)."},{"i":792,"s":"kinh-nghiem-dieu-hanh","q":"Năm 2021, tổ chức nào đã mua gói tín chỉ carbon của Chính phủ Việt Nam trị giá khoảng 40 triệu USD cho vùng miền núi phía Bắc?","o":[["A","Quỹ Tiền tệ Quốc tế (IMF)"],["B","Ngân hàng Phát triển Châu Á (ADB)"],["C","Ngân hàng Thế giới (World Bank)"],["D","Quỹ Khí hậu Xanh (GCF)"]],"a":["C"],"e":"Bà Trần Anh Thư chia sẻ vào năm 2021, World Bank đã mua gói tín chỉ carbon của Việt Nam trị giá khoảng 40 triệu USD và phân bổ phần lớn cho miền núi phía Bắc."},{"i":793,"s":"kinh-nghiem-dieu-hanh","q":"Trong vòng 10 năm (2016-2026), cấu trúc nghiệp vụ tại Chi nhánh Sở Giao dịch 3 đã mở rộng bao nhiêu phần trăm và tăng thêm mấy phòng chuyên biệt?","o":[["A","Mở rộng 20%, tăng thêm 4 phòng chuyên biệt"],["B","Mở rộng 35%, tăng thêm 6 phòng chuyên biệt"],["C","Mở rộng 50%, tăng thêm 8 phòng chuyên biệt"],["D","Mở rộng 15%, tăng thêm 2 phòng chuyên biệt"]],"a":["B"],"e":"Sở Giao dịch 3 đã tăng thêm 6 phòng nghiệp vụ chuyên biệt (từ 17 lên 23 phòng), tương ứng mở rộng 35% cấu trúc nghiệp vụ của chi nhánh."},{"i":794,"s":"kinh-nghiem-dieu-hanh","q":"Trong 10 năm (2016-2026), nhân sự tại Chi nhánh Sở Giao dịch 3 tăng bao nhiêu phần trăm để đáp ứng sự phát triển quy mô?","o":[["A","Tăng 2% (từ 179 lên 183 người)"],["B","Tăng 10% (từ 179 lên 197 người)"],["C","Tăng 20% (từ 179 lên 215 người)"],["D","Tăng 35% (tương ứng tốc độ mở rộng cấu trúc)"]],"a":["A"],"e":"Chi nhánh Sở Giao dịch 3 thực hiện chiến lược tinh gọn nhân sự triệt để, chỉ tăng đúng 4 người (2%, từ 179 lên 183 nhân sự) trong 10 năm."},{"i":795,"s":"kinh-nghiem-dieu-hanh","q":"Chỉ tiêu Lợi nhuận trước thuế (LNTT) của Chi nhánh Sở Giao dịch 3 đạt con số kỷ lục nào vào năm 2025?","o":[["A","628 tỷ VND"],["B","811 tỷ VND"],["C","1,022 tỷ VND"],["D","1,182 tỷ VND"]],"a":["D"],"e":"Theo biểu đồ chỉ tiêu hiệu quả tại Sở Giao dịch 3, LNTT năm 2025 đạt mức cao nhất lịch sử là 1,182 tỷ VND."},{"i":796,"s":"kinh-nghiem-dieu-hanh","q":"Chỉ tiêu hiệu quả LNTT/người tại Chi nhánh Sở Giao dịch 3 vào năm 2025 đạt bao nhiêu tỷ VND/người?","o":[["A","4.84 tỷ VND/người"],["B","5.95 tỷ VND/người"],["C","6.95 tỷ VND/người"],["D","4.65 tỷ VND/người"]],"a":["C"],"e":"Dữ liệu hiệu quả ghi nhận LNTT/người năm 2025 của Sở Giao dịch 3 đạt mức kỷ lục 6.95 tỷ VND/người."},{"i":797,"s":"kinh-nghiem-dieu-hanh","q":"Trong 6 tháng đầu năm 2026, chỉ tiêu Lợi nhuận trước thuế (LNTT) của Chi nhánh Sở Giao dịch 3 đạt bao nhiêu tỷ VND?","o":[["A","671.1 tỷ VND"],["B","811 tỷ VND"],["C","824.5 tỷ VND"],["D","1,022 tỷ VND"]],"a":["C"],"e":"Kết quả kinh doanh 6 tháng đầu năm 2026 của Sở Giao dịch 3 đạt LNTT rất ấn tượng là 824.5 tỷ VND."},{"i":798,"s":"kinh-nghiem-dieu-hanh","q":"Sửa đổi Luật nợ công được tiến hành từ năm 2025 và ban hành chính thức vào năm nào, mở ra cơ hội cho vay lại qua NHTM?","o":[["A","Năm 2025"],["B","Năm 2026"],["C","Năm 2027"],["D","Năm 2030"]],"a":["B"],"e":"Luật nợ công mới được sửa đổi năm 2025 và ban hành chính thức vào năm 2026, giúp mở rộng cơ hội cho vay lại qua các NHTM đủ điều kiện."},{"i":799,"s":"kinh-nghiem-dieu-hanh","q":"BIDV Chi nhánh Tây Hồ được chính thức thành lập vào năm nào trên cơ sở tách ra từ chi nhánh Hà Nội?","o":[["A","Năm 2005"],["B","Năm 2008"],["C","Năm 2012"],["D","Năm 2015"]],"a":["B"],"e":"BIDV Tây Hồ thành lập ngày 10/10/2008 trên cơ sở tách ra từ chi nhánh Hà Nội, thời điểm đầu gặp rất nhiều khó khăn về quy mô và nhân lực."},{"i":800,"s":"kinh-nghiem-dieu-hanh","q":"Ông Vũ Hoàng Dương về nhận nhiệm vụ Giám đốc tại BIDV Tây Hồ vào năm nào?","o":[["A","Năm 2008"],["B","Năm 2010"],["C","Năm 2012"],["D","Năm 2013"]],"a":["C"],"e":"Ông Vũ Hoàng Dương về nhận nhiệm vụ Giám đốc BIDV Tây Hồ vào năm 2012, đúng giai đoạn chi nhánh đang chịu nhiều áp lực và nợ xấu tồn đọng."},{"i":801,"s":"kinh-nghiem-dieu-hanh","q":"BIDV Tây Hồ là đơn vị đầu tiên trong hệ thống chủ động xây dựng và hoàn thành Đề án Tái cơ cấu toàn diện vào mốc thời gian nào?","o":[["A","Tháng 12/2013"],["B","Tháng 06/2015"],["C","Tháng 12/2015"],["D","Tháng 06/2018"]],"a":["B"],"e":"BIDV Tây Hồ hoàn thành xuất sắc Đề án Tái cơ cấu vào tháng 6/2015, trước thời hạn được Trụ sở chính giao 6 tháng."},{"i":802,"s":"kinh-nghiem-dieu-hanh","q":"Ba trụ cột kinh doanh mũi nhọn được BIDV Tây Hồ xác định tập trung phát triển từ năm 2018 là gì?","o":[["A","Tín dụng doanh nghiệp lớn, Ngân hàng bán lẻ, Chuyển tiền nhanh"],["B","Huy động vốn, Dịch vụ - Ngân hàng số, FDI"],["C","Tín dụng tiêu dùng, FDI, Kinh doanh ngoại hối"],["D","Huy động vốn, Thẻ tín dụng, Bancassurance"]],"a":["B"],"e":"Chi nhánh Tây Hồ chủ động, tiên phong xây dựng chiến lược phát triển theo mô hình ngân hàng hiện đại, kinh doanh ít vốn, tập trung vào 3 trụ cột: 'Huy động vốn - Dịch vụ, Ngân hàng số - FDI'."},{"i":803,"s":"kinh-nghiem-dieu-hanh","q":"Lợi nhuận trước thuế của BIDV Tây Hồ năm 2023 đạt mốc bao nhiêu, giúp chi nhánh ghi tên vào nhóm 21 chi nhánh Hạng Đặc biệt?","o":[["A","Đạt khoảng 500 tỷ đồng"],["B","Đạt khoảng 750 tỷ đồng"],["C","Đạt mốc 950 - 1.000 tỷ đồng"],["D","Cán mốc 2.000 tỷ đồng"]],"a":["C"],"e":"Đến năm 2023, lợi nhuận trước thuế của Tây Hồ đạt mốc 950-1.000 tỷ đồng (gấp 250 lần so với mức 4 tỷ đồng chênh lệch thu chi năm 2008), đưa chi nhánh trở thành đơn vị duy nhất đi lên từ tái cơ cấu lọt vào Top 21 chi nhánh đặc biệt."},{"i":804,"s":"kinh-nghiem-dieu-hanh","q":"Vào năm 2023, chỉ tiêu hiệu quả nào của BIDV Tây Hồ tự hào đứng thứ nhất toàn hệ thống?","o":[["A","Quy mô dư nợ tín dụng"],["B","Quy mô huy động vốn"],["C","Thu nhập ròng từ Ngân hàng số"],["D","Thu nhập ròng từ hoạt động FDI"]],"a":["C"],"e":"Năm 2023, thu nhập ròng từ Ngân hàng số của Tây Hồ đạt 120 tỷ đồng, đứng thứ 1 trong toàn hệ thống BIDV."},{"i":805,"s":"kinh-nghiem-dieu-hanh","q":"Trong các khách hàng lớn tại BIDV Tây Hồ, đơn vị nào có thời điểm số dư tiền gửi không kỳ hạn lên tới hơn 3.000 tỷ đồng kéo dài 6-7 năm?","o":[["A","Quỹ vắc-xin phòng chống Covid-19"],["B","Quỹ phòng chống tác hại thuốc lá (Bộ Y tế)"],["C","Quỹ hỗ trợ sắp xếp và đổi mới doanh nghiệp (Bộ Tài chính)"],["D","Dự án Cao tốc La Sơn - Túy Loan"]],"a":["B"],"e":"Quỹ phòng chống tác hại thuốc lá của Bộ Y tế gửi tại BIDV Tây Hồ có thời điểm cao nhất lên đến hơn 3.000 tỷ đồng không kỳ hạn và duy trì ổn định suốt 6-7 năm."},{"i":806,"s":"kinh-nghiem-dieu-hanh","q":"BIDV Tây Hồ đã thâm nhập và phát triển khách hàng FDI thông qua giải pháp cấu trúc SBLC độc đáo hợp tác với ngân hàng nào?","o":[["A","Eximbank Trung Quốc"],["B","Eximbank Thái Lan"],["C","Hanabank Hàn Quốc"],["D","Bank of Communications Trung Quốc"]],"a":["B"],"e":"BIDV Tây Hồ hợp tác với Eximbank Thái Lan phát hành standby LC (SBLC) bảo lãnh thanh toán cho các dự án điện gió/điện mặt trời của nhà đầu tư Thái Lan tại Việt Nam, mang lại nguồn thu lớn 120-150 tỷ/năm."},{"i":807,"s":"kinh-nghiem-dieu-hanh","q":"Cơ cấu nguồn thu bền vững của BIDV Tây Hồ được chứng minh qua tỷ lệ thu nhập ròng phi tín dụng đạt mức nào?","o":[["A","Đạt trên 30%"],["B","Đạt trên 50%"],["C","Đạt trên 70%"],["D","Đạt trên 90%"]],"a":["C"],"e":"Tây Hồ xây dựng được cơ cấu thu nhập cực kỳ bền vững với tỷ lệ thu nhập ròng phi tín dụng đạt trên 70% (Huy động vốn chiếm 55%, dịch vụ 16%, hoạt động khác 2%, tín dụng chỉ chiếm 27%)."},{"i":808,"s":"kinh-nghiem-dieu-hanh","q":"Ông Vũ Hoàng Dương đã giữ cương vị Giám đốc tại BIDV Tây Hồ trong bao lâu trước khi được điều chuyển sang Sở Giao dịch 1?","o":[["A","6 năm"],["B","10 năm"],["C","12 năm 6 tháng"],["D","15 năm"]],"a":["C"],"e":"Ông Vũ Hoàng Dương làm việc tại BIDV Tây Hồ 12 năm 6 tháng, sau đó được điều động làm Giám đốc BIDV Sở Giao dịch 1 trong thời gian 20 tháng (2024-2026)."},{"i":809,"s":"kinh-nghiem-dieu-hanh","q":"Ba trụ cột kinh doanh chiến lược tại BIDV Sở Giao dịch 1 giai đoạn 2024-2026 được xác định là gì?","o":[["A","Bán lẻ, FDI, Kinh doanh ngoại hối"],["B","Kinh doanh vốn lớn/giá rẻ; Trung tâm thu xếp/thẩm định tài trợ vốn lớn/trọng điểm; FDI và Ngân hàng số"],["C","Bán lẻ, Cho vay SME, Ngân hàng số"],["D","Huy động vốn cá nhân, Kinh doanh số, Cho vay tiêu dùng"]],"a":["B"],"e":"SGD 1
