Đ-CP ngày 26/6/2014"]],"a":["A"],"e":"Nghị định số 214/2025/NĐ-CP của Chính phủ ban hành ngày 04/8/2025 hướng dẫn chi tiết thi hành Luật Đấu thầu về lựa chọn nhà thầu."},{"i":449,"s":"dau-thau","q":"Thông tư số 79/2025/TT-BTC ngày 04/8/2025 của Bộ Tài chính hướng dẫn nội dung gì?","o":[["A","Quy định chi tiết việc cung cấp, đăng tải thông tin về đấu thầu và mẫu hồ sơ đấu thầu trên Hệ thống mạng đấu thầu quốc gia"],["B","Quy định trình tự thủ tục mua sắm tài sản tập trung tại các cơ quan nhà nước"],["C","Quy định về quản lý tài chính và phân cấp ủy quyền của Tổng giám đốc"],["D","Quy định về thủ tục nộp thuế và hoàn thuế của nhà thầu nước ngoài"]],"a":["A"],"e":"Thông tư 79/2025/TT-BTC quy định chi tiết cung cấp, đăng tải thông tin đấu thầu và mẫu hồ sơ đấu thầu trên Hệ thống mạng đấu thầu quốc gia."},{"i":450,"s":"dau-thau","q":"Theo quy định hiện hành tại Luật Đấu thầu, hạn mức áp dụng hình thức chỉ định thầu đối với gói thầu tư vấn là bao nhiêu?","o":[["A","Dưới 800 triệu đồng"],["B","Dưới 500 triệu đồng"],["C","Dưới 1 tỷ đồng"],["D","Dưới 2 tỷ đồng"]],"a":["A"],"e":"Theo quy định của Luật Đấu thầu mới nhất, gói thầu tư vấn có giá gói thầu dưới 800 triệu đồng được áp dụng chỉ định thầu."},{"i":451,"s":"dau-thau","q":"Hạn mức áp dụng hình thức chỉ định thầu đối với gói thầu mua sắm hàng hóa, xây lắp, phi tư vấn và hỗn hợp là bao nhiêu?","o":[["A","Dưới 2 tỷ đồng"],["B","Dưới 1 tỷ đồng"],["C","Dưới 500 triệu đồng"],["D","Dưới 3 tỷ đồng"]],"a":["A"],"e":"Hạn mức chỉ định thầu đối với các gói thầu phi tư vấn, mua sắm hàng hóa, xây lắp, hỗn hợp là dưới 2 tỷ đồng."},{"i":452,"s":"dau-thau","q":"Quy định số 273 ngày 08/4/2026 của Hội đồng quản trị BIDV ban hành nội dung gì?","o":[["A","Quy chế đầu tư, mua sắm, thuê và quản lý tài sản tại BIDV"],["B","Quy chế quản lý đầu tư xây dựng công trình và phân cấp ủy quyền tại BIDV"],["C","Trình tự thủ tục mua sắm hàng hóa dịch vụ tại đơn vị trực thuộc"],["D","Phân cấp ủy quyền của Tổng giám đốc trong quản lý tài chính"]],"a":["A"],"e":"Quy định số 273 ngày 08/04/2026 ban hành Quy chế đầu tư, mua sắm, thuê và quản lý tài sản thuộc thẩm quyền HĐQT BIDV."},{"i":453,"s":"dau-thau","q":"Theo quy chế quản lý đầu tư xây dựng công trình của BIDV (QĐ 274/QĐ-HĐQT), các dự án có tổng mức đầu tư từ bao nhiêu tỷ đồng trở lên sẽ do Ban Quản lý dự án Xây dựng cơ bản Hội sở chính trực tiếp làm chủ đầu tư và quản lý?","o":[["A","Từ 15 tỷ đồng trở lên"],["B","Từ 10 tỷ đồng trở lên"],["C","Từ 5 tỷ đồng trở lên"],["D","Từ 20 tỷ đồng trở lên"]],"a":["A"],"e":"Dự án đầu tư xây dựng công trình có quy mô từ 15 tỷ đồng trở lên do Ban QLDA XDCB Hội sở chính quản lý; dưới 15 tỷ do chi nhánh quản lý."},{"i":454,"s":"dau-thau","q":"Tại chi nhánh BIDV, dự án cải tạo sửa chữa nhỏ có quy mô dưới 1 tỷ đồng (hoặc dưới 3 tỷ đối với chi nhánh hạng đặc biệt tại Hà Nội, TP.HCM) do bộ phận nào thực hiện?","o":[["A","Tổ công tác xây dựng công trình và Tổ thẩm định chi nhánh"],["B","Ban Quản lý công trình chi nhánh"],["C","Ban Quản lý dự án Xây dựng cơ bản Hội sở chính"],["D","Trung tâm Mua sắm Tập trung Hội sở chính"]],"a":["A"],"e":"Đối với dự án cải tạo sửa chữa nhỏ dưới 1 tỷ (hoặc dưới 3 tỷ ở chi nhánh đặc biệt HN/HCM), chi nhánh thành lập Tổ công tác và Tổ thẩm định để thực hiện."},{"i":455,"s":"dau-thau","q":"Trung tâm Mua sắm Tập trung của BIDV chính thức hoạt động vào ngày nào?","o":[["A","01/06/2022"],["B","01/01/2024"],["C","01/06/2020"],["D","15/01/2025"]],"a":["A"],"e":"Trung tâm Mua sắm Tập trung của BIDV được thành lập và chính thức đi vào hoạt động từ ngày 01/06/2022."},{"i":456,"s":"dau-thau","q":"Tính đến năm 2026, có bao nhiêu loại tài sản thông dụng được đưa vào danh mục mua sắm tập trung tại Hội sở chính BIDV?","o":[["A","12 loại tài sản"],["B","10 loại tài sản"],["C","8 loại tài sản"],["D","15 loại tài sản"]],"a":["A"],"e":"Đến năm 2026, danh mục mua sắm tập trung tại BIDV gồm 12 loại tài sản (xe chuyên dùng, máy tính, laptop, máy tính bảng, UPS, máy đếm tiền...)."},{"i":457,"s":"dau-thau","q":"Kế hoạch lựa chọn nhà thầu đối với mỗi gói thầu phải bao gồm đầy đủ bao nhiêu nội dung cốt lõi theo quy định?","o":[["A","8 nội dung"],["B","6 nội dung"],["C","5 nội dung"],["D","10 nội dung"]],"a":["A"],"e":"Kế hoạch lựa chọn nhà thầu bao gồm 8 nội dung: tên gói thầu, giá gói thầu, nguồn vốn, hình thức LCNT, phương thức LCNT, thời gian tổ chức, loại HĐ, thời gian thực hiện."},{"i":458,"s":"dau-thau","q":"Chủ đầu tư có trách nhiệm đăng tải Kế hoạch lựa chọn nhà thầu lên Hệ thống mạng đấu thầu quốc gia trong thời hạn bao lâu kể từ ngày được phê duyệt?","o":[["A","Trong vòng 5 ngày làm việc"],["B","Trong vòng 3 ngày làm việc"],["C","Trong vòng 7 ngày làm việc"],["D","Trong vòng 10 ngày làm việc"]],"a":["A"],"e":"Thời hạn bắt buộc đăng tải kế hoạch lựa chọn nhà thầu là trong vòng 5 ngày làm việc kể từ ngày ban hành quyết định phê duyệt."},{"i":459,"s":"dau-thau","q":"Đối với gói thầu mua sắm hàng hóa hoặc phi tư vấn, nếu nhân sự chủ chốt của nhà thầu không đáp ứng yêu cầu, nhà thầu được thay thế tối đa bao nhiêu lần cho mỗi vị trí?","o":[["A","1 lần"],["B","2 lần"],["C","Không được thay thế"],["D","3 lần"]],"a":["A"],"e":"Luật mới cho phép nhà thầu bổ sung/thay thế nhân sự không đạt 1 lần đối với gói hàng hóa, phi tư vấn; nếu vẫn không đạt sẽ bị loại."},{"i":460,"s":"dau-thau","q":"Đối với gói thầu xây lắp, nhà thầu được phép thay thế nhân sự chủ chốt không đáp ứng tối đa bao nhiêu lần cho mỗi vị trí?","o":[["A","2 lần"],["B","1 lần"],["C","3 lần"],["D","Không giới hạn số lần"]],"a":["A"],"e":"Đối với gói thầu xây lắp, do tính chất phức tạp của công trường, nhà thầu được phép thay thế tối đa 2 lần cho mỗi vị trí nhân sự không đáp ứng."},{"i":461,"s":"dau-thau","q":"Thời gian tối thiểu cho phép nhà thầu làm rõ, bổ sung hoặc thay thế nhân sự chủ chốt, thiết bị là bao nhiêu ngày làm việc?","o":[["A","Không ít hơn 3 ngày làm việc"],["B","Không ít hơn 5 ngày làm việc"],["C","Không ít hơn 2 ngày làm việc"],["D","Không ít hơn 7 ngày làm việc"]],"a":["A"],"e":"Thời gian cho phép nhà thầu chuẩn bị bổ sung/thay thế nhân sự, thiết bị hợp lệ tối thiểu là không ít hơn 3 ngày làm việc."},{"i":462,"s":"dau-thau","q":"Nếu có sự không thống nhất giữa thông tin bảo đảm dự thầu kê khai trên webform và file scan đính kèm thì đánh giá dựa trên căn cứ nào?","o":[["A","Thông tin trong file đính kèm"],["B","Thông tin kê khai trên webform"],["C","Yêu cầu làm rõ để nhà thầu chọn lại"],["D","Bị loại ngay lập tức không cần đánh giá"]],"a":["A"],"e":"Theo nguyên tắc đánh giá E-HSDT, đối với bảo đảm dự thầu, nếu thông tin kê khai webform và file scan đính kèm khác nhau thì file scan đính kèm là căn cứ đánh giá."},{"i":463,"s":"dau-thau","q":"Hàng hóa chỉ được hưởng ưu đãi trong đấu thầu khi nhà thầu chứng minh được chi phí sản xuất trong nước đạt tỷ lệ tối thiểu bao nhiêu?","o":[["A","Từ 30% trở lên trong giá hàng hóa"],["B","Từ 25% trở lên trong giá hàng hóa"],["C","Từ 40% trở lên trong giá hàng hóa"],["D","Từ 50% trở lên trong giá hàng hóa"]],"a":["A"],"e":"Hàng hóa được hưởng ưu đãi khi có chi phí sản xuất trong nước (tỷ lệ nội địa hóa) chiếm từ 30% trở lên trong giá hàng hóa."},{"i":464,"s":"dau-thau","q":"Trình tự thực hiện mua sắm tài sản (MSTS) tại BIDV gồm bao nhiêu bước cốt lõi?","o":[["A","5 bước"],["B","4 bước"],["C","6 bước"],["D","3 bước"]],"a":["A"],"e":"Trình tự MSTS gồm 5 bước: (1) Phê duyệt chủng loại, TCKT, đơn giá; (2) Phê duyệt phương án và KHLCNT; (3) Tổ chức LCNT; (4) Ký kết, quản lý HĐ; (5) Quyết toán."},{"i":465,"s":"dau-thau","q":"Thời gian bảo hành công trình xây dựng thông thường là bao nhiêu tháng kể từ ngày ký biên bản nghiệm thu hoàn thành đưa vào sử dụng?","o":[["A","12 tháng"],["B","24 tháng"],["C","6 tháng"],["D","36 tháng"]],"a":["A"],"e":"Thời gian bảo hành công trình thông thường là 12 tháng kể từ ngày ký biên bản nghiệm thu bàn giao đưa vào sử dụng."},{"i":466,"s":"dau-thau","q":"Chủ đầu tư có trách nhiệm đăng tải thông tin chủ yếu của hợp đồng trên Hệ thống đấu thầu qua mạng quốc gia chậm nhất là?","o":[["A","05 ngày làm việc kể từ ngày ký kết hợp đồng"],["B","05 ngày làm việc kể từ ngày hợp đồng có hiệu lực"],["C","05 ngày kể từ ngày hợp đồng có hiệu lực"],["D","05 ngày làm việc kể từ ngày nhà thầu nộp bảo đảm thực hiện hợp đồng"]],"a":["B"],"e":"Khoản 4 Điều 8 Luật Đấu thầu số 22/2023/QH15"},{"i":467,"s":"dau-thau","q":"Theo quy định pháp luật về đấu thầu, đấu thầu là gì?","o":[["A","Là quá trình lựa chọn nhà thầu để ký kết, thực hiện hợp đồng cung cấp dịch vụ tư vấn, phi tư vấn, mua sắm hàng hóa, lựa chọn nhà đầu tư để ký kết, thực hiện hợp đồng dự án đầu tư kinh doanh trên cơ sở đảm bảo cạnh tranh, công bằng, minh bạch"],["B","Là quá trình lựa chọn nhà thầu để ký kết, thực hiện hợp đồng cung cấp dịch vụ tư vấn, phi tư vấn, mua sắm hàng hóa, xây lắp, lựa chọn nhà đầu tư để ký kết, thực hiện hợp đồng dự án đầu tư kinh doanh trên cơ sở đảm bảo cạnh tranh, công bằng và trách nhiệm giải trình"],["C","Là quá trình lựa chọn nhà thầu để ký kết, thực hiện hợp đồng cung cấp dịch vụ tư vấn, phi tư vấn, mua sắm hàng hóa, xây lắp; là quá trình lựa chọn nhà đầu tư để ký kết, thực hiện hợp đồng dự án đầu tư kinh doanh trên cơ sở đảm bảo cạnh tranh, công bằng, minh bạch, hiệu quả kinh tế và trách nhiệm giải trình"],["D","Là quá trình lựa chọn đơn vị để thực hiện hợp đồng thông qua các quy trình, thủ tục do pháp luật đấu thầu quy định."]],"a":["C"],"e":"Khoản 8 Điều 4 Luật Đấu thầu số 22/2023/QH15"},{"i":468,"s":"dau-thau","q":"Quy trình 02 trong đánh giá E-HSDT được áp dụng đối với gói thầu nào sau đây?","o":[["A","Gói thầu mua sắm hàng hóa áp dụng phương thức một giai đoạn một túi hồ sơ, sử dụng phương pháp “giá thấp nhất” và các nhà thầu, E-HSDT đều không có bất kỳ ưu đãi nào"],["B","Gói thầu dịch vụ phi tư vấn áp dụng phương thức một giai đoạn một túi hồ sơ, sử dụng phương pháp “giá đánh giá” và các nhà thầu, E-HSDT chào ưu đãi như nhau"],["C","Gói thầu xây lắp áp dụng phương thức một giai đoạn một túi hồ sơ, sử dụng phương pháp “giá thấp nhất” và các nhà thầu, E-HSDT đều không có bất kỳ ưu đãi nào"],["D","Gói thầu máy đặt, máy mượn áp dụng phương thức một giai đoạn một túi hồ sơ, sử dụng phương pháp “giá thấp nhất” và các nhà thầu, E-HSDT chào ưu đãi như nhau"]],"a":["A"],"e":"Khoản 1b Điều 30 Thông tư 79"},{"i":469,"s":"tai-tro-du-an","q":"Các dự án/phương án kinh doanh nào sau đây thuộc dự án/phương án kinh doanh trung dài hạn lớn, đặc thù theo quy định của BIDV?","o":[["A","Khách hàng vay 300 tỷ đồng, kỳ hạn 36 tháng để đầu tư dự án mới là dự án chung cư cao tầng + bảo lãnh nhà ở hình thành trong tương lai của dự án là 150 tỷ đồng."],["B","Khách hàng vay 300 tỷ đồng, thời hạn 60 tháng đầu tư đóng mới tàu pha sông biển"],["C","Khách hàng vay 200 tỷ đồng, thời hạn 48 tháng đầu tư mới nhà máy sản xuất nước ngọt giải khát"],["D","A&B"],["E","A&B&C"],["F","Không có đáp án nào đúng"]],"a":["C"],"e":""},{"i":470,"s":"tai-tro-du-an","q":"Khách hàng A là doanh nghiệp FDI, trước đây BIDV đã cho khách hàng vay 700 tỷ đồng đầu tư dự án nhà máy điện rác, dự án đã đi vào hoạt động và khách hàng đang trả nợ vay đầy đủ theo lịch trả nợ đã thống nhất tại HĐTD, dư nợ hiện tại của khoản vay là 400 tỷ đồng. Sau một thời gian đi vào hoạt động, một số thiết bị của dự án không còn đảm bảo nên khách hàng có nhu cầu vay 150 tỷ đồng đầu tư sửa chữa, thay thế một số thiết bị của dự án điện rác. Trên cơ sở đánh giá, chi nhánh nhận thấy dự án có tính khả thi và thuộc thẩm quyền phê duyệt cấp tín dụng của TSC. Chi nhánh sẽ trình TSC theo trình tự thủ tục nào?","o":[["A","Chi nhánh gửi hồ sơ đề xuất cấp tín dụng qua TTTĐPD theo trình tự thủ tục khoản cấp tín dụng vượt thẩm quyền của chi nhánh"],["B","Chi nhánh gửi hồ sơ đề xuất cấp tín dụng đồng thời qua TTTĐPD và Ban KHDNNN theo trình tự thủ tục khoản cấp tín dụng vượt thẩm quyền của chi nhánh"],["C","Chi nhánh gửi hồ sơ đề nghị qua Ban TTDA thành lập Tổ đề xuất cấp tín dụng và thực hiện theo quy trình cấp tín dụng dự án lớn, đặc thù"],["D","Chi nhánh gửi hồ sơ đề nghị qua Ban TTDA và Ban KHDNNN để thành lập Tổ đề xuất cấp tín dụng và thực hi  thép, gang, kim loại màu - Thương mại xăng dầu, khí đốt. - Thương mại sắt thép. - Thương mại công nghiệp nhẹ, hàng tiêu dùng"]],"a":["A"],"e":""},{"i":479,"s":"tai-tro-du-an","q":"Các bước chính trong cơ chế phối hợp tài trợ dự án tín dụng lớn đặc thù hiện nay?","o":[["A","(i) Chi nhánh tiếp cận khách hàng dự án, thực hiện Báo cáo đề xuất cấp tín dụng gồm các điều kiện tín dụng. (ii) Ban TTDA tái thẩm định đề xuất cấp tín dụng"],["B","(i) Chi nhánh tiếp cận khách hàng dự án, đàm phán với khách hàng điều kiện cấp tín dụng (ii) Chi nhánh cùng với Ban TTDA thực hiện Báo cáo đề xuất cấp tín dụng với các điều kiện đã đàm phán."],["C","(i) Chi nhánh thông tin và cùng Ban TTDA tiếp cận và làm việc khách hàng (ii) Chi nhánh cùng Ban TTDA làm Báo cáo đề xuất cấp tín dụng và đàm phán thống nhất với khách hàng về điều kiện tín dụng."],["D","(i) Chi nhánh và Ban TTDA phối hợp tiếp cận và đánh giá về khách (ii) Ban TTDA đàm phán với khách hàng điều kiện tín dụng và cùng chi nhánh làm Báo cáo đề xuất cấp tín dụng"]],"a":["C"],"e":""},{"i":480,"s":"tai-tro-du-an","q":"Các nội dung chính khi thẩm định dự án?","o":[["A","- Đánh giá pháp lý dự án - Đánh giá năng kực và kinh nghiệm của Khách hàng tại lĩnh vực ngành nghề tương tự. - Đánh giá các nguồn vốn tham gia vào dự án. - Đánh giá hiệu quả và khả năng trả nợ."],["B","- Đánh giá pháp lý dự án - Đánh giá TMĐT & suất đầu tư. - Đánh giá các nguồn vốn tham gia vào dự án. - Đánh giá hiệu quả và khả năng trả nợ."],["C","- Đánh giá pháp lý dự án - Đánh giá TMĐT & suất đầu tư. - Đánh giá rủi ro về môi trường và xã hội. - Đánh giá hiệu quả và khả năng trả nợ."],["D","- Đánh giá pháp lý dự án - Đánh giá TMĐT & suất đầu tư. - Đánh giá rủi ro và các biện pháp phòng ngừa.. - Đánh giá hiệu quả và khả năng trả nợ."]],"a":["B"],"e":""},{"i":481,"s":"tai-tro-du-an","q":"Đâu là một số khó khăn cho Chi nhánh khi đề xuất cấp tín dụng dự án?","o":[["A","- Nhiều Chi nhánh vẫn còn quá e ngại, quá thận trọng trong tiếp cận dự án tín dụng TDH (vì tính phức tạp, vì chưa có kinh nghiệm)."],["B","Lo ngại Dự án không đi vào hoạt động đúng tiéne độ, chất lượng như dự kiến"],["C","- Văn bản, quy định của BIDV về tín dụng còn phân tán, đan xen, chồng lấn."],["D","Cả 3 phương án trên"]],"a":["D"],"e":""},{"i":482,"s":"tai-tro-du-an","q":"Sở xây dựng nhiều địa phương yêu cầu giải chấp toàn bộ tài sản (BĐS thương mại thuộc dự an trước khi cấp Văn bản thông báo nhà ở đủ điều kiện được bán dẫn đến rủi ro cho ngân hàn khi không còn thế chấp tài sản thuộc dự án khi dự án chưa phát sinh nguồn thu. Giải pháp để giảm thiểu rủi ro và phù hợp với khả năng đáp ứng của Doanh nghiệp là gì?","o":[["A","Xem xét giải chấp khi: (i) Phương án bán hàng khả thi; (ii) Thế chấp cổ phần, vốn góp của cổ đông/thành viên góp vốn; (iii) Quản lý bản gôc GCN QSDĐ dự án; (iv) Quy định tỷ lệ nguồn thu tối thiểu"],["B","Xem xét giải chấp khi: (i) Phương án bán hàng khả thi; (ii) Bảo lãnh của Cổ đông/Công ty mẹ; (iii) Quản lý bản gôc GCN QSDĐ dự án; (iv) Quy định tỷ lệ nguồn thu tối thiểu"],["C","Xem xét giải chấp khi: (i) Phương án bán hàng khả thi; (ii) Thế chấp bổ sung quyền phải thu từ hợp đồng đặt cọc/mua bán; (iii) Thế chấp cổ phần, vốn góp của cổ đông/thành viên góp vốn; (iv) Quản lý bản gôc GCN QSDĐ dự án; (v) Quy định tỷ lệ nguồn thu tối thiểu"],["D","Không xem xét giải chấp trước. Yêu cầu Chủ đầu tư trả nợ trước hạn hoặc thay thế bằng TSĐB khác rồi mới giải chấp từng phần với giá trị tương ứng."]],"a":["C"],"e":""},{"i":483,"s":"tai-tro-du-an","q":"Theo nghị quyết số 1010/NQ-BIDV ngày 10/11/2021 v/v phê duyệt chiến lược cấu phần - chiến lược hoạt động Khối NHBB BIDV giai đoạn 2021 - 2025 chiến lược của Khối NHBB BIDV giai đoạn 2021 - 2025, mục tiêu đối với tín dụng TDH đến năm 2025 là","o":[["A","Kiểm soát tỷ trọng tín dụng TDH dưới 40%"],["B","Nâng tỷ trọng tín dụng TDH, đạt tỷ trọng 40%"],["C","Nâng tỷ trọng tín dụng TDH tối thiểu 10% so với năm 2021"],["D","Tỷ trọng tín dụng TDH đứng đầu hệ thống ngân hàng"],["E","Nâng tỷ trọng tín dụng TDH gắn được sử dụng làm tài sản bảo đảm tiền vay và TSHTTVV tạo ra nguồn trả nợ cho khoản cấp tín dụng tại BIDV (trừ trường hợp hợp vốn cấp tín dụng), yêu cầu khách hàng cam kết tối thiểu các nội dung gì?","o":[["A","Không được cầm cố, thế chấp TSHTTVV, các quyền phát sinh từ TSHTTVV và các khoản phải thu phát sinh từ dự án tại bất kỳ tổ chức tín dụng nào cho đến khi trả hết khoản cấp tín dụng này tại BIDV."],["B","Trường hợp chuyển nhượng hoặc bất kỳ hành động nào làm thay đổi quyền sở hữu đối với TSHTTVV phải được sự đồng ý của BIDV bằng văn bản"],["C","Trường hợp chuyển nhượng hoặc bất kỳ hành động nào làm thay đổi quyền sở hữu đối với TSHTTVV phải được sự đồng ý của BIDV bằng văn bản và số tiền thu được sẽ được sử dụng để trả nợ gốc, lãi, phí của khoản vay hình thành tài sản đó tại BIDV trước"],["D","Cả A&C"]],"a":["D"],"e":"Quyết định số 9427/QĐ-BIDV ngày 26/12/2024 về Định hướng cấp tín /dụng đối với khách hàng tổ chức (Điều 3, Mục 4)"},{"i":492,"s":"tai-tro-du-an","q":"Theo quy định tại NQ số 1443/NQ-BIDV ngày 25/12/2024 của HĐQT BIDV v/v cấp tín dụng đối với lĩnh vực đầu tư kinh doanh bất động sản, đối với KH xếp hạng A+ và dự án thuộc phân khúc Nhà ở thương mại, khu đô thị thì tỷ lệ cấp tín dụng tối đa là:","o":[["A","0.65"],["B","0.7"],["C","0.75"],["D","0.8"]],"a":["B"],"e":"NQ số 1443/NQ-BIDV ngày 25/12/2024 của HĐQT BIDV v/v cấp tín dụng đối với lĩnh vực đầu tư kinh doanh bất động sản (Phụ lục )"},{"i":493,"s":"tai-tro-du-an","q":"Theo các định hướng về tín dụng ngành giai đoạn 2024 - 2025, nhóm ngành nào sau đây thuộc danh sách các ngành tập trung kiểm soát rủi ro?","o":[["A","Kinh doanh Bất động sản (Khu đô thị, Nhà ở để bán)"],["B","Thương mại xăng dầu, khí đốt; Thương mại sắt thép; và Thương mại Vật liệu xây dựng"],["C","Sản xuất xe có động cơ"],["D","Thủy điện, truyền tải và phân phối điện"]],"a":["B"],"e":"Theo tài liệu Slide đào tạo. Nguồn tài liệu chỉ rõ 05 Ngành tập trung kiểm soát rủi ro 2024 - 2025 bao gồm: Thương mại xăng dầu, khí đốt; Thương mại sắt thép; Thương mại VLXD; Thương mại Nông lâm, thủy hải sản; và Thương mại công nghiệp nhẹ, hàng tiêu dùng."},{"i":494,"s":"tai-tro-du-an","q":"Khó khăn vướng mắc điển hình và giải pháp tương ứng khắc phục khi thẩm định dự án?","o":[["A","Đối với các dự án Điện gió, Điện mặt trời nối lưới, dòng tiền thanh toán thường chậm (thông thường từ 2-3 tháng, có dự án chậm 4-5 tháng), ảnh hưởng lớn đến lập kế hoạch trả nợ. Giải pháp khắc phục là cần xem xét duy trì dự phòng trả nợ tối thiểu 01 kỳ trả nợ gốc, lãi"],["B","Khách hàng FDI thường có cấu trúc sở hữu phức tạp, gây khó khăn trong việc đàm phán Công ty mẹ có bảo lãnh trả nợ thay/cam kết hỗ trợ tài chính. Giải pháp là từ chối các yêu cầu bảo lãnh này vì các điều kiện này thường không đảm bảo giảm thiểu rủi ro cho ngân hàng"],["C","Chi phí thuế tiền sử dụng đất tại các dự án Bất động sản Thương mại tại một số địa phương tăng vọt (do Luật Đất đai 2024 và Luật KD BĐS 2023) làm Tổng mức đầu tư tăng mạnh so với dự kiến ban đầu. Giải pháp khắc phục là áp dụng suất vốn đầu tư tham khảo từ suất vốn đầu tư của các Bộ ngành để đảm bảo TMĐT được kiểm soát."],["D","Nhiều chi nhánh còn e ngại, quá thận trọng khi tiếp cận dự án tín dụng trung dài hạn (TDH) do thiếu kinh nghiệm và tính phức tạp của dự án. Giải pháp là Chi nhánh chỉ nên tập trung thẩm định các dự án có quy mô nhỏ đã hoàn thành xong công tác giải phóng mặt bằng để giảm thiểu rủi ro pháp lý"]],"a":["A"],"e":"Theo tài liệu Slide đào tạo."},{"i":495,"s":"tai-tro-du-an","q":"Các yếu tố cần lưu ý khi đánh giá tổng mức đầu tư dự án?","o":[["A","Đối với các dự án có quyền sử dụng đất lâu dài có thu tiền, chi phí quyền sử dụng đất phải được trích khấu hao hàng năm."],["B","Trong giai đoạn lập dự án đầu tư ban đầu, TMĐT thường được lập dựa trên suất vốn đầu tư tham khảo từ các Bộ ngành hoặc từ các dự án tương tự đã thực hiện"],["C","Để đơn giản hóa, giá trị thanh lý tài sản của dự án luôn được xác định dựa trên giá thị trường thực tế tại thời điểm thanh lý, thay vì giá trị sổ sách."],["D","Đối với các dự án phức tạp như sản xuất gang thép, thẩm định TMĐT cần đặc biệt lưu ý rằng chi phí đầu tư thực tế thường thấp hơn đáng kể so với TMĐT lập ban đầu."]],"a":["B"],"e":"Theo tài liệu Slide đào tạo."},{"i":496,"s":"tai-tro-du-an","q":"Đánh giá hiệu quả và khả năng trả nợ dự án cần quan tâm đến những yếu tố nào để làm căn cứ đưa ra giả định tính toán?","o":[["A","Đánh giá về mặt thị trường và khả năng tiêu thụ sản phẩm để làm căn cứ đưa ra những giả định về công suất hoạt động, diện tích tiêu thụ/thuê, và dự kiến doanh thu hàng năm."],["B","Đánh giá Tổng mức đầu tư (TMĐT) nhằm mục đích duy nhất là đưa ra điều kiện về giá trị cho vay tối đa, mà không cần thiết phải đưa ra các giả định tính toán độ nhạy của dự án."],["C","Đánh giá tính khả thi của phương án vốn chỉ tập trung vào việc đáp ứng tỷ lệ Vốn chủ sở hữu tối thiểu theo quy định, vì chi phí vốn (lãi vay, tỷ suất chiết khấu) sẽ được tính riêng theo công thức WACC chuẩn mà không cần căn cứ vào phương án vốn của khách hàng."],["D","Đưa ra điều kiện về thời gian ân hạn, thời hạn cho vay và thời gian rút vốn phù hợp với dòng tiền dự án, vì đây là một trong bốn yếu tố cơ bản được sử dụng để lượng hóa các giả định đầu tiên cho quá trình tính toán."]],"a":["A"],"e":"Theo tài liệu Slide đào tạo."},{"i":497,"s":"phap-che","q":"Mô tả nào sau đây là chính xác đối với Quyền thu giữ tài sản của các TCTD?","o":[["A","Quyền theo luật định"],["B","Quyền theo thỏa thuận"],["C","Quyền đương nhiên vì Ngân hàng là bên cho vay"],["D","Quyền theo thỏa thuận giữa các bên khi đáp ứng những điều kiện nhất định theo Luật các TCTD"]],"a":["D"],"e":""},{"i":498,"s":"phap-che","q":"Cấp tín dụng là việc thỏa thuận để tổ chức, cá nhân sử dụng một khoản tiền hoặc cam kết cho phép sử dụng một khoản tiền theo nguyên tắc có hoàn trả bằng nghiệp vụ cho vay, chiết khấu, cho thuê tài chính,…","o":[["A","Bao thanh toán, bảo lãnh ngân hàng"],["B","Bảo lãnh ngân hàng, thư tín dụng"],["C","Thư tín dụng và các nghiệp vụ cấp tín dụng khác"],["D","A và C"]],"a":["D"],"e":""},{"i":499,"s":"phap-che","q":"Việc một Chi nhánh BIDV bị xử phạt vi phạm hành chính trong tổ chức và hoạt động của mình ảnh hưởng bất lợi đến?","o":[["A","Khả năng được xem xét mở rộng mạng lưới, thành lập Phòng Giao dịch của BIDV"],["B","Đánh giá xếp hạng Tổ chức tín dụng của BIDV"],["C","Đánh giá hoàn thành nhiệm vụ của Người quản lý và phân phối lợi nhuận của BIDV"],["D","Đánh giá hiệu quả hoạt động của doanh nghiệp"],["E","Tất cả các đáp án trên"]],"a":["E"],"e":""},{"i":500,"s":"phap-che","q":"Kể từ ngày hiệu lực của Luật đất đai năm 2024, 01/8/2024, nhận định nào sau đây là đúng?","o":[["A","Hộ gia đình không thuộc các trường hợp được liệt kê là người sử dụng đất"],["B","Là người sử dụng đất"],["C","Hộ gia đình không được thực hiện các quyền của người sử dụng đất"],["D","Hộ gia đình không thuộc các trường hợp được liệt kê là người sử dụng đất, nhưng được tiếp tục tham gia quan hệ pháp luật về đất đai với tư cách nhóm người sử dụng đất có chung quyền sử dụng đất"]],"a":["D"],"e":""},{"i":501,"s":"phap-che","q":"Hệ thống Tòa án nhân dân được tổ chức từ 01/7/2025 gồm mấy cấp và cụ thể gồm những cấp nào?","o":[["A","3 cấp: Tối cao, cấp tỉnh, cấp huyện"],["B","3 cấp: Tối cao, cấp tỉnh, cấp khu vực"],["C","4 cấp: Tối cao, cấp cao, cấp tỉnh, cấp khu vực"],["D","3 cấp: Tối cao, cấp cao, cấp khu vực"]],"a":["B"],"e":""},{"i":502,"s":"phap-che","q":"Giấy phép hoạt động ngân hàng của BIDV do cơ quan nào cấp?","o":[["A","NHNN"],["B","Bộ Tài chính"],["C","Ủy ban chứng khoán"],["D","Phòng đăng ký kinh doanh"]],"a":["A"],"e":""},{"i":503,"s":"phap-che","q":"Ngân hàng thương mại có thể có nhiều người đại diện theo pháp luật không? Người đai diện theo pháp luật hiện tại của BIDV là Chủ tịch HĐQT hay Tổng giám đốc?","o":[["A","Có thể có nhiều người đại diện theo pháp luật. Chủ tịch HĐQT"],["B","Chỉ một người là đại diện theo pháp luật. Tổng Giám đốc"],["C","Có thể có nhiều người là đại diện theo pháp luật. Tổng Giám đốc"],["D","Chỉ một n  Pháp chế Ngân hàng (Slide Buổi Sáng)."},{"i":510,"s":"phap-che","q":"Theo thống kê sơ bộ của Ban Pháp chế BIDV, hệ thống pháp luật Việt Nam hiện có bao nhiêu văn bản quy phạm pháp luật tác động trực tiếp đến hoạt động ngân hàng?","o":[["A","309 văn bản"],["B","450 văn bản"],["C","612 văn bản"],["D","1000 văn bản"]],"a":["C"],"e":"Qua thống kê sơ bộ của Ban Pháp chế, có 612 văn bản quy phạm pháp luật tác động trực tiếp đến hoạt động ngân hàng đang có hiệu lực (gồm 49 Luật, 175 Nghị định, 388 Thông tư) (Slide Buổi Sáng)."},{"i":511,"s":"phap-che","q":"Có bao nhiêu văn bản pháp luật mới liên quan đến hoạt động ngân hàng được ban hành trong giai đoạn 2025-2026?","o":[["A","27 văn bản"],["B","118 văn bản"],["C","104 văn bản"],["D","309 văn bản"]],"a":["D"],"e":"Có 309 văn bản pháp luật mới liên quan đến hoạt động ngân hàng được ban hành trong giai đoạn 2025-2026 (Slide Buổi Sáng, mục 2.1)."},{"i":512,"s":"phap-che","q":"Luật Các tổ chức tín dụng năm 2024 có hiệu lực thi hành chính thức từ ngày nào?","o":[["A","01/01/2024"],["B","01/7/2024"],["C","01/01/2025"],["D","01/7/2025"]],"a":["B"],"e":"Luật Các tổ chức tín dụng 2024 có hiệu lực thi hành từ ngày 01/7/2024, ngoại trừ một số điều khoản đặc thù về chuyển nhượng TSBĐ có hiệu lực từ 01/01/2025 (Slide Buổi Sáng)."},{"i":513,"s":"phap-che","q":"Luật Các tổ chức tín dụng năm 2024 gồm bao nhiêu chương và bao nhiêu điều?","o":[["A","10 Chương - 163 Điều"],["B","12 Chương - 200 Điều"],["C","15 Chương - 210 Điều"],["D","18 Chương - 250 Điều"]],"a":["C"],"e":"Luật Các tổ chức tín dụng 2024 có cấu trúc gồm 15 Chương và 210 Điều (tăng so với 10 Chương và 163 Điều của Luật Các TCTD 2010) (Slide Buổi Sáng, mục 2.2)."},{"i":514,"s":"phap-che","q":"Chương nào sau đây là chương mới được bổ sung hoàn toàn trong Luật Các TCTD 2024 so với Luật Các TCTD 2010?","o":[["A","Chương II: Ngân hàng chính sách"],["B","Chương IX: Can thiệp sớm"],["C","Chương XII: Về xử lý nợ xấu, tài sản bảo đảm của khoản nợ xấu"],["D","Tất cả các phương án trên đều đúng"]],"a":["D"],"e":"Luật Các TCTD 2024 bổ sung nhiều chương mới bao gồm Chương II (Ngân hàng chính sách), Chương IX (Can thiệp sớm), Chương X (Kiểm soát đặc biệt), Chương XI (Xử lý rút tiền hàng loạt) và Chương XII (Xử lý nợ xấu, TSBĐ) (Slide Buổi Sáng)."},{"i":515,"s":"phap-che","q":"Luật Các tổ chức tín dụng 2024 chính thức quy định dịch vụ nào sau đây là một hình thức cấp tín dụng?","o":[["A","Tư vấn tài chính"],["B","Thư tín dụng (L/C)"],["C","Đại lý bảo hiểm"],["D","Ủy thác đầu tư"]],"a":["B"],"e":"Luật Các tổ chức tín dụng 2024 xác nhận và quy định rõ 'Thư tín dụng (L/C)' là một hình thức cấp tín dụng (Slide Buổi Sáng, mục 2.2)."},{"i":516,"s":"phap-che","q":"Hoạt động 'đại lý quản lý tài sản bảo đảm' được Luật Các TCTD 2024 quy định là:","o":[["A","Hoạt động ngân hàng cốt lõi"],["B","Hoạt động bị nghiêm cấm đối với NHTM"],["C","Hoạt động kinh doanh khác của NHTM"],["D","Hoạt động chỉ áp dụng cho Ngân hàng chính sách"]],"a":["C"],"e":"Hoạt động đại lý quản lý TSBĐ được quy định là một hoạt động kinh doanh khác của NHTM trong Luật Các TCTD 2024 (Slide Buổi Sáng, mục 2.2)."},{"i":517,"s":"phap-che","q":"Tổng thiệt hại tài chính được xác định trong đại án hình sự LifePro tại Agribank Nam Hà Nội là bao nhiêu?","o":[["A","Hơn 1.000 tỷ đồng"],["B","Hơn 2.488 tỷ đồng"],["C","Hơn 4.700 tỷ đồng"],["D","Hơn 10.000 tỷ đồng"]],"a":["B"],"e":"Tổng thiệt hại tài chính của vụ án LifePro được xác định chính xác là 2.488.642.191.086 đồng (Slide Buổi Chiều, mục III)."},{"i":518,"s":"phap-che","q":"Sai phạm nghiêm trọng nào liên quan đến tài sản bảo đảm đã xảy ra trong vụ án hình sự LifePro?","o":[["A","Nhận thế chấp quyền sử dụng đất thuê trả tiền hàng năm (128.110,9 m2)"],["B","Nhận bảo đảm bằng 6 thương hiệu thời trang không có thật, không thẩm định quyền sở hữu"],["C","Giải ngân khi thiếu chứng từ gốc và thiếu báo cáo thẩm định"],["D","Tất cả các phương án trên đều đúng"]],"a":["D"],"e":"Vụ án LifePro là bài học xương máu với hàng loạt sai phạm: Nhận thế chấp đất thuê trả tiền hàng năm (sai luật), nhận thế chấp 6 thương hiệu ảo, giải ngân thiếu chứng từ gốc L/C và hồ sơ kiểm soát (Slide Buổi Chiều, mục III)."},{"i":519,"s":"phap-che","q":"Trung bình một năm, Ban Pháp chế BIDV xử lý khoảng bao nhiêu công việc tư vấn pháp luật trong toàn hệ thống?","o":[["A","Khoảng 1.000 việc"],["B","Khoảng 3.000 việc"],["C","Khoảng 5.000 việc"],["D","Khoảng 10.000 việc"]],"a":["D"],"e":"Trung bình mỗi năm Ban Pháp chế xử lý khoảng 10.000 công việc pháp lý (trong đó kênh tư vấn pháp luật điện tử B.Legal chiếm khoảng 3.000 - 5.000 việc) (Slide Buổi Sáng, mục 5)."},{"i":520,"s":"phap-che","q":"Số lượng vụ việc/vụ kiện tranh chấp phát sinh toàn hệ thống BIDV trung bình mỗi năm nằm trong khoảng nào?","o":[["A","Khoảng 500 vụ"],["B","Khoảng 1.000 vụ"],["C","Khoảng 2.000 vụ"],["D","Khoảng 5.000 vụ"]],"a":["C"],"e":"Số lượng tranh chấp của BIDV trung bình khoảng 2.000 vụ việc mỗi năm (Năm 2024 có 2.470 vụ, năm 2025 có 2.340 vụ) (Audio Pháp chế tại BIDV)."},{"i":521,"s":"phap-che","q":"Theo Báo cáo Công tác quản lý xử lý tranh chấp năm 2025 của BIDV, tổng giá trị tài sản trong các vụ việc BIDV thắng kiện được thi hành án là bao nhiêu?","o":[["A","Hơn 10.000 tỷ đồng"],["B","Hơn 20.000 tỷ đồng"],["C","Hơn 33.782 tỷ đồng"],["D","Hơn 50.000 tỷ đồng"]],"a":["C"],"e":"Tổng cộng giá trị BIDV thắng kiện và được thi hành án lũy kế đến năm 2025 là 33.782,9 tỷ đồng cho 2.846 vụ việc (Slide Buổi Sáng, mục 5.3)."},{"i":522,"s":"phap-che","q":"Hiện nay, trong toàn hệ thống BIDV có bao nhiêu cán bộ nhân sự chính thức được cấp Thẻ Luật sư?","o":[["A","16 người"],["B","30 người"],["C","50 người"],["D","100 người"]],"a":["A"],"e":"Toàn hệ thống BIDV chỉ có 16 người được cấp thẻ luật sư chính thức (15 người ngồi tại Hội sở chính, 1 người ở miền Nam, và không có ai ở miền Bắc) (Audio Công tác Pháp chế tại BIDV)."},{"i":523,"s":"phap-che","q":"Vụ án hình sự kéo dài 9 năm qua (qua 3 lần xét xử sơ thẩm) tại chi nhánh nào của BIDV liên quan đến tranh cãi pháp lý về định danh 'Tài sản nhà nước' đối với tài sản bảo đảm của BIDV?","o":[["A","Chi nhánh Tây Sài Gòn"],["B","Chi nhánh Bỉm Sơn"],["C","Chi nhánh Nam Hà Nội"],["D","Chi nhánh Thành Đô"]],"a":["A"],"e":"Vụ án tại chi nhánh Tây Sài Gòn (vụ của anh Hùng và anh Lộc) kéo dài do tranh cãi giữa TANDTC, VKSNDTC và Bộ Công An xem tài sản thế chấp tại BIDV (vốn nhà nước 80%) có phải tài sản nhà nước hay không (Audio Tổng quan hệ thống pháp luật)."},{"i":524,"s":"phap-che","q":"Trong vụ án hình sự tại chi nhánh Bỉm Sơn, nguyên nhân chính dẫn đến việc 6 cán bộ ngân hàng bị khởi tố tội Thiếu trách nhiệm gây hậu quả nghiêm trọng là gì?","o":[["A","Do đồng phạm cố ý làm giả hồ sơ với khách hàng"],["B","Do tự ý sửa đổi hợp đồng tín dụng trái thẩm quyền"],["C","Do tham gia tổ định giá tài sản thế chấp nhưng không thực tế đi kiểm tra, thẩm định, dẫn đến bị lừa đảo"],["D","Do làm mất con dấu của chi nhánh"]],"a":["C"],"e":"Nhóm cán bộ định giá chi nhánh Bỉm Sơn đã tin lời khách hàng, ký khống biên bản định giá mà không thực tế đi kiểm tra tài sản, dẫn đến ngân hàng bị lừa đảo chiếm đoạt tài sản (Audio Quản lý tranh chấp)."},{"i":525,"s":"phap-che","q":"Theo khuyến cáo từ Ban Pháp chế BIDV, khi phát sinh vụ việc tranh chấp phức tạp hoặc dính líu pháp lý, đơn vị/cán bộ nên liên hệ đầu tiên với ai để tìm giải pháp tối ưu?","o":[["A","Ban Kiểm tra và Giám sát nội bộ"],["B","Ban Pháp chế / Luật sư của BIDV"],["C","Công an địa phương"],["D","Đơn vị truyền thông báo chí"]],"a":["B"],"e":"Ban Pháp chế khuyến cáo liên hệ ngay luật sư/pháp chế vì pháp chế đi tìm giải pháp bảo vệ tốt nhất cho cán bộ và chi nhánh, còn kiểm tra giám sát là để quy trách nhiệm đúng sai sau khi vụ việc đã xảy ra (Audio Công tác Pháp chế tại BIDV)."},{"i":526,"s":"phap-che","q":"Dự án công nghệ số lớn nào của Khối Bán lẻ BIDV đã được Ban Pháp chế phối hợp rà soát, tháo gỡ từng phân đoạn pháp lý (disclaimer, biểu mẫu, thông điệp) để landing đúng tiến độ?","o":[["A","Hệ thống B-One"],["B","Hệ thống B.Legal"],["C","Dự án BIDV Home"],["D","Hệ thống định danh điện tử VNeID"]],"a":["C"],"e":"Dự án BIDV Home đã được Ban Pháp chế hỗ trợ làm việc liên tục trong 3-4 buổi để phân tích, rà soát pháp lý chi tiết từng bước, giúp dự án landing đúng hạn (Audio Các dự án kinh doanh)."},{"i":527,"s":"phap-che","q":"Trong giai đoạn đầu triển khai hệ thống B1 (B-One), tại sao việc trang bị chữ ký số cho ban lãnh đạo và cán bộ BIDV bị hạn chế và gây nhiều tranh luận?","o":[["A","Do chữ ký số không an toàn"],["B","Do tiết kiệm chi phí, chỉ ưu tiên mua cho nhóm phê duyệt tín dụng cá nhân trên app do Thông tư bắt buộc"],["C","Do đối tác công nghệ không đồng bộ"],["D","Do quy chế của NHNN cấm sử dụng chữ ký số rộng rãi"]],"a":["B"],"e":"Giai đoạn đầu BIDV tiết kiệm chi phí nên không mua chữ ký số diện rộng, chỉ mua cho nhóm phê duyệt tín dụng cá nhân trên app vì bắt buộc theo quy định của Thông tư 39 và Thông tư 06 sửa đổi (Audio Các dự án kinh doanh)."},{"i":528,"s":"phap-che","q":"Nguyên tắc lập pháp đổi mới và quan trọng nhất được Bộ Chính trị đặt ra trong Nghị quyết 66-NQ/TW là gì?","o":[["A","Không quản lý được thì cấm để bảo đảm an toàn hệ thống"],["B","Bỏ tư duy 'không quản được thì cấm', chuyển mạnh từ xây dựng thể chế sang tổ chức thi hành pháp luật hiệu quả"],["C","Tập trung siết chặt kỷ luật hành chính trong giao dịch dân sự"],["D","Yêu cầu tất cả các giao dịch điện tử phải thực hiện công chứng trực tiếp"]],"a":["B"],"e":"Nghị quyết 66-NQ/TW và Nghị quyết 184/NQ-CP nhấn mạnh nguyên tắc lập pháp: Bỏ tư duy 'không quản được thì cấm', lấy người dân và doanh nghiệp làm trung tâm, thúc đẩy đổi mới sáng tạo (Slide Buổi Sáng)."},{"i":529,"s":"phap-che","q":"Anh (chị) hãy cho biết các ảnh hưởng bất lợi đối với BIDV khi một Phòng Giao dịch bị xử phạt vi phạm hành chính trong lĩnh vực tiền tệ ngân hàng?","o":[["A","Bị hạn chế thành lập Phòng Giao dịch mới và ảnh hưởng đến kết quả xếp hạng của BIDV?"],["B","Ảnh hưởng đến kết quả đánh giá hiệu quả hoạt động của BIDV theo quy định của Bộ Tài chính và ảnh hưởng đến xếp loại người quản lý và phân phối lợi nhuận của Ngân hàng."],["C","Bị rút Giấy phép hoạt động Ngân hàng"],["D","Đáp án A và B"]],"a":["D"],"e":""},{"i":530,"s":"phap-che","q":"Nhận định nào dưới đây là Đúng đối với quy định về Tội phạm “Rửa tiền” trong Bộ luật Hình sự (chọn nhiều đáp án)","o":[["A","Chỉ cá nhân mới có thể là tội phạm của Tội rửa tiền"],["B","Cả cá nhân và pháp nhân thương mại đều có thể là tội phạm của Tội rửa tiền. (Đ)"],["C","Chỉ Giao dịch viên ngân hàng mới có nguy cơ cao là đồng phạm của Tội phạm nguồn và Tội rửa tiền"],["D","Cả giao dịch viên và cán bộ tín dụng của NHTM đều có nguy cơ cao là đồng phạm của Tội phạm nguồn và Tội rửa tiền. (Đ)."]],"a":["B","D"],"e":""},{"i":531,"s":"phap-che","q":"Ngân hàng thương mại phải thực hiện quy trình nhận biết khách hàng đối với cả những khách hàng vãng lai không có tài khoản nhưng thực hiện giao dịch chuyển tiền có tổng giá trị từ bao nhiêu tiền trở lên trong một ngày?","o":[["A","200 triệu đồng"],["B","10.000 USD hoặc quy đổi tương đương"],["C","400 triệu đồng"],["D","300 triệu đồng"]],"a":["C"],"e":""},{"i":532,"s":"phap-che","q":"Người đại diện theo pháp luật hiện nay của BIDV là ai?","o":[["A","Ông Lê Ngọc Lâm – Tổng Giám đốc"],["B","Ông Cấn Văn Lực- Chuyên gia Kinh tế trưởng"],["C","Ông Phan Đức Tú – Chủ tịch Hội đồng quản trị"],["D","Bà Tạ Thị Hạnh – Trưởng Ban Kiểm soát"]],"a":["A"],"e":""},{"i":533,"s":"phap-che","q":"Nhận định nào sau này là không chính xác về Tội Vi phạm quy định trong hoạt động ngân hàng (chọn nhiều đáp án)","o":[["A","Hành vi phân loại nợ không chính xác, không đúng tuổi nợ, không đúng bản chất khoản nợ là một trường hợp phạm tội."],["B","Định giá khống, định giá nâng khống khi thẩm định giá để cấp tín dụng đối với trường hợp phải có tài sản bảo đảm gây thiệt hại cho Ngân hàng từ 100 triệu đồng trở lên là một hành vi phạm tội."],["C","Cứ có một trong các hành vi mô tả tại khoản 1 Điều 206 Bộ luật hình sự, kể cả không gây thiệt hại cũng là phạm tội"],["D","Cấp tín dụng đối với đối tượng không được cấp tín dụng, trừ trường hợp phát hành thẻ tín dụng gây thiệt hại cho Ngân hàng từ 100 triệu đồng trở lên là một hành vi phạm tội"]],"a":["A","C"],"e":""},{"i":534,"s":"phap-che","q":"Chi nhánh BIDV X nhận thế chấp quyền sử dụng đất ở của bên thứ ba là của vợ chồng Ông A và Bà B; Giấy chứng nhận quyền sử dụng đất ghi tên, cấp cho Hộ gia đình Ông A và bà B; Nguồn gốc quyền sử dụng đất là do vợ chồng Ông A và Bà B nhận chuyển nhượng quyền sử dụng đất từ một bên thứ ba (đã công chứng hợp pháp, đã sang tên, tại thời điểm nhận chuyển nhượng hai con đều dưới 15 tuổi). Thời điểm ký HĐ thế chấp, hai con đều đã trên 18 tuổi, có nhà ở tọa lạc trên thửa đất, nhà ở chưa được cấp sở hữu. Cách thức ký HĐTC nào dưới đây được đánh giá là toàn diện và an toàn khi giao kết Hợp đồng thế chấp với gia đình ông A và bà B? (Xếp theo thứ tự từ an toàn nhất đến rủi ro nhất)","o":[["A","Ký Hợp đồng thế chấp QSDĐ với hai vợ chồng ông A và Bà B (2 người), công chứng, đăng ký HĐTC QSDĐ. Ký HĐTC nhà ở (chưa được cấp sở hữu) với cả 4 người (thêm 2 con), có thể không công chứng, đăng ký (tùy điều kiện thực tế tại địa phương)."],["B","Ký Hợp đồng thế chấp QSDĐ với tất cả các thành viên trong hộ gia đình Ông A và bà B (gồm 4 người), công chứng, đăng ký HĐTC QSDĐ. Ký HĐTC nhà ở (chưa được cấp sở hữu) với 04 người, có thể không công chứng, đăng ký (tùy điều kiện thực tế tại địa phương."],["C","Ký Hợp đồng thế chấp QSDĐ với hai vợ chồng ông A và Bà B (2 người), công chứng, đăng ký HĐTC QSDĐ; 02 con ký Văn bản từ chối tài sản (công nhận Quyền sử dụng đất chỉ thuộc sở hữu của Bố, Mẹ). Ký HĐTC nhà ở (chưa được cấp sở hữu) với cả 4 người (thêm 2 con), có thể không công chứng, đăng ký (tùy điều kiện thực tế tại địa phương)."],["D","Ký Hợp đồng thế chấp QSDĐ với hai vợ chồng ông A và Bà B (2 người), công chứng, đăng ký HĐTC QSDĐ; 02 con ký Văn bản từ chối tài sản (công nhận cả Quyền sử dụng đất và nhà ở chỉ thuộc sở hữu của Bố, Mẹ). Ký HĐTC nhà ở (chưa được cấp sở hữu) với vợ chồng ông A và Bà B (02 người), có thể không công chứng, đăng ký (tùy điều kiện thực tế tại địa phương)."]],"a":["B"],"e":""},{"i":535,"s":"phap-che","q":"Nhận định nào sau đây là chính xác theo Luật đất đai năm 2024","o":[["A","Luật đất đai không quy định về thế chấp quyền thuê đất trong Hợp đồng thuê đất trả tiền hàng năm"],["B","Luật đất đai không quy định về chuyển nhượng/bán quyền thuê đất trong Hợp đồng thuê đất trả tiền hàng năm khi thỏa mãn một số điều kiện"],["C","Luật đất đai quy định về tặng cho, góp vốn quyền thuê đất trong Hợp đồng thuê đất trả tiền hàng năm"],["D","Luật đất đai quy định về thừa kế quyền thuê đất trong Hợp đồng thuê đất trả tiền hàng năm."]],"a":["A"],"e":""},{"i":536,"s":"qlrr","q":"Theo anh/chị, các yêu cầu cốt lõi của công tác PCRT/TTKB/TTPBVKHDHL/Cấm vận là gì? Chọn phương án đúng nhất.","o":[["A","Yêu cầu pháp luật, thông lệ"],["B","Yêu cầu của khách hàng"],["C","Yêu cầu của NHNN"],["D","Yêu cầu của pháp luật; Thông lệ quốc tế; Trách nhiệm với khách hàng, đối tác; Uy tín với khách hàng"],["E","Thông lệ và cam kết với đối tác"],["F","Khả năng cạnh tranh với các ngân hàng cùng quy mô"]],"a":["D"],"e":""},{"i":537,"s":"qlrr","q":"Theo anh/chị, BIDV tuân thủ chính sách cấm vận của các tổ chức, quốc gia nào? Chọn phương án đúng nhất.","o":[["A","UN, Mỹ, EU"],["B","UN, Việt Nam"],["C","UN, Mỹ, EU, UK"],["D","UN, Mỹ, EU, UK, Việt Nam"],["E","UN, Mỹ, EU, Việt Nam, các quốc gia liên quan trong giao dịch"],["F","UN, Mỹ, EU, Việt Nam"]],"a":["E"],"e":""},{"i":538,"s":"qlrr","q":"Theo anh/chị, hệ thống nào sau đây hỗ trợ sàng lọc tự động giao dịch thanh toán quốc tế qua Swift với danh sách cấm vận theo thời gian thực? Chọn phương án đúng nhất.","o":[["A","Siron KYC"],["B","Siron AML"],["C","AML-SWIFT-HUB"],["D","Siron Analysis"],["E","Siron Util"],["F","SIMO"]],"a":["C"],"e":""},{"i":539,"s":"qlrr","q":"Theo anh/chị, đối tượng khách hàng nào sau đây BIDV đang phân loại là khách hàng mặc định rủi ro cao cấm vận? Chọn phương án đúng nhất.","o":[["A","Khách hàn ến 20%"],["C","Từ trên 20% đến gần 40% (riêng 6 tháng đầu năm 2026 đạt 38%)"],["D","Trên 50%"]],"a":["C"],"e":"Phí TTTM luôn chiếm tỷ trọng lớn nhất trong tổng thu phí dịch vụ toàn hàng, duy trì trên 20% đến gần 40%, riêng 6T/2026 đạt 38% tổng thu phí [1, 23]."},{"i":560,"s":"tttm","q":"Từ tháng 7/2024, do ảnh hưởng của Thông tư nào mà một số sản phẩm TTTM của BIDV phải chuyển hạch toán thu phí từ phí dịch vụ sang thu nhập tín dụng?","o":[["A","Thông tư số 12/2022/TT-NHNN"],["B","Thông tư số 21/2024/TT-NHNN về nghiệp vụ Thư tín dụng"],["C","Thông tư số 61/2024/TT-NHNN về bảo lãnh ngân hàng"],["D","Thông tư số 20/2024/TT-NHNN về bao thanh toán"]],"a":["B"],"e":"Từ tháng 7/2024, sau khi Thông tư 21 ra đời, một số sản phẩm gắn với tín dụng như phát hành L/C, chiết khấu... được hạch toán vào phí tín dụng thay vì phí dịch vụ [23, 116]."},{"i":561,"s":"tttm","q":"Doanh số thanh toán TTTM của BIDV hằng năm giai đoạn 2021-2025 duy trì ổn định ở mức trung bình là bao nhiêu?","o":[["A","Trên 5 tỷ USD"],["B","Trên 10 tỷ USD"],["C","Trên 20 tỷ USD"],["D","Trên 50 tỷ USD"]],"a":["C"],"e":"Doanh số thanh toán TTTM của BIDV hằng năm trong giai đoạn này duy trì ổn định ở mức trên 20 tỷ USD [5, 87]."},{"i":562,"s":"tttm","q":"Trong cơ cấu doanh số thanh toán TTTM tại BIDV, tỷ lệ trung bình giữa Nhập khẩu và Xuất khẩu thường duy trì ở mức nào?","o":[["A","Nhập khẩu 50% - Xuất khẩu 50%"],["B","Nhập khẩu 30% - Xuất khẩu 70%"],["C","Nhập khẩu 70% - Xuất khẩu 30%"],["D","Nhập khẩu 90% - Xuất khẩu 10%"]],"a":["C"],"e":"Nhập khẩu luôn chiếm tỷ trọng áp đảo, khoảng 70% so với xuất khẩu chiếm khoảng 30% tổng doanh số [87, 117]."},{"i":563,"s":"tttm","q":"Tốc độ tăng trưởng thu phí TTTM bình quân hằng năm của BIDV giai đoạn 2021-2025 đạt mức bao nhiêu?","o":[["A","Khoảng 5%"],["B","Khoảng 10%"],["C","Khoảng 15,9% - 16%"],["D","Khoảng 25%"]],"a":["C"],"e":"Tốc độ tăng trưởng phí TTTM giai đoạn này đạt tốc độ tăng trưởng tốt, bình quân hằng năm là 15,9% (xấp xỉ 16%) [87, 117]."},{"i":564,"s":"tttm","q":"Hai địa bàn chi nhánh đầu tàu tập trung chính về hoạt động TTTM của BIDV, chiếm tới 70% doanh số toàn hàng là những địa bàn nào?","o":[["A","Hà Nội và Đà Nẵng"],["B","Hà Nội và TP. Hồ Chí Minh"],["C","TP. Hồ Chí Minh và Hải Phòng"],["D","TP. Hồ Chí Minh và Cần Thơ"]],"a":["B"],"e":"Hà Nội và TP. Hồ Chí Minh là hai địa bàn trọng điểm lớn nhất, chiếm 70% doanh số toàn hàng (trong đó Hà Nội chiếm gần 48%) [0, 2]."},{"i":565,"s":"tttm","q":"Hệ thống Doka (Core TFC) của BIDV chính thức đi vào hoạt động (go-live) từ năm nào và có tính năng gì nổi bật?","o":[["A","Năm 2018 - Hỗ trợ quản lý báo cáo thủ công"],["B","Năm 2020 - Tự động hóa hạch toán kế toán"],["C","Năm 2021 - Hệ thống quản lý toàn trình, tích hợp ECM lưu trữ số hóa 100% hồ sơ không giấy tờ"],["D","Năm 2024 - Quản lý quan hệ ngân hàng đại lý"]],"a":["C"],"e":"Hệ thống Doka đi vào vận hành từ năm 2021 thay thế 6 hệ thống đơn lẻ trước đây, tích hợp ECM giúp lưu trữ và tác nghiệp số hóa toàn trình [24, 88]."},{"i":566,"s":"tttm","q":"Chương trình 'B.Trade+' (B-Trade Plus) dự kiến được triển khai tại các chi nhánh BIDV vào năm 2027 nhằm mục tiêu gì?","o":[["A","Tự động hóa ký số cho khách hàng doanh nghiệp lớn"],["B","Số hóa toàn bộ các khâu xử lý tại Chi nhánh và liên thông tác nghiệp với Trụ sở chính"],["C","Thử nghiệm ứng dụng Blockchain diện rộng"],["D","Thay thế hoàn toàn cán bộ thanh toán viên tại chi nhánh"]],"a":["B"],"e":"B.Trade+ (dự kiến triển khai 2027) sẽ số hóa các khâu tại chi nhánh (tiếp nhận, AML, correspondent banks, tờ trình đảm bảo nguồn...) tạo chuỗi liên thông với TSC [14, 60]."},{"i":567,"s":"tttm","q":"BIDV là ngân hàng đầu tiên tại Việt Nam thực hiện thành công giao dịch thử nghiệm phát hành L/C áp dụng công nghệ Blockchain vào ngày nào và trên nền tảng nào?","o":[["A","Ngày 27/08/2020 trên nền tảng Contour"],["B","Ngày 08/06/2026 trên nền tảng CargoDoc"],["C","Ngày 28/02/2023 trên nền tảng Trade Flat"],["D","Ngày 15/06/2026 trên nền tảng B.One"]],"a":["A"],"e":"BIDV đi đầu công nghệ khi phát hành thành công L/C thử nghiệm trên Contour ngày 27/08/2020, có xác nhận từ ADB giúp giảm thời gian xử lý xuống còn vài giờ [61]."},{"i":568,"s":"tttm","q":"Từ ngày 08/06/2026, BIDV đã chính thức triển khai giải pháp công nghệ nào để thay thế việc ký tay và đóng dấu vật lý của ngân hàng trên các chứng từ cung cấp cho khách hàng?","o":[["A","Gửi email thông báo tự động (E-Advice)"],["B","Giải pháp ký số chứng từ TTTM & BLQT trên toàn hệ thống"],["C","Sử dụng mã xác thực OTP qua tin nhắn SMS"],["D","Số hóa bóc tách tài liệu thông minh (IDP)"]],"a":["B"],"e":"Từ ngày 08/06/2026, BIDV áp dụng ký số cho 96% chứng từ TTTM & BLQT cung cấp cho khách hàng qua kênh số, giúp tinh giản quy trình và nâng cao bảo mật [13, 59]."},{"i":569,"s":"tttm","q":"Tính đến năm 2026, Trung tâm Tác nghiệp TTTM (TFC) của BIDV đang vận hành bao nhiêu robot (RPA) tự động hóa tác nghiệp và kế hoạch phát triển mới trong năm là gì?","o":[["A","5 robot - Phát triển robot đối chiếu hồ sơ giấy"],["B","8 robot - Xây dựng thêm 2 robot mới (thanh toán điện MX chuẩn Swift và báo cáo chuyển tiền trong nước)"],["C","10 robot - Phát triển robot tư vấn khách hàng qua chatbot"],["D","15 robot - Tự động hóa toàn bộ 100% các khâu xử lý"]],"a":["B"],"e":"TFC đang vận hành 8 robot RPA và năm 2026 tiếp tục xây dựng thêm 2 robot phục vụ thanh toán điện MX và báo cáo danh sách GD chuyển tiền trong nước [20, 21, 63]."},{"i":570,"s":"tttm","q":"Khoảng bao nhiêu % cán bộ làm nghiệp vụ TTTM tại BIDV đã đạt được các chứng chỉ chuyên gia quốc tế uy tín như CDCS và CSDG?","o":[["A","Khoảng 30%"],["B","Khoảng 50%"],["C","Gần 70% (72 cán bộ đạt chứng chỉ)"],["D","100% cán bộ nghiệp vụ"]],"a":["C"],"e":"BIDV đi đầu về chất lượng nguồn nhân sự TTTM với gần 70% (72 cán bộ) đạt chứng chỉ CDCS (chứng từ) và CSDG (bảo lãnh) [8, 56, 89]."},{"i":571,"s":"tttm","q":"Bản chất cốt lõi của sản phẩm UPAS L/C (Usance Payable at Sight L/C) tại BIDV là gì?","o":[["A","Khách hàng nhập khẩu trả ngay, người bán nhận tiền chậm"],["B","Mở L/C trả chậm, nhưng người bán (người thụ hưởng) được nhận tiền thanh toán trả ngay/trước hạn nhờ ngân hàng tài trợ trả thay trước"],["C","Bảo lãnh của BIDV cho khoản vay vốn quốc tế của doanh nghiệp"],["D","Phương thức nhờ thu chứng từ trả chậm không hủy ngang"]],"a":["B"],"e":"Sản phẩm UPAS L/C cho phép nhà nhập khẩu trả chậm (phù hợp dòng tiền) còn người bán vẫn nhận được tiền trả ngay nhờ ngân hàng tài trợ thanh toán trước [34, 99]."},{"i":572,"s":"tttm","q":"Dưới tác động của Thông tư 21/2024/TT-NHNN, khó khăn lớn nhất của sản phẩm UPAS L/C đối với chỉ tiêu kinh doanh của các chi nhánh BIDV là gì?","o":[["A","Thời gian xử lý giao dịch kéo dài thêm"],["B","Không tìm được ngân hàng tài trợ nước ngoài phù hợp"],["C","Bị coi là một khoản cấp tín dụng nên toàn bộ phí thu được phải hạch toán vào thu nhập tín dụng, không được ghi nhận vào phí dịch vụ của chi nhánh"],["D","Khách hàng phải hạch toán nợ xấu ngay lập tức"]],"a":["C"],"e":"Khó khăn của UPAS L/C từ 7/2024 là hạch toán như khoản cấp tín dụng, khiến chi nhánh không được ghi nhận phần phí dịch vụ TTTM thuần [6, 101, 128]."},{"i":573,"s":"tttm","q":"Để khắc phục hạn chế về thu nhập dịch vụ của UPAS L/C, BIDV đã giới thiệu sản phẩm thay thế nào cho phép ghi nhận toàn bộ phí thu được vào phí dịch vụ TTTM?","o":[["A","L/C nội địa trả chậm truyền thống"],["B","Nhờ thu kèm chứng từ xuất khẩu"],["C","Sản phẩm L/C Discounting (luồng follow 3 - chiết khấu miễn truy đòi bộ chứng từ)"],["D","Bao thanh toán xuất khẩu miễn truy đòi"]],"a":["C"],"e":"Sản phẩm L/C Discounting (luồng follow 3) giải quyết bài toán của chi nhánh bằng cách ghi nhận doanh thu vào phí dịch vụ TTTM thay vì thu nhập tín dụng [103, 106]."},{"i":574,"s":"tttm","q":"Điểm khác biệt quan trọng và cũng là vướng mắc chính khi triển khai sản phẩm L/C Discounting (luồng follow 3) tại các chi nhánh hiện nay là gì?","o":[["A","Nhà nhập khẩu bắt buộc phải ký quỹ 100% giá trị L/C"],["B","Yêu cầu phải có sự đồng thuận và đề nghị chiết khấu bằng văn bản từ phía người thụ hưởng và ngân hàng phục vụ người thụ hưởng"],["C","Chỉ được thực hiện giao dịch với các ngân hàng đại lý tự tìm kiếm chưa ký thỏa thuận với BIDV"],["D","Ngân hàng nước ngoài phải bảo lãnh thanh toán cho nhà nhập khẩu"]],"a":["B"],"e":"L/C Discounting đòi hỏi sự phối hợp đồng thuận từ phía người thụ hưởng và ngân hàng phục vụ người thụ hưởng về nhu cầu chiết khấu, điều này gây vướng cho các chi nhánh [35, 102]."},{"i":575,"s":"tttm","q":"Dòng sản phẩm nào đóng góp tỷ trọng lớn nhất (chiếm tới 57,7%) vào tổng thu phí dịch vụ TTTM của BIDV trong 6 tháng đầu năm 2026?","o":[["A","UPAS L/C nhập khẩu hàng dệt may"],["B","Bảo lãnh dự thầu quốc tế"],["C","Sản phẩm Mua hẳn miễn truy đòi bộ chứng từ theo L/C (chủ yếu là L/C nội địa)"],["D","Nhờ thu xuất khẩu thủy sản"]],"a":["C"],"e":"Sản phẩm Mua hẳn miễn truy đòi bộ chứng từ theo L/C (MHMTĐ) mang lại nguồn phí lớn, chiếm 57,7% trong tổng thu phí TTTM 6T.2026 [6, 40, 74]."},{"i":576,"s":"tttm","q":"Cơ sở pháp lý và điều chỉnh nghiệp vụ hiện hành đối với sản phẩm 'Mua hẳn miễn truy đòi bộ chứng từ theo L/C' tại BIDV gồm những văn bản nào?","o":[["A","Công văn số 3300/BIDV-CSSPBB ngày 11/06/2024"],["B","Công văn số 6165/BIDV-CSSPBB ngày 06/08/2025 và Công văn thí điểm số 3701/BIDV-QLKHDN ngày 21/05/2026"],["C","Quy định số 7829/QyĐ-BIDV ngày 31/12/2021"],["D","Công văn số 19992/BIDV-TTTM ngày 03/06/2026"]],"a":["B"],"e":"Nghiệp vụ MHMTĐ chịu điều chỉnh của CV 6165. Sau đó, CV 3701 ra đời cho phép thí điểm cơ chế linh hoạt nới lỏng điều kiện khách hàng tại 104 chi nhánh [42, 73, 74]."},{"i":577,"s":"tttm","q":"Điểm cải tiến nổi bật nhất của Sổ tay nghiệp vụ TTTM & BLQT phiên bản 6.0 (ban hành ngày 28/03/2025) so với các phiên bản trước là gì?","o":[["A","Chỉ lưu hành nội bộ nghiêm ngặt tại Trụ sở chính"],["B","Được thiết kế tinh gọn, lược bỏ bớt chi tiết nội bộ phức tạp để có thể cung cấp trực tiếp cho Khách hàng sử dụng làm tài liệu giới thiệu sản phẩm"],["C","Tăng độ dày tài liệu để làm giáo trình đào tạo học thuật"],["D","Áp dụng riêng cho các định chế tài chính nước ngoài"]],"a":["B"],"e":"Sổ tay phiên bản 6.0 lần đầu tiên được xây dựng sử dụng cho cả chi nhánh và khách hàng, thay đổi hình thức trình bày chuyên nghiệp, thân thiện hơn [28, 94]."},{"i":578,"s":"tttm","q":"Theo Công văn cơ chế động lực số 26139 ngày 14/07/2026 của Ban QLKH doanh nghiệp, mức khen thưởng tiền mặt cho cán bộ khi phát triển mới 1 khách hàng SME sử dụng sản phẩm Mua hẳn miễn truy đòi là bao nhiêu?","o":[["A","1 triệu đồng/khách hàng"],["B","5 triệu đồng/khách hàng"],["C","10 triệu đồng/khách hàng"],["D","20 triệu đồng/khách hàng"]],"a":["C"],"e":"Công văn 26139 quy định cơ chế động lực rất hấp dẫn: Thưởng 10 triệu đồng/khách hàng SME mới phát triển và 5 triệu đồng/khách hàng Mid-corp mới phát triển sử dụng sản phẩm [43]."},{"i":579,"s":"tham-dinh-phe-duyet","q":"Theo Công văn số 913/BIDV-QLRRTH ngày 22/02/2024 của BIDV v/v chỉ đạo hoạt động tín dụng năm 2024, mục tiêu tốc độ tăng trưởng tín dụng năm 2024 của BIDV là bao nhiêu?","o":[["A","12% (sẽ điều hành theo giới hạn tín dụng NHNN giao)"],["B","13% (sẽ điều hành theo giới hạn tín dụng NHNN giao)"],["C","14% (sẽ điều hành theo giới hạn tín dụng NHNN giao)"],["D","Mục tiêu tăng trưởng tín dụng tối đa nhằm đáp ứng các yêu cầu của NHNN trong việc hỗ trợ thúc đẩy phát triển kinh tế"]],"a":["C"],"e":""},{"i":580,"s":"tham-dinh-phe-duyet","q":"Thẩm quyền phê duyệt tín dụng của Phó Giám đốc Trung tâm Thẩm định và Phê duyệt hiện tại là bao nhiêu?","o":[["A","Tối đa 50% thẩm quyền của Giám đốc Trung tâm"],["B","Tương đương Giám đốc Phê duyệt cấp 2"],["C","Theo uỷ quyền của Giám đốc Trung tâm nhưng tối đa không vượt quá 50% thẩm quyền của Giám đốc Trung tâm"],["D","Không có thẩm quyền phê duyệt tín dụng"]],"a":["D"],"e":""},{"i":581,"s":"tham-dinh-phe-duyet","q":"Theo mô hình tổ chức hiện hành của BIDV, Trung tâm Định giá tài sản trực thuộc tuyến phòng thủ nào trong mô hình 3 tuyến phòng thủ","o":[["A","Tuyến 1 vì đây là bộ phận tham mưu/đưa ra các quyết định có rủi ro"],["B","Tuyến 2 vì đây là bộ phận định giá lại các TSBĐ của Chi nhánh"],["C","Tuyến 2 vì đây là bộ phận quản lý công tác định giá TSBĐ toàn hệ thống"],["D","Tuyến 3 vì đây là bộ phận đưa ra ý kiến độc lập về định giá TSBĐ để cấp phê duyệt ra quyết định tín dụng"]],"a":["A"],"e":""},{"i":582,"s":"tham-dinh-phe-duyet","q":"Phạm vi định giá TSBĐ của Trung tâm Định giá tài sản hiện tại bao gồm TSBĐ của các chi nhánh nào sau đây?","o":[["A","Tất cả các Chi nhánh địa bàn Hà Nội"],["B","16 Chi nhánh địa bàn Hà Nội"],["C","Tất cả các Chi nhánh địa bàn Hà Nội và địa bàn TP Hồ Chí Minh"],["D","Tất cả các chi nhánh BIDV tại Việt Nam"]],"a":["C"],"e":""},{"i":583,"s":"tham-dinh-phe-duyet","q":"Nhóm ngành cấp 2 tập trung kiểm soát rủi ro tại BIDV năm 2024 gồm các ngành nào sau đây?","o":[["A","(1) Thương mại nông, lâm, thuỷ hải sản (không gồm lúa gạo); (2) Thương mại sắt, thép; (3) Ngành Bất động sản tập trung kiểm soát rủi ro (bao gồm Đầu tư khu du lịch, nhà hàng khách sạn, resort) và không bao gồm Xây dựng Khu công nghiệp, khu chế xuất; (4) BOT chủ đầu tư giao thông"],["B","(1) Thương mại sắt, thép; (2) Sản xuất kim loại; (3) Thương mại xăng dầu, khí đốt và các sản phẩm liên quan; (4) Thương mại công nghiệp nhẹ hàng tiêu dùng"],["C","(1) Thương mại sắt, thép; (2) Sản xuất kim loại; (3) Thương mại xăng dầu, khí đốt và các sản phẩm liên quan; (4) Thương mại nông, lâm, thuỷ hải sản"],["D","(1) Đầu tư kinh doanh điện mặt trời mái nhà; (2) Thương mại sắt, thép; (3) Thương mại xăng dầu, khí đốt và các sản phẩm liên quan; (4) Kinh doanh bất động sản."]],"a":["B"],"e":""},{"i":584,"s":"tham-dinh-phe-duyet","q":"Theo công văn số 8383/BIDV-QLRRTH ngày 13/11/2023 về việc hướng dẫn thực hiện quy chế cho vay của BIDV, Doanh nghiệp phải cung cấp BCTC kiểm toán trong trường hợp nào?","o":[["A","Doanh nghiệp có doanh thu từ 1.500 tỷ đồng trở lên, ngoại trừ trường hợp cấp tín dụng đảm bảo 100% bằng số dư tiền gửi tại BIDV."],["B","Doanh nghiệp có dư nợ cấp tín dụng hoặc có nhu cầu cấp tín dụng tại BIDV từ 100 tỷ đồng trở lên, trừ trường hợp cấp tín dụng đảm bảo 100% bằng số dư tiền gửi tại BIDV hoặc doanh nghiệp Nhà nước (Nhà nước nắm giữ 100% vốn điều lệ) do Bộ Quốc phòng, Bộ Công an quản lý."],["C","Doanh nghiệp có dư nợ cấp tín dụng hoặc có nhu cầu cấp tín dụng tại BIDV từ 100 tỷ đồng trở lên, trừ trường hợp cấp tín dụng đảm bảo 100% bằng số dư tiền gửi tại BIDV hoặc doanh nghiệp Nhà nước (Nhà nước nắm giữ 50% vốn điều lệ trở lên)."],["D","Doanh nghiệp có dư nợ cấp tín dụng hoặc có nhu cầu cấp tín dụng tại BIDV từ 100 tỷ đồng trở lên."]],"a":["B"],"e":""},{"i":585,"s":"tham-dinh-phe-duyet","q":"Khẳng định nào sau đây là đúng nhất","o":[["A","BIDV chưa từng ban hành văn bản chỉ đạo, hướng dẫn liên quan đến việc cấp tín dụng ngành xăng dầu"],["B","BIDV đã ban hành sổ tay tín dụng hướng dẫn việc cấp tín dụng ngành xăng dầu"],["C","BIDV đã ban hành chỉ đạo liên quan đến việc cấp tín dụng ngành xăng dầu"],["D","BIDV đã ban hành sổ tay tín dụng hướng dẫn và chỉ đạo liên quan đến việc cấp tín dụng ngành xăng dầu"]],"a":["D"],"e":""},{"i":586,"s":"tham-dinh-phe-duyet","q":"Nhóm ngành cấp 2 tập trung kiểm soát rủi ro tại BIDV năm 2023 gồm:","o":[["A","(1) Thương mai nông, lâm, thuỷ hải sản (không gồm lúa gạo); (2) Thương mại sắt, thép; (3) Ngành Bất động sản tập trung kiểm soát rủi ro (bao gồm Đầu tư khu du lịch, nhà hàng khách sạn, resort) và không bao gồm Xây dựng Khu công nghiệp, khu chế xuất; (4) BOT chủ đầu tư giao thông"],["B","(1) Thương mại ô tô, xe có động cơ và các bộ phận phụ trợ; (2) Thương mại sắt, thép; (3) Hoạt động xây dựng chuyên dụng khác; (4) Thương mại xăng dầu, khí đốt và các sản phẩm liên quan."],["C","(1) Xây dựng công trình kỹ thuật dân dụng khác; (2) Thương mại sắt, thép; (3) Thương mại xăng dầu, khí đốt và các sản phẩm liên quan; (4) Kinh doanh bất động sản."],["D","(1) Đầu tư kinh doanh điện mặt trời mái nhà; (2) Thương mại sắt, thép; (3) Thương mại xăng dầu, khí đốt và các sản phẩm liên quan; (4) Kinh doanh bất động sản."],["E","Không có đáp án đúng"]],"a":["A"],"e":""},{"i":587,"s":"tham-dinh-phe-duyet","q":"Theo Luật đầu tư năm 2020, Trường hợp nào Nhà đầu tư không phải thực hiện thủ tục chấp thuận điều chỉnh Chủ trương đầu tư:","o":[["A","Thay đổi mục tiêu đã được quy định tại văn bản chấp thuận chủ trương đầu tư"],["B","Thay đổi tổng vốn đầu tư từ 20% trở lên không làm thay đổi quy mô dự án đầu tư"],["C","Thay đổi quy mô diện tích đất sử dụng trên 10% hoặc trên 30ha, thay đổi địa điểm đầu tư"],["D","Không đáp án nào đúng"]],"a":["B"],"e":""},{"i":588,"s":"tham-dinh-phe-duyet","q":"Quyết định phê duyệt về GHTD ngành tập trung kiểm soát rủi ro năm 2023 của BIDV do cấp nào ban hành?","o":[["A","Hội đồng Quản trị"],["B","Hội đồng tín dụng Trung ương"],["C","Tổng Giám đốc"],["D","Phó Tổng Giám đốc phụ trách Khối rủi ro."]],"a":["A"],"e":""},{"i":589,"s":"tham-dinh-phe-duyet","q":"Quyết định nào phê duyệt Đề án chuyển đổi hoạt động của Khối Thẩm định và Phê duyệt tín dụng?","o":[["A","Nghị quyết 1368/NQ-BIDV ngày 16/12/2025"],["B","Nghị quyết 549/NQ-BIDV ngày 11/05/2026"],["C","Quyết định 4449/QyĐ-BIDV ngày 15/06/2026"],["D","Quyết định 4685/QĐ-BIDV ngày 23/06/2026"]],"a":["B"],"e":"Nghị quyết số 549/NQ-BIDV ngày 11/05/2026 phê duyệt Đề án chuyển đổi hoạt động của Khối Thẩm định và Phê duyệt, đặt nền móng chuyển đổi toàn diện [Nghị quyết 549/NQ-BIDV]."},{"i":590,"s":"tham-dinh-phe-duyet","q":"Quy trình cấp tín dụng đối với Khách hàng tổ chức ban hành ngày 15/06/2026 theo văn bản nào?","o":[["A","Quy định 4449/QyĐ-BIDV"],["B","Quyết định 4685/QĐ-BIDV"],["C","Quyết định 862/QĐ-BIDV"],["D","Văn bản 2237/BIDV-SPBL"]],"a":["A"],"e":"Quy trình cấp tín dụng đối với Khách hàng tổ chức được ban hành kèm theo Quyết định số 4449/QyĐ-BIDV ngày 15/06/2026 [QyĐ 4449]."},{"i":591,"s":"tham-dinh-phe-duyet","q":"Quy định mới 4449 đã lược bỏ bước nào tại Trụ sở chính để đơn giản hóa quy trình cấp tín dụng?","o":[["A","Bước Tác nghiệp tín dụng"],["B","Bước Đề xuất tín dụng"],["C","Bước Thẩm định rủi ro"],["D","Bước Thẩm định tín dụng"]],"a":["C"],"e":"Quy trình mới 4449 lược bỏ bước Thẩm định rủi ro tại Trụ sở chính, quy trình rút gọn thành 3 bước: Đề xuất -> Thẩm định tín dụng -> Tác nghiệp [QyĐ 4449]."},{"i":592,"s":"tham-dinh-phe-duyet","q":"Quyết định số 4685/QĐ-BIDV ngày 23/06/2026 về phân cấp thẩm quyền phê duyệt tín dụng có hiệu lực từ ngày nào?","o":[["A","15/06/2026"],["B","23/06/2026"],["C","01/07/2026"],["D","01/01/2027"]],"a":["C"],"e":"Quyết định 4685/QĐ-BIDV ban hành ngày 23/06/2026 và chính thức có hiệu lực từ ngày 01/07/2026 [QĐ 4685]."},{"i":593,"s":"tham-dinh-phe-duyet","q":"Theo Quyết định 4685/QĐ-BIDV, cấp có thẩm quyền phê duyệt tín dụng nào đã bị bãi bỏ tại Trụ sở chính?","o":[["A","Hội đồng tín dụng cấp cao (HĐTDCC)"],["B","Ban chỉ đạo tín dụng"],["C","Phó Tổng Giám đốc phụ trách"],["D","Giám đốc Trung tâm Thẩm định và Phê duyệt"]],"a":["A"],"e":"Quy định thẩm quyền mới 4685 bãi bỏ cấp Hội đồng tín dụng cấp cao tại TSC để tăng tốc thời gian ra phán quyết tín dụng [QĐ 4685]."},{"i":594,"s":"tham-dinh-phe-duyet","q":"Đâu là tiêu chí xác định thẩm quyền phê duyệt tín dụng mới đối với Khách hàng tổ chức theo QĐ 4685?","o":[["A","Sự phân chia trường hợp cấp tín dụng qua TĐRR hay không qua TĐRR và xếp hạng tín dụng nội bộ"],["B","Giới hạn tín dụng đối với khách hàng và Giới hạn tín dụng trung dài hạn thực hiện phương án/dự án"],["C","Xếp hạng tín dụng nội bộ, phân loại khách hàng và phân loại nợ"],["D","Tỷ lệ tài sản bảo đảm và phân loại định chế tài chính"]],"a":["B"],"e":"BIDV loại bỏ các tiêu chí ma trận phức tạp cũ (như qua/không qua TĐRR, phân loại KH loại 1, 2, phân loại ĐCTC...). Tiêu chí mới chỉ gồm: GHTD đối với khách hàng và GHTD trung dài hạn để thực hiện 01 phương án/dự án [QĐ 4685]."},{"i":595,"s":"tham-dinh-phe-duyet","q":"Định hướng tăng trưởng tín dụng năm 2026 của BIDV bám sát chỉ tiêu định hướng của NHNN là bao nhiêu?","o":[["A","12% (có điều chỉnh phù hợp)"],["B","14% (có điều chỉnh phù hợp)"],["C","15% (có điều chỉnh phù hợp)"],["D","16% (có điều chỉnh phù hợp)"]],"a":["C"],"e":"Định hướng tăng trưởng tín dụng năm 2026 bám sát chỉ đạo của NHNN (tại Chỉ thị 01/CT-NHNN) và Nghị quyết 1368/NQ-BIDV của HĐQT là 15%, có điều chỉnh phù hợp thực tế [Chỉ thị 01/CT-NHNN & NQ 1368]."},{"i":596,"s":"tham-dinh-phe-duyet","q":"Tính đến 30/06/2026, dư nợ tín dụng của hệ thống đạt bao nhiêu nghìn tỷ đồng, và tăng trưởng bao nhiêu % so với cuối năm 2025?","o":[["A","1.521 nghìn tỷ đồng, tăng 4.5%"],["B","2.449 nghìn tỷ đồng, tăng 5.5%"],["C","2.597 nghìn tỷ đồng, tăng 6.0%"],["D","1.331 nghìn tỷ đồng, tăng 5.0%"]],"a":["B"],"e":"Đến hết 6 tháng đầu năm 2026, dư nợ tín dụng đạt 2.449 nghìn tỷ đồng, tăng trưởng 5,5% so với cuối năm 2025, cơ bản bám sát tiến độ kế hoạch đề ra [Slide Phần 1, Trang dư nợ]."},{"i":597,"s":"tham-dinh-phe-duyet","q":"Trong cơ cấu dư nợ tín dụng tính đến hết tháng 6/2026, tỷ trọng phân khúc Bán buôn và Bán lẻ lần lượt là bao nhiêu?","o":[["A","Bán buôn 60%, Bán lẻ 40%"],["B","Bán buôn 50%, Bán lẻ 50%"],["C","Bán buôn 54%, Bán lẻ 45%"],["D","Bán buôn 55%, Bán lẻ 45%"]],"a":["C"],"e":"Theo số liệu 6 tháng đầu năm 2026, tỷ trọng dư nợ tín dụng của bán buôn chiếm 54% và bán lẻ chiếm 45% [Slide Phần 1, Cơ cấu dư nợ]."},{"i":598,"s":"tham-dinh-phe-duyet","q":"Tốc độ tăng trưởng tín dụng xanh định hướng giai đoạn 2026–2028 đạt khoảng bao nhiêu %/năm?","o":[["A","10–15%/năm"],["B","15–20%/năm"],["C","20–25%/năm (đạt 1,3–1,5 lần tốc độ tăng trưởng tín dụng chung)"],["D","30–35%/năm"]],"a":["C"],"e":"Mục tiêu tăng trưởng tín dụng xanh giai đoạn 2026–2028 đạt khoảng 1,3–1,5 lần tốc độ tăng trưởng tín dụng chung của BIDV, tương đương khoảng 20–25%/năm [Slide Kết quả kỳ vọng]."},{"i":599,"s":"tham-dinh-phe-duyet","q":"Đâu là một trong bốn nguyên tắc xuyên suốt của Đề án chuyển đổi hoạt động Khối Thẩm định và Phê duyệt?","o":[["A","Tối ưu hóa lợi nhuận của từng khoản cấp tín dụng đơn lẻ bằng mọi giá"],["B","Chuyển đổi từ quản trị khoản vay sang quản trị danh mục tín dụng"],["C","Bảo đảm tính phụ thuộc chặt chẽ giữa bộ phận kinh doanh và thẩm định"],["D","Duy trì tuyệt đối quy trình xử lý hồ sơ tín dụng bằng bản giấy tại Chi nhánh"]],"a":["B"],"e":"Bốn nguyên tắc xuyên suốt gồm: (1) Độc lập giữa kinh doanh, thẩm định và phê duyệt; (2) Chuyển từ quản trị khoản vay sang quản trị danh mục tín dụng; (3) Lấy công nghệ, dữ liệu và AI làm nền tảng; (4) Tăng cường chuyên môn hóa theo ngành nghề [Nghị quyết 549]."},{"i":600,"s":"tham-dinh-phe-duyet","q":"Mục tiêu tự động hóa nội dung lập báo cáo thẩm định/báo cáo TĐRR nhờ ứng dụng công nghệ và AI đến hết năm 2028 là bao nhiêu?","o":[["A","Tối thiểu 30%"],["B","Kỳ vọng tự động hóa 50–60% nội dung lập báo cáo"],["C","Kỳ vọng tự động hóa 70–80% nội dung lập báo cáo"],["D","Tự động hóa hoàn toàn 100%"]],"a":["B"],"e":"Mục tiêu đến hết năm 2028 tự động hóa 50–60% nội dung lập báo cáo thẩm định/báo cáo TĐRR trên cơ sở dữ liệu và AI [Slide Kết quả kỳ vọng]."},{"i":601,"s":"tham-dinh-phe-duyet","q":"Tỷ lệ phê duyệt tự động/bán tự động đến hết năm 2028 đặt mục tiêu đạt tối thiểu bao nhiêu đối với SME và Bán lẻ?","o":[["A","SME đạt 10%; Bán lẻ đạt 20%"],["B","SME đạt 20%; Bán lẻ đạt 30%"],["C","SME đạt 30%; Bán lẻ đạt 40%"],["D","SME đạt 40%; Bán lẻ đạt 50%"]],"a":["B"],"e":"Kỳ vọng đến hết năm 2028 tỷ lệ phê duyệt tự động/bán tự động đạt tối thiểu 20% đối với khoản vay KH SME và 30% đối với khoản vay KH bán lẻ [Slide Kết quả kỳ vọng]."},{"i":602,"s":"tham-dinh-phe-duyet","q":"Đề án chuyển đổi đặt ra mục tiêu tinh gọn nhân sự thẩm định và phê duyệt toàn hệ thống giảm tối thiểu bao nhiêu % mỗi năm?","o":[["A","Giảm tối thiểu 5%/năm"],["B","Giảm tối thiểu 10%/năm"],["C","Giảm tối thiểu 15%/năm"],["D","Giảm tối thiểu 20%/năm"]],"a":["B"],"e":"Đề án đặt mục tiêu tinh gọn nhân sự thẩm định rủi ro, giảm tối thiểu 10%/năm ở toàn hệ thống; riêng tại TSC cho phép kiểm soát tăng bình quân 6%/năm giai đoạn 2026–2028 [Slide Kết quả kỳ vọng]."},{"i":603,"s":"tham-dinh-phe-duyet","q":"Dự án Lending Hub được bắt đầu triển khai từ ngày nào và dự kiến Go-live từ thời điểm nào?","o":[["A","Triển khai từ 15/07/2025, dự kiến Go-live từ 01/01/2027"],["B","Triển khai từ 11/05/2026, dự kiến Go-live từ 01/07/2026"],["C","Triển khai từ 15/06/2026, dự kiến Go-live từ 31/12/2026"],["D","Triển khai từ 15/07/2025, dự kiến Go-live từ 01/01/2028"]],"a":["A"],"e":"Dự án Lending Hub bắt đầu triển khai từ 15/07/2025, dự kiến thử nghiệm (Pilot) trong tháng 11–12/2026 và chính thức vận hành (Go-live) từ ngày 01/01/2027 [Slide Dự án Lending Hub]."},{"i":604,"s":"tham-dinh-phe-duyet","q":"Quy định của BIDV về tiếp nhận hồ sơ giấy sau khi hệ thống Lending Hub chính thức Go-live là gì?","o":[["A","Cho phép sử dụng song song hồ sơ giấy và hồ sơ điện tử vô thời hạn"],["B","BIDV sẽ dừng sử dụng hồ sơ ngoài hệ thống (dừng tiếp nhận hồ sơ giấy theo lộ trình)"],["C","Chỉ áp dụng hồ sơ giấy cho các khoản vay của doanh nghiệp siêu nhỏ"],["D","Chỉ dùng hồ sơ điện tử đối với các khoản cấp tín dụng thuộc thẩm quyền của Hội đồng quản trị"]],"a":["B"],"e":"Dự kiến, kể từ thời điểm Go-live hệ thống Lending Hub (01/01/2027), BIDV sẽ dừng hoàn toàn việc sử dụng hồ sơ ngoài hệ thống (theo lộ trình) [Slide Dự án Lending Hub]."},{"i":605,"s":"tham-dinh-phe-duyet","q":"Nguyên tắc sử dụng Bộ Khung điều kiện tín dụng (KĐK) được điều chỉnh như thế nào sau khi chuẩn hóa?","o":[["A","Điều chỉnh từ cơ chế bắt buộc áp dụng sang cơ chế mang tính khuyến nghị để tạo sự linh hoạt cho Chi nhánh"],["B","Điều chỉnh từ cơ chế mang tính khuyến nghị, ưu tiên tham khảo sang cơ chế bắt buộc áp dụng thống nhất toàn hệ thống"],["C","Giữ nguyên cơ chế khuyến nghị cũ nhưng bổ sung các tiêu chí định tính mơ hồ hơn"],["D","Hủy bỏ hoàn toàn Bộ KĐK và phân quyền tự quyết trọn gói cho từng Chi nhánh"]],"a":["B"],"e":"Nguyên tắc sử dụng Bộ KĐK được điều chỉnh từ cơ chế mang tính khuyến nghị, ưu tiên tham khảo sang cơ chế áp dụng thống nhất toàn hệ thống nhằm siết chặt chất lượng tín dụng [Slide Chuẩn hóa Khung ĐKTD]."},{"i":606,"s":"tham-dinh-phe-duyet","q":"Đặc điểm chính của nhóm 'Khách hàng liên quan (KHLQ) ẩn danh' gây nhiều rủi ro nợ xấu cho hệ thống là gì?","o":[["A","Các doanh nghiệp có tỷ lệ sở hữu vốn công khai và rất rõ ràng trên giấy đăng ký kinh doanh"],["B","Thành lập nhiều công ty không có quan hệ liên kết trên bề mặt hồ sơ nhưng thực chất do một ông chủ đứng sau điều hành"],["C","Các khách hàng FDI lớn chưa từng phát sinh quan hệ tín dụng tại Việt Nam"],["D","Doanh nghiệp có tình hình tài chính yếu kém nhưng có tài sản bảo đảm là bất động sản trung tâm giá trị lớn"]],"a":["B"],"e":"KHLQ ẩn danh là nhóm thành lập nhiều công ty độc lập trên hồ sơ pháp lý nhưng thực chất do một ông chủ chi phối phía sau. Họ dễ dàng tạo doanh thu ảo, dùng giao dịch lòng vòng để che giấu dòng tiền yếu kém [Slide Lưu ý chung về KHLQ]."},{"i":607,"s":"tham-dinh-phe-duyet","q":"Những ngành nghề nào được BIDV đưa vào nhóm 'ngành tập trung kiểm soát rủi ro' (KSRR) trong công tác thẩm định phê duyệt?","o":[["A","Ngành thi công xây lắp và bất động sản"],["B","Ngành năng lượng tái tạo (điện gió, điện mặt trời)"],["C","Ngành kinh doanh xăng dầu và thương mại thép"],["D","Ngành xuất khẩu nông sản và dệt may"]],"a":["C"],"e":"Kinh doanh xăng dầu và thương mại thép là những ngành đặc thù có biến động giá cực lớn và tiềm ẩn rủi ro chính sách cao, thuộc danh mục ngành tập trung KSRR theo quy định của BIDV [Slide Phần 2, Lưu ý theo ngành]."},{"i":608,"s":"tham-dinh-phe-duyet","q":"Theo Văn bản 2237/BIDV-SPBL ngày 01/04/2026, khách hàng cá nhân được vay tối đa bao nhiêu khoản vay nhu cầu nhà ở để mua/xây dựng, sửa chữa, cải tạo?","o":[["A","Tối đa 1 khoản vay / 1 căn nhà"],["B","Tối đa 2 khoản vay / 2 căn nhà"],["C","Tối đa 3 khoản vay để mua/xây dựng, sửa chữa, cải tạo tối đa 3 căn nhà ở (bao gồm cả vợ, chồng)"],["D","Tối đa 5 khoản vay để mua/xây dựng tối đa 5 căn nhà"]],"a":["C"],"e":"Văn bản 2237/BIDV-SPBL ngày 01/04/2026 quy định rõ: Cho vay nhu cầu nhà ở tối đa 03 khoản vay để mua/xây dựng, sửa chữa, hoàn thiện tối đa 3 căn nhà ở/KH (bao gồm cả cuối năm 2025, quy mô huy động vốn bán lẻ của BIDV đạt mốc bao nhiêu?","o":[["A","1,075 nghìn tỷ đồng"],["B","1,109 triệu tỷ đồng"],["C","1,103 triệu tỷ đồng"],["D","1,329 triệu tỷ đồng"]],"a":["B"],"e":"Huy động vốn bán lẻ đạt mốc lịch sử 1,109 triệu tỷ đồng, vượt kế hoạch 1,075 nghìn tỷ đồng (đạt 103% kế hoạch)."},{"i":636,"s":"ban-le","q":"Tệp khách hàng cá nhân của BIDV sở hữu bao nhiêu người và còn bao nhiêu sau khi làm sạch dữ liệu thực tế?","o":[["A","24 triệu KH trước và 21,1 triệu KH sau khi làm sạch"],["B","21 triệu KH trước và 14 triệu KH sau khi làm sạch"],["C","24 triệu KH trước và 18,8 triệu KH sau khi làm sạch"],["D","33 triệu KH trước và 24 triệu KH sau khi làm sạch"]],"a":["A"],"e":"Tài liệu ghi rõ sở hữu tệp khách hàng cá nhân lên tới 24 triệu người (đạt 21,1 triệu khách hàng sau khi làm sạch dữ liệu thực tế) với tỷ lệ hoạt động (active) đạt 58%."},{"i":637,"s":"ban-le","q":"Trong mô hình quầy mới (RBT), vai trò giao dịch viên truyền thống được phân tách thành những vai trò chuyên biệt nào?","o":[["A","Giao dịch viên (GDV) và Relationship Manager (RM)"],["B","Giao dịch viên (GDV) và Universal Banker (UB)"],["C","Universal Banker (UB) và Virtual RM (VRM)"],["D","Giao dịch viên (GDV) và Assistant RM (ARM)"]],"a":["B"],"e":"Tài liệu quy định phân tách vai trò tại quầy: Giao dịch viên truyền thống rã thành Giao dịch viên (GDV - chuyên trách tác nghiệp tiền mặt) và Universal Banker (UB - Ngân hàng đa năng tư vấn bán hàng & giao dịch phi tiền mặt)."},{"i":638,"s":"ban-le","q":"Vai trò chính của Universal Banker (UB) trong mô hình phục vụ mới của BIDV là gì?","o":[["A","Chỉ phục vụ các giao dịch liên quan đến tiền mặt tại quầy"],["B","Tư vấn, bán chéo SPDV, tác nghiệp giao dịch phi tiền mặt và hướng dẫn KH sử dụng kênh tự động/số"],["C","Chuyên trách tác nghiệp hỗ trợ tín dụng như soạn hợp đồng và công chứng"],["D","Phát triển và thu hút khách hàng mới theo lô như chi lương, dự án"]],"a":["B"],"e":"UB chuyên trách tư vấn, chốt bán SPDV, tác nghiệp giao dịch phi tiền mặt và hướng dẫn sử dụng kênh số/kênh tự động cho KH phổ thông đến quầy."},{"i":639,"s":"ban-le","q":"Chức danh Virtual RM (VRM) trong mô hình bán lẻ mới của BIDV chuyên trách nhiệm vụ nào?","o":[["A","Phục vụ phân khúc khách hàng Premier Elite trực tiếp tại chi nhánh"],["B","Quản lý khách hàng thân thiết từ xa chủ yếu qua kênh thoại"],["C","Tác nghiệp hồ sơ tín dụng và hỗ trợ giao dịch bảo đảm tại chi nhánh"],["D","Tập trung hoàn toàn vào việc đi săn tìm, phát triển khách hàng mới"]],"a":["B"],"e":"VRM (Cán bộ QLKH từ xa) phụ trách quản lý khách hàng thân thiết từ xa chủ yếu qua kênh thoại, hướng tới chăm sóc và nâng hạng khách hàng."},{"i":640,"s":"ban-le","q":"Trong mô hình tổ chức chi nhánh mới, các chức năng hỗ trợ tín dụng như soạn hợp đồng, giải ngân, nhắc nợ, công chứng được chuyển sang bộ phận nào?","o":[["A","Phòng Giao dịch khách hàng"],["B","Phòng Khách hàng cá nhân"],["C","Phòng Quản trị tín dụng (QTTD)"],["D","Phòng Khách hàng ưu tiên"]],"a":["C"],"e":"Tác nghiệp hỗ trợ tín dụng được chuyển giao toàn bộ sang phòng Quản trị tín dụng để giải phóng 100% thời gian cho RM/VRM tập trung bán hàng."},{"i":641,"s":"ban-le","q":"Định mức Loading chuẩn (số lượng khách hàng tối đa trên một cán bộ bán hàng) được khuyến nghị cho VRM và PRM là bao nhiêu?","o":[["A","VRM: ~1000 KH; PRM: ~500 KH"],["B","VRM: ~600 KH; PRM: ~200 KH"],["C","VRM: ~400 KH; PRM: ~100 KH"],["D","VRM: ~1200 KH; PRM: ~400 KH"]],"a":["B"],"e":"Tài liệu ghi rõ: Định mức Loading chuẩn khuyến nghị cho VRM là khoảng 600 khách hàng và PRM là khoảng 200 khách hàng."},{"i":642,"s":"ban-le","q":"Định mức Loading chuẩn không áp dụng cào bằng mà được điều chỉnh linh hoạt theo các yếu tố nào?","o":[["A","Cấp lương, địa bàn hoạt động, và tỷ lệ khách hàng vay có tài sản bảo đảm"],["B","Doanh số của cán bộ, số năm kinh nghiệm, và quy mô chi nhánh"],["C","Loại tài sản bảo đảm, số lượng sản phẩm bán chéo, và độ tuổi cán bộ"],["D","Quy mô dư nợ, độ tuổi khách hàng, và số lượng cuộc gọi điện thoại"]],"a":["A"],"e":"Loading chuẩn được tính toán chi tiết, điều chỉnh theo cấp lương, địa bàn hoạt động (miền núi, nông thôn, đô thị) và tỷ lệ khách hàng vay có tài sản bảo đảm."},{"i":643,"s":"ban-le","q":"Mục tiêu chiến lược của BIDV là nâng tỷ lệ CASA mảng bán lẻ lên bao nhiêu phần trăm vào năm 2030?","o":[["A","14,2%"],["B","15,9%"],["C","25%"],["D","40%"]],"a":["C"],"e":"Tài liệu ghi nhận mục tiêu bứt phá CASA mảng bán lẻ đạt 25% vào năm 2030 để tối ưu hóa chi phí vốn đầu vào."},{"i":644,"s":"ban-le","q":"Phương thức quản trị bán hàng theo 'Leading indicators' của BIDV được hiểu là gì?","o":[["A","Đo lường và quản trị bằng các hành động cụ thể hàng ngày, hàng tuần của nhân viên để chủ động bám sát kế hoạch"],["B","Các chỉ số kết quả tài chính cuối kỳ của chi nhánh"],["C","Các chỉ tiêu quy mô dư nợ tín dụng và huy động vốn bán lẻ cuối tháng"],["D","Các chỉ số về tỷ lệ nợ xấu và chất lượng tài sản"]],"a":["A"],"e":"Leading indicators là các chỉ số dẫn dắt, đo lường hành động cụ thể hàng ngày/hàng tuần của nhân viên giúp chủ động điều chỉnh thay vì thụ động nhìn kết quả cuối kỳ (Lagging)."},{"i":645,"s":"ban-le","q":"Hoạt động họp giao ban nhanh 'Huddle' hàng ngày của lực lượng bán hàng tại BIDV được quy định diễn ra trong bao lâu?","o":[["A","5 phút"],["B","15 phút"],["C","30 phút"],["D","60 phút"]],"a":["B"],"e":"BIDV thực hiện chuẩn hóa hoạt động hàng ngày thông qua họp giao ban nhanh mỗi sáng gọi là Huddle 15 phút."},{"i":646,"s":"ban-le","q":"Nhóm chỉ tiêu nào của mảng bán lẻ BIDV giai đoạn 2021-2025 KHÔNG hoàn thành kế hoạch?","o":[["A","Chỉ tiêu quy mô (Tín dụng và Huy động vốn bán lẻ)"],["B","Chỉ tiêu chất lượng (Tỷ lệ nợ xấu)"],["C","Chỉ tiêu hiệu quả (Thu nhập thuần, Thu dịch vụ ròng, CIR, ROA)"],["D","Chỉ tiêu số lượng khách hàng cá nhân"]],"a":["C"],"e":"Mặc dù hoàn thành 100% chỉ tiêu quy mô và chất lượng, BIDV không hoàn thành 6/6 chỉ tiêu hiệu quả bao gồm Thu nhập thuần (đạt 74%), Thu dịch vụ ròng (đạt 65%), CIR và ROA không đạt."},{"i":647,"s":"ban-le","q":"Đến năm 2024, tỷ lệ khách hàng giao dịch chính (Main account) tại BIDV chỉ đạt bao nhiêu phần trăm so với ngân hàng dẫn đầu?","o":[["A","5% tại BIDV so với 25% của ngân hàng dẫn đầu"],["B","14% tại BIDV so với 40% của ngân hàng dẫn đầu"],["C","10% tại BIDV so với 30% của ngân hàng dẫn đầu"],["D","21% tại BIDV so với 50% của ngân hàng dẫn đầu"]],"a":["A"],"e":"Sự gắn kết khách hàng của BIDV rất hạn chế: tỷ lệ khách hàng coi BIDV là ngân hàng giao dịch chính (Main account) chỉ đạt 5% (trong khi ngân hàng dẫn đầu đạt 25%)."},{"i":648,"s":"ban-le","q":"Theo slide đào tạo, tỷ lệ khách hàng hoạt động (active) chỉ sử dụng duy nhất 1 sản phẩm tại BIDV chiếm bao nhiêu phần trăm?","o":[["A","10%"],["B","19%"],["C","41%"],["D","56%"]],"a":["D"],"e":"Tài liệu Slide ghi nhận điểm hạn chế lớn về gắn kết khách hàng là 56% khách hàng hoạt động chỉ sử dụng duy nhất 1 sản phẩm."},{"i":649,"s":"ban-le","q":"Tầm nhìn chiến lược bán lẻ của BIDV đến năm 2030 đặt mục tiêu đạt vị thế nào?","o":[["A","Top 1 Bán lẻ Việt Nam, Top 10 Bán lẻ Đông Nam Á, Top 50 Bán lẻ Châu Á"],["B","Top 1 Bán lẻ Việt Nam, Top 20 Bán lẻ Đông Nam Á, Top 100 Bán lẻ Châu Á"],["C","Top 2 Bán lẻ Việt Nam, Top 15 Bán lẻ Đông Nam Á, Top 100 Bán lẻ Châu Á"],["D","Top 1 Bán lẻ Việt Nam, Top 30 Bán lẻ Đông Nam Á, Top 200 Bán lẻ Châu Á"]],"a":["B"],"e":"Tầm nhìn định vị mảng bán lẻ BIDV đến năm 2030 là trở thành Top 1 Bán lẻ Việt Nam, Top 20 Bán lẻ Đông Nam Á, và Top 100 Bán lẻ Châu Á."},{"i":650,"s":"ban-le","q":"Chỉ số chi phí trên thu nhập (CIR) mảng bán lẻ của BIDV đặt mục tiêu cắt giảm về mức bao nhiêu vào năm 2030?","o":[["A","Dưới hoặc bằng 55%"],["B","Dưới hoặc bằng 50%"],["C","Dưới hoặc bằng 40%"],["D","Dưới hoặc bằng 35%"]],"a":["C"],"e":"Chiến lược 2026-2030 đặt chỉ tiêu bứt phá đưa CIR bán lẻ về mức <= 40% (năm 2025 đang ở mức 55.5%)."},{"i":651,"s":"ban-le","q":"Mốc thời gian nào BIDV đặt mục tiêu đạt tỷ lệ phê duyệt tín dụng tự động các khoản vay nhỏ tập trung tại Hội sở chính lên tới 100%?","o":[["A","Trước ngày 31/12/2025"],["B","Trước ngày 31/12/2026"],["C","Trước ngày 31/12/2027"],["D","Trước ngày 31/12/2030"]],"a":["C"],"e":"Tài liệu ghi rõ lộ trình tự động hóa và tập trung hóa tín dụng mảng bán lẻ: Đạt 50% khoản vay nhỏ tập trung phê duyệt tại TSC từ năm 2026 và đạt 100% trước ngày 31/12/2027."},{"i":652,"s":"ban-le","q":"Trong cơ cấu nền khách hàng hoạt động, nhóm khách hàng cao cấp (KHCC) mang lại bao nhiêu phần trăm tổng thu nhập thuần bán lẻ (TNT)?","o":[["A","Chiếm 4,3% số lượng KH active nhưng đóng góp tới 41% thu nhập thuần"],["B","Chiếm 10% số lượng KH active nhưng đóng góp tới 55% thu nhập thuần"],["C","Chiếm 1,1% số lượng KH active nhưng đóng góp tới 20% thu nhập thuần"],["D","Chiếm 0,1% số lượng KH active nhưng đóng góp tới 8% thu nhập thuần"]],"a":["A"],"e":"Tài liệu ghi nhận: Tỷ trọng KHCC chỉ chiếm 4,3% KH active nhưng mang lại tới 41% tỷ trọng thu nhập thuần bán lẻ (trong đó KH Private chiếm 0,1% số lượng đóng góp 8% TNT)."},{"i":653,"s":"ban-le","q":"Nguyên nhân cốt lõi khiến tỷ lệ thâm nhập sản phẩm cho vay tiêu dùng tín chấp của BIDV còn thấp (chỉ đạt 18% KH active, đóng góp 2% dư nợ)?","o":[["A","Do lãi suất vay tiêu dùng tín chấp của BIDV quá cao so với các NHTMCP"],["B","Do quy trình thủ tục tại quầy rườm rà, mất nhiều ngày phê duyệt"],["C","Do chi nhánh ngại rủi ro rách việc, quy mô nhỏ và lo ngại trách nhiệm trong công tác xử lý nợ"],["D","Do khách hàng phổ thông không có nhu cầu vay tiêu dùng không có tài sản bảo đảm"]],"a":["C"],"e":"Tài liệu nêu rõ nguyên nhân tỷ lệ thâm nhập sản phẩm tín chấp thấp (chỉ đạt 18% KH active, 2% dư nợ) bất kể NIM rất cao (2.4%) là do chi nhánh ngại rủi ro, quy mô nhỏ và lo ngại trách nhiệm xử lý nợ."},{"i":654,"s":"kinh-te-vi-mo","q":"Tăng trưởng GDP thực tế của Việt Nam trong nửa đầu năm 2026 (H1.2026) đạt mức bao nhiêu?","o":[["A","6.52%"],["B","7.15%"],["C","8.18%"],["D","9.00%"]],"a":["C"],"e":"[C] - GDP H1.2026 đạt mức tăng trưởng ấn tượng là 8,18% (GDP Q2 tăng trưởng 8,38%)."},{"i":655,"s":"kinh-te-vi-mo","q":"Chỉ số CPI bình quân của Việt Nam trong H1.2026 đạt mức nào?","o":[["A","3.50%"],["B","4.38%"],["C","4.85%"],["D","5.20%"]],"a":["B"],"e":"[B] - CPI bình quân H1.2026 đạt 4,38%, lạm phát cơ bản cũng đã vượt ngưỡng 4%."},{"i":656,"s":"kinh-te-vi-mo","q":"Mức thâm hụt cán cân thương mại (nhập siêu) tổng hợp cả hàng hóa và dịch vụ của Việt Nam trong H1.2026 là bao nhiêu?","o":[["A","10 tỷ USD"],["B","15 tỷ USD"],["C","22 tỷ USD"],["D","30 tỷ USD"]],"a":["C"],"e":"[C] - Tổng thâm hụt là 22 tỷ USD (nhập siêu hàng hóa 17 tỷ USD, dịch vụ nhập siêu 5,5 tỷ USD) để nhập nguyên vật liệu phục vụ sản xuất."},{"i":657,"s":"kinh-te-vi-mo","q":"Tỷ lệ mất giá của đồng Việt Nam (VND) so với USD trong nửa đầu năm 2026 là bao nhiêu?","o":[["A","0.04%"],["B","1.50%"],["C","2.30%"],["D","4.50%"]],"a":["A"],"e":"[A] - VND cực kỳ ổn định, chỉ mất giá 0,04% nhờ dòng vốn FDI giải ngân tốt và nguồn kiều hối dồi dào gánh đỡ."},{"i":658,"s":"kinh-te-vi-mo","q":"Theo Thông tư 25/2026, các NHTM được tính bao nhiêu % tiền gửi có kỳ hạn của Kho bạc Nhà nước vào mẫu số để tính tỷ lệ LDR?","o":[["A","10%"],["B","20%"],["C","30%"],["D","50%"]],"a":["B"],"e":"[B] - Thông tư 25/2026 cho phép tính 20% tiền gửi có kỳ hạn của KBNN vào mẫu số tính LDR, giải tỏa ách tắc thanh khoản cho các NHTM."},{"i":659,"s":"kinh-te-vi-mo","q":"Trần tỷ lệ sử dụng nguồn vốn ngắn hạn để cho vay trung và dài hạn (SMLR) hiện hành được NHNN nâng lên mức nào?","o":[["A","30%"],["B","34%"],["C","40%"],["D","45%"]],"a":["C"],"e":"[C] - NHNN nâng trần tỷ lệ SMLR lên 40% nhằm tạo điều kiện cho các ngân hàng nới lỏng dòng tiền tài trợ các dự án trung và dài hạn."},{"i":660,"s":"kinh-te-vi-mo","q":"Hạn mức cho vay tiêu dùng không cần phương án sử dụng vốn theo quy định mới nhất được nâng lên mức bao nhiêu?","o":[["A","100 triệu VND"],["B","200 triệu VND"],["C","300 triệu VND"],["D","400 triệu VND"]],"a":["D"],"e":"[D] - Hạn mức cho vay tiêu dùng không cần phương án sử dụng vốn được nâng mạnh lên tối đa 400 triệu VND."},{"
